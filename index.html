  if (show==='clues') out = `<div class="tg-x"><table class="tg-grid"><tr><th>ID</th><th>단계</th><th>장소</th><th>제목</th><th>주인</th><th>해설</th></tr>${TG.clues.map(c=>`<tr><td>${c.id}</td><td>${c.phase}</td><td>${esc(SPOTNAME[c.spot])}</td><td>${esc(c.title)}</td><td>${esc(DATA.people[c.owner-1]?.name||'—')}</td><td style="white-space:normal;min-width:220px">${esc(c.gm)}</td></tr>`).join('')}</table></div>`;
  else if (show==='grid') out = `<div class="tg-x">${mdTable(TG.masterMd)}</div>`;
  else if (show.startsWith('ali')) { const id=+show.slice(3)||1; out = `<select class="field" onchange="tgGmView('ali'+this.value)">${DATA.people.map((p,i)=>`<option value="${i+1}" ${i+1===id?'selected':''}>${String(i+1).padStart(2,'0')} ${esc(p.name)}</option>`).join('')}</select><div style="margin-top:10px">${alibiPanel(id,'all')}</div>`; }
  return h + panel(`<h3>증거 수집 게임 설정</h3>
   <p class="muted">조사권은 「자세히 살펴보기」 1회에 1장씩 씁니다. 0이면 무제한입니다. 객실 가방 열람은 조사권을 쓰지 않습니다. 설정은 기기마다 따로 저장됩니다.</p>
   <div class="row"><label>1차 <input class="field" id="tgL1" type="number" min="0" value="${lim[1]}" style="width:76px;display:inline-block"></label><label>2차 <input class="field" id="tgL2" type="number" min="0" value="${lim[2]}" style="width:76px;display:inline-block"></label>${ui('','저장','tgSaveLimits()','primary')}</div>
   <h4>참가자용 진행 코드</h4><p class="muted">각 단계를 시작할 때 코드를 불러 주면 참가자가 홈 화면에서 입력해 같은 단계로 맞춥니다.</p>
   ${Object.entries(TG.stageCodes).map(([k,c])=>`<div class="entry"><b>${STAGE_LABEL[k]}</b> · <span class="gold" style="font-size:17px;letter-spacing:.1em">${c}</span></div>`).join('')}
   <h4>GM 자료</h4><div class="row">${ui('','전체 증거 배치표',"tgGmView('clues')",show==='clues'?'primary':'outline')}${ui('','21:00–22:15 위치표',"tgGmView('grid')",show==='grid'?'primary':'outline')}${ui('','인물별 알리바이',"tgGmView('ali1')",show.startsWith('ali')?'primary':'outline')}${show?ui('','접기',"tgGmView('')",'outline'):''}</div>
   <div style="margin-top:12px">${out}</div>
   <p style="margin-top:14px">${ui('','이 기기 탐색 기록 초기화','tgResetTile()','outline')}</p>`);
};

// 스타일 (앱 쪽)
const st = document.createElement('style');
st.textContent = `.tg-say{font-size:10.5px;border-radius:4px;padding:0 6px;border:1px solid;vertical-align:1px}.tg-say-pub{color:#7fb59a;border-color:#3f6b57}.tg-say-care{color:var(--gold);border-color:#6b5a33}.tg-say-sec{color:#ffb79a;border-color:#7b4a36;background:#2a140c}
.tg-row{cursor:pointer}.tg-dark{background:linear-gradient(90deg,#05080f,transparent)}.tg-tip{margin-top:7px;font-size:13px;color:#ffe2a8;background:#2a2210;border-left:2px solid var(--gold);padding:7px 9px;line-height:1.65}
.tg-x{overflow-x:auto;max-width:100%}.tg-grid{border-collapse:collapse;font-size:11.5px;white-space:nowrap}.tg-grid th,.tg-grid td{border:1px solid #2c3d52;padding:4px 6px;text-align:left}.tg-grid th{background:#1a2a3d}.tg-sec{color:#ffb79a}`;
document.head.appendChild(st);
render();
})();

</script>
<script>
// ═══ 실시간 동기화 (Firebase Realtime Database) ═══
// FIREBASE_CONFIG 가 비어 있으면 아무것도 하지 않고 기존 오프라인 방식(진행 코드)으로 동작한다.
(function(){
const CFG = window.FIREBASE_CONFIG || {};
const ROOM = String(window.GAME_ROOM || 'main').replace(/[.#$\[\]\/]/g,'_');
const DEVICE_KEY = 'lastcheckin_device_id', RESET_KEY = 'lastcheckin_reset_seen', STAGE_REV_KEY = 'lastcheckin_stage_rev';
const GENDER_DB = 'lastcheckin_v17_17p_genders';
let device = ''; try{ device = localStorage.getItem(DEVICE_KEY) || ''; if(!device){ device = 'd'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); localStorage.setItem(DEVICE_KEY, device); } }catch(e){ device='d'+Math.random().toString(36).slice(2); }

const SYNC = window.SYNC = { on:false, connected:false, readOK:false, writeOK:false, errors:{}, version:"17인 연결 수정 v21", room:ROOM, data:{}, device };
let db = null;   // 어댑터: watch(path,cb) set(path,v) update(path,v) remove(path) txn(path,fn) presence(path,v)

function syncFailure(e, operation='write') {
  SYNC.errors[operation] = /permission|denied/i.test(String(e&&e.code)+' '+String(e&&e.message))
    ? 'Firebase 접근 권한이 거부됐어요. Realtime Database의 규칙을 확인해 주세요.'
    : '연결 오류: '+String(e&&e.message||e||'네트워크 상태를 확인해 주세요.');
  if(operation==='read') SYNC.readOK=false;
  if(operation==='write') SYNC.writeOK=false;
  console.warn('게임 동기화 오류', operation, e); softRender();
}
function syncLabel(){
  if(Object.keys(SYNC.errors).length) return '● 동기화 오류';
  if(!SYNC.on) return '○ 서버 연결 준비 중';
  if(!SYNC.connected) return '○ 서버 연결 중…';
  return SYNC.readOK&&SYNC.writeOK ? '● 데이터 동기화 연결됨' : '○ 데이터 읽기·쓰기 확인 중…';
}
function syncStatusPanel(){return panel(`<b>${syncLabel()}</b><p class="muted">${safe(SYNC.version)} · 방 ${safe(ROOM)}</p>${Object.values(SYNC.errors).map(e=>`<p class="warning">${safe(e)}</p>`).join('')}`);}

// ── 어댑터: Firebase ──
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; const timeout=setTimeout(()=>rej(new Error('Firebase 파일 로딩 시간 초과. 인터넷 연결을 확인해 주세요.')),15000); s.onload=()=>{clearTimeout(timeout);res()}; s.onerror=()=>{clearTimeout(timeout);rej(new Error('Firebase 연결 파일을 불러오지 못했어요.'))}; document.head.appendChild(s); }); }
async function firebaseAdapter(){
  const V='10.12.2';
  await loadScript(`https://www.gstatic.com/firebasejs/${V}/firebase-app-compat.js`);
  await loadScript(`https://www.gstatic.com/firebasejs/${V}/firebase-database-compat.js`);
  const app = firebase.initializeApp(CFG); const d = firebase.database(app);
  return {
    watch:(p,cb)=>d.ref(p).on('value',s=>{SYNC.readOK=true;delete SYNC.errors.read;cb(s.val())},e=>syncFailure(e,'read')),
    set:(p,v)=>d.ref(p).set(v), update:(p,v)=>d.ref(p).update(v), remove:p=>d.ref(p).remove(),
    txn:(p,fn)=>d.ref(p).transaction(fn).then(r=>({committed:r.committed, value:r.snapshot.val()})),
    connected:cb=>d.ref('.info/connected').on('value',s=>cb(!!s.val())),
    presence:(p,v)=>{ const r=d.ref(p); return r.onDisconnect().remove().then(()=>r.set(v)); },
    now:()=>firebase.database.ServerValue.TIMESTAMP
  };
}

// ── 경로 ──
const R = p=>`rooms/${ROOM}${p?'/'+p:''}`;
const safeKey = k=>String(k).replace(/[.#$\[\]\/]/g,'_');

// ── 원격 → 이 기기 ──
let pendingRender=false, lastSig='';
function typing(){ const a=document.activeElement; return a && ['INPUT','TEXTAREA','SELECT'].includes(a.tagName) && el('app') && el('app').contains(a); }
function softRender(){ if(window.TG_isOpen&&TG_isOpen()){ pendingRender=true; return; } if(typing()){ pendingRender=true; return; } pendingRender=false; try{ render(); }catch(e){} }
document.addEventListener('focusout', ()=>setTimeout(()=>{ if(pendingRender&&!typing()) softRender(); }, 50));
setInterval(()=>{ if(pendingRender && !typing() && !(window.TG_isOpen&&TG_isOpen())) softRender(); }, 1500);

function lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function apply(room){
  room = room || {}; SYNC.data = room;
  // 새 게임(전체 초기화) 감지
  const resetAt = room.resetAt||0; let seen = 0; try{ seen = +(localStorage.getItem(RESET_KEY)||0); }catch(e){}
  if (resetAt && !seen){ try{ localStorage.setItem(RESET_KEY, String(resetAt)); }catch(e){} }
  else if (resetAt && resetAt > seen){ wipeLocal(resetAt); return; }

  // 배역·이름·성별
  const cast = room.cast || {};
  const names = {}, genders = {};
  Object.entries(cast).forEach(([i,c])=>{ if(c&&c.name&&c.device){ names[i]=c.name; if(c.gender) genders[i]=c.gender; } });
  if (state.role>=0){
    const mine = cast[String(state.role)];
    if (mine && mine.device && mine.device !== device){ lostRole(mine.name); return; }
    if ((!mine || !mine.device) && state.name){ claimRole(state.role, state.name, state.gender); names[String(state.role)]=state.name; if(state.gender) genders[String(state.role)]=state.gender; }
    else if (mine && state.gender && mine.gender!==state.gender){ db.update(R('cast/'+state.role), {gender:state.gender}).catch(e=>syncFailure(e)); genders[String(state.role)]=state.gender; }
  }
  lsSet(NAME_DB, names); lsSet(GENDER_DB, genders);

  // 선착순 획득 기록
  const claims = room.claims || {};
  const world = {}; Object.entries(claims).forEach(([k,v])=>{ world[v&&v.key||k]=v; });
  lsSet(WORLD_KEY_V11, world);
  // 내가 가졌다고 생각했지만 다른 사람이 먼저 가진 증거 정리
  if (state.role>=0 && Array.isArray(state.inventory)){
    const lost = state.inventory.filter(id=>{ const w=world['E:'+id]; return w && w.owner!==state.role; });
    if (lost.length) dropEvidence(lost, world['E:'+lost[0]].name);
  }

  // 쪽지
  const letters = Object.values(room.letters||{}).filter(Boolean).sort((a,b)=>a.at-b.at);
  lsSet(MSG_DB, letters);

  // 조건부 조력자 판정 (김도현 = 9번, 배수아 = 18번)
  const dec = room.decisions || {};
  state.branchRegistry = state.branchRegistry || {};
  if (dec['8']) state.branchRegistry['9'] = ['conceal','deal'].includes(dec['8'].key);
  if (dec['17']) state.branchRegistry['18'] = dec['17'].key==='deal';

  // 진행 단계
  const st = room.stage;
  let rev = ''; try{ rev = localStorage.getItem(STAGE_REV_KEY)||''; }catch(e){}
  if (st && st.stage && String(st.rev)!==rev){
    try{ localStorage.setItem(STAGE_REV_KEY, String(st.rev)); }catch(e){}
    const was = state.stage;
    state.stage = st.stage; state.timerEnd = st.timerEnd || 0;
    if (st.stage==='decision' && was!=='decision') state.decision='';
    selectedPerson = -1;
    if (window.TG_isOpen && TG_isOpen()) TG_close();
    if (st.stage==='finished') view='book';
    else if (view==='map' && !isExploring()) view='home';
    if (was!==st.stage) flash(`진행 단계가 「${phaseName()}」(으)로 바뀌었습니다`);
  }
  SYNC.final = room.final || null;

  const sig = JSON.stringify([names,genders,world,letters.length,dec,st,room.final,room.presence&&Object.keys(room.presence).length, room.ballots]);
  try{ persist(); }catch(e){}
  if (sig!==lastSig){ lastSig=sig; softRender(); }
}
function wipeLocal(resetAt){
  try{ for(let i=localStorage.length-1;i>=0;i--){ const k=localStorage.key(i); if(k&&k.startsWith('lastcheckin_')&&k!==DEVICE_KEY&&k!==RESET_KEY) localStorage.removeItem(k); } localStorage.setItem(RESET_KEY,String(resetAt)); }catch(e){}
  location.reload();
}
function lostRole(name){
  const old = state.role;
  state = Object.assign({}, defaultState); try{ persist(); }catch(e){}
  view='home'; selectedPerson=-1; softRender();
  alert(`방금 다른 참가자(${name})가 같은 역할을 먼저 받았습니다. 다시 「역할 배정」을 눌러 주세요.`);
}
function dropEvidence(ids, by){
  state.inventory = state.inventory.filter(x=>!ids.includes(x));
  if (state.tg && state.tg.got){ ids.forEach(id=>{ const g=state.tg.got[id]; if(g){ if(state.tg.used&&state.tg.used[g.phase]>0) state.tg.used[g.phase]--; delete state.tg.got[id]; } }); }
  try{ persist(); }catch(e){}
  flash(`한발 늦었습니다. ${by||'다른 참가자'} 님이 먼저 가져갔어요 (조사권은 돌려받았어요)`);
}
function flash(t){
  let n=document.getElementById('syncToast'); if(!n){ n=document.createElement('div'); n.id='syncToast'; n.style.cssText='position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:10000;background:#e6c48b;color:#1a1408;font-weight:700;padding:9px 14px;border-radius:8px;box-shadow:0 6px 20px #0009;max-width:calc(100% - 32px);text-align:center;font-size:13.5px'; document.body.appendChild(n); }
  n.textContent=t; n.hidden=false; clearTimeout(n._t); n._t=setTimeout(()=>n.hidden=true, 3200);
}

// ── 이 기기 → 원격 ──
function claimRole(i, name, gender){
  return db.txn(R('cast/'+i), cur=>{ if(cur && cur.device && cur.device!==device) return; return Object.assign({gender:gender||''}, cur||{}, {name, device, at:Date.now()}); })
    .then(r=>{ if(!r.committed && r.value && r.value.device!==device && state.role===i) lostRole(r.value.name); }).catch(e=>syncFailure(e));
}
const _registerCastName = registerCastName;
registerCastName = function(i,n){ const ok=_registerCastName(i,n); if(ok && SYNC.on){ const g=(i===state.role&&state.gender)||''; claimRole(i, String(n).trim().replace(/\s+/g,' ').slice(0,24), g); } return ok; };
const _registerGender = registerGender;
registerGender = function(i,g){ _registerGender(i,g); if(SYNC.on) db.update(R('cast/'+i), {gender:g}).catch(e=>syncFailure(e)); };

const _doClaim = doWorldClaimV11;
doWorldClaimV11 = function(key){
  const ok = _doClaim(key);
  if (ok && SYNC.on){
    const me = {owner:state.role, name:liveName(state.role), at:Date.now(), key};
    db.txn(R('claims/'+safeKey(key)), cur=>{ if(cur && cur.owner!==state.role) return; return me; })
      .then(r=>{ if(!r.committed && r.value && r.value.owner!==state.role){
        if (key.startsWith('E:')) dropEvidence([key.slice(2)], r.value.name);
        else { try{ const w=worldClaimsV11(); w[key]=r.value; localStorage.setItem(WORLD_KEY_V11, JSON.stringify(w)); }catch(e){} flash(`한발 늦었습니다. ${r.value.name} 님이 먼저 가져갔어요`); softRender(); }
      } }).catch(e=>syncFailure(e));
  }
  return ok;
};
const _resetWorld = resetWorldV11;
resetWorldV11 = function(){ _resetWorld(); if(SYNC.on && adminAuthenticated) db.remove(R('claims')).catch(e=>syncFailure(e)); };

const _putLetters = putLetters;
putLetters = function(all){ _putLetters(all); if(!SYNC.on) return; const remote=(SYNC.data&&SYNC.data.letters)||{}; (all||[]).forEach(m=>{ if(m&&m.id&&!remote[safeKey(m.id)]) db.set(R('letters/'+safeKey(m.id)), m).catch(e=>syncFailure(e)); }); };

const _chooseDecision = chooseDecision;
chooseDecision = function(key){ _chooseDecision(key); if(SYNC.on && state.role>=0) db.set(R('decisions/'+state.role), {key, at:Date.now()}).catch(e=>syncFailure(e)); };
function pushBallot(){ if(SYNC.on && state.role>=0) db.set(R('ballots/'+state.role), {count:state.count, votes:state.votes||[], at:Date.now()}).catch(e=>syncFailure(e)); }
const _toggleVote = toggleVote; toggleVote = function(i){ _toggleVote(i); pushBallot(); };
const _chooseCount = chooseCount; chooseCount = function(n){ _chooseCount(n); pushBallot(); };

// 진행자: 단계 전환을 모든 기기에 보낸다
function pushStage(stage, extra){ if(!SYNC.on) return; const rev = Date.now()+'-'+device; try{ localStorage.setItem(STAGE_REV_KEY, rev); }catch(e){} db.set(R('stage'), Object.assign({stage, rev, at:Date.now(), timerEnd:0}, extra||{})).catch(e=>alert('단계 전송에 실패했습니다: '+e.message)); }
const _startPhase = startPhase; startPhase = function(next){ _startPhase(next); if(adminAuthenticated){ if(next==='explore1'||next==='lobby') db&&SYNC.on&&db.remove(R('final')).catch(e=>syncFailure(e)); pushStage(next); } };
const _startDecision = startDecision; startDecision = function(){ _startDecision(); if(adminAuthenticated) pushStage('decision', {timerEnd:state.timerEnd}); };
const _finalize = finalize;
finalize = function(){
  if (!adminAuthenticated) return _finalize();
  if (SYNC.on){ const fin = groupResult(); db.set(R('final'), fin).catch(e=>syncFailure(e)); SYNC.final = fin; }
  _finalize(); pushStage('finished');
};
// 최후 선택 타이머가 끝나면 진행자 기기가 투표 단계로 넘긴다
setInterval(()=>{ const st=SYNC.data&&SYNC.data.stage; if(SYNC.on && adminAuthenticated && st && st.stage==='decision' && st.timerEnd && Date.now()>st.timerEnd+1500) pushStage('vote'); }, 3000);

// ── 집계: 범인 수는 최다 득표 인원, 지목은 득표순 ──
function groupResult(){
  const ballots = Object.entries((SYNC.data&&SYNC.data.ballots)||{}).filter(([i])=>roleActive(+i)).map(([i,b])=>({i:+i, count:b.count||0, votes:(b.votes||[]).filter(roleActive)}));
  const cc={}; ballots.forEach(b=>{ if(b.count) cc[b.count]=(cc[b.count]||0)+1; });
  const count = +(Object.entries(cc).sort((a,b)=>b[1]-a[1]||a[0]-b[0])[0]||[state.count||1])[0];
  const tally={}; ballots.forEach(b=>b.votes.forEach(v=>{ tally[v]=(tally[v]||0)+1; }));
  const ranked = Object.entries(tally).sort((a,b)=>b[1]-a[1]||a[0]-b[0]).map(([k,n])=>({i:+k,n}));
  return { count, votes: ranked.slice(0,count).map(r=>r.i), tally, voters: ballots.length, at: Date.now() };
}
const _result = result;
result = function(){ const f=SYNC.final; if(!f||!Array.isArray(f.votes)) return _result(); const mine=state.votes; state.votes=f.votes; try{ return _result(); } finally { state.votes=mine; } };
const _bookPage = bookPage;
bookPage = function(){
  let h = _bookPage(); const f=SYNC.final; if(!f||state.stage!=='finished') return h;
  const rows = Object.entries(f.tally||{}).sort((a,b)=>b[1]-a[1]).map(([i,n])=>`<div class="entry"><b>${safe(liveName(+i))}</b> · ${n}표${f.votes.includes(+i)?' <span class="tag">최종 지목</span>':''}</div>`).join('');
  return h + panel(`<h3>전체 투표 집계</h3><p class="muted">${f.voters}명 투표 · 다수가 고른 범인 수 ${f.count}명 · 득표순 상위 ${f.count}명을 최종 지목으로 처리했습니다.</p>${rows||'<p class="muted">투표 없음</p>'}`);
};

// ── 화면: 홈 상태 · 진행자 콘솔 ──
const _home = home;
home = function(){
  let h = _home(); if(!SYNC.on || !role() || selectedPerson!==-1) return h+syncStatusPanel();
  // 동기화 중에는 진행 코드 입력칸을 연결 상태 표시로 바꾼다
  const i = h.indexOf('<section class="card">'), j = h.indexOf('</section>', i);
  const badge = panel(`<div class="row between"><div><b>${syncLabel()}</b><br><small class="muted">진행 단계는 진행자가 바꾸면 자동으로 맞춰집니다. 지금: <b>${phaseName()}</b></small></div></div>${isExploring()?`<button class="btn primary" style="width:100%;margin-top:10px;min-height:48px" onclick="setview('map')">산장 탐색하러 가기</button>`:''}`);
  return ((i===0 && j>0) ? badge + h.slice(j+'</section>'.length) : badge + h)+syncStatusPanel();
};
window.syncResetGame = function(){
  if(!adminAuthenticated||!SYNC.on) return;
  if(!confirm('모든 참가자의 배정·증거·쪽지·투표를 지우고 새 게임을 시작할까요? 참가자 화면도 처음으로 돌아갑니다.')) return;
  const at=Date.now(); db.set(R(''), {resetAt:at}).then(()=>wipeLocal(at)).catch(e=>alert('초기화 실패: '+e.message));
};
const _adminPage = adminPage;
adminPage = function(){
  const h = _adminPage(); if(!adminAuthenticated) return h;
  if(!SYNC.on) return h + syncStatusPanel();
  const d=SYNC.data||{}, pres=Object.values(d.presence||{}), cast=d.cast||{}, ballots=d.ballots||{}, dec=d.decisions||{};
  const rows = activePeopleMap((p,i)=>{ const c=cast[String(i)], on=pres.some(x=>x.role===i);
    return `<tr><td>${String(i+1).padStart(2,'0')}</td><td>${safe(p.name)}</td><td>${c?safe(c.name):'<span class="muted">미배정</span>'}</td><td>${c?(on?'<span style="color:#7fb59a">접속</span>':'<span class="muted">오프라인</span>'):''}</td><td>${dec[String(i)]?'✔':''}</td><td>${ballots[String(i)]?((ballots[String(i)].votes||[]).length+'명'):''}</td></tr>`; }).join('');
  return h + syncStatusPanel() + panel(`<h3>실시간 동기화 · ${syncLabel()}</h3>
   <p class="muted">방 이름 <b>${safe(ROOM)}</b> · 위의 단계 버튼을 누르면 모든 참가자 화면이 함께 바뀝니다. 최후 선택 4분이 끝나면 자동으로 범인 투표로 넘어가고, 「엔딩 공개」는 전체 투표를 집계해 모두에게 같은 결과를 보여 줍니다.</p>
   <div class="tg-x"><table class="tg-grid"><tr><th>#</th><th>배역</th><th>참가자</th><th>상태</th><th>최후 선택</th><th>투표</th></tr>${rows}</table></div>
   <p style="margin-top:12px">${ui('','새 게임 시작 (전체 초기화)','syncResetGame()','outline')}</p>`);
};

// ── 시작 ──
async function start(){
  if (!CFG || !CFG.databaseURL){ syncFailure(new Error('게임 파일에 데이터베이스 주소가 없어요.'),'setup');return; }   // 설정 전: 오프라인 모드
  try{ db = await firebaseAdapter(); }
  catch(e){ syncFailure(e,'setup'); return; }
  SYNC.on = true;
  db.connected(c=>{ SYNC.connected=c; if(!c){SYNC.readOK=false;SYNC.writeOK=false;} if(c) updatePresence(true); softRender(); });
  db.watch(R(''), apply);
  setInterval(()=>updatePresence(false), 4000);
}
let lastPres='';
function updatePresence(force){
  if(!SYNC.on || !SYNC.connected) return;
  const v = {role: state.role, name: state.name||'', admin: !!adminAuthenticated};
  const sig = JSON.stringify(v); if(!force && sig===lastPres) return; lastPres=sig;
  db.presence(R('presence/'+device), Object.assign({at:Date.now()}, v)).then(()=>{const changed=!SYNC.writeOK||SYNC.errors.write;SYNC.writeOK=true;delete SYNC.errors.write;if(changed)softRender();}).catch(e=>{lastPres='';syncFailure(e,'write');});
}
window.SYNC_useAdapter = function(a){ db=a; SYNC.on=true; SYNC.connected=true; db.watch(R(''), v=>{SYNC.readOK=true;apply(v)}); updatePresence(true); };  // 테스트용
start();
})();

</script>
