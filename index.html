/* v12 | thumb-operated analog joystick, fixed in the map screen only */
.v12-joy-row{display:flex;align-items:center;justify-content:center;gap:20px;margin:14px auto 11px;max-width:410px;padding:4px 6px 8px}
.v12-pad{width:132px;height:132px;flex:0 0 132px;position:relative;display:grid;place-items:center;border-radius:50%;border:2px solid #738ba4;background:radial-gradient(circle at 50% 44%,#28415a,#111f32 72%);box-shadow:inset 0 2px 18px #020813,0 5px 15px #0007;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;cursor:grab}
.v12-pad:active{cursor:grabbing;border-color:#d3b47b}
.v12-pad-guide{position:absolute;inset:16px;border:1px dashed #546b83;border-radius:50%;pointer-events:none}
.v12-pad-guide:after{content:'✦';color:#5c7490;display:grid;place-items:center;height:100%;font-size:18px}
.v12-knob{position:absolute;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;color:#d9e6f5;font-size:15px;line-height:1;border:2px solid #a9bfda;background:linear-gradient(135deg,#647e9c,#304862);box-shadow:0 4px 13px #0009;pointer-events:none;will-change:transform;transition:none}
.v12-joy-help{display:flex;flex-direction:column;gap:7px;min-width:0;max-width:210px}.v12-joy-help b{font-size:15px;color:#ecd2a6}.v12-joy-help span{font-size:12px;line-height:1.65;color:#d5dfeb}.v12-joy-help small{font-size:11px;line-height:1.5;color:#97aec3}
@media(max-width:360px){.v12-joy-row{gap:14px}.v12-pad{width:112px;height:112px;flex-basis:112px}.v12-knob{width:52px;height:52px}.v12-joy-help span{font-size:11px}}

/* V13 — furnished investigation rooms and translucent touch controls */
.v13-map-shell{position:relative;border-radius:17px;overflow:hidden;border:2px solid #9f875e;box-shadow:0 15px 35px #0009,0 0 0 4px #1d2529;background:#0a151c}
.v13-map-stage{position:relative;width:100%;aspect-ratio:11 / 9;overflow:hidden;isolation:isolate}
.v13-underlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;display:block}
.v13-map-stage .v11-map{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:11/9;background:transparent;border:0;gap:0;z-index:2;overflow:hidden}
.v13-map-stage .v11-cell{background:transparent!important;border:0!important;filter:none!important;box-shadow:none!important;color:transparent;opacity:1;outline-offset:-2px;cursor:default}
.v13-map-stage .v11-cell.floor{cursor:pointer}
.v13-map-stage .v11-cell.wall,.v13-map-stage .v11-cell.furn{pointer-events:none}
.v13-map-stage .v11-cell.door{color:#dbd1ae;pointer-events:none}
.v13-map-stage .v11-cell.has-object{cursor:pointer;color:inherit;overflow:visible;z-index:3}
.v13-map-stage .v11-cell.has-object:before{content:'';position:absolute;inset:9%;border:1px solid rgba(219,178,95,.33);border-radius:6px;box-shadow:0 0 8px rgba(225,180,103,.13);pointer-events:none}
.v13-map-stage .v11-cell.has-object.nearby:before{border-color:#f6d58b;box-shadow:0 0 0 2px #d9a85d33,0 0 17px #f9d8879c;animation:v13glow 1.65s ease-in-out infinite alternate}
.v13-map-stage .v11-cell.has-object.targeted:before{border:2px solid #fff1b1;box-shadow:0 0 0 3px #b48b4788,0 0 20px #fff2b5}
@keyframes v13glow{to{box-shadow:0 0 0 3px #f0c97b45,0 0 19px #f9d887c9}}
.v13-map-stage .v11-cell.has-object:active{transform:none}
.v13-map-stage .v11-cell.avatar-player{z-index:6;filter:drop-shadow(0 1px 2px #0007)!important;color:initial}
.v13-object-svg,.v13-avatar-svg{height:100%;width:100%;display:block;overflow:visible;pointer-events:none}
.v13-avatar-svg{filter:drop-shadow(0 2px 2px rgba(0,0,0,.6))}
.v13-map-chip{position:absolute;left:8px;top:7px;background:#091820b9;border:1px solid #f0d4a16b;backdrop-filter:blur(5px);border-radius:7px;color:#f7e5c4;font-weight:800;font-size:10px;z-index:7;padding:5px 8px;pointer-events:none}
.v13-map-floor{position:absolute;right:7px;top:7px;background:#111d259c;border:1px solid #a5b1b54f;backdrop-filter:blur(3px);border-radius:6px;color:#e6e7dd;font-size:9px;padding:5px 7px;z-index:7;pointer-events:none}
.v13-controls{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 14px 10px;background:linear-gradient(150deg,#172838e0,#101b2aef);border-top:1px solid #8f7e6355}
.v13-controls .v12-pad{width:112px;height:112px;flex:0 0 112px;opacity:.72;background:radial-gradient(circle at 45% 40%,#8295a348,#263c4d84 57%,#1023329a 100%);border:2px solid #d5dfe4a2;box-shadow:inset 0 0 19px #050b0d75,0 2px 14px #0a111564;backdrop-filter:blur(7px);transition:opacity .14s}
.v13-controls .v12-pad:active{opacity:.95;border-color:#e6d3ab}
.v13-controls .v12-pad-guide{inset:12px;border-color:#c3c9c976}
.v13-controls .v12-pad-guide:after{content:'+';color:#bdcbd785;font-size:27px;font-weight:300}
.v13-controls .v12-knob{width:53px;height:53px;color:#f5e9d0;opacity:.91;background:linear-gradient(155deg,#8496a2a8,#365066ae);border:1.5px solid #e2e8e5aa;box-shadow:0 4px 11px #0006;backdrop-filter:blur(5px)}
.v13-action-group{display:flex;align-items:center;flex-direction:column;justify-content:center;gap:5px;min-width:110px}
.v13-action{display:flex;align-items:center;justify-content:center;flex-direction:column;width:90px;height:90px;border-radius:50%;border:2px solid #d8c69d9c;background:radial-gradient(circle at 34% 25%,#e5d29e48,#6c5a4270 66%,#2e30319c);color:#faf1df;font-weight:900;font-size:25px;line-height:1;box-shadow:inset 0 0 16px #0002,0 4px 16px #0006;backdrop-filter:blur(8px);touch-action:manipulation;user-select:none;-webkit-tap-highlight-color:transparent;opacity:.78;transition:transform .08s,opacity .12s}
.v13-action:active{opacity:1;transform:scale(.94);background:#997746bd}
.v13-action span{display:block;font-size:11px;letter-spacing:1px;margin-top:6px;font-weight:750}
.v13-action-group small{color:#c7d0d3;font-size:10px;text-align:center;white-space:nowrap}
.v13-explore-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0 9px}
.v13-explore-top b{font-family:Georgia,'Noto Serif KR',serif;font-size:19px;letter-spacing:.2px;color:#ecdcb7}
.v13-explore-top span{font-size:10px;color:#a1b5be}
.v13-mini-guide{font-size:11px;line-height:1.6;color:#bbcad3;margin:9px 0 13px}
.v13-selected{color:#dfca9d!important}
@media(max-width:370px){.v13-controls{padding:11px 10px 9px;gap:9px}.v13-controls .v12-pad{width:99px;height:99px;flex-basis:99px}.v13-controls .v12-knob{width:47px;height:47px}.v13-action{width:82px;height:82px}.v13-action-group{min-width:94px}}

": [["가족사진", "청명 프로젝트에 참여하기 전 가족과 찍은 사진. 다른 피해 가족의 기록도 함께 끼워 두었다."], ["손편지", "피해자 가족 모임에 보내려고 쓴 편지."], ["기사 스크랩", "사망 원인을 축소해 단정한 옛 보도들."]], "roleMark": "ordinary", "oneLine": "오래된 의료사고의 다른 피해 가족들을 대표해 기록을 모은 사람.", "purpose": "청명 프로젝트에 가족이 참여한 뒤 심각한 피해를 입었다. 서도윤의 공개 발표가 의료 기록을 다시 지우는 일이 될까 걱정되어 직접 참석했다.", "actingTip": "사고 피해자의 이름을 강조하고 섣부른 추측을 경계한다.", "quotes": ["우리는 숫자가 아니라 사람에 대한 답을 기다렸어요.", "우리 가족에게는 숫자가 아니라 이름이 있었어요."], "guide": {"rule": "당신은 거짓말을 할 수 없다. 불리하거나 곤란한 사실을 먼저 꺼낼 필요는 없지만, 누가 직접 물으면 본 그대로 답하고 추측과 목격을 구분해 말하라.", "keywords": ["제가 본 건 거기까지예요", "얼굴은 못 봤어요, 옷만 기억해요", "그 시간엔 한지훈 씨와 정원에 있었어요", "확인해 줄 사람은 한지훈 씨예요", "말하기 곤란하지만 물으셨으니 답할게요"], "examples": [{"q": "21:49에 계단에서 서지안을 확실히 봤습니까?", "a": "확실하다고는 못 해요. 밝은색 카디건을 입은 사람이 고개를 숙이고 내려왔고, 저는 서지안 씨라고 생각했어요. 얼굴은 보지 못했습니다."}, {"q": "임수빈 씨에 대해 숨기는 게 있지 않나요?", "a": "물으셨으니 말씀드릴게요. 21:56에 라운지에서 머리가 젖은 채 파란 천을 쥐고 의료 가방을 급히 닫는 걸 봤어요. 그게 무슨 뜻인지는 저도 모릅니다."}, {"q": "피해자 가족이니 서도윤에게 원한이 있었던 것 아닙니까?", "a": "원망한 적은 있어요. 하지만 그 시간엔 한지훈 씨와 정원에 있었고, 21:20부터는 라운지에 있었어요. 저는 복수가 아니라 기록을 원했습니다."}]}}, {"name": "김도현", "job": "시설 보안 담당", "team": "정보 비공개", "motive": "2016년 · 자신이 보지 못한 사고\n청명 프로젝트가 의료기관에서 문제를 일으키던 당시 당신은 다른 현장에서 전기와 보안 설비를 다루는 일을 배우고 있었다. 사람의 기록보다는 전류의 흐름이 명확하다고 믿었다. 임혜정의 이름이나 실험실 경고에 대해서는 거의 알지 못했다. 당시의 사건은 당신에게 먼 뉴스에 가까웠다.\n\n2017~2020년 · 손으로 남는 로그\n현장을 옮겨 다니며 발전기 점검과 출입통제 장치 관리에 익숙해졌다. 비상등이 켜지는 순서, 잠금장치가 닫힌 뒤 남기는 기계 소리, 조작자가 아무 기록을 남기지 않았다고 믿어도 사라지지 않는 접속 로그를 배웠다. 당신은 원인을 알기 위해 장치를 열어 보는 사람이었지, 그것으로 남의 시간을 만들려는 사람은 아니었다.\n\n2021~2025년 · 청명산장의 규칙\n산장 시설을 맡으며 백하린과 열쇠 대장을 맞췄고, 문하준과 보안 백업 점검도 몇 차례 진행했다. 서재의 보조 서비스문이 자동으로 걸리는 구조라는 사실은 알고 있었지만, 그 문이 살인사건의 쟁점이 되리라고는 상상하지 못했다. 회사 임원이 시설 사용을 지시하면 어디까지 거절할 수 있을지 고민한 적도 없었다.\n\n2026년 11월 7일 · 꺼진 불과 남은 책임\n강태준은 발표를 지연시키고 싶다며 짧은 전원 차단을 부탁했고 당신은 정비 작업처럼 처리하기로 했다. 21시 40분 실제로 차단기를 내렸지만 누군가를 해칠 계획에는 참여하지 않았다. 22시 12분 보안실에서 백업 영상 속 수상한 동선의 조각을 보게 되자 선택지가 생겼다. 그대로 제출할 것인가, 스스로 저지른 정전이 드러날까 두려워 또 하나의 기록을 지울 것인가.", "secret": "21:40 지하 설비실에서 직접 수동 차단 레버를 내렸고 21:52 다시 올렸다. 강태준의 부탁이었고 보수 이야기도 function nameEverywhere(root){if(!root)return;const replacements=activePeopleMap((p,i)=>[p.name,liveName(i)]).filter(([old,v])=>old!==v).sort((a,b)=>b[0].length-a[0].length);if(!replacements.length)return;
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const targets=[];let t;while(t=walker.nextNode()){if(t.parentElement&&(['SCRIPT','STYLE','TEXTAREA','OPTION'].includes(t.parentElement.tagName)||t.parentElement.closest('[data-keep-original]')))continue;targets.push(t)}
 for(const t of targets){let v=t.nodeValue;for(const [old,n] of replacements)v=v.split(old).join(n);if(v!==t.nodeValue)t.nodeValue=v}
 // select <option> needs updating as well, without mutating option values.
 for(const o of root.querySelectorAll('option')){let v=o.textContent;for(const [old,n] of replacements)v=v.split(old).join(n);o.textContent=v}
}

 else if(accompliceVotes.length){title='조력자만 지목 · 그림자만 붙잡다';story='일부 참가자는 일정표 삭제와 증거 은폐에 가담한 사람을 정확히 찾아냈다. 그러나 서도윤을 실제로 죽인 임수빈은 최종 지목에서 빠졌다. 산장 밖에서 진범을 추적할 새로운 수사가 시작된다.'}
 else{title=state.votes.length?'잘못된 지목':'미해결 사건';story='투표가 살인범과 그 은폐 조력자를 특정하지 못했다. 서로의 진술은 남았지만 그날 정전 중 서재에서 무슨 일이 있었는지는 공개되지 않았다.'}
 if(innocentVotes.length)title+=' · 무고한 인물 오지목';
 return {name:title,story,main:caught,guilty,accompliceVotes,innocentVotes};
}

function bookPage(){
 const p=role(),r=result();if(state.stage!=='finished')return `<h2>봉인된 기록</h2>${panel(`<h3>스토리북은 아직 열리지 않았습니다.</h3><p>모든 플레이어의 최종 선택 및 범인 투표를 마친 후 관리자만 공개할 수 있습니다.</p><p class="footer-note">관리자 콘솔의 '엔딩 공개'를 이용하세요.</p>`)}`;
 const choiceName={reveal:'폭로·자백',conceal:'은폐·침묵',deal:'거래'}[state.decision]||'선택 없음';
 const personalEnd=(()=>{if(!p)return '당신은 사건의 전말을 읽는다.';if(p.id===13)return r.main?'당신은 어머니의 죽음에 대한 진실을 찾았지만, 그 과정에서 스스로 저지른 살인도 인정하거나 추궁받아야 했다.':'당신은 당장의 지목은 피했지만 최민서와 남겨진 기록은 언제든 당신의 이름을 세상에 드러낼 수 있다.';if(p.id===6)return state.decision==='reveal'?'당신은 자신이 삭제한 일정표의 원본을 제출했다. 진실을 향한 증언이 늦어졌다는 사실 또한 기록으로 남았다.':'당신은 진범을 알고도 침묵했다. 숨긴 일정표가 언젠가 복원된다면 스스로 지켜 온 모든 것이 무너질 수 있다.';if([9,18].includes(p.id))return actualGuilty().includes(p.id)?'당신은 자신의 비밀을 지키려고 살인사건과 관련한 사실까지 의도적으로 숨겼다. 이제 사건의 은폐 조력자로서 후속 수사의 대상이 된다.':'당신은 불리한 상황에서도 살인범을 위한 적극적인 거짓 진술을 선택하지 않았다. 다만 원래 감추고 있던 문제에 대한 책임은 별개로 남는다.';return state.decision==='reveal'?'당신은 결국 자신이 가진 자료를 공개하기로 했다. 당신이 선택한 문장 하나가 다른 사람의 알리바이를 다시 쓰게 만들었다.':state.decision==='conceal'?'당신은 자신이 가진 불리한 자료를 남겨 두었다. 침묵이 살인에 가담했다는 뜻은 아니지만, 아직 공개되지 않은 의문은 남았다.':'당신의 선택은 사건을 완전히 끝내지 못했다. 그러나 당신이 모은 기록들은 누군가의 증언을 확인할 기준이 되었다.'})();
 return `<h2>사건의 최종 기록</h2>${panel(`<span class="tag">이번 시연의 결과</span><h2 class="gold">${safe(r.name)}</h2><p>${safe(r.story)}</p><p><b>최종 지목:</b> ${state.votes.length?state.votes.map(i=>safe(liveName(i))).join(', '):'없음'}</p><p><b>나의 마지막 선택:</b> ${safe(choiceName)}</p><p><b>판정 기준:</b> 임수빈(주범) · 최민서(확정 은폐 조력자)${r.guilty.includes(8)?' · 김도현(선택에 따라 가담)':''}${r.guilty.includes(17)?' · 배수아(선택에 따라 가담)':''}</p>`)}<article class="book"><h3>프롤로그 · 임혜정의 수첩</h3><p>10년 전 청명 프로젝트의 임상시험에 참여한 임혜정은 심각한 이상 반응을 호소했다. 그러나 경고는 조직의 기록에서 지워졌고, 사망 원인은 다른 이유로 정리되었다. 임혜정의 자녀 임수빈은 그날부터 진실을 찾기 시작했다.</p><h3>제1장 · 산장에 모인 사람들</h3><p>서도윤은 ${victimGender()==='미지정'?'연인 배역에 배정된 참가자의 성별이 확정되기 전까지 성별이 정해지지 않은 인물':victimGender()+'인 인물'}이었다. 홍예진 배역의 참가자는 서도윤과 여섯 해 동안 사실혼 관계였다. 회사 홍보 책임자이기도 했던 연인은 재산 문서와 왜곡된 발표문을 모두 의심하고 있었고, 21시 18분에는 서재 앞에서 격한 언쟁을 벌였다. 하지만 이 다툼 자체가 살인을 입증하는 증거는 아니었다. ${victimGender()==='여성'?'그녀에게 남은 마지막 밤이었지만, 연인은 그것을 알지 못했다.':victimGender()==='남성'?'그에게 남은 마지막 밤이었지만, 연인은 그것을 알지 못했다.':'이것은 서도윤에게 남은 마지막 밤이었지만, 연인은 그것을 알지 못했다.'}</p><p>17명의 초대객은 서로 다른 것을 얻기 위해 산장에 왔다. 누군가는 지분 계약을, 누군가는 잃어버린 연구노트를, 누군가는 자신이 만든 허위 문서를 되찾으려 했다. 그날 저녁 서도윤이 예고한 폭로는 모두의 이해관계를 흔들었다.</p><h3>제2장 · 21시 40분</h3><p>임수빈은 21시 25분 서재로 들어가 서도윤에게 어머니의 의료기록 원본을 요구했다. 서도윤은 수정된 폭로 자료를 고수했다. 21시 40분, 김도현이 다른 목적의 의뢰로 전원을 차단했고 서재에서 몸싸움이 벌어졌다. 임수빈은 21시 41~45분 사이 서도윤에게 치명적인 부상을 입혔다. 21시 46분 비상 서비스문으로 빠져나왔고, 문은 자동으로 닫혔다.</p><h3>제3장 · 침묵하는 사람들</h3><p>최민서는 임수빈의 비공개 면담과 서비스 통로 이용 정황을 알고도 일정표를 수정했다. 김도현은 정전의 이유를 은폐했고, 배수아는 오래전 합의서의 책임을 두려워했다. 하지만 김도현·배수아의 현재 살인 은폐 가담 여부는 각자의 마지막 행동에 따라 달라진다. 범행을 알지 못했던 과거의 행동만으로 살인 공범이라 단정할 수 없다.</p><h3>제4장 · 우리의 결말</h3><p>${safe(r.story)}</p><h3>제5장 · ${safe(liveName(state.role))}의 이후</h3><p>${safe(personalEnd)}</p><h3>부록 · 다른 가능성</h3><p>임수빈을 지목했다면 범행은 드러난다. 임수빈을 놓치고 최민서만 지목했다면 '조력자만 지목' 엔딩이 된다. 모두를 정확히 지목해도 임혜정 의료사고의 원본 기록이 자동 공개되는 것은 아니다. 10년 전 진실을 공개하는 선택은 각 인물이 수집한 문서와 폭로 여부에 달려 있다.</p><h3>등장인물 비밀 해금</h3>${activePeopleMap(x=>`<p><b>${safe(x.name)} · ${safe(x.job)}</b> — ${safe(x.weakPoint)}</p>`).join('')}</article><p class="footer-note">이 데모의 결과는 현재 기기의 투표·선택에 따른 미리보기입니다. Supabase 연결 후 모든 참가자의 최종 선택과 합산 투표를 기준으로 확정됩니다.</p>`;
}

function v11AtRoom(){let pos=state.v11Pos;if(!pos||pos.room!==state.room){pos={room:state.room,x:5,y:7};state.v11Pos=pos;}return pos}
function v11Furniture(room){const here=DATA.rooms[room];let a=here.items.map((id,k)=>({kind:'evidence',key:id,id,x:V11_OBJECTS[k%V11_OBJECTS.length][0],y:V11_OBJECTS[k%V11_OBJECTS.length][1],icon:V11_SPRITES[k%V11_SPRITES.length],label:['서류·가구 조사','잠긴 수납장','오래된 물건','기록 보관대','조사할 물체'][k%5]})).filter(o=>!claimOwnerV11('E:'+o.id));
 // 19 wardrobes distributed over twelve rooms; none of their contents are visible until search.
 activePeopleForEach((person,i)=>{if(i%DATA.rooms.length!==room||i===state.role)return;if(person.personalItems.every((_,index)=>!!claimOwnerV11('P:'+i+':'+index)))return;let slot=Math.floor(i/DATA.rooms.length);a.push({kind:'bag',key:'bag-'+i,person:i,x:slot===0?1:9,y:6,icon:'🧳',label:'개인 보관함'})});

function v11Block(x,y,room){if(x<1||y<1||x>9||y>7)return true;if(V11_BLOCKED.has(x+','+y))return true;return v11Furniture(room).some(o=>o.x===x&&o.y===y)}

function v11PathTo(tx,ty){const pos=v11AtRoom(),key=(x,y)=>x+','+y;const todo=[[pos.x,pos.y]],came=new Map([[key(pos.x,pos.y),null]]);while(todo.length){const [x,y]=todo.shift();if(x===tx&&y===ty){let path=[],z=key(x,y);while(came.get(z)){const [xx,yy]=z.split(',').map(Number);path.push([xx,yy]);z=came.get(z)}return path.reverse()}
 for(const [nx,ny] of v11Neighbors(x,y,state.room)){const nk=key(nx,ny);if(!came.has(nk)){came.set(nk,key(x,y));todo.push([nx,ny])}}}return null}

function v12JoyAim(e){
 if(!JOY12.pad)return;
 const b=JOY12.pad.getBoundingClientRect(),mx=b.left+b.width/2,my=b.top+b.height/2;
 let dx=e.clientX-mx,dy=e.clientY-my,mag=Math.hypot(dx,dy);

}

IN / 03:40 OUT\n※ 2016년 데이터. 오늘 밤 사건 시각과 무관", "owner": null, "concerns": [3, 12, 13], "gm": "박현우가 사고 전날 밤 중단 권고서를 들고 왔고 신우진이 결재함에 접근했다는 기록. 사망 이틀 뒤 새벽 경영진(서도윤) 카드의 기록실 출입은 사후 수정 정황. 현재 살인 시각과 섞으면 안 된다."}, {"id": "E12", "spot": "mgmt_keybox", "phase": 1, "title": "열쇠 반출 대장", "kind": "document", "text": "열쇠함 문 안쪽에 대장이 끈으로 매달려 있다. 오늘 밤 서명이 몇 줄 있다. '서재 서비스문' 줄에는 반출 기록이 한 번도 없다.", "detail": "【열쇠 반출 대장 · 11.07】\n16:30 객실키 201~205 배부 · 백하린\n21:34 시설 마스터키 반출 · 김도현 / 확인 백하린\n22:02 관리 마스터키 반출 · 백하린 (22:20 반납)\n서재 정문키 · 서도윤 대표 소지\n서재 서비스문키 · 보관 중 (반출 없음)\n서재 업무 출입카드 · 최민서 (서비스문 권한 없음)\n203호 예비키 수량: 2 → 3 (덧쓴 흔적)", "owner": 10, "concerns": [10, 9, 6], "gm": "서비스문 열쇠는 아무도 가져가지 않았다 → 열쇠 없이 안에서 나가면 저절로 잠기는 문(E17). 21:34 서명은 김도현의 정전 준비, 22:02는 백하린이 최민서와 정문을 연 기록. 203호 예비키 덧씀은 백하린의 무단 복제(C21)."}, {"id": "E13", "spot": "storage_box", "phase": 2, "title": "익명 제보자의 편지", "kind": "letter", "text": "상자 더미 아래 '청명 연구센터 이관 · 2016 우편물'이라고 적힌 오래된 상자가 있다. 그 안에 '수취인 불명 반송' 도장이 찍힌 봉투 하나가 뜯기지 않은 채 섞여 있다.", "detail": "【봉투】 받는 사람: 청명 피해가족 모임 대표 앞 / 소인 2016.10.28 / 반송\n【내용】\n\"연구노트 37~38쪽과 병동 간호 관찰기록이 곧 바뀝니다.\n 현장 연구원의 중단 권고는 분명히 있었습니다.\n 원본 색인은 연구동 자료보관 구역의 작은 보관함에 남아 있을 겁니다.\n 저는 이름을 밝힐 수 없습니다. 안에서 일하는 사람.\"", "owner": null, "concerns": [8, 3, 13, 4], "gm": "2016년 기록 삭제를 미리 경고한 익명 편지(제외 배역의 개인 편지를 대체). 피해가족 모임(오세린)에게 가지 못하고 회사 우편물로 되돌아와 묻혔다. '작은 보관함의 원본 색인'은 박현우가 21:45 챙긴 색인표(C29)와 연결. 창고가 2차 전용 구역이라 2차 공개."}, {"id": "E14", "spot": "archive_drawer", "phase": 2, "title": "청명 설계도 원본 REV.03", "kind": "blueprint", "text": "다시 살펴보니 서랍 바닥이 이중으로 되어 있다. 판자를 들어 올리자 둘둘 말린 청사진이 나온다. 모서리 한 귀퉁이가 손바닥만큼 찢겨 없다.", "detail": "【청명 투약 제어 장치 설계도 REV.03】\n변경: 안전 인터록(이상 반응 시 자동 중단 회로) 삭제\n설계: 신우진 / 결재: (공란)\n여백 전달 경로 메모: \"중단 권고 · 현장(P) → 기술 책임 → 대표 결재 대기\"\n※ 찢긴 모서리: 누군가 일부를 떼어 감", "owner": 12, "concerns": [12, 3], "gm": "자동 중단 회로를 뺀 도면, 서명자 신우진. 찢긴 모서리는 신우진 가방의 설계도 조각과 맞는다. 중단 권고가 기술 책임 단계에서 멈췄음을 E02와 대조해 확인. 신우진이 21:35~21:48 자료보관 구역 서랍을 뒤진 이유."}, {"id": "E15", "spot": "study_desk", "phase": 1, "title": "지분 이전 계약 (서도윤 보관본)", "kind": "document", "text": "책상 오른쪽 서랍에 '지분'이라고 적힌 파일이 있다. 계약서 한 부와 서도윤 필체의 포스트잇이 함께 끼워져 있다.", "detail": "【청명 프로젝트 투자 지분 계약 · 대표 보관 사본】\n지분 이전: 강태준 18% → 서도윤 (2016.12 사고 후 귀속)\n제3조 연구비 정산 완료 시 잔금 지급 (형광펜)\n제7조 대표 유고 시 해당 지분은 지정 상속인에게 승계\n서명: 강태준 / 서도윤 / 입회: 재무 윤서아\n포스트잇: \"원본은 회계실 앞 복도 문서함 J-18. 자정 공개 자료에 포함할 것.\"", "owner": 1, "concerns": [1, 2, 11], "gm": "강태준·윤서아의 금전 갈등과 서지안의 상속 이해관계를 잇는 자료. 강태준은 정전 중 이 원본을 복도 문서함에서 찾았다(21:47 상의 안에 챙김, 본인 비밀). 서재에는 들어가지 않았으므로 이 사본은 손대지 않았다."}, {"id": "E16", "spot": "pr_desk", "phase": 1, "title": "언론 대응 원고", "kind": "document", "text": "책상 위에 버전별로 철해진 보도자료가 쌓여 있다. 가장 오래된 장은 2016년 날짜다. 최신본에는 한 문단 전체에 취소선이 그어져 있다.", "detail": "【보도자료 v1 · 2016.11】\n\"참가자는 기저질환으로 급성 악화되어 사망… 연구와 무관\"\n【자정 발표문 v4 · 오늘】\n[취소선] \"당시 경영진은 중단 권고를 보고받고도 실험을 계속했다\"\n하단 검토란: H.Y.J ✓ / \"기자 원본 요구 시 거절\"", "owner": 15, "concerns": [15, 4], "gm": "홍예진이 10년 전 허위 문안을 썼고 오늘 발표문에서도 경영진 책임 문단이 빠졌다. 20:26 정유리의 원본 요구를 거절한 이유. 동기 자료일 뿐 현장 증거는 아니다."}, {"id": "E17", "spot": "mgmt_desk", "phase": 1, "title": "서재 보조문 수리 내역", "kind": "document", "text": "업무 책상 위에 시설 수리 기록 바인더가 펼쳐져 있다. '서재 보조(서비스)문' 항목에 형광펜이 칠해져 있고, 작은 글씨로 주의사항이 붙어 있다.", "detail": "【시설 수리 기록 · 2025.11】\n대상: 2층 서재 보조문 (서비스 통로 연결)\n작업: 자동 걸쇠 설치 · 문이 닫히면 자동으로 잠김\n 안쪽: 손잡이로 열림 / 바깥쪽: 열쇠 필요\n요청: 서도윤 대표 / 시공: 시설팀 K.D.H / 점검 요청: 매니저 백하린 (3회)\n주의: \"닫힌 뒤에는 바깥에서 보면 잠긴 문과 구분 불가\"", "owner": 9, "concerns": [9, 10, 7, 13], "gm": "현장 확인 갈래 1. 밀실의 해답: 안에서 나가면 문이 저절로 잠긴다. 열쇠 없이 서재를 빠져나간 사람이 있을 수 있다는 출발점. 강태준의 오래된 평면도(가방)는 걸쇠 설치 전 도면이라 무관."}, {"id": "E18", "spot": "server_sensor", "phase": 2, "title": "복도 센서 이동 기록", "kind": "system", "text": "센서 제어 단말에 2층 문·동작 센서 기록이 남아 있다. 정전 중에도 배터리로 작동한 기록이다. 서재 보조문 줄이 21:46에 깜빡인다.", "detail": "【SENSOR LOG · 배터리 모드 · 서버 시각(정확)】\n21:40:00 주전원 차단 → 센서 배터리 전환\n21:46:03 서재 보조문 OPEN\n21:46:05 서재 보조문 CLOSE · AUTO-LATCH\n21:46:18 2F 서비스 통로 MOTION\n21:47:02 2F 서비스 계단 문 OPEN/CLOSE (충격 감지)\n21:47:30 서비스 계단 2F→1F MOTION\n21:48:05 1F 서비스 계단실 MOTION (이후 7분간 간헐 감지)\n21:55:10 1F 서비스 계단실 → 라운지 문 OPEN", "owner": 19, "concerns": [19, 13, 10, 6, 7], "gm": "현장 확인 갈래 2. 사망 추정(21:41~21:45) 직후 누군가 보조문으로 나가 서비스 계단으로 내려갔고, 1층 계단실에 7분가량 머문 뒤 21:55 라운지로 나왔다. 21:56 라운지에서 젖은 머리로 가방을 닫던 임수빈(오세린 목격)과 연결. 21:47 충격음은 백하린·정유리·홍예진·서지안이 들은 소리."}, {"id": "E19", "spot": "study_floor", "phase": 2, "title": "서재 현장 감식 기록", "kind": "medical", "text": "현장 보존선 안쪽에 감식 메모판이 세워져 있다. 사망 추정 시간이 굵게 적혀 있고, 손목 부분 메모에 동그라미가 쳐져 있다.", "detail": "【현장 감식 기록 (임시) · 22:08 현장 통제 이후 작성】\n사망 추정: 21:41 ~ 21:45\n사인: 후두부 충격 · 책상 모서리 혈흔과 일치\n피해자 양 손목 압박흔 · 몸싸움 정황\n바닥: 깨진 물잔, 밀려난 의자\n피해자 오른손 손톱 밑: 청색 면섬유 미량\n둔기·흉기 없음 / 계획 범행 정황 약함", "owner": 13, "concerns": [13, 7, 1, 6], "gm": "현장 확인 갈래 3. 정전 직후 4분 사이의 몸싸움. 이 시각 강태준은 1층 회계실·복도(윤서아 21:43 메시지), 최민서는 비서실(21:42)과 계단(21:44)에 있었다. 청색 섬유는 E22·임수빈의 손수건과 연결. 의료인이라는 직업만으로 사인을 단정하지 말 것."}, {"id": "E20", "spot": "study_desk", "phase": 2, "title": "서재 녹음 복원 18초", "kind": "audio", "text": "다시 살펴보니 책상 램프 받침 아래에 손가락만 한 녹음기가 숨겨져 있다. 면담 때마다 몰래 켜 두던 장치인 듯하다. 파일이 손상되어 마지막 18초만 복구된다.", "detail": "【REC_2125.wav · 녹음기 시계 = 서버 동기화】\n파일 시작: 21:25:04\n복구 구간 21:41:40~21:41:58\n(정전 직후 숨소리, 의자 끌리는 소리)\n서도윤: \"…임혜정 씨 일은, 나도 어쩔 수—\"\n다른 목소리(낮고 떨림): \"그 이름, 당신 입으로 부르지 마.\"\n(부딪히는 소리) (무거운 것이 넘어지는 소리)\n녹음 끝", "owner": 13, "concerns": [13, 6, 19, 4], "gm": "현장 확인 갈래 4. 21:25에 시작된 면담이 정전 뒤까지 이어졌고 상대는 '임혜정'에 격하게 반응한 사람. 목소리만으로 화자를 확정할 수 없으니 E23(21:25 면담자)·E21(보호자 이름)과 대조해야 한다."}, {"id": "E21", "spot": "study_safe", "phase": 2, "title": "임혜정 의료 일지 사본", "kind": "medical", "text": "금고 문이 열려 있다. 안에 봉투 하나와 손때 묻은 진료 일지 사본이 들어 있다. 일지 앞장에 메모지가 클립으로 꽂혀 있다.", "detail": "【진료 일지 사본 · 참가자 #07 임혜정 · 2016】\n10.02 \"약 먹고 나면 손끝이 저리다. 연구진에게 말함.\"\n10.11 \"중단하고 싶다고 했다. '조금만 더'.\"\n10.20 \"꼭 기록해 주세요.\"\n병동 보고: 이상 반응 3회 · 본사 보고 누락\n보호자: 자녀 임수빈\n클립 메모(서도윤 필체): \"오늘 21:25. 이 사람의 자녀가 온다. 간호사로. 원본을 원할 것이다.\"", "owner": 13, "concerns": [13, 8, 15, 6], "gm": "동기 확인 갈래 4. 서도윤은 임수빈의 정체를 알고 21:25 면담에 대비했다. E20의 '임혜정' 반응과 결합하면 면담자=임수빈. 금고 번호는 홍예진 힌트(C05)."}, {"id": "E22", "spot": "study_sidedoor", "phase": 2, "title": "서비스문 섬유 흔적", "kind": "object", "text": "다시 살펴보니 보조문 자동 걸쇠 모서리에 무언가 걸려 있다. 파란 실 몇 가닥이다. 천 가장자리가 급히 문틈에 끼었다 빠진 듯하다.", "detail": "【채취물】\n위치: 서재 보조문 걸쇠 금속 모서리 (바닥에서 약 90cm)\n성분: 청색 면사 4가닥 · 얇은 평직, 오래 빨아 색이 바램\n형태: 손수건·스카프 가장자리 올\n비교: 피해자 손톱 밑 섬유(E19)와 색·굵기 유사", "owner": 13, "concerns": [13, 10], "gm": "현장 확인 갈래 5. 보조문으로 나간 사람이 파란 천을 쥐고 있었다. 임수빈 가방(BAG13)의 올 풀린 파란 손수건과 대조. 단독으로 확정할 수는 없다."}, {"id": "E23", "spot": "secr_pc", "phase": 2, "title": "삭제 전 면담 일정 백업", "kind": "system", "text": "다시 살펴보니 PC 문서 프로그램에 버전 기록이 남아 있다. 같은 일정표가 두 번 저장되었고, 사건 뒤 저장본에서 한 줄이 사라졌다.", "detail": "【내부면담.docx · 버전 기록 · PC 시계 = 서버 동기화】\nv3 21:05 저장 · 사용자 choi.ms\n 21:10 강태준 부대표 · 지분 계약\n 21:25 임수빈 · 비공개 면담 (서재, 배석 없음)\nv4 22:18 저장 · 사용자 choi.ms\n 21:25 행 삭제\n22:19 출력 1부 (비서실 프린터)", "owner": 6, "concerns": [6, 13, 19], "gm": "기회 확인 갈래 2. 21:25 면담자는 임수빈, 지운 사람은 비서실 계정(최민서), 시각은 사건 뒤 22:18. 은폐 조력의 결정적 증거. E06 공개판·C26 대기 카드와 비교하면 삭제가 드러난다."}, {"id": "E24", "spot": "legal_cab", "phase": 2, "title": "공동거주 계약 기록", "kind": "document", "text": "다시 살펴보니 보관함 뒤판 쪽에 얇은 파일 하나가 따로 꽂혀 있다. 회사 서류와 섞이지 않게 숨겨 둔 것 같다. 두 사람의 서명이 나란히 있다.", "detail": "【공동거주 계약서 (사본)】\n주소: 서울 ○○구 ○○로 17, 1203호\n기간: 2019.04 ~ (갱신)\n당사자: 서도윤 / 홍예진 (자필 서명)\n생활비 분담·공동 소유 물품 목록 첨부\n공증 상담: 이재혁 (2024)", "owner": 15, "concerns": [15, 11, 5], "gm": "홍예진과 서도윤의 사실혼 관계. 유언장 'H'의 정체이자 금고 번호 앞 두 자리(04). 상속 이해관계는 있지만 살인 증거는 아니다."}, {"id": "E25", "spot": "study_shelf", "phase": 2, "title": "서도윤의 미개봉 편지", "kind": "letter", "text": "다시 살펴보니 책장 맨 아래 칸 사진첩 속에 봉투가 끼워져 있다. 겉봉에 'Y에게 · 발표 뒤에 열 것'이라고 쓰여 있다. 봉투는 아직 뜯기지 않았다.", "detail": "【봉투 겉면】 Y에게. 발표 뒤에 열 것. (11.07)\n【내용】\n\"마지막 발표 뒤 네게 꼭 해야 할 말이 있다.\n 금고의 봉투는 네가 열어. 그 안에 이름이 하나 있다.\n 그 사람이 오늘 오면, 나는 도망치지 않을 거야.\n 지안이에게는 내가 직접 말할게.\"\n— D.", "owner": 15, "concerns": [15, 11, 13], "gm": "서도윤이 홍예진에게 남긴 사적인 고백. '금고 속 이름'은 E21의 임혜정·임수빈. 서지안 언급은 상속 정리 의도. 살인 고백은 아니다."}, {"id": "D-01", "spot": "lobby_desk", "phase": 1, "title": "다큐멘터리 촬영 일정표", "kind": "document", "text": "안내데스크 옆 클립보드에 촬영 일정표가 끼워져 있다. 시간대별로 촬영 장소가 적혀 있고, 구석에 볼펜으로 휘갈긴 메모가 하나 있다.", "detail": "【다큐멘터리 촬영 일정표 · 2026.11.07 · 감독 김세진】\n16:40 장비 반입 (로비, 매니저 확인)\n18:50 로비 · 도착 인터뷰 (초상 거절자는 음성·손만)\n19:15 식당 · 저녁 스케치\n20:00 식당 · 대표 발표 (편집 없이 원본 보존)\n20:10 로비·라운지 스케치\n21:20 2층 서재 주변 · 인터뷰 준비, 장비 확인\n21:30 로비 · 장비 점검\n24:00 식당 · 자정 원본 공개\n구석 수기 메모: \"김 감독 장비 가방 2층\"", "owner": 16, "concerns": [6, 10, 4], "gm": "감독 유도 단서. 감독의 장비 가방이 왜 2층 서재 근처에 있었는지 의문을 품게 한다. 1차 토론 이후 이 일정표를 감독(김세진)에게 보여 주면 힌트 A(가방 속 카메라에 21:30 무렵 의료사고 원본을 요구하는 흐린 목소리)를 듣는다. 기회 확인 갈래 3."}, {"id": "D-02", "spot": "archive_desk", "phase": 2, "title": "촬영 장비 기록표", "kind": "document", "text": "다시 살펴보니 열람 책상 한쪽에 임시 편집대가 차려져 있다. 노트북 옆에 방금 출력한 듯한 장비 점검표 한 장이 놓여 있다.", "detail": "【촬영 장비 기록표 · 22:20 이후 출력 · 감독 김세진】\n장비: 카메라 A (2층 객실 복도 수납 벤치의 장비 가방 안)\n녹화 상태: ON · 21:26 ~ 21:48 (보안 서버 기준 보정값)\n 카메라 자체 시계 21:27 ~ 21:49 (서버보다 약 1분 빠름)\n영상: 가방 안감으로 화면 가려짐\n음성: 일부 남음 (천 너머, 화자 판별 불가)\n원본: 감독 보관 · 복제본 별도 보존", "owner": 16, "concerns": [4, 19, 13, 6], "gm": "감독 유도 단서. 2차 수집 이후 감독에게 제시하면 힌트 B(21:46쯤 금속성 문 닫히는 소리, 어느 문인지는 모름)를 듣는다. E18 21:46:05 보조문 AUTO-LATCH와 시각을 맞추는 현장 확인 갈래 6. 감독 가방·카메라·SD카드 자체는 파밍 대상이 아니다."}, {"id": "C01", "spot": "study_desk", "phase": 1, "title": "발표 원고 마지막 장", "kind": "document", "text": "책상 위에 자정 발표 원고가 흩어져 있다. 마지막 장만 다른 종이에 출력되어 있고, 여백에 굵은 손글씨가 남아 있다.", "detail": "【자정 발표 원고 p.12 (19:48 교체본)】\n\"청명 프로젝트의 모든 자료를 오늘 공개합니다.\"\n여백 손글씨:\n\"자정 전에 먼저 만나야 할 사람이 있다.\n 이름은 원고에도 일정표에도 쓰지 말 것.\"\n하단 출력 정보: 비서실 프린터 19:46", "owner": 6, "concerns": [6, 13], "gm": "마지막 장은 최민서가 19:48 식당에서 서도윤에게 건넸다(홍예진 목격). '먼저 만날 사람'=21:25 비공개 면담자. 1차에서는 정체 불명."}, {"id": "C02", "spot": "acct_desk", "phase": 1, "title": "만년필 뚜껑", "kind": "object", "text": "책상 아래에 서류 몇 장이 흩어져 있고, 그 사이에 검은 만년필 뚜껑이 떨어져 있다. 어둠 속에서 누군가 급히 뒤진 자리 같다.", "detail": "【만년필 뚜껑】\n클립 각인: K.T.J\n뚜껑 안쪽 잉크가 아직 촉촉함 (최근에 떨어짐)\n주변: 책상 아래 서류철이 휴대폰 불빛에 비춰 뒤진 듯 뒤집혀 있음", "owner": 1, "concerns": [1, 2], "gm": "강태준이 21:40 정전 직후 회계실 책상 아래에서 휴대폰 불빛으로 서류를 찾다 흘린 뚜껑. 강태준 가방(BAG01)의 뚜껑 없는 만년필과 짝. 21:30~21:38 윤서아가 들은 뚜껑 소리, 21:43 메시지와 함께 살인 시각 1층에 있었다는 알리바이. 서재에는 들어간 적이 없다."}, {"id": "C03", "spot": "study_sidedoor", "phase": 1, "title": "잠긴 보조문", "kind": "object", "text": "서재 구석의 보조문은 단단히 잠겨 있다. 손잡이 아래 금속 걸쇠가 내려와 있고, 문틈으로 차가운 바람이 새어 든다.", "detail": "【관찰】\n보조문: 잠김 (바깥 서비스 통로 쪽)\n걸쇠: 내려가 있음 / 열쇠 구멍은 바깥쪽에만 있음\n문틈 바람: 통로 너머가 계단으로 이어지는 듯\n서도윤이 평소 했다는 말: \"보조 통로는 늘 잠겨 있다.\"", "owner": null, "concerns": [10, 9, 7], "gm": "1차에서는 밀실처럼 보이게 하는 단서. 2차 E17·E18·E22로 뒤집힌다."}, {"id": "C04", "spot": "study_shelf", "phase": 1, "title": "경고 편지 (원본)", "kind": "letter", "text": "책장 사이에 접힌 편지가 꽂혀 있다. 글씨가 날카롭고 획이 눌려 있다. 끝에 이니셜만 적혀 있다.", "detail": "\"당신이 설계를 바꾸라고 했던 날을 기억합니다.\n 그 회로를 뺀 건 내 손이지만, 지시는 당신이었습니다.\n 이번에도 내 이름만 남긴다면\n 나도 모든 걸 말하겠습니다. 당신도 끝입니다.\"\n— W.J. (2026.08)", "owner": 12, "concerns": [12], "gm": "신우진이 서도윤에게 보낸 경고 편지 원본(가방에는 사본). '회로'는 E14의 안전 인터록. 살인 동기처럼 보이지만 목적은 자료 확보."}, {"id": "C05", "spot": "study_safe", "phase": 1, "title": "잠긴 금고와 메모지", "kind": "object", "text": "금고는 굳게 잠겨 있다. 다이얼 옆에 작은 포스트잇이 붙어 있고, 정갈한 글씨로 힌트 같은 문장이 적혀 있다.", "detail": "【금고: 잠김 (4자리)】\n포스트잇:\n\"앞 두 자리 = 우리가 처음 같이 살기 시작한 달\n 뒤 두 자리 = 네가 아는 그 숫자\"\n손잡이에 지문을 닦은 흔적은 없음", "owner": 15, "concerns": [15, 11], "gm": "'같이 살기 시작한 달'=04(E24, 2019.04). 번호를 아는 사람은 홍예진. 2차에 금고가 열리고 E21이 나온다."}, {"id": "C06", "spot": "secr_pc", "phase": 1, "title": "프린터 출력 기록", "kind": "system", "text": "비서실 PC 화면 구석에 프린터 작업 내역이 떠 있다. 사건이 난 뒤의 시각에 출력된 문서가 있다. 모니터 테두리에 메모지가 붙어 있다.", "detail": "【출력 내역 · 서버 시각】\n19:46 발표원고_p12.pdf\n21:16 내부면담_순서표.pdf\n22:19 내부면담_수정.pdf ← ?\n【메모지】 \"백업 암호: 첫 출근일 + 대표님 이니셜\"", "owner": 6, "concerns": [6], "gm": "22:19에 면담표를 '수정'해 다시 출력한 사람이 있다. 최민서 은폐의 1차 힌트. 백업 암호 메모는 2차 E23 복원 열쇠(최민서 가방의 암호 메모와 같은 내용)."}, {"id": "C07", "spot": "dining_table", "phase": 1, "title": "식탁 좌석 카드", "kind": "object", "text": "긴 식탁에 손님 이름이 적힌 좌석 카드가 그대로 남아 있다. 몇 장에는 메모가 휘갈겨져 있다. 식탁 끝에 털 달린 마이크 바람막이 하나가 굴러 있다.", "detail": "【19:15 저녁 좌석】\n상석: 서도윤 (19:20 착석) / 맞은편: 강태준, 그 옆 윤서아\n박현우 · (두 자리) · 신우진\n이재혁 / 서지안은 반대편 끝\n홍예진 옆: 배수아 / 끝자리: 임수빈, 오세린\n강태준 카드 뒷면: \"20:00 반박할 것\"\n바람막이 안쪽 라벨: PRESS · J.Y.R", "owner": null, "concerns": [1, 2, 3, 12, 5, 11, 4], "gm": "저녁 동선 정리용. 박현우·신우진이 서로 피해 앉았고 서지안은 이재혁과 떨어져 앉았다. 바람막이는 20:00 발표를 녹음한 정유리의 것(E04와 짝)."}, {"id": "C08", "spot": "lobby_board", "phase": 1, "title": "게시판의 인원 메모", "kind": "notebook", "text": "비상등 위치 안내문 아래에 볼펜 메모가 덧붙어 있다. 경찰 조서처럼 시각과 인원을 줄 맞춰 적었다. 글씨 끝마다 짧게 밑줄을 긋는 버릇이 있다.", "detail": "【21:40 정전 · 로비 비상등 아래 확인】\n21:40 본인, 다큐 감독 김세진_\n21:41 서버 기술자, 지하에서 올라옴_\n21:42 이재혁 변호사, 계단 아래 비상등 곁_\n21:44 누군가 중앙 계단을 올라감. 실루엣만, 구두 소리_\n21:45 매니저 손전등 2층으로_\n21:48 같은 구두 소리 급히 내려와 1층 복도 쪽으로_\n21:50 자문 변호사 문서가방 들고 관리실 쪽으로_", "owner": 7, "concerns": [7, 19, 5, 10, 18, 6], "gm": "한지훈의 메모. 한지훈·김세진·문하준·이재혁의 정전 직후 알리바이. 21:44~21:48 구두 소리 왕복은 최민서(밝은 회색 카디건), 21:50은 배수아. 계단 쪽 인물은 서재 보조문 이탈자와 다른 사람이다."}, {"id": "C09", "spot": "garden_bench", "phase": 1, "title": "신문 스크랩과 메모", "kind": "notebook", "text": "벤치 위에 비닐 파일 하나가 놓여 있다. 오래된 신문 기사들이 붙어 있고, 마지막 장 여백의 글씨가 유난히 세다.", "detail": "【스크랩: 2016.10 '임상 참가자 기저질환으로 사망' 외 5건】\n여백 메모:\n\"서도윤. 반드시 대가를 치르게 할 것.\"\n\"20:40 정원. 한 형사님께 다시 보여 드림.\"\n파일 표지 스티커: 청명 피해가족 모임", "owner": 8, "concerns": [8, 7], "gm": "오세린이 20:40~21:20 정원에서 한지훈과 2016년 수사 이야기를 나누다 두고 들어간 파일. 분노 메모는 약점이지만 행동으로 옮기지 않았다(21:20 이후 라운지)."}, {"id": "C10", "spot": "mgmt_keybox", "phase": 1, "title": "비어 있는 열쇠 고리", "kind": "object", "text": "열쇠함 문이 조금 열려 있다. '시설 마스터' 고리가 비어 있다. 바로 옆 '서재 서비스문(예비)' 고리에는 열쇠가 그대로 걸려 있다.", "detail": "【열쇠함 현황】\n시설 마스터키: 없음\n관리 마스터키: 있음 (22:20 반납 표시)\n서재 서비스문(예비): 있음 · 먼지가 고르게 쌓임\n객실 예비키 203: 3개 (다른 방은 2개씩)", "owner": 9, "concerns": [9, 10], "gm": "시설 마스터키는 김도현이 21:34 가져감(E12). 서비스문 열쇠는 아무도 손대지 않았다. 203호 예비키만 하나 더 = 백하린 복제(C21)."}, {"id": "C11", "spot": "lobby_desk", "phase": 1, "title": "체크인 기록", "kind": "document", "text": "안내데스크 위에 체크인 명부가 펼쳐져 있다. 짐 보관 칸에 체크가 줄지어 있는데, 한 줄만 '직접 소지'라고 따로 적혀 있다.", "detail": "【체크인 명부 · 11.07】\n16:40 촬영 장비 반입 · 다큐 감독 (B.H.R 문 개방)\n18:40 윤서아 / 신우진 / 이재혁 / 배수아\n19:02 강태준 · 봉투 수령 (비서실 전달)\n19:14 의료지원 · 가방 보관 거절, 직접 소지\n21:30 비상등 위치 안내 완료 · B.H.R", "owner": 10, "concerns": [10, 13, 1], "gm": "의료 가방을 맡기지 않은 사람=임수빈. 1차에서는 사소해 보이는 행동이지만 21:20 라운지 소파에 가방을 두고 손수건만 쥐고 나간 장면(배수아 목격)과 이어진다."}, {"id": "C12", "spot": "lounge_fire", "phase": 1, "title": "타다 만 이메일 출력본", "kind": "document", "text": "벽난로 장작 사이에 구겨진 종이가 던져져 있다. 불길이 닿지 않아 글자가 대부분 남아 있다. 받는 사람 주소 앞부분만 읽힌다.", "detail": "【이메일 출력본 · 10:05 수신】\n받는 사람: jian.s***@\n\"발표가 끝나면 유언 내용을 정리할 생각이다.\n 놀라지 말고, 산장에서 이야기하자.\"\n— D.\n종이 뒷면 볼펜: \"15%?? 말도 안 돼\"", "owner": 11, "concerns": [11, 5], "gm": "서지안이 받은 유언 변경 예고 메일. 20:18 라운지에서 서도윤에게 이유를 물었다가 \"관계없는 일\"이라는 답을 듣고 벽난로에 던졌다. 금전 동기 자료."}, {"id": "C13", "spot": "dining_cupboard", "phase": 1, "title": "찬장 위 메모와 물컵", "kind": "notebook", "text": "비상등 아래 찬장 위에 물이 반쯤 남은 컵 하나가 놓여 있다. 그 옆에 법무용 포스트잇 한 장이 붙어 있다. 찬장 모서리에 무거운 가방 손잡이에 눌린 자국이 있다.", "detail": "【포스트잇 (단정한 글씨)】\n\"21:42 법률문서실에서 나옴. 봉인 상태 확인.\n 불 들어오기 전엔 움직이지 말 것.\n 21:49 관리실 빈 서랍으로 옮길 것. B.S.A\"\n컵: 하나뿐 · 립밤 자국 없음", "owner": 18, "concerns": [18, 7, 8], "gm": "배수아가 21:42~21:49 식당 비상등 아래에서 혼자 문서가방을 붙잡고 있었다는 흔적. 21:50 1층 계단(한지훈·오세린 목격), 21:52 관리실 서랍(C15)으로 이어지는 동선을 설명한다. 서재와 먼 곳."}, {"id": "C15", "spot": "mgmt_desk", "phase": 1, "title": "빈 책상 서랍의 봉인 봉투", "kind": "document", "text": "업무 책상 맨 아래 서랍이 덜 닫혀 있다. 안에 법무용 대형 집게로 묶인 봉투 하나가 들어 있다. 봉인 라벨이 붙어 있어 열 수는 없다.", "detail": "【봉투 라벨】 \"법률자문 · 기밀 · 개봉 금지 · B.S…\"\n대형 법무용 집게 2개\n서랍 안 다른 물건 없음 (평소 비어 있던 서랍)\n봉투 모서리가 살짝 젖어 있음", "owner": 18, "concerns": [18, 10, 9], "gm": "배수아가 21:52 관리실 빈 책상 서랍에 봉인 봉투를 맡겨 둔 흔적. 21:53 관리실 앞에서 백하린과 스쳤다(C31 봉인 스티커). 범인 동선과는 무관한 미끼."}, {"id": "C16", "spot": "svc_floor", "phase": 2, "title": "서비스 통로의 발자국", "kind": "object", "text": "먼지 쌓인 통로 바닥에 발자국이 한 줄로 나 있다. 서재 보조문 앞에서 시작해 서비스 계단 쪽으로만 이어지고, 돌아온 자국은 없다.", "detail": "【발자국】\n시작: 서재 보조문 앞 / 끝: 서비스 계단 2층 문\n크기: 약 230mm, 굽 낮은 고무 밑창 (쿠션 패턴)\n보폭: 넓고 불규칙 · 뛰듯이 이동\n객실 복도 연결문: 복도 쪽에서 잠김. 손바닥만 한 유리창으로 복도가 보임. 문 안쪽엔 다른 발자국 없음", "owner": 13, "concerns": [13, 6, 10], "gm": "보조문으로 나간 사람은 서재 안에 있던 사람이고 간호화 같은 고무 밑창이다. 구두 소리의 주인(최민서)은 통로에 들어오지 않았고 21:47 연결문 유리창 너머로만 보았다. 백하린이 21:49 연결문이 잠긴 것을 확인한 사실과 일치."}, {"id": "C17", "spot": "svcst1_floor", "phase": 2, "title": "멸균 거즈 포장지와 생수병", "kind": "medical", "text": "다시 살펴보니 계단 마지막 칸 밑 틈에 작은 포장지가 끼어 있다. 병원 납품용 멸균 거즈 포장이다. 옆에 거의 비운 생수병 하나가 쓰러져 있다.", "detail": "【포장지】 '멸균 거즈 4×4 / 의료기관 납품용' 로트 MG-2210\n뜯은 모서리에 아주 옅은 붉은 자국\n【생수병】 산장 객실 비치용, 거의 비어 있음 · 바닥에 물 고인 자국\n이 계단은 2층 서비스 통로와 바로 이어진다.", "owner": 13, "concerns": [13, 8, 5], "gm": "서비스 계단으로 내려온 사람이 21:48~21:55 이곳에 숨어 생수로 손수건을 적셔 손·얼굴을 닦고 거즈 포장을 버렸다. 21:53 이재혁이 들은 물기 짜는 소리, 21:56 젖은 머리로 의료 가방을 닫던 임수빈(오세린 목격)과 연결."}, {"id": "C18", "spot": "sec_monitor", "phase": 2, "title": "보안실 접속 기록", "kind": "system", "text": "CCTV 모니터 옆에 로그인 기록 창이 열려 있다. 사건 뒤 두 계정이 차례로 접속했다. 화면 아래 자동 덮어쓰기 경고가 깜빡인다.", "detail": "【보안실 접속 · 서버 시각】\n19:40 mhj-temp · 백업 장치 점검\n21:02 mhj-temp · 백업 접근 요청 → 거부 (kdh, 내선)\n22:12 kdh_facility · ARCHIVE_2F_SVC 열람\n22:12 mhj-temp · 복구 도구 실행\n⚠ 순환 녹화: 23:00 덮어쓰기 예정 (백업하지 않으면 소실)", "owner": 9, "concerns": [9, 19], "gm": "김도현과 문하준이 22:12 함께 서비스 통로 영상(E08)을 봤다. 김도현이 이를 지우거나 거래하면 은폐 조력자가 되는 갈림길."}, {"id": "C19", "spot": "server_rack", "phase": 2, "title": "복사된 관리자 인증", "kind": "system", "text": "서버 랙 뒤 콘솔에 세션 기록이 남아 있다. 외부 기기가 관리자 인증 정보를 복사한 흔적이다. 기기 이름이 그대로 찍혀 있다.", "detail": "【ADMIN SESSION】\n21:02 인증 거부 (사용자 mhj-temp)\n21:05 관리자 토큰 export → 기기: MHJ-LAPTOP\n21:34 백업 인증 (같은 토큰)\n해시 목록 파일 생성: hash_1107.txt", "owner": 19, "concerns": [19, 9], "gm": "문하준이 허가 없이 관리자 인증을 복사(약점). 영상 진정성 공격에 쓰일 수 있지만 해시 목록으로 원본성을 방어할 수 있다."}, {"id": "C20", "spot": "storage_box", "phase": 2, "title": "현금 봉투와 작업 메모", "kind": "object", "text": "상자 더미 맨 아래에 두툼한 흰 봉투가 숨겨져 있다. 안에 현금과 접힌 메모가 들어 있다. 메모 끝에 만년필 잉크 번짐이 있다.", "detail": "【메모 (만년필)】\n\"21:40 / 12분.\n 회계실 쪽만이라도 확실히 어둡게.\n 기록엔 낙뢰로. K\"\n봉투: 현금 다발 (작업비 명목)\n봉투 겉: '시설 작업비 · FAC-01'", "owner": 1, "concerns": [1, 9], "gm": "강태준이 김도현에게 정전을 의뢰한 증거(20:38 통화로 재확인). 목적은 계약서 원본 회수였지 살인이 아니다. 김도현이 지하 창고에 숨겨 둠."}, {"id": "C21", "spot": "storage_shelf", "phase": 2, "title": "열쇠 복제 영수증", "kind": "document", "text": "창고 선반 공구함 사이에 영수증이 끼어 있다. 열쇠 복제 업체의 것이다. 복제 목록에 서재 열쇠는 없다.", "detail": "【○○열쇠 영수증 · 2025.07】\n품목: 객실 203 예비키 1 / 객실 105 1 / 창고 1\n의뢰: 청명산장 관리 · 백○린\n메모: \"VIP 요청 건 · 장부엔 기록 X\"\n※ 서재 정문·서비스문 키는 목록에 없음", "owner": 10, "concerns": [10], "gm": "백하린의 무단 복제(약점). 서재 열쇠는 복제하지 않았으므로 밀실과 무관함을 증명."}, {"id": "C22", "spot": "acct_cab", "phase": 2, "title": "2016 감사 보고서 표지", "kind": "document", "text": "다시 살펴보니 서류함 가장 깊은 칸에 낡은 보고서 표지가 붙어 있다. '보류' 도장이 찍혀 있고, 검토자 칸에 가는 펜 서명이 있다.", "detail": "【2016 청명 프로젝트 회계감사 보고서 · 표지】\n의견: 의심 항목 3건 (보류)\n검토자: 윤○아 (서명)\n\"추가 자료 확보 시 재검토\" · 이후 기록 없음", "owner": 2, "concerns": [2], "gm": "윤서아가 10년 전 의심 항목을 덮었던 책임. 오늘 그것을 바로잡으려는 동기."}, {"id": "C23", "spot": "legal_table", "phase": 2, "title": "다시 봉인된 봉투", "kind": "document", "text": "다시 살펴보니 탁자 밑 선반에 봉인 봉투가 놓여 있다. 봉인 테이프를 한 번 뜯었다가 다시 붙인 자국이 있다. 재봉인 시각이 연필로 적혀 있다.", "detail": "【봉인 봉투 · 첨부 B】\n재봉인: 21:59 (J.H.)\n내용 발췌: \"본 자료 공개 시 공개자는 손해배상 책임을 진다\"\n별지: 21:30~21:42 배 자문과 구형본 대조 · 종이 날짜와 전자 생성일 다름\n봉투 귀퉁이: 이재혁 법률 상담 카드 스테이플", "owner": 5, "concerns": [5, 18], "gm": "이재혁이 폭로를 막는 문안을 갖고 있었다(약점). 21:30~21:42 배수아와 법률문서실에 함께 있었고 21:59 봉인을 재확인했다. 두 사람의 알리바이."}, {"id": "C24", "spot": "archive_cabinet", "phase": 2, "title": "캐비닛 반출 카드", "kind": "document", "text": "다시 살펴보니 캐비닛 문 안쪽에 낡은 반출 카드가 붙어 있다. 자물쇠 주변에 새로 긁힌 자국이 여러 줄 있다. 맞지 않는 열쇠를 여러 번 넣어 본 듯하다.", "detail": "【반출 카드】\n2016.10.20 원본 노트 복사 1부 · P.H.W (승인 없음)\n2016.10.22 노트 p.37~38 열람 · 기술책임\n자물쇠: 구형 '청명' 규격 · 오늘 긁힌 자국 (열리지 않음)", "owner": 3, "concerns": [3, 12], "gm": "박현우가 사고 전날 무단으로 복사본을 가져간 약점. 오늘 20:45~21:20 가져온 열쇠로 캐비닛을 열려다 실패한 흔적. 사망 다음 날 기술책임(신우진)이 뜯긴 쪽을 열람."}, {"id": "C25", "spot": "archive_desk", "phase": 2, "title": "열람 단말 조회 기록", "kind": "system", "text": "다시 살펴보니 열람 책상 단말에 조회 기록이 남아 있다. 한 사용자가 보고서의 특정 쪽만 반복해 열었다. 옆에 반듯하게 네 번 접힌 메모지가 있다.", "detail": "【자료실 단말 · 조회 · 오늘】\n20:24 R-SWJ (구 연구카드) 설계도 색인\n20:35 GUEST-MED 사고보고서 v3 p.14 (3회)\n20:48 GUEST-03 연구노트 색인\n【메모 (작고 반듯한 글씨, 네모나게 접힘)】\n\"p.14 처치 미흡을 의료진에게.\n 엄마는 간호 기록에 '괜찮다'고 쓴 적 없음.\"", "owner": 13, "concerns": [13, 3, 12], "gm": "의료진 책임 전가 문단(p.14)을 반복 조회한 의료지원=임수빈(20:35). '엄마'라는 단어가 개인적 동기를 드러낸다. 20:24 신우진, 20:48 박현우 조회는 각자 자료를 찾은 기록."}, {"id": "C26", "spot": "waiting_table", "phase": 1, "title": "면담 대기 순서 카드", "kind": "notebook", "text": "대기 공간 협탁 위에 손바닥만 한 순서 카드가 놓여 있다. 정갈한 글씨로 오늘 밤 서재 방문 순서가 적혀 있다. 한 줄에만 이름이 없다.", "detail": "【서재 방문 순서 (손글씨)】\n21:10 강 부대표 · 지분 계약 ✓\n21:22 강 부대표 재방문 · 다음 면담 있어 돌려보냄\n21:25 비공개 면담 · 대표 지시로 이름 생략, 배석 없음\n21:38 대표님: \"내려가 있어요\"\n(카드 하단 비어 있음)", "owner": 6, "concerns": [6, 1, 13], "gm": "최민서가 21:05~21:25 대기 공간에서 정리한 순서 카드. 21:25 비공개 면담이 실제로 있었다는 증거인데 E06 공개판에는 그 줄이 없다 → 사건 뒤 삭제. 22:08부터 한지훈이 현장을 통제해 최민서는 이 카드를 회수하지 못했다. 이름은 E23에서 확인."}, {"id": "C27", "spot": "garden_bench", "phase": 2, "title": "수첩 낱장 · 미제출 진술", "kind": "notebook", "text": "다시 살펴보니 벤치 등받이 틈에 접힌 수첩 낱장이 끼어 있다. 경찰 수첩 양식이다. 비에 젖었다 마른 듯 종이가 울어 있다.", "detail": "【참고인 진술 메모 · 2016.10 (미제출)】\n진술인: 청명 병동 간호 인력 (익명 요청)\n\"10.20 저녁 관찰기록에 이상 반응을 적었는데,\n 다음 날 보니 '특이사항 없음'으로 바뀌어 있었다.\"\n하단: \"보고서 반영 안 됨. 종결 지시. H.J.H\"", "owner": 7, "concerns": [7, 8, 13], "gm": "한지훈이 20:40~21:20 정원에서 오세린에게 보여 주려다 남긴 낱장. 10년 전 조기 종결의 약점이자 E05·E21의 기록 조작을 뒷받침하는 자료."}, {"id": "C28", "spot": "kitchen_bin", "phase": 2, "title": "잉크 묻은 종이 타월", "kind": "object", "text": "다시 살펴보니 쓰레기통 맨 위에 젖은 종이 타월 뭉치가 버려져 있다. 검은 잉크와 회색 먼지가 묻어 있다. 사이에 작은 라벨 하나가 붙어 나왔다.", "detail": "【종이 타월】 검은 스탬프 잉크·서류 먼지 (혈흔 반응 없음)\n【라벨 조각】 \"자료보관 B-07 · 2016 설계\"\n개수대 옆에 물 튄 자국", "owner": 12, "concerns": [12, 15], "gm": "신우진이 21:56 주방 개수대에서 자료보관 구역 서랍을 뒤지다 묻은 잉크·먼지를 씻어 낸 흔적(홍예진 목격). 피가 아니라 잉크이므로 살인과 무관함을 보여 준다."}, {"id": "C29", "spot": "archive_drawer", "phase": 2, "title": "열린 작은 보관함", "kind": "object", "text": "다시 살펴보니 자료보관 구역 안쪽에 손바닥만 한 금속 보관함이 열린 채 있다. 열쇠로 연 흔적이 깨끗하다. 색인 칸 하나가 비어 있다.", "detail": "【보관함 내부】\n색인표 칸: 2015 / (빈 칸: 2016) / 2017\n자물쇠: 손상 없음 · 맞는 열쇠로 열림\n보관함 위 먼지에 손전등 둥근 자국", "owner": 3, "concerns": [3, 4, 12], "gm": "박현우가 21:45 정전 중 손전등을 켜고 자기 열쇠로 열어 2016년 색인표 한 장을 챙긴 흔적(정유리는 불빛만 봄). 비밀 행동이지만 살인과 무관. E13 편지의 '작은 보관함의 원본 색인'과 연결."}, {"id": "C30", "spot": "pr_desk", "phase": 2, "title": "홍보 준비실 노트북 메시지", "kind": "system", "text": "다시 살펴보니 책상 위 노트북에 메신저 창이 열린 채 잠겨 있지 않다. 개인 대화방 하나가 맨 위에 고정되어 있다. 보내지 않은 메시지가 입력창에 남아 있다.", "detail": "【메신저 · 대화방 'D'】\n21:05 발신: \"오늘 끝나면 우리 얘기해. 더는 없는 사람처럼 못 살아.\"\n21:24 입력창(미전송): \"아까는 미안해. 발표 문단은 그대로 둘게.\"\n【작업 기록】 21:22~21:28 자정 발표문 v4 저장", "owner": 15, "concerns": [15], "gm": "홍예진이 21:05 홍보 준비실에서 서도윤에게 사적 메시지를 보냈고 21:18~21:21 서재 앞 언쟁 뒤 21:22~21:28 이곳에서 작업했다. 사적 관계의 동기 자료이며 정전 전 행적의 확인."}, {"id": "C31", "spot": "lobby_lost", "phase": 2, "title": "주워 온 봉인 스티커", "kind": "object", "text": "다시 살펴보니 분실물함 구석에 봉인 스티커 한 장이 들어 있다. 습득 메모가 함께 붙어 있다. 관리실 앞에서 주웠다고 적혀 있다.", "detail": "【습득물 메모】\n물품: 봉인 스티커 (\"법률자문 B.S.A · 개봉 금지\")\n습득: 21:53, 관리실 앞 복도\n습득자: 매니저 백하린\n※ 접착면에 먼지가 거의 없음", "owner": 18, "concerns": [18, 10], "gm": "배수아가 21:52 관리실 쪽으로 이동했고 21:53 백하린과 스쳤다는 사실. 관리실 서랍 봉투(C15)와 이어져 배수아의 정전 직후 동선이 해명된다."}, {"id": "C32", "spot": "server_rack", "phase": 2, "title": "시계 오차 대조표", "kind": "notebook", "text": "다시 살펴보니 랙 옆면에 손으로 쓴 표가 붙어 있다. 장치마다 시계가 어떻게 다른지, 기준 시각을 맞추는 계산이 적혀 있다.", "detail": "【시계 오차 (18:40 측정 · 문하준)】\n보안 서버 (CCTV·센서·비서실 PC): 기준 · 정확\n감독 카메라 (김세진): 서버보다 약 1분 빠름\n정유리 녹음기: 서버와 일치\n서재 녹음기: 서버 동기화\n결론: 카메라 시각 − 1분 = 실제 시각", "owner": 19, "concerns": [19, 4, 13], "gm": "문하준의 메모. 서버·센서 기록은 그대로 실제 시각이고, 감독 카메라 시각만 1분을 빼면 된다. D-02·힌트 B의 문소리를 E18 21:46:05 보조문 AUTO-LATCH와 맞추는 열쇠."}, {"id": "C33", "spot": "util_desk", "phase": 2, "title": "설비 점검 일지", "kind": "notebook", "text": "설비 점검 책상 위에 오늘 날짜 점검 일지가 펼쳐져 있다. 정전 원인 칸을 몇 번이나 고쳐 쓴 흔적이 있다. 지우개 가루가 책상에 남아 있다.", "detail": "【설비 점검 일지 · 11.07 · 담당 김도현】\n08:30 정기 점검 · 이상 없음\n21:40 주전원 차단 · 원인: \"낙뢰 추정\" (볼펜, 꾹꾹 눌러 씀)\n 비고란 지운 자국 (연필): \"수동 12분 · K 요청\"\n21:52 복구", "owner": 9, "concerns": [9, 1], "gm": "김도현이 21:36~21:52 설비실에서 직접 차단·복구하고 기록엔 낙뢰로 적었다. E07(MANUAL OVERRIDE)·C20(K 메모)과 대조하면 거짓이 드러난다. 정전 은폐는 살인과 별개."}, {"id": "BAG01", "spot": "r201_bag1", "phase": 2, "title": "강태준의 가방", "kind": "bag", "text": "침대 옆에 손잡이 가죽이 닳은 검은 서류 가방이 놓여 있다. 이름표에 이름이 적혀 있다.", "detail": "【이름표: 강태준 · 201호】\n· 접힌 지분 계약서 · 지급 조건 문단에 펜으로 밑줄\n· 만년필 · 뚜껑이 없다. 펜촉에 검은 잉크\n· 오래된 서재 평면도 사본 · 보조문 위치는 있으나 자동 걸쇠 설치 전 도면", "owner": 1, "concerns": [1], "gm": "뚜껑 없는 만년필은 회계실 책상 아래 뚜껑(C02)과 짝. 평면도는 걸쇠 설치 전 도면이라 최신 잠금 방식을 몰랐다는 뜻(21:15~21:21 계단홀 벤치에서 보던 것)."}, {"id": "BAG02", "spot": "r201_bag2", "phase": 2, "title": "윤서아의 가방", "kind": "bag", "text": "침대 옆에 지퍼마다 색깔 태그가 달린 회색 노트북 백팩이 놓여 있다. 수하물 태그에 이름이 적혀 있다.", "detail": "【수하물 태그: 윤서아 · 201호】\n· 회계 USB · 두 버전의 원장과 누락 항목 표시\n· 감사 수첩 · 2016년 보류한 계정 번호, 오늘 21:05 재검증 메모\n· 외주업체 명함 · 이중 지급을 받은 거래처 실제 담당자", "owner": 2, "concerns": [2], "gm": "윤서아의 초기 소지품. E09·E15·C22와 연결."}, {"id": "BAG04", "spot": "r202_bag1", "phase": 2, "title": "이재혁의 가방", "kind": "bag", "text": "침대 옆에 안쪽이 칸칸이 나뉜 갈색 변호사 가방이 놓여 있다. 이름표에 이름이 적혀 있다.", "detail": "【이름표: 이재혁 · 202호】\n· 공증 사본 · 원본과 다른 일련번호\n· 법률 상담 카드 · 날짜가 수정된 회의 메모\n· 봉인 문서 · 비밀유지 합의 초안", "owner": 5, "concerns": [5], "gm": "이재혁의 초기 소지품. E01 일련번호 불일치, E10·C23과 연결."}, {"id": "BAG05", "spot": "r202_bag2", "phase": 2, "title": "배수아의 가방", "kind": "bag", "text": "침대 옆에 모서리가 단단한 남색 문서 가방이 놓여 있다. 수하물 태그에 이름이 적혀 있다.", "detail": "【수하물 태그: 배수아 · 202호】\n· 합의서 초본 · 위험 책임을 의료진에게 돌리는 조항\n· 비밀 각서 · 2016년 사건 공개에 관한 조건\n· 옛 법률 연락망 · 담당 변호사와 유가족 대리인 연락처", "owner": 18, "concerns": [18], "gm": "배수아의 초기 소지품. E10과 연결. 봉인 봉투 자체는 21:52 관리실 서랍(C15)에 옮겨 두었다."}, {"id": "BAG06", "spot": "r202_bag3", "phase": 2, "title": "서지안의 가방", "kind": "bag", "text": "침대 옆에 스티커가 잔뜩 붙은 작은 여행 캐리어가 놓여 있다. 이름표에 이름이 적혀 있다.", "detail": "【이름표: 서지안 · 202호】\n· 가족관계 증명 서류 · 서도윤과의 친족 관계\n· 유언 변경 이메일 · 유언 정리 예고 (원본 출력)\n· 객실 열쇠고리 · 202호 키와 개인 장식", "owner": 11, "concerns": [11], "gm": "서지안의 초기 소지품. E01·C12와 연결."}, {"id": "BAG07", "spot": "r203_bag1", "phase": 2, "title": "박현우의 가방", "kind": "bag", "text": "침대 옆에 팔꿈치 닿는 쪽이 해진 낡은 캔버스 가방이 놓여 있다. 이름표에 이름이 적혀 있다.", "detail": "【이름표: 박현우 · 203호】\n· 찢긴 실험 수첩 · 번호가 비는 두 장\n· 실험실 단체사진 · 임혜정이 함께 찍혀 있다\n· 금속 캐비닛 열쇠 · 자료실 보관함 중 하나와 맞는다", "owner": 3, "concerns": [3], "gm": "박현우의 초기 소지품. 열쇠는 큰 캐비닛(C24)이 아니라 자료보관 구역 작은 보관함(C29)에 맞는다. 단체사진은 동기 갈래 보조 자료."}, {"id": "BAG08", "spot": "r203_bag2", "phase": 2, "title": "신우진의 가방", "kind": "bag", "text": "침대 옆에 원통형 도면 통이 꽂힌 검은 가방이 놓여 있다. 수하물 태그에 이름이 적혀 있다.", "detail": "【수하물 태그: 신우진 · 203호】\n· 설계도 조각 · 원본 설계도의 찢긴 모서리\n· 실험실 출입 카드 · 2016년 연구 구역 접근 카드 (R-SWJ)\n· 경고 편지 사본 · 서도윤에게 보낸 폭로 경고", "owner": 12, "concerns": [12], "gm": "신우진의 초기 소지품. 설계도 조각은 E14와 맞고, 카드 R-SWJ는 E11·C25 기록과 같다."}, {"id": "BAG10", "spot": "r204_bag1", "phase": 2, "title": "정유리의 가방", "kind": "bag", "text": "침대 옆에 앞주머니에 PRESS 패치가 붙은 방수 취재 가방이 놓여 있다. 이름표에 이름이 적혀 있다.", "detail": "【이름표: 정유리 · 204호】\n· 휴대 녹음기 · 21:10·21:18 언쟁의 일부\n· 취재 수첩 · 익명 제보 출처를 가린 메모\n· 메모리 카드 · 녹음 복원용 백업", "owner": 4, "concerns": [4], "gm": "정유리의 초기 소지품. 녹음기 시계는 서버와 일치(C32). E04와 연결."}, {"id": "BAG11", "spot": "r204_bag2", "phase": 2, "title": "한지훈의 가방", "kind": "bag", "text": "침대 옆에 군용처럼 투박한 오래된 더플백이 놓여 있다. 수하물 태그에 이름이 적혀 있다.", "detail": "【수하물 태그: 한지훈 · 204호】\n· 조사 수첩 · 2016년 누락 조사 목록\n· 과거 현장사진 · 보조 통로와 무관한 연구센터 장면\n· 손전등 · 정전 때 로비에서 사용", "owner": 7, "concerns": [7], "gm": "한지훈의 초기 소지품. C27 미제출 진술 낱장은 이 수첩에서 뜯긴 것."}, {"id": "BAG12", "spot": "r204_bag3", "phase": 2, "title": "오세린의 가방", "kind": "bag", "text": "침대 옆에 손잡이에 노란 리본이 묶인 꽃무늬 토트백이 놓여 있다. 이름표에 이름이 적혀 있다.", "detail": "【이름표: 오세린 · 204호】\n· 가족사진 · 다른 피해 가족의 기록\n· 손편지 · 피해자 가족 모임에 보내려던 글\n· 기사 스크랩 목록 · 사건을 축소한 옛 보도 (원본 파일은 정원에 두고 옴)", "owner": 8, "concerns": [8], "gm": "오세린의 초기 소지품. C09 스크랩 파일과 연결."}, {"id": "BAG13", "spot": "r205_bag1", "phase": 2, "title": "임수빈의 가방", "kind": "bag", "text": "침대 옆에 적십자 표시가 바랜 의료 가방이 놓여 있다. 지퍼가 끝까지 잠기지 않았다. 이름표에 이름이 적혀 있다.", "detail": "【이름표: 임수빈 · 205호】\n· 오래된 가족사진 · 임혜정과 함께 찍은 사진. 뒷면에 2016년 날짜\n· 어머니 수첩 · 임상시험 이상 반응 기록\n· USB · 진료 원본의 일부\n· 파란 손수건 · 한쪽 모서리 올이 풀려 실 몇 가닥이 빠져 있다. 아직 축축하다\n· 의료 가방 · 기본 응급처치 용품, 멸균 거즈 4×4 (로트 MG-2210) 한 장이 비어 있음", "owner": 13, "concerns": [13], "gm": "동기 갈래의 가족사진. 올 풀린 파란 손수건은 E22·E19 섬유와 대조, 축축한 상태는 C17 생수병과 연결. 거즈 로트 번호가 서비스 계단 포장지(C17)와 같 지에서 오세린이 의료 기록 보관 절차를 묻자 답하다가 말끝이 굳었다. 오세린도 그 표정을 봤다.", "saw": "오세린, 홍예진(근처)", "witness": "오세린", "say": "careful", "tip": "물으면 \"절차를 설명하다 어머니 생각이 나서\"라고 넘겨라. 오세린은 당신 표정까지 기억하니 대화 자체를 부인하지는 마라."}, {"t": "20:35", "room": "archive", "place": "2층 자료실", "action": "자료실 문서철에서 사고 책임을 현장 의료진에게 넘기고 경영진 결재란을 지운 수정 보고서를 찾았다. 안쪽 책상에서는 신우진이 설계도 서류를 넘기고 있었지만 서로 말을 걸지 않았다.", "saw": "신우진", "witness": "자료실 열람 기록·신우진", "say": "careful", "tip": "보고서를 본 것까지는 인정해도 된다. '동기'로 들리지 않도록 \"직업상 기록 보관 방식이 궁금했다\"고 포장하라."}, {"t": "20:50", "room": "lounge", "place": "라운지 소파", "action": "라운지 소파에 의료 가방을 내려놓고 앉아 면담 시간을 기다렸다. 신우진이 라운지와 로비 사이를 몇 번 오갔고, 창가에서는 배수아가 통화를 하고 있었다.", "saw": "신우진, 배수아", "witness": "배수아", "say": "public", "tip": "이 시간부터 '쭉 라운지에 있었다'는 이야기를 시작하라. 20시 50분부터 21시 20분까지는 사실이니 자신 있게 말해도 된다."}, {"t": "21:05", "room": "lounge", "place": "라운지 소파", "action": "배수아가 창가 테이블에 자리를 잡고 봉인된 서류를 펼치기 시작했다. 당신은 접어 온 보고서 사본을 무릎 위에서 몇 번이고 다시 펼쳤다.", "saw": "배수아", "witness": "배수아", "say": "public", "tip": "배수아가 증인이 되어 줄 시간이다. 그녀의 이름을 먼저 대면 알리바이가 단단해 보인다."}, {"t": "21:12", "room": "lounge", "place": "라운지 소파", "action": "소파에서 시계를 확인했다. 2층에서 고성이 오갔다는 얘기가 라운지까지 흘러왔지만 자리를 뜨지 않았다.", "saw": "배수아", "witness": "배수아", "say": "public", "tip": "강태준의 21시 10분 언쟁 이야기가 나오면 관심 있는 척 맞장구치며 화제를 그쪽으로 넘겨라."}, {"t": "21:20", "room": "lounge", "place": "라운지 소파", "action": "의료 가방을 소파에 그대로 두고 파란 손수건만 쥔 채 일어났다. 테이블의 배수아가 고개를 들었고, 정원 쪽 복도에서 한지훈·오세린이 들어오는 기척이 났다.", "saw": "배수아, 한지훈·오세린(들어오는 중)", "witness": "배수아가 나가는 모습을 봤다. 한지훈·오세린은 주인 없는 가방을 봤다.", "say": "secret", "tip": "거짓말이 가능하다. \"잠깐 화장실에 다녀왔다\"고 둘러댈 수 있다. 하지만 배수아가 손수건만 쥐고 나가는 모습을 봤고, 한지훈·오세린은 가방만 덩그러니 남은 소파를 봤다. 나간 사실 자체는 부인하지 말고 행선지만 흐려라."}, {"t": "21:21", "room": "lobby", "place": "로비", "action": "가방 없이 로비를 가로질러 중앙 계단으로 향했다. 안내데스크의 백하린과 눈이 마주쳤다.", "saw": "백하린", "witness": "백하린", "say": "secret", "tip": "백하린이 계단으로 가는 당신을 봤다. 화장실 핑계를 댔다면 여기서 깨진다. \"2층 객실에 물건을 가지러 갔다\"는 쪽이 더 버티기 쉽다."}, {"t": "21:23", "room": "stair2", "place": "2층 계단", "action": "2층으로 올라가 공증 시각을 확인하던 이재혁·서지안 곁을 지나 대기 공간 쪽으로 갔다. 입구에서 문을 두드리고 돌아서던 강태준과 어깨가 스쳤다.", "saw": "이재혁, 서지안, 강태준", "witness": "이재혁·서지안·강태준 세 사람이 본다.", "say": "secret", "tip": "2층에 올라간 사실은 부인하지 마라. 세 사람이 봤다. \"면담 순서를 물으러 대기 공간에 갔다\"까지만 인정하라."}, {"t": "21:24", "room": "waiting", "place": "서재 앞 대기 공간", "action": "강태준이 계단으로 내려갔다. 대기 공간에서 최민서가 일정표를 확인하며 당신을 기다리고 있었다.", "saw": "최민서, 강태준(내려가는 뒷모습)", "witness": "최민서", "say": "secret", "tip": "최민서는 사실상 당신 편이 된다. 그녀가 먼저 이 시간을 말하지 않으면 당신도 꺼내지 마라."}, {"t": "21:25", "room": "study", "place": "서재", "action": "최민서의 확인을 받고 서재에 들어갔다. 서도윤에게 임혜정의 원본 의료 기록을 공개해 달라고 곧장 요구했다.", "saw": "서도윤, 최민서(입장 확인)", "witness": "최민서·E23 삭제 전 일정 백업", "say": "secret", "tip": "가장 위험한 시각이다. \"대기 공간에서 기다리다 면담을 못 하고 내려왔다\"고 거짓말할 수 있다. 다만 E23 원본 일정이 복원되면 무너진다. 그때는 \"들어간 건 맞지만 몇 분 이야기하고 나왔다\"로 물러서라."}, {"t": "21:29", "room": "study", "place": "서재", "action": "서도윤의 휴대폰이 울렸다. 최민서의 확인 전화였고, 그는 \"끝나면 부르겠다\"며 끊었다.", "saw": "서도윤", "witness": "최민서(통화 기록)", "say": "secret", "tip": "이 통화를 당신이 안다는 사실 자체가 서재 안에 있었다는 증거다. 절대 먼저 언급하지 마라."}, {"t": "21:33", "room": "study", "place": "서재", "action": "서도윤은 당신이 임혜정의 자녀라는 걸 이미 알고 있었다. 그는 책임을 흐리는 설명만 되풀이했고 원본은 내놓지 않았다.", "saw": "서도윤", "witness": "없음", "say": "secret", "tip": "서재 안 대화 내용은 어떤 경우에도 꺼내지 마라. 물으면 \"서재 안 일은 모른다\"로 일관하라."}, {"t": "21:37", "room": "study", "place": "서재", "action": "\"원본을 주세요\"라는 당신의 목소리가 높아졌고, 어머니 이름 '임혜정'이 몇 번 오갔다. 문밖의 최민서도 들었을 것이다.", "saw": "서도윤, 최민서(문밖)", "witness": "최민서·감독 가방 속 녹음(화자 특정 불가)·E20", "say": "secret", "tip": "녹음이 공개되면 \"그 목소리가 나라는 증거는 없다\"고 버텨라. 실제로 가방 속 녹음과 E20만으로는 화자를 특정할 수 없다."}, {"t": "21:38", "room": "study", "place": "서재", "action": "서도윤이 문을 한 뼘 열고 밖의 최민서에게 \"내려가 있어요\"라고 말한 뒤 다시 닫았다.", "saw": "서도윤, 최민서(문틈)", "witness": "최민서", "say": "secret", "tip": "모르는 척하라. 최민서가 이 장면을 말하지 않는 한 드러나지 않는다."}, {"t": "21:40", "room": "study", "place": "서재", "action": "조명이 한꺼번에 꺼졌다. 어둠 속에서 서도윤이 책상 위 서류를 끌어당기는 소리가 났고, 당신은 그 손을 붙잡았다.", "saw": "서도윤", "witness": "없음(E07 정전 기록)", "say": "secret", "tip": "정전 순간 어디 있었냐고 물으면 \"2층 객실 복도에서 비상등을 찾고 있었다\"고 답할 수 있다. 다만 같은 시각 홍예진이 2층 계단홀과 객실 복도에 있었으니 그녀가 당신을 못 봤다고 하면 곤란해진다."}, {"t": "21:41", "room": "study", "place": "서재", "action": "다툼이 몸싸움으로 번졌다. 서류를 두고 밀고 당기다 둘 다 균형을 잃었다.", "saw": "서도윤", "witness": "없음(E19 현장 감식)", "say": "secret", "tip": "E19가 나오면 \"간호사라서 의심받는 것뿐\"이라고 말하라. 직업만으로 범인이 될 수는 없다는 논리가 통한다."}, {"t": "21:44", "room": "study", "place": "서재", "action": "서도윤이 넘어지며 책상 모서리에 후두부를 부딪쳤다. 둔탁한 소리가 방 안을 울렸다.", "saw": "서도윤", "witness": "정유리·홍예진이 '쿵' 소리를 들었다(누구인지는 모름).", "say": "secret", "tip": "소리를 들은 사람들은 위치만 안다. 당신은 \"그 소리 저도 들은 것 같다\"고 말하지 말라. 들었다고 하면 2층에 있었다는 고백이 된다."}, {"t": "21:45", "room": "study", "place": "서재", "action": "무릎을 꿇고 숨과 맥을 확인했다. 간호사의 손은 이미 답을 알고 있었지만 휴대폰을 꺼내지 못했다.", "saw": "서도윤", "witness": "없음", "say": "secret", "tip": "이 순간은 당신만 안다. 최후 고백을 택한다면 여기서부터 이야기하라."}, {"t": "21:46", "room": "svc", "place": "서재 보조문 · 2층 서비스 통로", "action": "서재 보조문을 열고 서비스 통로로 빠져나왔다. 문이 닫히며 자동 걸쇠가 '철컥' 물렸다.", "saw": "", "witness": "E17 보조문 구조·E18 복도 센서·E22 섬유·감독 가방 속 녹음(금속성 소리)", "say": "secret", "tip": "E22 파란 섬유가 나오면 \"파란 천은 흔하다\"고 받아쳐라. 실제로 섬유만으로는 확정할 수 없다. 걸쇠 구조(E17)를 아는 척하지 마라."}, {"t": "21:47", "room": "svc", "place": "2층 서비스 통로 → 서비스 계단", "action": "통로 끝 서비스 계단 문을 밀고 들어가자 문이 '쾅' 닫혔다. 그 순간 통로 입구 쪽에 누군가 서 있는 기척이 들었지만 돌아보지 않았다.", "saw": "통로 입구의 누군가(나중에 최민서로 밝혀짐)", "witness": "최민서가 뒷모습을 봤다. 백하린·정유리·홍예진·서지안이 문소리를 들었다.", "say": "secret", "tip": "문소리는 여러 사람이 들었지만 얼굴을 본 사람은 최민서뿐이고, 그녀는 입을 닫는다. 최민서를 자극하지 마라."}, {"t": "21:48", "room": "svcst1", "place": "1층 서비스 계단실", "action": "어둠 속에서 마지막 계단을 헛디뎌 문에 어깨를 부딪쳤다. 라운지 구석 문 너머에서 누군가 숨을 죽이는 것 같았다.", "saw": "", "witness": "오세린이 라운지에서 '쿵' 소리를 들었다.", "say": "secret", "tip": "오세린이 소리 이야기를 꺼내면 \"정전 때 산장 전체가 삐걱거렸다\"며 넘겨라."}, {"t": "21:50", "room": "svcst1", "place": "1층 서비스 계단실", "action": "계단실 선반의 생수 묶음에서 한 병을 뜯어 파란 손수건을 적시고 손과 얼굴을 닦았다. 주머니의 거즈 포장지는 구석에 버렸다.", "saw": "", "witness": "계단실에 남은 거즈 포장지와 빈 생수병", "say": "secret", "tip": "계단실에서 거즈 포장지가 발견되면 \"간호사 아니라도 거즈는 누구나 쓴다\"고 하라. 당신 것이라고 인정하지 마라."}, {"t": "21:52", "room": "svcst1", "place": "1층 서비스 계단실", "action": "문틈 아래로 불빛이 돌아왔다. 전원이 복구됐다는 걸 알고 숨을 고르며 젖은 머리를 손으로 쓸어 넘겼다.", "saw": "", "witness": "없음", "say": "secret", "tip": "전원 복구 순간 어디 있었냐고 물으면 \"라운지로 내려오던 중\"이라고 답하라."}, {"t": "21:53", "room": "svcst1", "place": "1층 서비스 계단실", "action": "손수건의 물기를 짰다. 문 너머 라운지 구석에서 누군가 휴대폰을 두드리는 기척이 나서 손을 멈췄다.", "saw": "문 너머 라운지의 이재혁(기척만)", "witness": "이재혁이 물기 짜는 소리를 들었다.", "say": "secret", "tip": "이재혁이 물소리 이야기를 하면 모르는 척하라. 그는 문 너머 소리만 들었을 뿐 사람은 보지 못했다."}, {"t": "21:55", "room": "lounge", "place": "라운지", "action": "구석 문을 조용히 열고 라운지로 나왔다. 테이블에는 정유리가 노트북을 켜고 있었고, 구석에는 이재혁이 휴대폰을 보고 있었다. 오세린이 막 라운지로 들어왔다.", "saw": "정유리, 이재혁, 오세린", "witness": "오세린·정유리", "say": "secret", "tip": "\"계속 라운지 근처에 있었다\"고 말할 수 있다. 하지만 21시 20분부터 소파에 가방만 있었다는 걸 본 사람이 여럿이다."}, {"t": "21:56", "room": "lounge", "place": "라운지 소파", "action": "소파의 의료 가방을 열어 젖은 파란 손수건을 밀어 넣고 급히 닫았다. 고개를 들자 오세린이 젖은 머리를 정면에서 보고 있었다.", "saw": "오세린", "witness": "오세린", "say": "secret", "tip": "가장 크게 들킨 장면이다. \"정전 때 물을 쏟아서 세수를 했다\"고 둘러댈 수 있다. 오세린이 파란 천까지 봤으니 손수건을 넣은 사실은 부인하지 말고 이유만 바꿔라."}, {"t": "22:00", "room": "lounge", "place": "라운지 소파", "action": "가방을 무릎에 올린 채 소파에 앉아 있었다. 정유리는 노트북을 닫고 일어섰다.", "saw": "정유리, 오세린", "witness": "오세린", "say": "public", "tip": "평온해 보이는 게 중요하다. 이 시간은 사실대로 말해도 된다."}, {"t": "22:05", "room": "lobby", "place": "로비", "action": "로비로 나갔다가 2층에서 비명이 들리고 서도윤이 숨졌다는 소식이 돌았다. 다리에 힘이 빠졌다.", "saw": "로비의 김세진, 정유리, 박현우, 이재혁, 서지안, 배수아, 오세린 등", "witness": "로비의 여러 사람", "say": "public", "tip": "충격받은 모습은 연기할 필요가 없다. 말은 짧게 하라."}, {"t": "22:07", "room": "hall2", "place": "2층 객실 복도", "action": "사람들 틈에 섞여 2층으로 올라갔다. 서재 앞에는 이미 사람들이 웅성거리고 있었다.", "saw": "강태준, 홍예진, 백하린, 최민서", "witness": "2층의 여러 사람", "say": "public", "tip": "다른 사람들과 함께 올라갔다고 말하면 된다."}, {"t": "22:09", "room": "waiting", "place": "서재 앞 대기 공간", "action": "\"간호사였어요, 맥이라도 보게 해 주세요\"라며 서재로 들어가려다 문 앞의 한지훈에게 막혔다.", "saw": "한지훈", "witness": "한지훈", "say": "careful", "tip": "간호사의 반사적 행동으로 설명하라. 한지훈이 본 장면이니 부인하지 말고, 현장을 보고 싶었던 진짜 이유는 숨겨라."}, {"t": "22:12", "room": "hall2"  D-02 촬영 장비 기록표): 감식 기록은 몸싸움과 책상 모서리 충돌을, 18초 녹음은 「임혜정」이라는 이름을 남긴다. 보조문 걸쇠의 파란 섬유는 임수빈의 손수건과 닮았고, 센서와 가방 속 카메라의 음성은 21:46 보조문이 열렸다 닫힌 순간을 가리킨다. 이것들을 한데 묶어야 범행 뒤의 동선이 성립한다.\n- 서재는 누군가 일부러 잠근 방이 아니었다. 보조 서비스문에는 닫히면 저절로 걸쇠가 물리는 장치가 달려 있었고(E17), 그 때문에 안쪽에서 잠긴 방처럼 보였을 뿐이다. 정문은 22:04 백하린이 마스터키로 열었다.\n- 21:41~21:45 몸싸움 끝에 서도윤이 책상 모서리에 머리를 부딪혀 쓰러진 뒤, 임수빈은 21:46 보조 서비스문으로 나가 2층 서비스 통로를 지나 서비스 계단으로 내려갔다. 걸쇠가 물리는 짧은 쇳소리는 2층 객실 복도 벤치에 놓인 김세진의 가방 속 카메라에 흐릿하게 녹음되었고(D-02), 센서에도 짧은 이벤트가 남았다(E18). 21:47 최민서는 서비스 통로 입구에서 파란 손수건을 쥔 임수빈의 뒷모습을 보았다. 임수빈은 21:55까지 1층 서비스 계단실에 숨어 손수건을 적셔 손과 얼굴을 닦았다.", "css": "\n/* 레이아웃: 화면 전체를 채우는 타일맵 캔버스 위에 쯔꾸르식 대사창·패드·수첩 시트를 겹친다. 밤의 산장: 남색 어둠, 놋쇠 램프빛, 눈. */\n:host{\n  color-scheme:dark;\n  --night:#0b1220;      /* 바탕 */\n  --ink:#101a2c;        /* 패널 */\n  --ink2:#18253b;       /* 패널 강조 */\n  --line:#3a4d6b;       /* 테두리 */\n  --snow:#eef2f7;       /* 본문 */\n  --fog:#9fb0c8;        /* 보조 글자 */\n  --brass:#e2b867;      /* 램프빛 강조 */\n  --ember:#d9744a;      /* 경고 · 비밀 */\n  --moss:#7fb59a;       /* 공개 */\n  --f-display:'Gowun Batang','Nanum Myeongjo',serif;\n  --f-body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;\n  --f-log:'Nanum Gothic Coding','D2Coding',ui-monospace,monospace;\n}\n\n#tgwrap{position:fixed;inset:0;background:var(--night);color:var(--snow);font-family:var(--f-body);overflow:hidden;font-size:14px;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}\nbutton{font:inherit;color:inherit;cursor:pointer}\nbutton:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--brass);outline-offset:2px}\n#tgapp{position:absolute;inset:0;display:flex;flex-direction:column}\n#stage{position:relative;flex:1;min-height:0}\ncanvas#view{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block}\n\n/* 상단 HUD */\n#hud{position:absolute;top:0;left:0;right:0;display:flex;gap:8px;align-items:center;justify-content:space-bet 공간 · 대기 공간 협탁", "study_floor": "2층 서재 (사건 현장) · 쓰러져 있던 자리", "study_sidedoor": "2층 서재 (사건 현장) · 서재 보조문 앞", "svc_floor": "2층 2층 서비스 통로 · 서비스 통로 바닥", "r201_bag1": "2층 객실 201 · 201호 가방 1", "r201_bag2": "2층 객실 201 · 201호 가방 2", "r202_bag1": "2층 객실 202 · 202호 가방 1", "r202_bag2": "2층 객실 202 · 202호 가방 2", "r203_bag1": "2층 객실 203 · 203호 가방 1", "r203_bag2": "2층 객실 203 · 203호 가방 2", "r204_bag1": "2층 객실 204 · 204호 가방 1", "r204_bag2": "2층 객실 204 · 204호 가방 2", "r205_bag1": "2층 객실 205 · 205호 가방 1", "r205_bag2": "2층 객실 205 · 205호 가방 2", "r201_bag3": "2층 객실 201 · 201호 가방 3", "r202_bag3": "2층 객실 202 · 202호 가방 3", "r203_bag3": "2층 객실 203 · 203호 가방 3", "r204_bag3": "2층 객실 204 · 204호 가방 3", "r205_bag3": "2층 객실 205 · 205호 가방 3", "util_panel": "지하 지하 설비실 · 전기 패널 (수동 차단 레버)", "sec_monitor": "지하 보안실 · CCTV 모니터", "util_desk": "지하 지하 설비실 · 설비 점검 책상", "sec_recorder": "지하 보안실 · 녹화 장치 책상", "server_rack": "지하 서버실 · 관리용 서버 랙", "server_sensor": "지하 서버실 · 센서 제어 단말", "storage_shelf": "지하 지하 창고 · 창고 선반", "storage_box": "지하 지하 창고 · 창고 상자 더미"}, "defaultLimits": {"1": 6, "2": 6}, "stageCodes": {"explore1": "1114", "discuss1": "2140", "explore2": "2205", "discuss2": "2212", "vote": "0000"}, "endings": {"endings": {"A": {"title": "완전한 진실", "condition": "임수빈이 지목됐고, 실제 조력자가 모두 지목됐으며, 무고한 인물은 없다.", "body": ["최종 투표가 끝나자 사람들은 처음으로 서재에 들어간 사람과 서재에서 나온 사람을 구분해 말하기 시작한다. 강태준의 분노는 녹음에 남아 있었지만 그가 살인 시간에 회계실에 있었다는 기록도 남아 있었다. 신우진의 경고 편지는 섬뜩했으나 연구실 출입 기록이 서재 출입을 증명하지는 못했다. 사람들은 무엇보다 자신이 믿고 싶었던 이야기를 한 번씩 지웠다.", "정유리가 조용히 읽는다. “21시 25분, 비공개 면담. 21시 40분, 수동 정전. 21시 46분, 보조문 닫힘.” 문하준이 가방 속 카메라에 우연히 남은 녹음과 센서 기록의 시각을 보정한 자료를 펼친다. 파란 섬유를 추궁하자 임수빈은 한동안 입을 열지 못한다. “그 방에 있었어요. 처음에는 이야기만 하려 했습니다.” 누구도 그 한 문장 뒤에 이어질 말을 서두르지 않는다.", "최민서는 삭제된 일정의 원본이 복원되었다는 사실 앞에서 무너진다. “알고 있었습니다. 하지만 내가 한 건 그 사람을 죽이는 일이 아니었다고 생각했어요.” 한지훈이 답한다. “누군가를 죽인 사람과 그 사실을 숨긴 사람의 책임은 다릅니다. 그렇다고 뒤의 책임이 없어지는 것도 아닙니다.” 김도현이나 배수아가 은폐를 골랐다면, 그 영상 삭제와 허위 진술도 이 자리에서 함께 드러난다.", "며칠 뒤 정유리의 보도는 한 사람의 복수극만을 제목에 내세우지 않는다. 임혜정의 사망 기록, 지워진 승인, 멈추지 않은 임상시험과 새로 발생한 살인 모두를 분리해서 적는다. 서도윤은 죽었지만 그의 문서가 말하던 “사고는 개인의 불행이었다”라는 문장은 더 이상 통하지 않는다. 임수빈의 선택은 책임을 져야 할 일로 남고, 임혜정의 죽음 역시 다시 조사되어야 할 사건으로 남는다.", "김세진은 편집실에서 첫 화면을 고른다. 눈 덮인 청명산장의 창문이다. 그는 자막 대신 녹음된 목소리를 먼저 틀기로 한다. “원본을 공개해 주세요.” 영화는 그 요구가 너무 늦게 이루어진 밤의 기록이 된다."]}, "B": {"title": "복수의 끝", "condition": "임수빈이 지목됐고, 실제 조력자도 무고한 인물도 지목되지 않았다.", "body": ["범인으로 임수빈의 이름이 불렸을 때, 그녀의 과거를 알고 있던 이들 가운데 누구도 바로 고개를 들지 못한다. 임수빈은 오래된 가족사진을 책상 위에 올려놓는다. “이 사람은 임혜정입니다. 저희 어머니예요. 기록에는 그냥 한 줄로만 남았습니다.” 그것은 처음으로 자신의 사정을 변명처럼 꺼낸 순간이었다.", "사람들은 임수빈이 서재에 들어간 사실과 서비스문으로 나왔을 가능성을 이해한다. 그러나 누가 원본 일정표를 지웠는지, 왜 복도 기록의 일부가 늦게 복원되었는지는 끝내 하나의 결론이 되지 않는다. 최민서는 사람들 뒤편에서 가만히 서 있다. 나중에 누군가 그녀의 노트북을 살폈을 때, 이미 많은 부분은 정리된 뒤다.", "한지훈이 묻는다. “그때 왜 신고하지 않았습니까?” 임수빈은 답하지 못한다. 그 침묵 앞에서 그녀의 복수를 이해하려던 사람들조차 한 발 물러선다. 그녀의 마음을 설명할 수 있다는 것과 그녀의 행동이 옳았다는 것은 달랐다.", "사건 이후 살인 수사는 진행되지만 은폐에 가담한 사람이 누구였는지는 오래도록 분명해지지 않는다. 임혜정의 기록이 공개되지 않았다면, 언론은 그녀를 “십 년간 원한을 품은 살인범의 어머니”로만 부른다. 원본이 공개되었다면 그녀는 비로소 한 사람의 환자이자 기록이 바뀐 피해자로 등장한다.", "편집실에서 김세진은 마지막 장면을 오래 바라본다. 임수빈이 사진을 접는 모습이다. 그는 그 장면 위에 승리의 음악을 넣지 않는다. 복수가 끝났다는 것은 아무것도 회복되지 않았다는 말일 수 있기 때문이다."]}, "C": {"title": "불완전한 정의", "condition": "임수빈은 지목됐지만, 실제 조력자가 일부만 지목됐거나 무고한 인물이 함께 지목됐다.", "body": ["결과 발표에서 임수빈의 이름이 나왔을 때 사람들은 사건이 해결됐다고 생각한다. 그러나 그 옆에 적힌 이름들은 완전히 맞지 않는다. 실제 기록을 지운 사람이 빠져 있거나, 서도윤에게 분노했다는 이유만으로 무고한 사람이 더해져 있다.", "윤서아는 모든 사람 앞에 이중장부를 펼치고 강태준의 서명을 가리킨다. “이것 때문에 의심받을 이유는 충분하죠. 하지만 이 종이에는 살인 시간에 어디 있었는지가 적혀 있지 않습니다.” 사람들은 계약서를 다시 본다. 조금 전까지만 해도 확실해 보였던 추론이 몇 갈래로 흩어진다.", "임수빈은 범행을 인정한다. 최민서가 은폐했다는 사실이 알려졌다면 사람들은 그 이름을 붙잡는다. 그러나 또 다른 기록 삭제를 선택한 인물이 있었다면, 그 흔적은 시간이 흐른 뒤에야 나타난다. 무고한 사람이 지목된 경우 그 사람은 자신의 과거 잘못을 설명해야 하는 처지까지 몰린다. 살인을 하지 않았다는 사실은 쉽게 명예를 되돌려 주지 못한다.", "청명 프로젝트의 기록이 외부로 공개되면 과거 사건을 다시 들여다보는 조사가 시작된다. 그러나 이 밤의 투표 기록에는 끝내 지워지지 않는 잘못이 남는다. 사람들은 그때 왜 누군가를 너무 빨리 믿었는지, 왜 다른 누군가를 아무 근거 없이 확신했는지를 이야기한다.", "김세진은 편집 과정에서 두 개의 인터뷰를 나란히 붙인다. “그 사람이 틀림없다고 생각했습니다.” 그리고 다음 장면. “저는 그 방에 없었습니다.” 감독은 어느 쪽도 편집으로 지우지 않는다. 진실이 드러나는 것과 공정한 판단을 하는 것이 반드시 같은 속도로 움직이지 않는다는 사실을 남기기 위해서다."]}, "D": {"title": "그림자만 붙잡다", "condition": "임수빈은 지목되지 않았고, 실제 조력자가 1명 이상 지목됐다.", "body": ["최종 투표에는 최민서의 이름이 적혀 있다. 누군가 일정표를 지웠다는 사실은 분명했고, 복원된 파일의 마지막 접근 계정도 그녀에게로 향했다. 모두가 숨죽인다. “그럼 당신이 서도윤을 죽인 겁니까?” 최민서의 목소리가 떨린다. “아니요. 하지만 누가 그 방에서 나왔는지는 봤어요.”", "그 말에 사람들이 고개를 돌린다. 누군가 소리친다. “그럼 왜 말하지 않았어요?” 최민서는 입술을 깨문다. 그녀가 자신의 비밀을 모두 말하려는 순간, 이미 투표는 끝나 있다. 범인으로 지목되지 않은 임수빈은 끝내 이름이 불리지 않은 자리에 앉아 있었다.", "수사가 이어지면서 최민서의 은폐 책임은 드러나지만, 살인 실행자를 확정할 자료는 참가자들이 모은 증거만으로 연결되지 않는다. 오세린은 임수빈이 가방을 급히 닫던 모습을 떠올리지만 그 기억 하나만으로 유죄를 확신할 수 없다고 말한다. 누구도 자신이 가장 중요한 질문을 건너뛰었다는 사실을 쉽게 인정하지 못한다.", "임수빈이 산장을 떠나는 길, 그녀의 휴대전화에는 어머니 수첩 사진이 그대로 남아 있다. 그녀는 진실이 숨겨져 있는 동안 자신도 안전하다고 생각하려 한다. 그러나 영원히 잊힐 기록은 아니다. 문하준은 백업이 두 군데 존재했다는 사실을 알고 있다. 언젠가 그 밤의 음성은 다른 방식으로 복원될 수 있다.", "김세진은 마지막 인터뷰에서 최민서에게 묻는다. “당신이 지킨 건 누구였습니까?” 긴 침묵 끝에 답이 돌아온다. “그 사람이라고 믿었어요. 사실은 제가 지키고 싶은 제 모습이었는지도 모르겠어요.” 다큐멘터리에는 그 대답만이 남는다."]}, "E": {"title": "잘못된 판결", "condition": "임수빈도 실제 조력자도 지목되지 않았다. 무고한 인물만 지목됐다.", "body": ["산장에 모인 사람들은 가장 큰 목소리를 낸 사람을 범인으로 삼았다. 강태준의 언쟁이 떠올랐고, 신우진의 협박성 편지가 누구보다 선명했다. 서지안의 유언장도 의심을 키웠다. 그날 밤의 많은 행동이 죄처럼 보였지만, 정작 서재에 누가 있었는지를 증명하는 연결 고리는 빠져 있었다.", "강태준이 웃음도 아닌 소리를 낸다. “계약서를 숨겼습니다. 그 일은 인정해요. 그런데 그것 때문에 내가 죽였다고요?” 아무도 그의 말에 답하지 않는다. 신우진은 가져온 경고 문서를 펴며 손이 떨린다. 그 서류가 살인의 증거가 아니라 오래전에 내보내지 못한 경고라는 사실을 뒤늦게 설명한다.", "임수빈의 이름은 그 자리에서 거의 거론되지 않는다. 그녀는 오세린과 눈을 마주치지 않는다. 최민서는 자신의 가방을 꼭 붙들고 있다. 누가 이 밤을 잘못 이해했는지, 누가 그 잘못을 이용했는지 모두 말하지 않는다.", "사건 후 잘못 지목된 사람들의 과거 문제는 별도로 드러날 수 있다. 하지만 살인이라는 가장 중대한 질문에서는 무고한 사람에게 의심을 떠넘긴 셈이다. 시간이 지나 새로운 기록이 나오면 사건의 방향이 바뀔지도 모른다. 그때까지 청명산장에 남는 것은 잘못된 확신이다.", "김세진은 이 결말에 아무 판결문도 붙이지 않는다. 카메라에는 다른 사람의 말을 끊고 자신이 확실하다고 말하는 목소리들이 녹음되어 있다. 그는 마지막 화면을 검게 남겨 둔다. “확신은 증거가 아니다.”"]}, "F": {"title": "사라진 밤", "condition": "유효한 최종 지목이 없다(전원 기권 등).", "body": ["지목해야 할 시간이 끝났을 때 화면에는 아무 이름도 남아 있지 않다. 사람들은 서로의 표정을 본다. 누구나 의심하는 이름은 있었지만 그 이름이 실제 살인을 증명한다는 말을 끝내 책임지지 못했다.", "정유리는 취재 수첩을 덮는다. 박현우는 연구노트의 끝을 접고, 홍예진은 서도윤에게 보내지 못한 메시지를 읽는다. 강태준은 계약서를 다시 가방에 넣는다. 침묵은 공평하지 않다. 이미 자신이 알고 있는 사실을 숨긴 사람에게 더 유리하기 때문이다.", "서재의 서비스문은 다시 잠긴다. 현장 자료는 수사기관에 넘겨지지만 산장에서 있었던 대면 추리는 결말을 만들지 못한다. 김세진이 사건 이후 새로 촬영한 영상에는 사람들이 각자 다른 방향으로 걸어가는 장면만 남는다.", "열 해 전 사건의 원본이 끝내 공개되지 않았다면 임혜정의 이름은 또 한 번 수정된 보고서의 부록으로 남는다. 일부 기록이 공개되었다면 살인과 별개의 조사가 시작될 수 있다. 그러나 그날 밤 누가 어떤 선택을 했는지는 아직 판별되지 않는다.", "김세진은 영상 편집 프로그램에서 마지막 파일의 제목을 짓지 못한다. 자신이 할 수 있는 일은 원본을 보존하는 것뿐이다. 비어 있는 제목 칸이 그날의 결말이 된다."]}}, "branch": ["의료일지와 원본 보고서가 공개되면 임혜정의 사망은 새로운 공적 조사 대상이 된다. 이 경우 진범이 붙잡히지 않았더라도 청명 프로젝트의 진실은 일부 드러날 수 있다.", "공개가 차단되면 살인사건이 해결되어도 임혜정 사망의 배후 책임은 흐려진다. 서재의 죽음과 열 해 전의 죽음은 서로 다른 사건이며, 한쪽의 결말이 다른 쪽의 결말을 대신하지 않는다.", "감독 김세진의 인터뷰와 촬영 기록이 충분히 모였다면 「마지막 기록자」 후일담으로 「감독 김세진 · 편집되지 않은 밤」을 함께 읽는다. 기록이 부족했다면 그 필름은 편집되지 못한 채 미완성으로 남는다. 감독의 성취는 엔딩 판정을 바꾸지 않는다."], "epilogues": {"강태준": "회사가 무너지기 시작한 날, 강태준은 기자들이 살인사건보다 이중장부를 먼저 묻는 것을 보고 당황한다. 자신의 분노가 살인 동기로 읽혔던 시간만큼이나 오래 자신의 서명을 설명해야 한다. 그는 서도윤의 죽음으로 문제가 해결되지 않았다는 사실을 뒤늦게 알게 된다. 공개를 택했다면 회계 문제의 책임을 인정하고, 은닉을 택했다면 더 늦은 순간에 같은 질문을 받는다.", "윤서아": "윤서아는 실종된 금액보다 어디서 잘못된 결재가 시작됐는지 밝히는 보고서를 쓴다. 숫자는 모두 그 자리에 있었다. 자신이 보고를 보류한 공백도 기록의 일부였다는 사실이 괴롭다. 공개한 원장은 사람들에게 사실을 보여 주지만 그 일을 하지 않았던 시간을 지워 주지는 않는다.", "박현우": "박현우는 오래전 실험 수첩의 찢긴 가장자리를 맞추어 본다. 복원된 페이지에서 그는 임혜정의 이상 반응 옆에 자신의 경고 서명을 발견한다. 자신이 경고했기 때문에 책임이 없다고 생각한 세월을 돌아본다. 기록을 공개하면 연구자로서의 명성은 완전히 돌아오지 않을지 몰라도 다음 피해자를 위한 근거는 남는다.", "정유리": "정유리는 기사 첫머리에 살인자의 이름을 쓰지 않는다. “누가 기록을 바꾸었는가.” 독자들이 끝까지 읽기를 바라면서도, 누군가의 얼굴이 아니라 문서의 경로를 따라가기로 한다. 제보자의 신원을 지켰다면 취재의 일부는 오래 비공개로 남고, 공개를 택했다면 새 증거와 함께 그 사람의 안전을 다시 생각해야 한다.", "이재혁": "이재혁은 사건 뒤 서류 봉투를 세 개로 나눈다. 하나는 고객의 유언장, 하나는 피해자 가족의 합의서, 나머지는 그 문서를 만든 사람들의 진술이다. 그는 이 세 봉투를 같은 책상 위에 놓는 일이 얼마나 위험한지 안다. 계약의 유효성과 진실의 공개는 다른 질문이지만, 어느 하나를 완전히 외면할 수도 없다는 사실을 배운다.", "최민서": "최민서는 자신의 화면에서 지운 이름을 다시 쓰는 데 오랜 시간이 걸린다. 21시 25분 임수빈. 단 하나의 행이 복원되자 도망갈 곳이 없어졌다. 그녀는 살인을 계획하지 않았지만 사건 이후 무엇을 지킬지 스스로 결정했다. 그날 이후 최민서는 비서실의 모든 일정표보다 자신의 침묵이 가장 정확한 기록이었다는 것을 안다.", "한지훈": "한지훈은 경찰서를 떠났던 이유를 다시 떠올린다. 2016년 자신이 보지 못한 문서들이 있었다. 이번에는 가장 유력해 보이는 용의자가 아니라 가장 적게 검증된 진술부터 확인했다. 결과가 완전하지 않더라도 그는 추측을 사실처럼 쓰지 않는 수첩을 남긴다.", "오세린": "오세린은 피해 유가족 모임에 다시 나간다. 임혜정의 이야기가 알려졌다고 해서 자신의 가족이 겪은 고통까지 한꺼번에 정리되지는 않는다. 그녀는 사람들에게 말한다. “한 사람의 복수 이야기에만 머물면, 우리가 왜 이 기록을 모았는지 잊게 됩니다.” 오래된 스크랩은 그날 처음으로 한 권의 파일이 된다.", "김도현": "김도현은 새벽에 지하 설비실로 내려간다. 전원은 다시 켜져 있고, 조작 로그는 여전히 21시 40분을 가리킨다. 진실을 공개했다면 자신의 잘못과 살인 은폐를 분리해 설명할 수 있다. 영상을 지웠다면 그 선택은 또 하나의 기록으로 남는다. 기술은 누구의 편도 아니지만 기술을 쥔 사람에게 책임이 없는 것은 아니다.", "백하린": "백하린은 산장의 모든 문에 붙은 표찰을 새로 적는다. 객실 열쇠 복제 문제를 밝히면 자신의 일자리를 잃을 수도 있다. 그러나 21시 47분 서비스문 소리가 무엇을 의미했는지 안 뒤로, 안전을 위해 만든 규칙을 스스로 지키지 않았던 일을 더 이상 가볍게 생각할 수 없다.", "서지안": "서지안은 유언장이 열리기 전에 옛 가족사진을 본다. 자신이 지키려 했던 것은 몫이 아니라 가족으로 인정받을 자리가 아니었을까. 홍예진에게는 오랫동안 묻지 못한 말을 남긴다. “그 사람이 어떤 사람이었는지, 나에게는 아무것도 말해 주지 않았어요.” 돈 문제는 남지만 서재의 죽음은 그것으로 설명되지 않는다.", "신우진": "신우진은 과거 중단 권고의 서명란에 손가락을 올린다. 서명이 있었다고 해서 끝까지 경고한 것은 아니다. 자신의 이름이 살인 용의자 명단에서 사라진 후에도 그는 오래된 실험의 책임에서 벗어나지 못한다. 자료 공개를 택했다면 그의 연구 경력은 새로운 검증을 받게 된다.", "임수빈": "임수빈은 어머니 수첩의 마지막 문장을 읽는다. “꼭 기록해 주세요.” 그녀는 마침내 많은 기록을 모았지만 가장 중요한 순간에 진실을 숨겼다. 범행이 드러났다면 책임을 피하지 못한다. 도주한 결말이라도 어머니의 죽음이 자신이 저지른 죽음을 정당화하지는 못한다는 사실이 따라온다.", "홍예진": "홍예진은 서도윤과 함께 살던 집으로 돌아와 신발 두 켤레가 놓인 현관을 본다. 회사에서 그를 대표라 불렀던 시간보다 집에서 그의 이름을 부른 시간이 더 길었다. 사랑했던 사람이 잘못을 저질렀다는 사실을 인정하는 데에도 시간이 걸린다. 공동거주 기록을 공개했다면 자신의 사생활도 잃을 수 있지만, 그것이 거짓 발표에 동참해야 할 이유는 아니다.", "배수아": "배수아는 새벽에 법률사무소에 도착해 오래된 초안과 지금의 진술서를 나란히 놓는다. 사실을 적었다면 자신의 과거 책임을 다시 받게 될 것이다. 허위로 고쳤다면 법적 문장의 무게를 더 크게 체감하게 된다. 그녀는 서명을 하지 않은 빈 공간을 오래 바라본다. 선택하지 않은 척하는 것 역시 선택이었다.", "문하준": "문하준은 고장 난 서버의 파일 복구가 끝났다고 선언하지 않는다. 시간차가 보정된 장치들은 모두 조금씩 다른 이야기를 했다. 그가 할 일은 가장 그럴듯한 영상 하나를 진실로 만들지 않는 것이다. 서로 독립적인 기록이 같은 방향을 향할 때 비로소 “그 시각에 그곳에 있었다”고 적는다.", "김세진": "김세진은 마지막까지 카메라를 내려놓지 않았다. 밀담을 요청했던 사람들 가운데 누군가는 우발적 녹음의 존재를 알고 돌아갔고, 다른 누군가는 감독의 주머니에 무엇이 있는지조차 몰랐다. 다큐멘터리를 편집하면서 그는 카메라가 모든 것을 기록한다는 오래된 믿음을 버린다. 어떤 사람은 의도적으로 렌즈를 피했고, 어떤 말은 담장 너머에서 녹음되었으며, 가장 중요한 범행의 순간은 렌즈 밖에서 벌어졌다. 감독은 엔딩의 맨 끝에 이렇게 적는다. “이것은 범인을 먼저 알아본 기록이 아니라, 사람들이 진실에 접근하려고 서로에게 질문했던 밤의 기록이다.”"}, "explain": ["서도윤을 죽인 사람은 전직 간호사 임수빈이다. 아래의 세 갈래는 서로를 대신하지 못한다. 동기만으로는 살인을 확정할 수 없고, 서재에 들어갔다는 사실만으로는 범인을 가릴 수 없으며, 현장의 흔적은 시각을 맞춰야 비로소 한 사람의 동선이 된다.", "동기 확인 (E02 청명 연구노트 · E03 수정 사고 보고서 · E05 사망진단서 사본 · E21 임혜정 의료 일지 사본 · 임수빈의 가족사진): 2016년 청명 프로젝트의 이상 반응은 보고되지 않았고, 수정된 보고서는 책임을 현장 의료진에게 돌리며 경영진 검토란을 지웠다. 그렇게 숨진 임혜정은 임수빈의 어머니다. 이 갈래는 누군가의 가족이 무너졌다는 사실을 보여 줄 뿐, 그 자체로 살인을 증명하지는 않는다.", "기회 확인 (E06 수정된 면담 일정표 · E23 삭제 전 면담 일정 백업 · D-01 다큐멘터리 촬영 일정표): 공개된 일정표에는 21:25 면담이 없다. 복원된 백업에는 「21:25 임수빈 비공개 면담」과 22:18 항목 삭제 기록이 함께 남아 있다. 촬영 일정표는 그 시각 2층 서재 주변의 움직임을 받쳐 준다. 다만 서재를 찾은 사람이 모두 살인범은 아니다.", "현장 확인 (E17 보조문 수리 내역 · E18 복도 센서 이동 기록 · E19 서재 현장 감식 기록 · E20 서재 녹음 복원 18초 · E22 서비스문 섬유 흔적 · D-02 촬영 장비 기록표): 감식 기록은 몸싸움과 책상 모서리 충돌을, 18초 녹음은 「임혜정」이라는 이름을 남긴다. 보조문 걸쇠의 파란 섬유는 임수빈의 손수건과 닮았고, 센서와 가방 속 카메라의 음성은 21:46 보조문이 열렸다 닫힌 순간을 가리킨다. 이것들을 한데 묶어야 범행 뒤의 동선이 성립한다.", "서재는 누군가 일부러 잠근 방이 아니었다. 보조 서비스문에는 닫히면 저절로 걸쇠가 물리는 장치가 달려 있었고(E17), 그 때문에 안쪽에서 잠긴 방처럼 보였을 뿐이다. 정문은 22:04 백하린이 마스터키로 열었다.", "21:41~21:45 몸싸움 끝에 서도윤이 책상 모서리에 머리를 부딪혀 쓰러진 뒤, 임수빈은 21:46 보조 서비스문으로 나가 2층 서비스 통로를 지나 서비스 계단으로 내려갔다. 걸쇠가 물리는 짧은 쇳소리는 2층 객실 복도 벤치에 놓인 김세진의 가방 속 카메라에 흐릿하게 녹음되었고(D-02), 센서에도 짧은 이벤트가 남았다(E18). 21:47 최민서는 서비스 통로 입구에서 파란 손수건을 쥔 임수빈의 뒷모습을 보았다. 임수빈은 21:55까지 1층 서비스 계단실에 숨어 손수건을 적셔 손과 얼굴을 닦았다.", "김세진의 카메라는 21:26 녹화 시험 뒤 정지되지 않은 채 가방에 들어갔고, 21:48까지 렌즈가 가방 안감에 가려 음성만 남았다. 카메라 시계는 보안 서버보다 약 1분 빠르므로, 시각을 보정해야 센서·녹음·목격 진술이 한 줄로 이어진다. 김세진은 고정 카메라를 설치하지 않았고, 정전 내내 로비에 있었다.", "21:40 정전은 김도현이 강태준의 부탁으로 지하 설비실에서 일으킨 것이다. 임수빈과의 공모는 없었고, 살인과는 무관하다.", "최민서는 21:47 임수빈의 뒷모습을 보았고, 22:12 201호 앞에서 「당신이었어요?」라는 물음에 고개를 숙이는 임수빈을 보며 진실을 알았다. 22:15 배수아에게 진술을 맞추자고 제안했고, 22:18 비서실 PC의 원본 일정표에서 21:25 면담 항목을 지웠다(E23에 삭제 기록). 그래서 최민서는 언제나 조력자다.", "김도현(22:12 보안실에서 서비스 통로의 흐릿한 동선을 확인)과 배수아(22:15 진술 변경 제안을 받음)는 살인의 진실을 안 뒤 최후 선택에서 은폐를 골랐을 때만 조력자가 된다. 과거의 잘못이나 별도의 불법행위만으로는 살인 조력자가 되지 않는다."], "box": {"흉기": "없음. 몸싸움 중 책상 모서리에 후두부를 부딪혔다", "동기": "어머니 임혜정의 죽음과 지워진 기록. 원본을 돌려받으려던 면담이 몸싸움으로 번졌다", "범행 시각": "21:41~21:45", "조력자": "확정 조력자 최민서 (22:18 면담 기록 삭제). 김도현·배수아는 은폐를 고른 경우에만", "정전": "김도현이 강태준의 부탁으로 실행. 살인과 무관"}}};
window.TG_DATA.maps=window.MAPS;window.TG_DATA.spawns=window.SPAWNS;
</script>
<script>
// ═══ 청명산장 타일맵 증거 수집 (앱 내장형) ═══
// 앱의 state / DATA / 단계(stage)와 연결된다. 화면은 Shadow DOM 안에서 그려 앱 CSS와 섞이지 않는다.
(function(){
'use strict';
const TG = window.TG_DATA;
const MAPS = TG.maps, SPAWNS = TG.spawns, CLUES = TG.clues, FLAVOR = TG.flavor, ALIBIS = TG.alibis;
const TS = 16; const ART_SCALE=2; const LODGE_LIGHTS={};
const LIMIT_KEY = 'lastcheckin_tg_limits';

// ── 앱 연결 ──
function appLimits(){ try{ const v=JSON.parse(localStorage.getItem(LIMIT_KEY)||'null'); if(v&&typeof v==='object') return {1:+v[1]||0,2:+v[2]||0}; }catch(e){} return {1:TG.defaultLimits[1],2:TG.defaultLimits[2]}; }
window.TG_setLimits = function(l1,l2){ try{ localStorage.setItem(LIMIT_KEY, JSON.stringify({1:Math.max(0,l1|0),2:Math.max(0,l2|0)})); }catch(e){} };
window.TG_getLimits = appLimits;
function tgState(){ const TK=window.TG_ADMIN?'tgAdmin':'tg'; state[TK] = state[TK] || {}; const t=state[TK]; t.got=t.got||{}; t.seen=t.seen||{}; t.visited=t.visited||{}; t.used=t.used||{1:0,2:0}; if(t.glint===undefined) t.glint=true; return t; }
// 실명 치환: 앱에 등록된 참가자 이름으로 바꿔 보여 준다.
function LT(s){ s=String(s==null?'':s); try{ const rep=DATA.people.map((p,i)=>[p.name,liveName(i)]).filter(([a,b])=>a!==b).sort((a,b)=>b[0].length-a[0].length); for(const [a,b] of rep) s=s.split(a).join(b); }catch(e){} return s; }
let ROLE = {}; const ALI = Object.fromEntries(ALIBIS.map(a=>[a.id,a]));
function buildRoles(){ ROLE = {}; DATA.people.forEach((p,i)=>{ ROLE[i+1] = {id:i+1, name:liveName(i), job:p.job}; }); }

// S: 엔진이 쓰는 작업 상태 (앱 state.tg 에 저장)
const PK = ()=> (!window.TG_ADMIN && state.stage==='explore3') ? 3 : S.phase;
let S = { role:1, phase:1, f:'F1', x:15, y:14, dir:'down', got:{}, seen:{}, visited:{}, used:{1:0,2:0}, limits:{1:6,2:6}, glint:true };
function save(){ const t=tgState(); Object.assign(t,{mv:window.MAP_VERSION,f:S.f,x:S.x,y:S.y,dir:S.dir,got:S.got,seen:S.seen,visited:S.visited,used:S.used,glint:S.glint}); try{ persist(); }catch(e){} }

// ── Shadow DOM ──
const HOST = document.createElement('div'); HOST.id='tgHost'; HOST.style.cssText='position:fixed;inset:0;z-index:9000;display:none';
document.body.appendChild(HOST);
const ROOT = HOST.attachShadow({mode:'open'});
ROOT.innerHTML = `<style>${TG.css}</style>${TG.html}`;
const $ = id=>ROOT.getElementById(id);
// ───────────── 데이터 색인 ─────────────
const SPOT = {};           // spotId → {f,x,y,name,base,room}
const SPOT_AT = {};        // 'F1:x:y' → spotId
for (const [fid,m] of Object.entries(MAPS)) {
  m.H = m.rows.length; m.W = m.rows[0].length;
  m.rows.forEach((row,y)=>[...row].forEach((c,x)=>{
    const sp = m.spots[c]; if(!sp) return;
    const room = roomAt(fid,x,y);
    SPOT[sp.id] = {f:fid,x,y,name:sp.name,base:sp.base,room}; SPOT_AT[fid+':'+x+':'+y] = sp.id;
  }));
}
const CLUES_AT = {}; CLUES.forEach((c,i)=>{ c.order=i; if(!CLUES_AT[c.spot]) CLUES_AT[c.spot]=[]; CLUES_AT[c.spot].push(c); });

function roomAt(f,x,y){ const m=MAPS[f]; return m.rooms.find(r=>x>=r.x&&x<r.x+r.w&&y>=r.y&&y<r.y+r.h)||null; }
function tile(f,x,y){ const m=MAPS[f]; if(y<0||y>=m.H||x<0||x>=m.W) return ' '; return m.rows[y][x]; }
const OUTDOOR = new Set('grh:=fa'.split(''));
const WALKABLE = new Set('.,_g:=DUVY'.split(''));
function linkAt(f,x,y){ return MAPS[f].links.find(l=>l.x===x&&l.y===y); }
function walkable(f,x,y){
  const c = tile(f,x,y);
  if (c==='L') return S.phase>=2;
  if (MAPS[f].spots[c]) return false;
  return WALKABLE.has(c);
}

// ───────────── 픽셀 그리기 도구 ─────────────
function hash(x,y,s=0){ let h = (x*374761393 + y*668265263 + s*982451653)|0; h=(h^(h>>>13))*1274126177|0; return ((h^(h>>>16))>>>0)/4294967296; }
function R(g,x,y,w,h,c){ g.fillStyle=c; g.fillRect(x,y,w,h); }
const CARPET = { lobby:['#5a1e26','#6c2730','#3e1218'], lounge:['#203a2e','#2a4a3a','#142a20'], study:['#1d2742','#273355','#121a30'],
  r201:['#5a4652','#6a5562','#3e2f39'], r202:['#4a4c5e','#5a5c70','#33354a'], r203:['#5a4a3a','#6a5847','#3e3226'], r204:['#3e4e5a','#4c5e6b','#2a3842'], r205:['#5a3e3e','#6b4c4c','#3e2929'] };
function drawFloorChar(g,ch,px,py,x,y,room){
  if (ch==='.'){ // 나무 바닥
    const tint = room && room.id==='hall1'||room&&room.id==='hall2' ? ['#6b4a30','#5b3e27','#7a5638'] : ['#7a5434','#684629','#8a6240'];
    R(g,px,py,16,16,tint[0]);
    for(let i=0;i<4;i++){ const yy=py+i*4; R(g,px,yy+3,16,1,tint[1]); const off=((y*4+i)*7)%16; R(g,px+off,yy,1,3,tint[1]); if(hash(x,y,i)>.7) R(g,px+((off+6)%15),yy+1,2,1,tint[2]); }
  } else if (ch===','){ const c = CARPET[room&&room.id] || CARPET.lobby; R(g,px,py,16,16,c[0]);

function tryMove(dir){
  S.dir = dir; const [dx,dy]=DIRV[dir]; const nx=S.x+dx, ny=S.y+dy;
  const ln = linkAt(S.f,nx,ny);
  if (dx!==0 && (linkAt(S.f,nx,ny) || linkAt(S.f,S.x,S.y)))return; // v26: 계단 링크 칸만 옆으로 막는다 (접근로 칸은 자유)
  if (ln && ln.phase===2 && S.phase<2){ blockedMsg('계단 입구에 노란 통제선이 쳐져 있다.\n(2차 조사부터 내려갈 수 있다)'); return; }
  if (tile(S.f,nx,ny)==='L' && S.phase<2){ return; }
  if (!walkable(S.f,nx,ny)) return;
  player.moving = true; player.t = 0; player.fx=S.x; player.fy=S.y; S.x=nx; S.y=ny; player.step = player.step===1?2:1;
}
let lastBlock = 0;
function blockedMsg(t){ const now=performance.now(); if(now-lastBlock<900) return; lastBlock=now; say([t]); }

function arrive(){
  if (window.TG_onMove) try{ window.TG_onMove(S); }catch(e){}
  const ln = linkAt(S.f,S.x,S.y);
  if (ln){ travel(ln.to, ln.tx, ln.ty, ln.label); return; }
  updateHud(); save();
}
function isStairTile(f,x,y){ return MAPS[f].links.some(l=>{ if(l.x!==x) return false; let len=1; while(len<3&&['.',',','_'].includes(tile(f,l.x,l.y+len))&&!MAPS[f].links.some(o=>o.x===l.x&&o.y===l.y+len)) len++; return y>=l.y&&y<l.y+len; }); }
function faceAway(f,x,y){ const r=MAPS[f].links.find(l=>Math.abs(l.x-x)+Math.abs(l.y-y)===1) || MAPS[f].links.find(l=>l.x===x&&y>l.y&&y<=l.y+3); if(!r) return null; return r.y<y?'down':r.y>y?'up':r.x<x?'right':'left'; }
function travel(f,x,y,label){
  const fade=$('fade'); fade.style.opacity=1; mode='busy';
  setTimeout(()=>{ S.f=f; S.x=x; S.y=y; S.dir=faceAway(f,x,y)||S.dir; if(!FLOORCV[f]) prerender(f); player.moving=false; updateHud(); save(); if(window.TG_onMove) try{ window.TG_onMove(S); }catch(e){}
    fade.style.opacity=0; mode='play'; toast(MAPS[f].name+' · '+((roomAt(f,x,y)||{}).name||'')); }, 240);
}

function update(dt){
  if (mode==='title'){ attract.t += dt; return; }
  if (player.moving){
    player.t += dt/135;
    if (player.t>=1){ player.moving=false; player.t=0; arrive(); if(mode==='play'){ const d=currentDir(); if(d) tryMove(d); else player.step=0; } }
  } else if (mode==='play'){ const d=currentDir(); if(d) tryMove(d); }
  updatePrompt();
}
function currentDir(){ return held || heldKeys[heldKeys.length-1] || null; }

function render(now){
  ctx.imageSmoothingEnabled=false;
  ctx.fillStyle='#05080f'; ctx.fillRect(0,0,view.width,view.height);
  const f = mode==='title' ? 'F1' : S.f; const m = MAPS[f]; const cv = FLOORCV[f] || prerender(f);
  const T = TS*SC;
  let wx, wy;
  if (mode==='title'){ const k=(Math.sin(attract.t/9000)+1)/2; wx = (m.W*8/46 + k*m.W*30/46)*T; wy = (m.H*12/28 + Math.sin(attract.t/7000)*m.H*6/28)*T; }
  else { const t = player.moving ? player.t : 1; const ix = player.moving ? player.fx+(S.x-player.fx)*t : S.x; const iy = player.moving ? player.fy+(S.y-player.fy)*t : S.y;
    wx = (ix+.5)*T; wy = (iy+.5)*T; player.ix=ix; player.iy=iy; }
  let ox = Math.round(view.width/2 - wx), oy = Math.round(view.height/2 - wy);
  const mw=m.W*T, mh=m.H*T;
  if (mw>view.width) ox = Math.min(0, Math.max(view.width-mw, ox)); else ox = Math.round((view.width-mw)/2);
  if (mh>view.height) oy = Math.min(0, Math.max(view.height-mh, oy)); else oy = Math.round((view.height-mh)/2);
  { const dx0=Math.max(0,ox), dy0=Math.max(0,oy), dx1=Math.min(view.width,ox+mw), dy1=Math.min(view.height,oy+mh);
    if (dx1>dx0 && dy1>dy0) ctx.drawImage(cv, (dx0-ox)/SC*ART_SCALE,(dy0-oy)/SC*ART_SCALE,(dx1-dx0)/SC*ART_SCALE,(dy1-dy0)/SC*ART_SCALE, dx0,dy0,dx1-dx0,dy1-dy0); }

  // 반짝임
  if (mode!=='title' && S.glint){
    for (const [k,id] of Object.entries(SPOT_AT)){ const [sf,sx,sy]=k.split(':'); if(sf!==f) continue; const st=spotState(id);
      if (st==='done' || st==='locked') continue;
      const ph = ((now/1000 + (+sx*0.37 + +sy*0.61)) % 2.4);
      if (ph<0.9){ const a = Math.sin(ph/0.9*Math.PI); const cx=ox+(+sx+.5)*T, cy=oy+(+sy+.3)*T; const r = T*0.22*a;
        ctx.fillStyle = st==='new' ? `rgba(255,226,150,${a})` : `rgba(200,215,235,${a*.7})`;
        ctx.fillRect(cx-r, cy-SC/2, r*2, SC); ctx.fillRect(cx-SC/2, cy-r, SC, r*2); }
    }
  }
  // 플레이어
  if (mode!=='title' && S.role){
    const spr = sprite(S.role, S.dir, player.moving ? player.step : 0);
    const px = ox + player.ix*T, py = oy + (player.iy+1)*T - 22*SC + SC;
    ctx.drawImage(spr, 0,0,spr.width,spr.height, Math.round(px), Math.round(py), 16*SC, 22*SC);
  }
  if (mode!=='title' && window.TG_drawOthers) { try{ window.TG_drawOthers(ctx,f,ox,oy,T,SC,now,sprite,roomAt,S); }catch(e){} }
  // 조명
  const cx = mode==='title' ? view.width/2 : ox+(player.ix+.5)*T, cy = mode==='title' ? view.height/2 : oy+(player.iy+.5)*T;
  const dark = f==='B1' ? .5 : .42; // v26: B1 .62 -> .5
  const gr = ctx.createRadialGradient(cx,cy,T*2.2,cx,cy,T*8);
  gr.addColorStop(0,'rgba(8,12,24,0)'); gr.addColorStop(1,`rgba(4,7,16,${dark})`);
  ctx.fillStyle=gr; ctx.fillRect(0,0,view.width,view.height);
  ctx.fillStyle = 'rgba(255,190,110,0.035)'; ctx.fillRect(0,0,view.width,view.height);
  // Local warm lamplight and cool window light; soft pools preserve legibility.
  ctx.save();ctx.globalCompositeOperation='screen';
  for(const lamp of (LODGE_LIGHTS[f]||[])){
    const lx=ox+lamp.x*T,ly=oy+lamp.y*T,rad=lamp.r*T;
    if(lx+rad<0||ly+rad<0||lx-rad>view.width||ly-rad>view.height)continue;
    const glow=ctx.createRadialGradient(lx,ly,0,lx,ly,rad);
    glow.addColorStop(0,lamp.warm?'rgba(208,155,77,.16)':'rgba(104,153,176,.11)');
    glow.addColorStop(.42,lamp.warm?'rgba(163,111,57,.055)':'rgba(68,114,152,.045)');glow.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=glow;ctx.fillRect(lx-rad,ly-rad,rad*2,rad*2);
  }
  ctx.restore();
  const vignette=ctx.createRadialGradient(view.width/2,view.height/2,view.height*.25,view.width/2,view.height/2,Math.max(view.width,view.height)*.7);
  vignette.addColorStop(0,'#03081100');vignette.addColorStop(1,'#03081155');ctx.fillStyle=vignette;ctx.fillRect(0,0,view.width,view.height);
  // 눈
  if (f==='F1'){
    for(const p of snow){ p.y += 0.0009*p.s*(16); p.x += Math.sin(now/1300+p.s*9)*0.0004; if(p.y>1){p.y=0;p.x=Math.random();}
      const sx = p.x*view.width, sy=p.y*view.height; const tx=Math.floor((sx-ox)/T), ty=Math.floor((sy-oy)/T);
      if (OUTDOOR.has(tile('F1',tx,ty)) || /[123]/.test(tile('F1',tx,ty))) { ctx.fillStyle=`rgba(235,242,250,${.5+p.s*.5})`; ctx.fillRect(sx,sy,SC*(p.s>.7?2:1),SC*(p.s>.7?2:1)); } }
  }
}
let last = performance.now();
function loop(now){ if(!running) return; const dt=Math.min(50,now-last); last=now; update(dt); render(now); requestAnimationFrame(loop); }

function availableClues(id){ return (CLUES_AT[id]||[]).filter(c=>c.phase<=S.phase && !(c.kind==='bag' && c.owner && !roleActive(c.owner-1))); }
function spotState(id){
  const sp=SPOT[id]; if (sp.room && sp.room.phase===2 && S.phase<2) return 'locked';
  const av = availableClues(id); const un = av.filter(c=>!S.got[c.id]);
  if (un.length) return S.visited[id]>=S.phase && un.every(c=>S.seen[c.id]) ? 'seen' : 'new';
  return S.visited[id]>=S.phase ? 'done' : 'new';
}
function picksLeft(){ const lim=S.limits[PK()]; return lim>0 ? Math.max(0, lim - (S.used[PK()]||0)) : Infinity; }

function updateHud(){
  const rm = roomAt(S.f,S.x,S.y); $('hudRoom').textContent = rm ? rm.name : MAPS[S.f].name;
  $('hudFloor').textContent = MAPS[S.f].name.toUpperCase()+' · '+(ROLE[S.role]?ROLE[S.role].name:'');
  const ph=$('hudPhase'); ph.textContent = S.phase===2 ? '2차 조사' : '1차 조사'; ph.classList.toggle('p2',S.phase===2);
  const lim=S.limits[PK()]; $('hudPicks').textContent = window.TG_ADMIN ? '관리자 시찰' : lim>0 ? (PK()===3?`마지막 수집 ${picksLeft()}/${lim}`:`조사권 ${picksLeft()}/${lim}`) : '조사권 무제한';
}
function facing(){ const [dx,dy]=DIRV[S.dir]; return [S.x+dx,S.y+dy]; }
function updatePrompt(){
  const el=$('prompt');
  if (mode!=='play'){ el.hidden=true; return; }
  const [fx,fy]=facing(); const id=SPOT_AT[S.f+':'+fx+':'+fy]; const c=tile(S.f,fx,fy);

  else { const ln=linkAt(S.f,fx,fy); if(ln && ln.phase===2 && S.phase<2) t='통제된 계단'; }
  el.hidden = !t; if(t) el.textContent = t;
}

const dlg=$('dlg'), dWho=$('dlgWho'), dTxt=$('dlgTxt'), dCh=$('dlgCh'), dMore=$('dlgMore');
let dq = null;
function say(pages, who=''){ return new Promise(res=>{ dq = {pages:pages.slice(), who, res, choices:null}; mode='dialog'; nextPage(); }); }
function ask(text, choices, who=''){ return new Promise(res=>{ dq = {pages:[text], who, res, choices, sel:0}; mode='dialog'; nextPage(); }); }
let typing=null;
function nextPage(){
  if (!dq) return;
  if (!dq.pages.length){ const r=dq.res; dq=null; dlg.hidden=true; mode='play'; r(); return; }
  const t = dq.pages.shift(); dTxt.dataset.full = t; dlg.hidden=false; dWho.textContent=dq.who; dWho.hidden=!dq.who; dCh.innerHTML=''; dMore.hidden=true;
  let i=0; clearInterval(typing); typing=null;
  if (matchMedia('(prefers-reduced-motion:reduce)').matches){ finishTyping(); return; }
  dTxt.textContent=''; typing=setInterval(()=>{ i+=2; dTxt.textContent=t.slice(0,i); if(i>=t.length) finishTyping(); }, 22);
}
function finishTyping(){ clearInterval(typing); typing=null; dTxt.textContent=dTxt.dataset.full; if(dq && dq.choices && !dq.pages.length) showChoices(); else dMore.hidden=false; }
function showChoices(){
  dCh.innerHTML='';
  dq.choices.forEach((c,i)=>{ const b=document.createElement('button'); b.textContent=c; if(i===dq.sel) b.classList.add('sel');
    b.onclick=(e)=>{ e.stopPropagation(); choose(i); }; dCh.appendChild(b); });
}
function choose(i){ const r=dq.res; dq=null; dlg.hidden=true; mode='play'; r(i); }
dlg.addEventListener('click', ()=>dlgTap());
function dlgTap(){
  if (!dq) return;
  if (typing){ finishTyping(); return; }
  if (dq.choices && !dq.pages.length){ if(dCh.children.length) choose(dq.sel); return; }
  nextPage();
}
function moveSel(d){ if(!dq||!dq.choices||!dCh.children.length) return; dq.sel=(dq.sel+d+dq.choices.length)%dq.choices.length; [...dCh.children].forEach((b,i)=>b.classList.toggle('sel',i===dq.sel)); }

function pages(text){ // 문장 2개씩 끊기
  const s = text.replace(/\s+/g,' ').replace(/([.!?…”"])\s+/g,'$1\n').split('\n').filter(Boolean); const out=[];
  for(let i=0;i<s.length;i+=2) out.push(s.slice(i,i+2).join(' ')); return out.length?out:[text];
}
