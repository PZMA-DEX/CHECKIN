"spot":"acct_cab","phase":1,"title":"법인 회계 원장 (이중장부)","kind":"document","text":"서류함 안에 같은 제목의 원장 두 권이 나란히 꽂혀 있다. 같은 날짜, 같은 금액인데 계정 이름이 다르다. 한쪽 여백에 형광펜 표시가 빽빽하다.","detail":"【2016 회계 원장 — A본 / B본 대조】\n2016.09.12  ₩1,800,000,000\n A본: 연구비(임상)   B본: 설비비 — (주)한결설비\n수취 계좌: 차명 '조○호 외 1'\n결재: 부대표 강태준 (서명)\n형광펜 메모(가는 펜글씨): \"동일 비용 이중 기재 — 21:05 재검증 완료\"","owner":null,"concerns":[2,1,14],"gm":"연구비를 설비비로 위장, 차명계좌는 조은호. 결재 강태준. 메모 필체·21:05는 윤서아."},{"id":"E10","spot":"legal_table","phase":1,"title":"기밀 합의서 (2016)","kind":"document","text":"열람 탁자 위에 '대외비' 도장이 찍힌 합의서가 펼쳐져 있다. 책임 조항에 밑줄이 그어져 있다. 첨부자료 칸은 비어 있다.","detail":"【비밀유지 합의서 · 2016.12】\n갑: 청명 프로젝트 법인 / 을: 참가자 #07 유가족\n제3조 사고 책임은 현장 의료진 및 연구원의 처치 과실로 한다.\n제7조 을은 본 사고를 어떠한 매체에도 공개하지 않는다.\n초안 작성: 외부 자문 배수아 / 첨부 B: (누락)\n연필 메모: \"첨부 B — 21:36 비교 예정. J.H.\"","owner":18,"concerns":[18,5,13,8],"gm":"배수아가 쓴 책임 전가 합의서. 'J.H.'=이재혁. 누락 첨부는 이재혁의 봉인 봉투. 의료진 책임 전가는 임수빈 동기 강화."},{"id":"E11","spot":"net_rack","phase":1,"title":"연구동 · 자료실 출입 카드 로그","kind":"system","text":"랙 옆 모니터에 출입 카드 기록이 스크롤되고 있다. 위쪽은 오래된 연구동 기록이다. 아래쪽은 오늘 밤 자료실 기록이다.","detail":"【청명 연구동 2016.11.14】\n23:52  IN   R-NAM (연구보조원)   OUT 기록 없음\n【백야산장 2층 자료실 · 오늘】\n20:24  R-SWJ (구 연구카드)\n20:35  GUEST-MED (임시 의료지원)\n20:38  GUEST-11\n20:52  GUEST-03","owner":null,"concerns":[17,12,13,3],"gm":"2016년 R-NAM=남가온의 실종 가족(나간 기록 없음). 오늘 20:24 신우진, 20:35 의료지원=임수빈, 20:38 남가온, 20:52 박현우."},{"id":"E12","spot":"mgmt_keybox","phase":2,"title":"열쇠 반출 대장","kind":"document","text":"다시 살펴보니 열쇠함 문 안쪽에 대장이 끈으로 매달려 있다. 마지막 서명은 21:34이다. '서재 서비스문' 줄에는 반출 기록이 한 번도 없다.","detail":"【열쇠 반출 대장】\n19:10  객실키 201~205 배부 — 백하린\n21:34  마스터키 반출 — 김도현 / 확인 백하린\n서재 정문키 — 서도윤 대표 소지\n서재 서비스문키 — 보관 중 (반출 없음)\n서재 출입카드(업무) — 최민서\n203호 예비키 수량: 2 → 3 (덧쓴 흔적)","owner":10,"concerns":[10,9,6],"gm":"서비스문 열쇠는 아무도 안 가져감 → 열쇠 없이 '안에서 나가며 자동으로 잠긴' 문(E17). 21:34 서명은 김도현 정전 준비. 예비키 수량 덧씀은 백하린의 무단 복제."},{"id":"E13","spot":"garden_gate","phase":1,"title":"누군가 남긴 편지 (조각)","kind":"letter","text":"정원 출입문 경첩 틈에 종이 한 조각이 끼어 있다. 오래 접혀 있던 듯 접힌 선이 하얗게 닳았다. 문장이 중간에서 찢겨 있다.","detail":"【편지 조각 (오른쪽 반)】\n\"…실험실을 떠날 수 없다. 밖으로 나갈 수\n 없게 문이 바깥에서 잠긴다.\n 이 편지를 받으면 연구동 B2를 찾아—\"\n끝 서명: \"…온이에게. 누나가\"","owner":17,"concerns":[17,12],"gm":"남가온 가족의 마지막 편지 나머지 반쪽. 남가온 소지품 '편지 반쪽'과 맞춰야 완성. 연구동 B2는 E14 설계도와 연결."},{"id":"E14","spot":"archive_drawer","phase":2,"title":"기술 설계 도면 REV.03","kind":"blueprint","text":"다시 살펴보니 서랍 바닥이 이중으로 되어 있다. 판자를 들어 올리자 둘둘 말린 청사진이 나온다. 모서리가 손바닥만큼 찢겨 없다.","detail":"【청명 투약 제어 장치 설계도 REV.03】\n변경: 안전 인터록(자동 중단 회로) 삭제 — B2 실험실\nB2 출입문: 외부 잠금 전용\n설계: 신우진 / 검토: 남○○ / 승인: 서도윤\n※ 찢긴 모서리 — 누군가 일부를 떼어 감","owner":12,"concerns":[12,17,3],"gm":"자동 중단 회로를 뺀 도면, 서명자 신우진. 찢긴 모서리=신우진 소지품 '설계도 조각'. 검토자 남○○=남가온 가족, B2 외부 잠금이 편지와 연결."},{"id":"E15","spot":"acct_desk","phase":2,"title":"투자 지분 계약 (원본)","kind":"document","text":"다시 살펴보니 책상 아래 바닥 틈에 서류 한 묶음이 밀려 들어가 있다. 누군가 어둠 속에서 급히 찾다가 떨어뜨린 것 같다. 표지에 '원본'이라는 빨간 도장이 있다.","detail":"【청명 프로젝트 투자 지분 계약 — 원본】\n지분 이전: 강태준 18% → 서도윤 (사고 후 귀속)\n투자 보증인: 조은호\n특약: 대표 유고 시 지분은 지정 상속인에게 승계\n서명: 강태준 / 조은호 / 서도윤\n표지에 휴대폰 불빛에 비친 듯한 손때 자국","owner":1,"concerns":[1,14,11,2],"gm":"강태준이 21:40 회계실에서 휴대폰 불빛으로 찾던 원본. 훔치려던 행동이지 살인 아님. 상속 특약은 서지안 동기와 연결."},{"id":"E16","spot":"pr_desk","phase":1,"title":"긴급 언론 대응 지침 (보도자료 초안)","kind":"document","text":"책상 위에 버전별로 철해진 보도자료가 쌓여 있다. 가장 오래된 장은 2016년 날짜다. 최신본에는 한 문단 전체에 취소선이 그어져 있다.","detail":"【보도자료 v1 · 2016.11】\n\"참가자는 기저질환으로 급성 악화되어 사망… 연구와 무관\"\n【자정 발표문 v4 · 오늘】\n[취소선] \"당시 경영진은 중단 권고를 보고받고도 실험을 계속했다\"\n하단 검토란: H.Y.J ✓  /  \"기자 질문 대응 — 원본 요구 시 거절\"","owner":15,"concerns":[15,4],"gm":"홍예진이 10년 전 거짓 문안을 썼고, 오늘 발표문에서도 경영진 책임 문단이 빠짐. 정유리의 원본 요구 거절과 연결."},{"id":"E17","spot":"util_desk","phase":2,"title":"서재 보조 출입문 수리 기록","kind":"document","text":"설비 점검 책상에 수리 기록 바인더가 펼쳐져 있다. '서재 보조(서비스)문' 항목에 형광펜이 칠해져 있다. 작은 글씨로 주의사항이 붙어 있다.","detail":"【시설 수리 기록 · 2025.11】\n대상: 2층 서재 보조문(서비스 통로 연결)\n작업: 자동 걸쇠 설치 — 문이 닫히면 자동 잠김\n 안쪽: 손잡이로 열림 / 바깥쪽: 열쇠 필요\n요청: 서도윤 대표 / 시공: 시설팀 K.D.H\n주의: \"닫힌 뒤에는 바깥에서 보면 잠긴 문과 구분 불가\"","owner":9,"concerns":[9,10,1,13],"gm":"밀실 트릭의 해답: 안에서 나가면 문이 저절로 잠김. 열쇠 없이 서재를 빠져나간 사람이 있었다는 뜻. 강태준 도면 사본은 리모델링 검토용(무관)."},{"id":"E18","spot":"server_sensor","phase":2,"title":"센서 이동 기록","kind":"system","text":"센서 제어 단말에 2층 문·동작 센서 기록이 남아 있다. 정전 중에도 배터리로 작동한 기록이다. 서재 보조문 줄이 21:46에 깜빡인다.","detail":"【SENSOR LOG — 배터리 모드 (서버 시각)】\n21:40:00  주전원 차단 → 센서 배터리 전환\n21:46:03  서재 보조문  OPEN\n21:46:05  서재 보조문  CLOSE · AUTO-LATCH\n21:46:18  2F 서비스 통로  MOTION\n21:47:02  2F 서비스 통로-객실복도 연결문 OPEN/CLOSE\n21:47:30  서비스 계단 2F→1F  MOTION\n21:48:05  1F 서비스 계단실 문  OPEN","owner":19,"concerns":[19,13,10,6,7],"gm":"21:46 서재 보조문으로 누군가 나가 서비스 계단으로 1층 라운지 쪽 이동. 21:47 연결문 소리=백하린이 들은 소리, 최민서 목격 지점."},{"id":"E19","spot":"study_floor","phase":2,"title":"현장 감식 기록","kind":"medical","text":"현장에 남겨진 감식 메모 판이 있다. 사망 추정 시간이 굵게 적혀 있다. 손목 부분의 메모에 동그라미가 쳐져 있다.","detail":"【현장 감식 기록 (임시)】\n사망 추정: 21:41 ~ 21:45\n사인: 후두부 충격 — 책상 모서리 혈흔 일치\n피해자 양 손목 압박흔 — 몸싸움 정황\n피해자 오른손 손톱 밑: 청색 면섬유 미량\n둔기·흉기 발견 안 됨 / 계획 범행 정황 약함","owner":13,"concerns":[13,1,6],"gm":"정전 직후 4분 사이 몸싸움. 21:33 1층에 있던 강태준, 21:42 비서실의 최민서는 제외 가능. 청색 섬유는 E22와 손수건으로 연결."},{"id":"E20","spot":"study_desk","phase":2,"title":"서재 녹음 — 마지막 18초","kind":"audio","text":"다시 살펴보니 책상 램프 받침 아래에 손가락만 한 녹음기가 숨겨져 있다. 면담 때마다 몰래 켜 두는 장치인 듯하다. 파일이 손상되어 마지막 18초만 복구된다.","detail":"【REC_2125.wav — 복구 구간 21:41:40~21:41:58】\n(정전 직후 숨소리, 의자 끌리는 소리)\n서도윤: \"…임혜정 씨 일은, 나도 어쩔 수—\"\n다른 목소리(낮고 떨림): \"그 이름, 당신 입으로 부르지 마.\"\n(부딪히는 소리) (무거운 것이 넘어지는 소리)\n— 녹음 끝 —\n파일명 시작 시각: 21:25","owner":13,"concerns":[13,6,19,4],"gm":"21:25에 시작된 면담 녹음. 상대는 '임혜정'이라는 이름에 격하게 반응하는 사람=가족. E21의 보호자 이름과 맞추면 임수빈."},{"id":"E21","spot":"study_safe","phase":2,"title":"임혜정의 진료 일지","kind":"medical","text":"금고 문이 열려 있다. 안에 봉투 하나와 손때 묻은 진료 일지가 들어 있다. 일지 앞장에 메모지가 클립으로 꽂혀 있다.","detail":"【진료 일지 · 참가자 #07 임혜정 · 2016】\n10.30 \"약 먹고 나면 손끝이 저리다. 연구진에게 말함.\"\n11.09 \"중단하고 싶다고 했다. '조금만 더'.\"\n보호자: 자녀 임수빈 (간호학과 재학)\n클립 메모(서도윤 필체): \"오늘 21:25 — 이 사람의 자녀가 온다.\n 간호사로. 원본을 원할 것이다.\"","owner":13,"concerns":[13,15,6],"gm":"서도윤은 임수빈의 정체를 알고 21:25 면담에 대비했다. E20의 '임혜정' 반응과 결합하면 면담자=임수빈. 금고 비번은 홍예진 힌트(C05)."},{"id":"E22","spot":"study_sidedoor","phase":2,"title":"서비스문 파란 섬유","kind":"object","text":"다시 살펴보니 보조문 자동 걸쇠 모서리에 무언가 걸려 있다. 파란 실 몇 가닥이다. 천 가장자리가 급히 문틈에 끼었다 빠진 듯하다.","detail":"【채취물】\n위치: 서재 보조문 걸쇠 금속 모서리 (바닥에서 약 90cm)\n성분: 청색 면사 4가닥 — 얇은 평직, 오래 빨아 색이 바램\n형태: 손수건·스카프 가장자리 올\n비교: 피해자 손톱 밑 섬유(E19)와 색·굵기 유사","owner":13,"concerns":[13,8,17],"gm":"범인은 보조문으로 나갔고 파란 천을 쥐고 있었다. 임수빈의 파란 손수건(가방, 올 풀림)과 대조. 오세린·남가온 목격과도 연결."},{"id":"E23","spot":"secr_pc","phase":2,"title":"삭제 전 면담 일정표 (수정 이력)","kind":"system","text":"다시 살펴보니 PC의 문서 버전 기록이 남아 있다. 같은 일정표가 두 번 저장되었다. 21:58 저장본에서 한 줄이 사라졌다.","detail":"【내부면담.docx — 버전 기록】\nv3  20:40 저장  사용자 choi.ms\n  21:25  임수빈 — 비공개 면담 (서재, 배석 없음)\nv4  21:58 저장  사용자 choi.ms\n  21:25 행 삭제\n21:59  출력 1부 (비서실 프린터)","owner":6,"concerns":[6,13],"gm":"21:25 면담자는 임수빈, 지운 사람은 비서실 계정(최민서), 시각은 사건 후 21:58. 은폐 조력의 결정적 증거."},{"id":"E24","spot":"legal_cab","phase":2,"title":"공동거주 계약 기록","kind":"document","text":"다시 살펴보니 보관함 뒤판 쪽에 얇은 파일 하나가 따로 꽂혀 있다. 회사 서류와 섞이지 않게 숨겨 둔 것 같다. 두 사람의 서명이 나란히 있다.","detail":"【공동거주 계약서 (사본)】\n주소: 서울 ○○구 ○○로 17, 1203호\n기간: 2019.04 ~ (갱신)\n당사자: 서도윤 / 홍예진 (자필 서명)\n생활비 분담·공동 소유 물품 목록 첨부\n공증 상담: 이재혁 (2024)","owner":15,"concerns":[15,11,5],"gm":"홍예진과 서도윤의 사실혼 관계. 유언장 'H'의 정체. 상속 이해관계가 있지만 살인 증거는 아님."},{"id":"E25","spot":"study_shelf","phase":2,"title":"서도윤의 마지막 비공개 편지","kind":"letter","text":"다시 살펴보니 책장 맨 아래 칸 사진첩 속에 봉투가 끼워져 있다. 겉봉에 'Y에게 — 발표 뒤에 열 것'이라고 쓰여 있다. 봉투는 아직 뜯기지 않았다.","detail":"【봉투 겉면】 Y에게 — 발표 뒤에 열 것. (21:05)\n【내용】\n\"마지막 발표 뒤 네게 꼭 해야 할 말이 있다.\n 금고의 봉투는 네가 열어. 그 안에 이름이 하나 있다.\n 그 사람이 오늘 오면, 나는 도망치지 않을 거야.\n 지안이에게는 내가 직접 말할게.\"\n— D.","owner":15,"concerns":[15,11,13],"gm":"서도윤이 홍예진에게 남긴 편지. '금고 속 이름'=임혜정/임수빈(E21). 서지안 언급은 상속 정리 의도."},{"id":"C01","spot":"study_desk","phase":1,"title":"발표 원고 마지막 장","kind":"document","text":"책상 위에 자정 발표 원고가 흩어져 있다. 마지막 장만 다른 종이에 출력되어 있다. 여백에 굵은 손글씨가 남아 있다.","detail":"【자정 발표 원고 p.12 (19:48 교체본)】\n\"청명 프로젝트의 모든 자료를 오늘 공개합니다.\"\n여백 손글씨:\n\"자정 전에 먼저 만나야 할 사람이 있다.\n 이름은 원고에 쓰지 말 것.\"\n하단 출력 정보: 비서실 프린터 19:46","owner":6,"concerns":[6,13],"gm":"마지막 장을 전달한 건 최민서(19:48). '먼저 만날 사람'=21:25 면담자. 1차에선 정체 불명."},{"id":"C02","spot":"study_floor","phase":1,"title":"만년필 뚜껑","kind":"object","text":"쓰러져 있던 자리 근처, 책상 다리 옆에 검은 만년필 뚜껑이 떨어져 있다. 금색 클립에 이니셜이 각인되어 있다. 본체는 보이지 않는다.","detail":"【만년필 뚜껑】\n클립 각인: K.T.J\n뚜껑 안쪽 잉크가 말라 있음 (최근 떨어진 것은 아닌 듯)\n같은 모델: 계약 서명용으로 흔히 쓰는 국산 만년필","owner":1,"concerns":[1,2],"gm":"강태준이 21:10~21:24 서재에 들렀을 때 흘린 것(잉크가 말라 있음). 21:40에는 1층 회계실(E15·C20·윤서아 진술) — 살인과 무관한 미끼."},{"id":"C03","spot":"study_sidedoor","phase":1,"title":"잠긴 보조문","kind":"object","text":"서재 구석의 보조문은 단단히 잠겨 있다. 손잡이 아래 금속 걸쇠가 내려와 있다. 문틈으로 차가운 바람이 새어 든다.","detail":"【관찰】\n보조문: 잠김 (바깥 서비스 통로 쪽)\n걸쇠: 내려가 있음 / 열쇠 구멍은 바깥쪽에만 있음\n문틈 바람 — 통로 너머가 계단으로 이어지는 듯\n서도윤이 했다는 말: \"보조 통로는 늘 잠겨 있다.\"","owner":null,"concerns":[10,1,9],"gm":"1차에선 '밀실'처럼 보이게 하는 단서. 2차 E17·E22로 뒤집힘."},{"id":"C04","spot":"study_shelf","phase":1,"title":"협박성 편지","kind":"letter","text":"책장 사이에 접힌 편지가 꽂혀 있다. 글씨가 날카롭고 획이 눌려 있다. 끝에 이니셜만 적혀 있다.","detail":"\"당신이 설계를 바꾸라고 했던 날을 기억합니다.\n 그 회로를 뺀 건 내 손이지만, 지시는 당신이었습니다.\n 이번에도 내 이름만 남긴다면\n 나도 모든 걸 말하겠습니다. 당신도 끝입니다.\"\n— W.J. (2026.08)","owner":12,"concerns":[12],"gm":"신우진의 협박성 편지 원본(소지품은 사본). '회로'는 E14 안전 인터록. 살인 동기로 보이지만 실은 자료 확보 목적."},{"id":"C05","spot":"study_safe","phase":1,"title":"잠긴 금고와 메모지","kind":"object","text":"금고는 굳게 잠겨 있다. 다이얼 옆에 작은 포스트잇이 붙어 있다. 정갈한 글씨로 힌트 같은 문장이 적혀 있다.","detail":"【금고: 잠김 (4자리)】\n포스트잇:\n\"앞 두 자리 = 우리가 처음 같이 살기 시작한 달\n 뒤 두 자리 = 네가 아는 그 숫자\"\n금고 손잡이에 지문 닦은 흔적은 없음","owner":15,"concerns":[15,11],"gm":"'같이 살기 시작한 달'=04(E24, 2019.04). 비번을 아는 사람은 홍예진. 2차에 금고가 열려 E21 확인."},{"id":"C06","spot":"secr_pc","phase":1,"title":"프린터 출력 대기열","kind":"system","text":"비서실 PC 화면 구석에 프린터 작업 내역이 떠 있다. 사건이 난 뒤의 시각에 출력된 문서가 있다. 모니터 테두리에 메모지가 붙어 있다.","detail":"【출력 내역】\n19:46  발표원고_p12.pdf\n20:45  내부면담_출력.pdf\n21:59  내부면담_수정.pdf  ← ?\n【메모지】 \"백업 암호: 첫 출근일 + 대표님 이니셜\"","owner":6,"concerns":[6],"gm":"21:59에 면담표를 '수정'해 다시 출력한 사람이 있다. 최민서 은폐의 1차 힌트(내용은 2차 E23)."},{"id":"C07","spot":"dining_table","phase":1,"title":"식탁 좌석 카드","kind":"object","text":"긴 식탁에 손님 이름이 적힌 좌석 카드가 그대로 남아 있다. 몇 자리 카드에는 메모가 휘갈겨져 있다. 식탁 끝에 털 달린 마이크 바람막이 하나가 굴러 있다.","detail":"【19:35 저녁 좌석】\n상석: 서도윤 / 맞은편: 강태준\n같은 테이블: 윤서아, 조은호\n서도윤 왼쪽 뒤: 박현우 / 몇 자리 건너: 신우진\n강태준 카드 뒷면: \"20:00 — 반박할 것\"\n바람막이 안쪽 라벨: PRESS · J.Y.R","owner":null,"concerns":[1,2,14,3,12,4],"gm":"저녁 동선 정리용. 박현우·신우진이 서로 피해 앉음. 바람막이는 정유리(E04 노트북과 짝)."},{"id":"C08","spot":"lobby_board","phase":1,"title":"게시판의 인원 메모","kind":"notebook","text":"비상등 위치 안내문 아래에 볼펜 메모가 덧붙어 있다. 경찰 조서처럼 시각과 인원을 줄 맞춰 적었다. 글씨 끝마다 짧게 밑줄을 긋는 버릇이 있다.","detail":"【21:40 정전 직후 로비 비상등 아래 확인】\n- 본인\n- 촬영 감독 (카메라 비상 조명 켬)\n- 서버 기술자 (네트워크 확인 중)\n21:45 촬영 감독과 복도 방향 화면 확인_\n21:50 1층 계단 — 자문 변호사 문서가방 들고 지나감_","owner":7,"concerns":[7,16,19,18],"gm":"한지훈의 메모. 한지훈·차시온·문하준의 정전 직후 알리바이와 배수아 21:50 목격."},{"id":"C09","spot":"garden_bench","phase":1,"title":"신문 스크랩과 메모","kind":"notebook","text":"벤치 위에 비닐 파일 하나가 놓여 있다. 오래된 신문 기사들이 붙어 있다. 마지막 장 여백의 글씨가 유난히 세다.","detail":"【스크랩: 2016.11 '임상 참가자 기저질환으로 사망' 외 5건】\n여백 메모:\n\"서도윤 — 반드시 대가를 치르게 할 것.\"\n\"21:30 정원. 혼자 다시 읽음.\"\n파일 표지 스티커: 청명 피해가족 모임","owner":8,"concerns":[8,13],"gm":"오세린의 분노 메모(약점). 행동으로 옮기지 않았음. 21:30 정원은 혼자라 미증명."},{"id":"C10","spot":"mgmt_keybox","phase":1,"title":"비어 있는 열쇠 고리","kind":"object","text":"열쇠함 문이 조금 열려 있다. '마스터' 고리가 비어 있다. 바로 옆 '서재 서비스문(예비)' 고리에는 열쇠가 그대로 걸려 있다.","detail":"【열쇠함 현황】\n마스터키: 없음\n서재 서비스문(예비): 있음 — 먼지 고르게 쌓임\n관리실 열쇠: 직원용 1개 없음\n객실 예비키 203: 3개 (다른 방은 2개씩)","owner":9,"concerns":[9,10],"gm":"마스터키는 김도현이 21:34 가져감. 서비스문 열쇠는 손대지 않음. 203호 예비키만 하나 더 = 백하린 복제."},{"id":"C11","spot":"lobby_desk","phase":1,"title":"체크인 기록","kind":"document","text":"안내데스크 위에 체크인 명부가 펼쳐져 있다. 짐 보관 칸에 체크가 줄지어 있다. 한 줄만 '직접 소지'라고 따로 적혀 있다.","detail":"【체크인 명부】\n19:02  강태준 — 봉투 수령 (비서실 전달)\n19:07  윤서아 / 신우진\n19:14  의료지원 — 가방 보관 거절, 직접 소지\n19:16  정유리 / 차시온 — 촬영 장비 반입\n21:30  비상등 위치 안내 완료 — B.H.R","owner":10,"concerns":[10,13,1,16],"gm":"의료 가방을 맡기지 않은 사람=임수빈. 1차에서는 사소해 보이는 행동."},{"id":"C12","spot":"lounge_fire","phase":1,"title":"타다 만 이메일 출력본","kind":"document","text":"벽난로 장작 사이에 구겨진 종이가 던져져 있다. 불길이 닿지 않아 글자가 대부분 남아 있다. 받는 사람 주소 앞부분만 읽힌다.","detail":"【이메일 출력본 · 10:05 수신】\n받는 사람: jian.s***@\n\"발표가 끝나면 유언 내용을 정리할 생각이다.\n 놀라지 말고, 산장에서 이야기하자.\"\n— D.\n종이 뒷면 볼펜: \"15%?? 말도 안 돼\"","owner":11,"concerns":[11,5],"gm":"서지안이 받은 유언 변경 예고 메일. 분노 메모가 금전 동기를 키움."},{"id":"C13","spot":"dining_cupboard","phase":1,"title":"송금 확인증 반쪽","kind":"document","text":"비상등 아래 찬장 서랍 틈에 접힌 종이가 끼어 있다. 은행 송금 확인증의 절반이다. 찬장 위에는 물이 반쯤 남은 컵 두 개가 있다.","detail":"【송금 확인증 (반쪽)】\n수취: (주)한결설비\n금액: ₩300,000,000\n송금인: (가려짐) / 담당 확인: E.H. Cho\n컵 두 개 — 한쪽 컵 가장자리에 연한 립밤 자국","owner":14,"concerns":[14,2],"gm":"조은호의 차명 송금 흔적(E09와 같은 업체). 컵 두 개는 21:42 윤서아·조은호가 비상등 아래에서 만난 흔적 = 둘의 알리바이."},{"id":"C14","spot":"parking_van","phase":1,"title":"촬영 일지","kind":"notebook","text":"촬영 차량 조수석에 촬영 일지가 놓여 있다. 컷마다 시각이 꼼꼼하게 적혀 있다. 한 줄은 펜으로 여러 번 덧칠되어 있다.","detail":"【촬영 일지】\n19:16 로비 — J 기자 인터뷰 도입\n19:58 식당 — 발표 광각\n21:40 로비 — 비상 조명 ON\n21:45 로비 — 전직 형사님과 복도 화면 확인\n21:51 1층 계단 — 배터리 교체\n(덧칠) 2024 인터뷰 #7 — 대표 발언 컷 ■■■","owner":16,"concerns":[16,7,4],"gm":"차시온의 알리바이와, 예전 인터뷰에서 서도윤에게 불리한 장면을 잘라낸 약점."},{"id":"C15","spot":"svcst1_floor","phase":1,"title":"서류 집게와 라벨 조각","kind":"object","text":"서비스 계단 아래 어두운 바닥에 큼직한 서류 집게가 떨어져 있다. 옆에 찢어진 라벨 조각도 있다. 계단 위쪽에서 찬 바람이 내려온다.","detail":"【라벨 조각】 \"…법률자문 · 기밀 · 개봉 금지\"\n서명 일부: \"B.S…\"\n서류 집게: 대형, 법무용\n계단 위쪽 문: 닫혀 있음 (1차에서는 열 수 없음)","owner":18,"concerns":[18,7],"gm":"배수아가 21:50 문서가방을 들고 1층 계단을 지날 때 떨어뜨린 것. 범인 동선 근처의 미끼."},{"id":"C16","spot":"svc_floor","phase":2,"title":"서비스 통로의 발자국","kind":"object","text":"먼지 쌓인 통로 바닥에 발자국이 한 줄로 나 있다. 서재 보조문 앞에서 시작해 계단 쪽으로만 이어진다. 돌아온 자국은 없다.","detail":"【발자국】\n시작: 서재 보조문 앞 / 끝: 서비스 계단 2층 입구\n크기: 약 230mm, 굽 낮은 고무 밑창 (쿠션 패턴)\n보폭: 넓고 불규칙 — 뛰듯이 이동\n통로-객실복도 연결문 앞: 다른 신발(얇은 구두굽) 자국 1쌍, 문 앞에서 멈춤","owner":13,"concerns":[13,6],"gm":"보조문으로 나간 사람은 서재 안에 있던 사람. 간호화 같은 밑창. 연결문 앞에서 멈춘 구두 자국=21:47 최민서."},{"id":"C17","spot":"svcst1_floor","phase":2,"title":"멸균 거즈 포장지","kind":"medical","text":"다시 살펴보니 계단 마지막 칸 밑 틈에 작은 포장지가 끼어 있다. 병원 납품용 멸균 거즈 포장이다. 뜯은 모서리에 아주 옅은 붉은 자국이 있다.","detail":"【포장지】\n'멸균 거즈 4×4 / 의료기관 납품용'\n로트 번호: MG-2210\n개봉 후 버려진 지 오래되지 않음\n이 계단은 2층 서비스 통로와 바로 이어진다.","owner":13,"concerns":[13,8],"gm":"서비스 계단으로 내려온 사람이 의료용 거즈로 손을 닦았다. 21:56 라운지에서 의료 가방을 급히 닫던 임수빈(오세린 목격)과 연결."},{"id":"C18","spot":"sec_monitor","phase":2,"title":"보안실 접속 기록","kind":"system","text":"CCTV 모니터 옆에 로그인 기록 창이 열려 있다. 사건 뒤 두 계정이 차례로 접속했다. 화면 아래 자동 덮어쓰기 경고가 깜빡인다.","detail":"【보안실 접속】\n20:18  mhj-temp — 백업 장치 점검\n20:58  mhj-temp — 백업 접근 요청 → 거부 (kdh)\n22:12  kdh_facility — ARCHIVE_2F 열람\n22:12  mhj-temp — 복구 도구 실행\n⚠ 순환 녹화: 23:00 덮어쓰기 예정 (백업 안 하면 소실)","owner":9,"concerns":[9,19],"gm":"김도현과 문하준 모두 22:12에 21:46 영상을 봤다. 김도현이 이를 지우면 은폐 조력자가 되는 갈림길."},{"id":"C19","spot":"server_rack","phase":2,"title":"복사된 관리자 인증","kind":"system","text":"서버 랙 뒤 콘솔에 세션 기록이 남아 있다. 외부 기기가 관리자 인증 정보를 복사한 흔적이다. 기기 이름이 그대로 찍혀 있다.","detail":"【ADMIN SESSION】\n20:58  인증 거부 (사용자 mhj-temp)\n21:05  관리자 토큰 export → 기기: MHJ-LAPTOP\n21:34  서버 보안 점검 (같은 토큰)\n해시 목록 파일 생성: hash_0412.txt","owner":19,"concerns":[19,9],"gm":"문하준이 허가 없이 관리자 인증을 복사(약점). 영상 진정성 공격에 쓰일 수 있지만 해시 목록으로 원본성 방어 가능."},{"id":"C20","spot":"storage_box","phase":2,"title":"현금 봉투와 작업 메모","kind":"object","text":"상자 더미 맨 아래에 두툼한 흰 봉투가 숨겨져 있다. 안에 현금과 접힌 메모가 들어 있다. 메모 끝에 만년필 잉크 번짐이 있다.","detail":"【메모 (만년필)】\n\"21:40 / 12분.\n 회계실 쪽만이라도 확실히 어둡게.\n 기록엔 낙뢰로.  — K\"\n봉투: 현금 다발 (작업비 명목)\n봉투 겉: '시설 작업비 — FAC-01'","owner":1,"concerns":[1,9],"gm":"강태준이 김도현에게 정전을 의뢰한 증거. 목적은 계약서 회수였지 살인 아님(강태준은 21:40 1층 회계실)."},{"id":"C21","spot":"storage_shelf","phase":2,"title":"열쇠 복제 영수증","kind":"document","text":"창고 선반 공구함 사이에 영수증이 끼어 있다. 열쇠 복제 업체의 것이다. 복제 목록에 서재 열쇠는 없다.","detail":"【○○열쇠 영수증 · 2025.07】\n품목: 객실 203 예비키 1 / 객실 105 1 / 창고 1\n의뢰: 백야산장 관리 — 백○린\n메모: \"VIP 요청 건 — 장부엔 기록 X\"\n※ 서재 정문·서비스문 키는 목록에 없음","owner":10,"concerns":[10],"gm":"백하린의 무단 복제(약점). 서재 열쇠는 복제하지 않았으므로 밀실과 무관함을 증명."},{"id":"C22","spot":"acct_cab","phase":2,"title":"2016 감사 보고서 표지","kind":"document","text":"다시 살펴보니 서류함 가장 깊은 칸에 낡은 보고서 표지가 붙어 있다. '보류' 도장이 찍혀 있다. 검토자 칸에 가는 펜 서명이 있다.","detail":"【2016 청명 프로젝트 회계감사 보고서 — 표지】\n의견: 의심 항목 3건 — (보류)\n검토자: 윤○아 (서명)\n\"추가 자료 확보 시 재검토\" — 이후 기록 없음","owner":2,"concerns":[2],"gm":"윤서아가 10년 전 의심 항목을 덮었던 책임. 오늘 그것을 바로잡으려는 동기."},{"id":"C23","spot":"legal_table","phase":2,"title":"다시 봉인된 봉투","kind":"document","text":"다시 살펴보니 탁자 밑 선반에 봉인 봉투가 놓여 있다. 봉인 테이프를 한 번 뜯었다가 다시 붙인 자국이 있다. 재봉인 시각이 연필로 적혀 있다.","detail":"【봉인 봉투 — 첨부 B】\n재봉인: 21:59 (J.H.)\n내용 발췌: \"본 자료 공개 시 공개자는 손해배상 책임을 진다\"\n별지: 21:36 배수아 자문과 대조 — 일치\n봉투 귀퉁이: 이재혁 법률 상담 카드 스테이플","owner":5,"concerns":[5,18],"gm":"이재혁이 폭로를 막는 문안을 갖고 있었다(약점). 21:36 배수아와 법률문서실에 함께 있었음을 보여줌 = 둘의 알리바이."},{"id":"C24","spot":"archive_cabinet","phase":2,"title":"캐비닛 반출 기록","kind":"document","text":"다시 살펴보니 캐비닛 문 안쪽에 낡은 반출 카드가 붙어 있다. 자물쇠에는 새로 긁힌 자국이 있다. 맞는 열쇠는 따로 있는 듯하다.","detail":"【반출 카드】\n2016.11.09  원본 노트 복사 1부 — P.H.W (승인 없음)\n2016.11.10  노트 p.37~38 열람 — 기술책임\n자물쇠: 구형 '청명' 규격 — 오늘 긁힌 자국","owner":3,"concerns":[3,12],"gm":"박현우가 사고 당일 무단으로 복사본을 가져간 약점. 오늘 같은 규격 열쇠로 캐비닛을 연 흔적."},{"id":"C25","spot":"archive_desk","phase":2,"title":"열람 단말 조회 기록","kind":"system","text":"다시 살펴보니 열람 책상 단말에 조회 기록이 남아 있다. 한 사용자가 보고서의 특정 쪽만 반복해 열었다. 옆에 반듯하게 네 번 접힌 메모지가 있다.","detail":"【자료실 단말 · 조회】\n20:35  GUEST-MED  사고보고서 v3  p.14 (3회)\n20:52  GUEST-03  연구노트 색인\n【메모 (작고 반듯한 글씨, 네모나게 접힘)】\n\"p.14 — 처치 미흡을 의료진에게.\n 엄마는 간호 기록에 '괜찮다'고 쓴 적 없음.\"","owner":13,"concerns":[13,3],"gm":"의료진 책임 전가 문단(p.14)을 반복 조회한 의료지원=임수빈. '엄마'라는 단어가 개인적 동기를 드러냄."},{"id":"C26","spot":"waiting_table","phase":2,"title":"명함 뒤 대기 메모","kind":"notebook","text":"다시 살펴보니 협탁 서랍 안에 명함 한 장이 뒤집혀 있다. 뒷면에 급하게 쓴 메모가 있다. 앞면은 투자회사 대표 명함이다.","detail":"【명함 뒷면】\n\"21:28 도착. 안에서 누가 얘기 중 — 대기.\n 목소리 낮음. 남자인지 여자인지 모르겠음.\n 21:31 포기, 라운지로.\"\n앞면: ○○인베스트 대표 조은호","owner":14,"concerns":[14,13,6],"gm":"21:28 서재 안에 이미 누군가 있었다 → 21:25 면담 실존. 조은호는 21:31 라운지로 내려감(알리바이)."},{"id":"C27","spot":"garden_bench","phase":2,"title":"지퍼백 속 위치 기록","kind":"document","text":"다시 살펴보니 벤치 다리 뒤에 지퍼백이 테이프로 붙어 있다. 안에 출력된 지도와 메모가 들어 있다. 메모 끝에 손목시계 그림이 그려져 있다.","detail":"【마지막 위치 기록 · 2016.11.14 23:58】\n'청명 연구동 지하 2층' — 휴대전화 마지막 신호\n메모: \"아무에게도 보여주지 말 것.\n 누나가 준 시계, 아직 11시 58분에 멈춰 있음.\"","owner":17,"concerns":[17],"gm":"남가온이 혼자 숨겨 온 실종 가족의 마지막 위치(약점). E11(OUT 기록 없음)·E14(B2 외부 잠금)와 연결."},{"id":"C28","spot":"kitchen_bin","phase":2,"title":"찢긴 차용증","kind":"document","text":"다시 살펴보니 쓰레기통 바닥에 잘게 찢긴 종이가 뭉쳐 있다. 조각을 맞추자 도장 찍힌 문서가 된다. 차용증이다.","detail":"【차용증 (복원)】\n차용인: 강○준 / 보증: 조○호\n금액: ₩500,000,000\n조건: \"청명 지분 회수 시 우선 상환\"\n찢긴 시각 추정: 정전 이후 (종이에 촛농 없음, 물기 없음)","owner":14,"concerns":[14,1],"gm":"강태준·조은호의 돈 문제. 21:49 식당 복도 대화와 연결. 둘 다 금전 동기는 있으나 살인 현장과는 멀다."},{"id":"C29","spot":"lounge_table","phase":2,"title":"반사면 캡처 화면","kind":"camera","text":"다시 살펴보니 노트북에 영상 캡처 한 장이 새로 열려 있다. 복도 유리창에 비친 흐릿한 형체다. 옆에 시각 보정 메모가 붙어 있다.","detail":"【캡처 · 차시온 카메라 21:49:10 (보정 전)】\n복도 끝 유리 반사 — 1명, 손에 천 같은 것을 쥠\n적외선 화면이라 색 판별 불가\n메모: \"카메라 −1분 / 서버 +2분 → 실제 21:48경?\"\n\"이름 단정 금지 — 녹음과 대조할 것\"","owner":16,"concerns":[16,4,13],"gm":"차시온·정유리가 가진 반사면 장면. 서버 시각 보정 시 E08/E18 21:46~48 이동자와 같은 사람. 단독으론 신원 불명."},{"id":"C30","spot":"pr_desk","phase":2,"title":"통화 실패 기록","kind":"system","text":"다시 살펴보니 책상 위 충전 중인 업무폰에 알림이 남아 있다. 정전 중 한 번 건 전화가 연결되지 않았다. 그 위로 저녁 무렵 받은 짧은 메시지가 보인다.","detail":"【업무폰】\n21:05  수신 — 'D': \"오늘 밤 끝나면 우리 얘기하자.\"\n21:41  2층 객실 복도 — 비상등 확인 메모\n21:46  발신 — 시설팀 김도현 ✕ (연결 안 됨)\n21:51  임시 공지 초안 작성","owner":15,"concerns":[15,9],"gm":"홍예진의 정전 중 행적(2층 객실 구역). 김도현은 지하 설비실에서 전화를 받지 않음. 'D'는 서도윤."},{"id":"C31","spot":"lobby_lost","phase":2,"title":"주워 온 봉인 스티커","kind":"object","text":"다시 살펴보니 분실물함 구석에 봉인 스티커 한 장이 들어 있다. 습득 메모가 함께 붙어 있다. 관리실 앞에서 주웠다고 적혀 있다.","detail":"【습득물 메모】\n물품: 봉인 스티커 (\"법률자문 B.S.A — 개봉 금지\")\n습득: 21:53, 관리실 앞 복도\n습득자: 관리실\n※ 스티커 접착면에 먼지 거의 없음","owner":18,"concerns":[18,10],"gm":"배수아가 21:52 관리실 쪽으로 이동했다는 사실. 서비스 계단 라벨(C15)과 이어져 배수아 동선이 해명됨."},{"id":"C32","spot":"net_rack","phase":2,"title":"시계 오차 대조표","kind":"notebook","text":"다시 살펴보니 랙 옆면에 손으로 쓴 표가 붙어 있다. 장치마다 시계가 몇 분씩 어긋나 있다. 기준 시각을 맞추는 계산이 적혀 있다.","detail":"【시계 오차 (19:28 측정)】\n관리 서버(CCTV·센서): 실제 +2분\n촬영 카메라(차시온): 실제 −1분\n서재 녹음기: 실제와 일치\n결론: 서버 21:46 = 실제 21:44경","owner":19,"concerns":[19,16,13],"gm":"문하준의 메모. 보정하면 서재 보조문 탈출은 사망 추정 시각(21:41~45) 끝 직후와 정확히 맞물린다."},{"id":"C33","spot":"garden_gate","phase":2,"title":"출입문 개폐 표시판","kind":"system","text":"다시 살펴보니 출입문 위에 작은 개폐 표시판이 달려 있다. 정전 중에도 배터리로 기록되었다. 빨간 숫자가 세 줄 남아 있다.","detail":"【정원 출입문 개폐】\n21:33  CLOSE\n21:44  OPEN\n21:47  CLOSE\n문 바깥 흙 위: 운동화 자국 1쌍 (안쪽으로 돌아옴)","owner":17,"concerns":[17,7],"gm":"21:33 한지훈이 문을 닫음, 21:44~47 남가온이 바깥 공기를 쐼 — 둘 다 서재와 먼 곳."},{"id":"BAG01","spot":"r201_bag1","phase":2,"title":"강태준의 가방","kind":"bag","text":"침대 옆에 검은 서류 가방 하나가 놓여 있다. 손잡이 가죽이 닳은 서류 가방이다. 이름표에 이름이 적혀 있다.","detail":"【이름표: 강태준 · 201호】\n· 접힌 사업계약서 — 청명 프로젝트 지분 이전 조항에 펜으로 줄을 그어 놓았다.\n· 만년필 — 서도윤과의 계약 서명에 사용하던 평범한 필기구.\n· 서재 보조문 도면 사본 — 리모델링 비용 검토 당시 받은 오래된 평면도.","owner":1,"concerns":[1],"gm":"강태준의 서재 보조문 도면은 리모델링 검토용. 자동 걸쇠(E17) 이전 도면이라 오히려 걸쇠가 없음."},{"id":"BAG02","spot":"r201_bag2","phase":2,"title":"윤서아의 가방","kind":"bag","text":"침대 옆에 회색 노트북 백팩 하나가 놓여 있다. 지퍼마다 색깔 태그가 달린 정리된 백팩이다. 수하물 태그에 이름이 적혀 있다.","detail":"【수하물 태그: 윤서아 · 201】\n· 회계 USB — 두 버전의 계정 원장과 누락 항목 표시가 있다.\n· 감사 수첩 — 21:05에 확인한 이상 송금 기록이 적혀 있다.\n· 거래처 명함 — 이중 지급을 받은 외주업체 연락처.","owner":2,"concerns":[2],"gm":"윤서아의 초기 소지품 확인용."},{"id":"BAG03","spot":"r201_bag3","phase":2,"title":"조은호의 가방","kind":"bag","text":"침대 옆에 가죽 브리프케이스 하나가 놓여 있다. 번호 자물쇠가 달린 고급 가방이다. 번호는 0000에 맞춰져 있다. 명함 꽂이에 이름이 적혀 있다.","detail":"【명함 꽂이: 조은호 · 201호】\n· 은행 거래 명세 — 일부 차명 계좌와 송금 시각이 적혀 있다.\n· 계약 키 카드 — 금고 보관 계약서 수령용 코드.\n· 차용증 — 강태준 측과 주고받은 투자 보증 문서.","owner":14,"concerns":[14],"gm":"조은호의 초기 소지품 확인용."},{"id":"BAG04","spot":"r202_bag1","phase":2,"title":"이재혁의 가방","kind":"bag","text":"침대 옆에 갈색 서류 가방 하나가 놓여 있다. 안쪽이 칸칸이 나뉜 변호사용 가방이다. 이름표에 이름이 적혀 있다.","detail":"【이름표: 이재혁 · 202호】\n· 공증 사본 — 원본과 다른 일련번호가 찍혀 있다.\n· 법률 상담 카드 — 서도윤의 사전 상담 일정이 적혀 있다.\n· 봉인 봉투 — 구형 비밀유지 합의서의 일부 첨부자료.","owner":5,"concerns":[5],"gm":"이재혁의 초기 소지품 확인용."},{"id":"BAG05","spot":"r202_bag2","phase":2,"title":"배수아의 가방","kind":"bag","text":"침대 옆에 남색 문서 가방 하나가 놓여 있다. 모서리가 단단한 문서 전용 가방이다. 수하물 태그에 이름이 적혀 있다.","detail":"【수하물 태그: 배수아 · 202】\n· 서명된 합의서 초본 — 일부 위험 책임을 의료진에게 돌리는 표현이 있다.\n· 비밀 각서 — 2016년 사건 공개에 관한 조건이 적혀 있다.\n· 법률 연락망 — 옛 담당 변호사와 유가족 대리인 명단.","owner":18,"concerns":[18],"gm":"배수아의 초기 소지품 확인용."},{"id":"BAG06","spot":"r202_bag3","phase":2,"title":"서지안의 가방","kind":"bag","text":"침대 옆에 작은 여행 캐리어 하나가 놓여 있다. 스티커가 잔뜩 붙은 캐리어다. 이름표에 이름이 적혀 있다.","detail":"【이름표: 서지안 · 202호】\n· 가족관계 서류 — 서도윤과의 친족 관계 증명.\n· 유산 이메일 — 유언 변경 예정이라는 짧은 예고가 있다.\n· 열쇠고리 — 객실 열쇠와 개인 장식이 달려 있다.","owner":11,"concerns":[11],"gm":"서지안의 초기 소지품 확인용."},{"id":"BAG07","spot":"r203_bag1","phase":2,"title":"박현우의 가방","kind":"bag","text":"침대 옆에 낡은 캔버스 가방 하나가 놓여 있다. 팔꿈치에 닿는 쪽이 해진 가방이다. 이름표에 이름이 적혀 있다.","detail":"【이름표: 박현우 · 203호】\n· 찢긴 실험 수첩 — 표지 안쪽에 이상 반응 기록 번호가 있다.\n· 연구실 사진 — 임상시험 참여자와 연구진이 함께 찍힌 단체 사진.\n· 자물쇠 열쇠 — 자료실 낡은 캐비닛과 규격이 비슷하다.","owner":3,"concerns":[3],"gm":"박현우의 초기 소지품 확인용."},{"id":"BAG08","spot":"r203_bag2","phase":2,"title":"신우진의 가방","kind":"bag","text":"침대 옆에 검은 도면 통 가방 하나가 놓여 있다. 원통형 도면 통이 꽂힌 가방이다. 수하물 태그에 이름이 적혀 있다.","detail":"【수하물 태그: 신우진 · 203】\n· 설계도 조각 — 원본 설계도의 일부.\n· 실험실 출입 카드 — 과거 연구 구역 접근 카드.\n· 협박성 편지 사본 — 서도윤에게 했던 폭로 경고가 적혀 있다.","owner":12,"concerns":[12],"gm":"신우진의 초기 소지품 확인용."},{"id":"BAG09","spot":"r203_bag3","phase":2,"title":"남가온의 가방","kind":"bag","text":"침대 옆에 작은 크로스백 하나가 놓여 있다. 끈을 여러 번 묶어 고친 흔적이 있다. 이름표에 이름이 적혀 있다.","detail":"【이름표: 남가온 · 203호】\n· 실종자 사진 — 임상연구센터 직원 신분증 사진.\n· 편지 반쪽 — “밖으로 나갈 수 없다”라는 문장이 끊겨 있다.\n· 손목시계 — 실종자의 마지막 선물.","owner":17,"concerns":[17],"gm":"남가온의 초기 소지품 확인용."},{"id":"BAG10","spot":"r204_bag1","phase":2,"title":"정유리의 가방","kind":"bag","text":"침대 옆에 방수 취재 가방 하나가 놓여 있다. 앞주머니에 PRESS 패치가 붙어 있다. 이름표에 이름이 적혀 있다.","detail":"【이름표: 정유리 · 204호】\n· 휴대 녹음기 — 정전 이전 언쟁과 일부 복도 소리가 들어 있다.\n· 취재 수첩 — 익명 제보자 약속과 출입 시간 메모.\n· 마이크 메모리 카드 — 녹음 1번 파일의 별도 백업.","owner":4,"concerns":[4],"gm":"정유리의 초기 소지품 확인용."},{"id":"BAG11","spot":"r204_bag2","phase":2,"title":"한지훈의 가방","kind":"bag","text":"침대 옆에 오래된 더플백 하나가 놓여 있다. 군용처럼 투박한 더플백이다. 수하물 태그에 이름이 적혀 있다.","detail":"【수하물 태그: 한지훈 · 204】\n· 사건 조사 수첩 — 참고인 이름과 누락된 질문이 적혀 있다.\n· 과거 현장사진 — 10년 전 연구센터 복도가 찍혀 있다.\n· 손전등 — 정전 중 사용했으나 서재에는 접근하지 않았다.","owner":7,"concerns":[7],"gm":"한지훈의 초기 소지품 확인용."},{"id":"BAG12","spot":"r204_bag3","phase":2,"title":"오세린의 가방","kind":"bag","text":"침대 옆에 꽃무늬 토트백 하나가 놓여 있다. 손잡이에 노란 리본이 묶여 있다. 이름표에 이름이 적혀 있다.","detail":"【이름표: 오세린 · 204호】\n· 가족사진 — 사촌과 함께 찍은 여름 사진.\n· 손편지 — 사고 당시 유가족 모임에 보내려던 편지.\n· 신문기사 스크랩 — 사망 원인을 단정한 초기 보도들의 목록.","owner":8,"concerns":[8],"gm":"오세린의 초기 소지품 확인용."},{"id":"BAG13","spot":"r205_bag1","phase":2,"title":"임수빈의 가방","kind":"bag","text":"침대 옆에 의료 가방 하나가 놓여 있다. 적십자 표시가 바랜 의료 가방이다. 지퍼가 끝까지 잠기지 않았다. 이름표에 이름이 적혀 있다.","detail":"【이름표: 임수빈 · 205호】\n· 오래된 가족사진 — 임혜정과 함께 찍은 사진. 뒤에 2016년 날짜가 적혀 있다.\n· 어머니의 수첩 — 임상시험 이상 반응과 마지막 의료진 면담이 적혀 있다.\n· USB 메모리 — 수집해온 원본 의료 기록 일부가 저장되어 있다.\n· 파란 손수건 — 오래된 천 손수건. 한쪽 모서리 올이 풀려 실 몇 가닥이 빠져 있다.\n· 의료 가방 — 기본 응급처치 용품만 들어 있다.","owner":13,"concerns":[13],"gm":"임수빈의 가방: 파란 손수건 모서리 올이 풀려 E22 섬유와 대조 가능. 어머니 수첩·가족사진이 임혜정과의 관계 증명."},{"id":"BAG14","spot":"r205_bag2","phase":2,"title":"홍예진의 가방","kind":"bag","text":"침대 옆에 베이지 숄더백 하나가 놓여 있다. 안쪽에 지갑과 업무폰이 들어 있는 숄더백이다. 이름표에 이름이 적혀 있다.","detail":"【이름표: 홍예진 · 205호】\n· 공동거주 계약 사본 — 서도윤과 홍예진이 함께 거주해 온 주소 및 기간이 적힌 문서. 서명이 있다.\n· 낡은 커플 사진 — 서도윤과 함께 찍은 일상 사진. 관계를 대외적으로 공개하지 않았다는 사실과 대조된다.\n· 비공개 편지 — 서도윤이 “마지막 발표 뒤 네게 꼭 해야 할 말이 있다”고 남긴 편지.\n· 언론 대응 문건 — 사고 발표문과 자정 발표문 여러 버전이 있으며 삭제된 문단이 표시되어 있다.\n· 휴대전화 — 21:05 개인 메시지와 21:46 김도현 통화 실패 기록을 확인할 수 있다.","owner":15,"concerns":[15],"gm":"홍예진의 관계 증거(E24/E25)와 21:46 통화 실패 기록."},{"id":"BAG15","spot":"r205_bag3","phase":2,"title":"문하준의 가방","kind":"bag","text":"침대 옆에 하드케이스 장비 가방 하나가 놓여 있다. 케이블이 가지런히 감긴 장비 가방이다. 수하물 태그에 이름이 적혀 있다.","detail":"【수하물 태그: 문하준 · 205】\n· 휴대 PC — 복구 작업 기록과 해시값 목록.\n· 복구 USB — 삭제 영상 조각의 보존용 저장장치.\n· 네트워크 분석 메모 — 서버 시계와 카메라 시계의 차이가 적혀 있다.","owner":19,"concerns":[19],"gm":"문하준의 초기 소지품 확인용."},{"id":"BAG16","spot":"secr_file","phase":2,"title":"최민서의 가방","kind":"bag","text":"다시 살펴보니 파일함 아래 칸에 개인 가방이 숨겨져 있다. 사원증 줄에 이름이 적혀 있다. 열어 보니 개인 소지품이 들어 있다.","detail":"【사원증 줄: 비서실 최민서】\n· 수정 일정표 — 임수빈 면담 항목이 제거된 출력물.\n· 서재 출입 카드 — 공식 업무용 카드. 서비스 통로 출입 권한은 없다.\n· 암호 메모 — 비서실 일정 데이터의 백업 암호 힌트.","owner":6,"concerns":[6],"gm":"최민서의 수정 일정표 출력물(21:59)이 E23과 일치. 출입카드는 서비스 통로 권한 없음."},{"id":"BAG17","spot":"mgmt_desk","phase":2,"title":"김도현의 가방","kind":"bag","text":"다시 살펴보니 책상 밑에 공구 가방이 밀어 넣어져 있다. 가방 끈 라벨에 이름이 적혀 있다. 열어 보니 개인 소지품이 들어 있다.","detail":"【가방 끈 라벨: 시설 김도현】\n· 마스터키 — 시설 유지보수용 열쇠.\n· 보안 패널 카드 — 전력 패널 접근 권한을 증명한다.\n· 작업장갑 — 전기시설 정기 점검 때 사용하는 장갑.","owner":9,"concerns":[9],"gm":"김도현의 보안 패널 카드 = E07 FAC-01."},{"id":"BAG18","spot":"lobby_desk","phase":2,"title":"백하린의 가방","kind":"bag","text":"다시 살펴보니 데스크 서랍 안쪽에 직원용 파우치가 있다. 명찰에 이름이 적혀 있다. 열어 보니 개인 소지품이 들어 있다.","detail":"【명찰: 매니저 백하린】\n· 객실 배치표 — 17명의 배정 객실 번호가 적혀 있다.\n· 열쇠 대장 사본 — 21시 34분 열쇠 확인 서명이 있다.\n· 관리실 열쇠 — 본인 직원 출입용으로 서재 서비스문의 열쇠는 아니다.","owner":10,"concerns":[10],"gm":"백하린의 초기 소지품 확인용."},{"id":"BAG19","spot":"parking_van","phase":2,"title":"차시온의 가방","kind":"bag","text":"다시 살펴보니 차량 뒤 칸에 개인 장비 케이스가 실려 있다. 케이스 스텐실에 이름이 적혀 있다. 열어 보니 개인 소지품이 들어 있다.","detail":"【케이스 스텐실: CHA SION / 차시온】\n· 촬영 카메라 — 정전 중 로비 일부를 비춘 영상이 있다.\n· 교체 배터리 — 21시 51분 교체한 표시가 남아 있다.\n· 인터뷰 동의서 — 일부 참여자가 실명 비공개를 요청했다.","owner":16,"concerns":[16],"gm":"차시온의 초기 소지품 확인용."}],"flavor":{"acct_cab":"서류함 칸마다 연도별 라벨이 붙어 있다. 종이 냄새와 먼지만 가득하다.","secr_file":"파일함이 색깔별로 반듯하게 정리되어 있다. 너무 반듯해서 오히려 손대기가 꺼려진다.","legal_cab":"철제 보관함의 서랍이 무겁게 닫혀 있다. 대외비 도장이 찍힌 빈 폴더만 보인다.","mgmt_keybox":"열쇠 고리들이 비상등 빛에 희미하게 반짝인다. 더 볼 만한 것은 없다.","net_rack":"랙의 초록 불빛이 규칙적으로 깜빡인다. 팬 돌아가는 소리만 낮게 울린다.","garden_bench":"젖은 나무 벤치에 낙엽이 붙어 있다. 산 쪽에서 차가운 바람이 분다.","acct_desk":"계산기와 형광펜이 굴러다닌다. 커피는 이미 식어 있다.","secr_pc":"모니터 화면보호기에 백야산장 로고가 천천히 떠다닌다.","legal_table":"열람 탁자 위 독서등이 빈 자리를 비추고 있다.","mgmt_desk":"시설 점검표가 클립보드에 꽂혀 있다. 오늘 날짜 칸은 비어 있다.","dining_cupboard":"찬장 위 비상등이 웅웅거린다. 그릇들이 가지런히 쌓여 있다.","lounge_fire":"벽난로의 불씨가 거의 꺼져 간다. 장작 타는 냄새가 희미하게 남았다.","svcst1_floor":"계단 아래는 유난히 어둡고 서늘하다. 위층에서 문 삐걱이는 소리가 들린 것 같다.","dining_table":"식사가 끝난 식탁에 접시 자국과 와인 얼룩이 남아 있다.","lobby_board":"게시판에 산장 이용 안내와 비상 대피도가 붙어 있다.","lounge_table":"소파 테이블 위에 다 마신 찻잔이 놓여 있다.","pr_desk":"보도자료 양식 빈 종이가 쌓여 있다. 펜 뚜껑이 모두 닫혀 있다.","lobby_desk":"안내데스크 벨이 조용히 놓여 있다. 체크인 펜이 끈에 매달려 흔들린다.","garden_gate":"정원 출입문 너머로 칠흑 같은 숲이 보인다. 경첩이 바람에 삐걱인다.","pr_bag":"삼각대와 조명 스탠드가 가방 밖으로 삐져나와 있다. 특별한 것은 없다.","kitchen_bin":"음식물 냄새가 훅 올라온다. 저녁 식사의 잔반뿐이다.","lobby_lost":"분실물함에 장갑 한 짝과 우산 두 개가 들어 있다. 오래전 손님들의 물건이다.","parking_van":"차량 유리에 김이 서려 있다. 바깥은 눈발이 날리기 시작했다.","archive_cabinet":"낡은 캐비닛에서 쇠 냄새와 곰팡이 냄새가 난다.","study_shelf":"경영서와 상패가 빼곡하다. 책등의 먼지가 고르게 쌓여 있다.","study_safe":"묵직한 금고가 벽에 박혀 있다. 더 이상 새로운 것은 없다.","archive_desk":"열람 책상 위 스탠드가 깜빡인다. 연필 자국만 남아 있다.","archive_drawer":"서랍마다 연도 라벨이 붙어 있다. 빈 서랍이 덜컹거린다.","study_desk":"주인 잃은 책상 위에 펜과 원고 클립이 그대로 놓여 있다. 의자가 비스듬히 밀려나 있다.","waiting_table":"대기 공간 협탁 위 생수병이 반쯤 비어 있다. 서재 문 너머는 조용하다.","study_floor":"카펫이 한쪽으로 밀려 있다. 이곳에 오래 머물고 싶지 않다.","study_sidedoor":"보조문 앞 공기가 유난히 차갑다. 문은 말없이 닫혀 있다.","svc_floor":"좁은 서비스 통로에 먼지가 쌓여 있다. 손님은 다니지 않는 길이다.","r201_bag1":"가방은 이미 다 살펴보았다. 더 나올 것은 없다.","r201_bag2":"가방은 이미 다 살펴보았다. 더 나올 것은 없다.","r201_bag3":"가방은 이미 다 살펴보았다. 더 나올 것은 없다.","r202_bag1":"가방은 이미 다 살펴보았다. 더 나올 것은 없다.","r202_bag2":"가방은 이미 다 살펴보았다. 더 나올 것은 없다.","r202_bag3":"가방은 이미 다 살펴보았다. 더 나올 것은 없다.","r203_bag1":"가방은 이미 다 살펴보았다. 더 나올 것은 없다.","r203_bag2":"가방은 이미 다 살펴보았다. 더 나올 것은 없다.","r203_bag3":"가방은 이미 다 살펴보았다. 더 나올 것은 없다.","r204_bag1":"가방은 이미 다 살펴보았다. 더 나올 것은 없다.","r204_bag2":"가방은 이미 다 살펴보았다. 더 나올 것은 없다.","r204_bag3":"가방은 이미 다 살펴보았다. 더 나올 것은 없다.","r205_bag1":"가방은 이미 다 살펴보았다. 더 나올 것은 없다.","r205_bag2":"가방은 이미 다 살펴보았다. 더 나올 것은 없다.","r205_bag3":"가방은 이미 다 살펴보았다. 더 나올 것은 없다.","util_panel":"전기 패널이 낮게 웅웅거린다. 레버는 모두 '켜짐'에 올라가 있다.","sec_monitor":"모니터마다 텅 빈 복도가 흑백으로 비친다.","util_desk":"점검 책상 위에 드라이버와 절연 테이프가 흩어져 있다.","sec_recorder":"녹화 장치의 빨간 REC 불빛이 깜빡인다.","server_rack":"서버실 공기가 건조하고 차갑다. 팬 소리가 귀를 먹먹하게 한다.","server_sensor":"센서 단말에 '정상' 표시만 줄지어 떠 있다.","storage_shelf":"선반에 예비 전구와 세제 상자가 쌓여 있다.","storage_box":"상자 더미에서 오래된 장식품과 크리스마스 전구가 삐져나와 있다."},"alibis":[{"id":1,"name":"강태준","summary":"저녁 내내 지분 계약 원본에 매달렸다. 21시 10분 서재 앞에서 서도윤과 다툰 뒤 1층 회계실 쪽에서 정전을 맞았고, 22시 5분 로비에서 소식을 듣고 2층으로 올라갔다.","timeline":[{"t":"09:10","room":"offsite","place":"회사 회의실","action":"서도윤이 보낸 수정 투자계약 메일을 열어보았다. 지분 조항이 통째로 바뀌어 있었다.","saw":"","witness":"메일 열람 시간이 서버에 남는다.","say":"public","tip":"숨길 이유가 없다. 이 일로 화가 나 있었다는 것까지는 인정해도 된다."},{"t":"15:20","room":"offsite","place":"산장으로 가는 차량","action":"조은호에게 지분 계약의 원본을 가져오라고 연락했다.","saw":"","witness":"조은호(14)의 통화 기록.","say":"public","tip":"'원본 대조용'이라고만 말하라."},{"t":"18:40","room":"parking","place":"주차장 · 산장 입구","action":"산장에 도착해 서류가방을 직접 들고 내렸다. 가방 안주머니에는 예전에 받은 서재 도면 사본이 접혀 있었다.","saw":"장비 차량 옆에서 카메라를 정리하던 차시온(16)과 정유리(04)","witness":"차시온(16)·정유리(04)가 도착 장면을 봤다.","say":"public","tip":"도착 시각은 말해도 된다. 도면 사본은 먼저 꺼내지 마라."},{"t":"19:02","room":"lobby","place":"로비","action":"체크인하면서 최민서가 전달한 봉투를 받았다. 안에는 '21:10, 서재 앞'이라고만 적힌 메모가 있었다.","saw":"최민서(06)","witness":"최민서(06)가 봉투 전달을 알고 있다.","say":"public","tip":"메모 내용까지 말해도 된다. 서도윤이 먼저 만나자고 한 것이라는 점을 강조하라."},{"t":"19:35","room":"dining","place":"식당","action":"서도윤 맞은편 자리에서 식사했다. 와인을 두 잔 마셨다.","saw":"윤서아(02), 조은호(14)","witness":"윤서아와 조은호가 같은 테이블에 있었다.","say":"public","tip":"식사 자리 배치를 정확히 말하면 신뢰를 얻는다."},{"t":"20:00","room":"dining","place":"식당","action":"서도윤의 폭로 선언에 처음으로 반박했다. '증거도 없이 회사를 무너뜨릴 셈이냐'고 언성을 높였다.","saw":"서도윤, 대부분의 참석자","witness":"대부분의 참석자가 기억한다.","say":"public","tip":"부정하지 마라. 모두가 봤다. 대신 '경영자로서 당연한 반발'이라고 설명하라."},{"t":"20:20","room":"lounge","place":"라운지","action":"라운지 구석에서 조은호와 낮은 목소리로 계약 원본 이야기를 했다. 조은호는 곧 서도윤에게 가서 보증금 이야기를 꺼냈다.","saw":"조은호(14)","witness":"조은호(14)","say":"public","tip":"'투자자와 업무 이야기'라고 하면 된다."},{"t":"20:42","room":"hall1","place":"1층 복도 회계실 앞","action":"김도현에게서 '21:40, 약속대로'라는 짧은 확인 메시지를 받고 바로 지웠다. 서류를 찾을 시간을 벌기 위해 미리 부탁해 둔 정전이었다.","saw":"","witness":"김도현(09) 쪽에 발신 흔적이 남는다.","say":"secret","tip":"정전 이야기가 나오면 '리모델링 투자 때문에 설비 일정을 물은 적은 있다'고만 하라. 들키면 '서류를 찾을 시간이 필요했을 뿐, 사람을 해칠 생각은 없었다'고 인정하라."},{"t":"20:44","room":"acct","place":"회계실","action":"윤서아와 프로젝트 정산 자료를 두고 실랑이했다. 이중 지급 항목을 묻는 말에 '네가 회계사면 알아서 맞춰'라고 쏘아붙였다.","saw":"윤서아(02)","witness":"윤서아가 당시의 대화를 기억한다.","say":"public","tip":"말다툼은 인정하라. 금액 이야기는 피하라."},{"t":"21:00","room":"lobby","place":"로비 계단 앞","action":"메모 시간에 맞추려고 로비 계단 앞에서 손목시계를 두 번 확인한 뒤 2층으로 올라갔다.","saw":"안내데스크의 백하린(10)","witness":"백하린(10)이 데스크에서 봤을 수 있다.","say":"public","tip":"그대로 말하면 된다."},{"t":"21:05","room":"waiting","place":"서재 앞 대기 공간","action":"대기 공간 소파에 앉아 서도윤을 기다렸다. 최민서가 협탁에서 면담 순서표를 정리하고 있었다.","saw":"최민서(06)","witness":"최민서(06)","say":"public","tip":"최민서가 증인이다. 언제부터 기다렸는지 물으면 21시 5분이라고 하라."},{"t":"21:10","room":"waiting","place":"2층 서재 앞","action":"서재에서 나온 서도윤에게 지분 계약을 돌려달라고 언쟁했다. 목소리가 복도까지 울렸다.","saw":"서도윤, 최민서(06), 복도에서 녹음기를 든 정유리(04)는 보지 못했다","witness":"정유리와 최민서가 목소리를 들었다.","say":"public","tip":"가장 먼저 의심받는 장면이다. 숨기지 말고 '계약 문제로 싸웠을 뿐'이라고 선을 그어라."},{"t":"21:13","room":"waiting","place":"2층 서재 앞","action":"서도윤이 '오늘 밤 자료가 공개되면 너도 끝이야'라고 말하고 서재 문을 닫았다. 문을 한 번 세게 두드렸지만 열리지 않았다.","saw":"최민서(06)가 '그만하시라'고 말렸다.","witness":"최민서(06)","say":"careful","tip":"그 말은 서도윤이 당신에게 한 협박이다. 당신이 위협한 게 아니라는 점을 분명히 하라."},{"t":"21:15","room":"stair2","place":"2층 계단홀 벤치","action":"계단홀 벤치에 앉아 서류가방에서 서재 도면 사본을 꺼냈다. 금고와 보조문 위치를 손가락으로 짚어 보았다.","saw":"","witness":"정유리(04)가 21시 18분 계단을 내려가며 당신을 지나쳤다.","say":"secret","tip":"도면을 들킨다면 '리모델링 투자 검토 때 받은 사본, 금고에 든 계약서 원본 위치를 본 것'이라고 하라. 보조문은 '그런 게 있는 줄도 몰랐다'고 하지 말고 '봤지만 관심 없었다'고 하라."},{"t":"21:18","room":"stair2","place":"2층 계단홀 벤치","action":"서재 앞에서 홍예진과 서도윤의 언성이 들렸다. '언제까지 숨길 거야'라는 한마디만 또렷했다. 정유리가 급히 계단을 뛰어 내려갔다.","saw":"홍예진(15)의 목소리, 정유리(04)","witness":"정유리(04)","say":"public","tip":"홍예진의 언쟁 내용은 그 한마디 말고는 모른다고 하라."},{"t":"21:21","room":"stair2","place":"2층 계단홀","action":"홍예진이 눈가를 훔치며 계단을 내려갔다. 말을 걸지 않았다.","saw":"홍예진(15)","witness":"홍예진(15)","say":"public","tip":"본 그대로 말하라."},{"t":"21:22","room":"waiting","place":"2층 서재 앞","action":"다시 대기 공간으로 가 서재 문을 두드렸다. 막 올라온 최민서가 '다음 면담이 잡혀 있다'며 막았다.","saw":"최민서(06)","witness":"최민서(06)","say":"public","tip":"'다음 면담자가 누구냐'고 물었지만 대답을 못 들었다고 하라."},{"t":"21:23","room":"hall2","place":"2층 객실 복도","action":"대기 공간을 나오다 복도에 서 있던 임수빈과 스쳤다. 빈손이었고 한 손을 주머니에 넣고 있었다. 서로 목례만 했다.","saw":"임수빈(13)","witness":"임수빈(13)","say":"public","tip":"중요한 증언이다. '21시 23분, 대기 공간 바로 앞'이라고 정확히 말하라."},{"t":"21:24","room":"stair2","place":"2층 계단","action":"서재를 떠나 1층으로 내려왔다. 계단에서 이재혁과 서지안이 서류 이야기를 하고 있었다.","saw":"이재혁(05), 서지안(11)","witness":"이재혁이 계단에서 당신을 보았다.","say":"public","tip":"이재혁과 서지안이 증인이다."},{"t":"21:27","room":"lobby","place":"로비 안내 게시판 앞","action":"로비 게시판 앞에서 시간을 보냈다. 회계실에 윤서아가 있는지 신경 쓰였다.","saw":"안내데스크의 백하린(10), 소파의 서지안(11)","witness":"백하린(10)이 봤을 수 있다.","say":"careful","tip":"'바람 쐬러 내려왔다'고 하라."},{"t":"21:30","room":"hall1","place":"1층 복도 회계실 쪽","action":"윤서아가 회계실에서 나와 식당 쪽으로 가는 것을 확인하고 회계실로 들어갔다.","saw":"윤서아(02) (상대는 모름)","witness":"독립 목격 없음.","say":"secret","tip":"이 시각은 '로비에 있었다'고 버텨라. 백하린의 안내 방송(21:30)을 들었냐고 물으면 '얼핏 들었다'고 하라."},{"t":"21:31","room":"acct","place":"회계실","action":"서류함 앞에서 투자 계약서 원본 폴더 번호를 찾아 만년필로 손바닥 메모지에 적었다.","saw":"","witness":"독립 목격 없음.","say":"secret","tip":"들키면 '내 회사 계약서를 확인한 것'이라고 하라. 훔쳤다는 단어는 쓰지 마라."},{"t":"21:33","room":"hall1","place":"회계실 복도","action":"투자 계약서가 든 문서함을 확인하고 만년필 뚜껑을 닫는 순간 복도 발소리가 들려 로비 쪽으로 걸어 나갔다.","saw":"돌아오던 윤서아(02)","witness":"윤서아가 복도에서 펜 소리를 들었다.","say":"careful","tip":"'정산 자료를 다시 보러 갔다가 아무도 없어 나왔다'고 하라."},{"t":"21:35","room":"lobby","place":"로비","action":"로비로 나왔다. 김도현이 관리실 쪽에서 나와 지하 계단으로 내려가는 것을 봤다.","saw":"김도현(09)","witness":"김도현(09)","say":"careful","tip":"김도현을 본 것은 말해도 된다. 왜 그를 눈여겨봤는지는 말하지 마라."},{"t":"21:37","room":"lobby","place":"로비 안내 게시판 앞","action":"시계를 보며 기다렸다. 한지훈이 정원 쪽 복도에서 로비로 들어와 게시판 앞을 지나갔다.","saw":"한지훈(07)","witness":"한지훈(07)","say":"careful","tip":"'그냥 서 있었다'고 하라. 한지훈이 증인이다."},{"t":"21:39","room":"acct","place":"회계실","action":"'정산 얘기를 마저 하자'며 회계실로 다시 들어갔다. 윤서아는 대꾸하지 않고 노트북만 봤다.","saw":"윤서아(02)","witness":"윤서아(02)","say":"careful","tip":"윤서아와 같이 있었다는 사실이 당신의 알리바이다. 들어간 이유는 '정산 이야기'로 통일하라."},{"t":"21:40","room":"acct","place":"1층 회계실","action":"정전 때 휴대전화 불빛으로 책상 아래 서류를 확인했다. 어둠 속에서 윤서아가 '누구야!' 하고 외쳤고 '나야, 강태준'이라고 답했다.","saw":"윤서아(02)","witness":"윤서아의 휴대전화 통화기록이 근처 위치를 뒷받침한다.","say":"public","tip":"정전 순간 1층 회계실에 있었다는 것이 가장 강한 알리바이다. 자신 있게 말하라."},{"t":"21:41","room":"acct","place":"회계실","action":"윤서아가 휴대전화로 관리실에 전화를 걸며 식당 쪽 비상등을 찾아 나갔다. 혼자 남았다.","saw":"윤서아(02)","witness":"윤서아(02)가 나갈 때까지 당신이 방에 있었다는 것은 안다.","say":"careful","tip":"'따라 나가려다 서류가 쏟아져 주워 담았다'고 하라."},{"t":"21:43","room":"acct","place":"회계실","action":"휴대전화 불빛으로 서류함 맨 아래 칸에서 투자 계약서 원본 폴더를 찾아 상의 안쪽에 넣었다.","saw":"","witness":"독립 목격 없음.","say":"secret","tip":"끝까지 숨기려면 '떨어진 서류를 정리했다'고만 하라. 폴더가 발견되면 '내 회사 계약서를 지키려 했다, 반환하겠다'고 하라."},{"t":"21:45","room":"acct","place":"회계실","action":"복도에서 누군가 정원 쪽으로 뛰어가는 소리가 나서 불빛을 끄고 숨을 죽였다.","saw":"1층 복도의 발소리(누구인지 모름)","witness":"","say":"careful","tip":"발소리는 '동쪽, 정원 방향'이었다고 말하면 다른 사람 동선 확인에 도움이 된다."},{"t":"21:47","room":"acct","place":"회계실","action":"폴더를 상의 안에 넣은 채 서류함을 닫았다. 손바닥에 땀이 차서 휴대전화를 두 번 떨어뜨렸다.","saw":"","witness":"","say":"secret","tip":"'정전이 무서워 그냥 앉아 있었다'고 해도 된다."},{"t":"21:48","room":"hall1","place":"1층 복도","action":"회계실을 나와 식당 쪽 복도로 걸었다. 비상등 불빛만 바닥에 깔려 있었다.","saw":"","witness":"","say":"careful","tip":"'윤서아를 찾으러 식당 쪽으로 갔다'고 하라."},{"t":"21:49","room":"hall1","place":"식당 방향 복도","action":"조은호와 마주쳐 자금 문제를 더 이야기하지 않겠다고 말했다. 조은호가 지분 반환을 다시 요구했다.","saw":"조은호(14)","witness":"조은호가 목격했다.","say":"public","tip":"조은호가 증인이다. 숨이 차 있지 않았다는 점을 그가 말해 줄 것이다."},{"t":"21:51","room":"acct","place":"회계실","action":"조은호와 헤어진 뒤 회계실로 돌아가 폴더를 서류함에 다시 넣을지 망설였다.","saw":"","witness":"","say":"secret","tip":"'노트북을 두고 온 윤서아 대신 문을 닫아 주러 갔다'고 하라."},{"t":"21:52","room":"acct","place":"회계실","action":"전기가 들어왔다. 폴더를 그대로 품에 넣고 회계실 불을 끈 채 나왔다.","saw":"","witness":"","say":"secret","tip":"전기가 들어온 시각은 21시 52분으로 확실하다고 말하라."},{"t":"21:54","room":"lobby","place":"로비","action":"로비 소파에 앉았다. 윤서아가 문하준에게 서버 기록을 묻는 소리를 들었다.","saw":"윤서아(02), 문하준(19)","witness":"윤서아(02)","say":"public","tip":"두 사람의 대화를 들었다고 말하면 위치가 확인된다."},{"t":"21:57","room":"lobby","place":"로비","action":"홍예진이 임시 공지문을 백하린에게 건넸다. 22시에 로비 집합이라는 말이 돌았다.","saw":"홍예진(15), 백하린(10)","witness":"","say":"public","tip":"그대로 말하라."},{"t":"22:00","room":"lobby","place":"로비","action":"백하린의 안내로 사람들이 로비에 모였다. 상의 안 폴더가 신경 쓰여 팔짱을 끼고 있었다.","saw":"백하린(10), 홍예진(15)","witness":"여러 사람","say":"public","tip":"그대로 말하라."},{"t":"22:05","room":"lobby","place":"로비","action":"서재에서 누군가 죽었다는 말을 듣고 2층으로 올라갔다.","saw":"한지훈(07), 윤서아(02)","witness":"한지훈이 당신의 반응을 보았다.","say":"public","tip":"놀란 반응은 진짜였다. 왜 바로 올라갔는지 물으면 '서도윤이 계약서를 갖고 있었으니까'라고 솔직히 말하라."},{"t":"22:08","room":"hall2","place":"2층 객실 복도","action":"한지훈이 대기 공간 입구를 막고 '아무도 들어오지 말라'고 했다. 문틈으로 서재 바닥에 쓰러진 서도윤의 발끝만 보였다.","saw":"한지훈(07), 백하린(10), 최민서(06), 홍예진(15)","witness":"한지훈(07)","say":"public","tip":"현장에 들어가지 않았다는 것을 분명히 하라."},{"t":"22:12","room":"hall2","place":"2층 객실 복도 서쪽","action":"복도 벽에 기대 서 있었다. 복도 서쪽 끝에서 최민서와 임수빈이 붙어 서서 짧게 이야기하는 것을 봤다. 내용은 들리지 않았다.","saw":"최민서(06), 임수빈(13)","witness":"","say":"careful","tip":"이 장면을 언제 꺼낼지는 전략이다. 두 사람이 무슨 사이인지 물어보는 데 써라."},{"t":"22:15","room":"lobby","place":"로비","action":"한지훈의 요청으로 1층으로 내려와 대기했다. 상의 안 폴더를 어떻게 할지 고민했다.","saw":"조은호(14)","witness":"조은호(14)","say":"careful","tip":"'지시에 따라 로비에서 대기했다'고 하라."},{"t":"22:20","room":"lobby","place":"로비","action":"로비 소파에서 조은호 옆에 앉아 말없이 시계를 봤다.","saw":"조은호(14)","witness":"조은호(14)","say":"public","tip":"그대로 말하라."}],"questions":["윤서아(02)에게: 21시 40분 정전 직후 회계실에서 휴대전화 불빛을 비춘 사람이 나였다는 걸 확인해 줄 수 있나? 몇 시에 회계실을 나갔나?","이재혁(05)·서지안(11)에게: 21시 23~24분 2층 계단에 있을 때 나 말고 위로 올라간 사람은 누구였나? 그 사람은 무엇을 들고 있었나?","최민서(06)에게: 21시 22분에 '다음 면담이 잡혀 있다'고 나를 막았는데, 그 다음 면담자는 누구였나? 일정표를 보여줄 수 있나?"]},{"id":2,"name":"윤서아","summary":"저녁 대부분을 1층 회계실에서 장부 검증으로 보냈다. 정전 순간 회계실에 강태준과 함께 있었고, 식당 비상등 아래에서 조은호·배수아를 만난 뒤 주방에서 양초를 찾았다.","timeline":[{"t":"10:00","room":"offsite","place":"외부 감사 사무실","action":"2016년 회계원장에 표시된 누락 계정을 다시 확인했다.","saw":"","witness":"컴퓨터 ite","place":"산장 도착 전 휴게소","action":"차시온과 연락해 촬영 장비를 확인했다.","saw":"","witness":"차시온(16)과 통화 기록이 있다.","say":"public","tip":"그대로 말하라."},{"t":"18:40","room":"parking","place":"주차장 · 산장 입구","action":"차시온과 장비 차량에서 녹음기와 카메라를 내렸다. 강태준이 서류가방을 들고 지나갔다.","saw":"차시온(16), 강태준(01)","witness":"차시온(16)","say":"public","tip":"그대로 말하라."},{"t":"19:00","room":"lobby","place":"로비","action":"체크인하고 녹음기 시간을 산장 시계에 맞췄다.","saw":"","witness":"","say":"public","tip":"그대로 말하라."},{"t":"19:16","room":"lobby","place":"로비","action":"차시온의 카메라 앞에서 취재 목적을 설명했다.","saw":"차시온(16)","witness":"차시온이 촬영했다.","say":"public","tip":"그대로 말하라."},{"t":"19:30","room":"dining","place":"식당","action":"서도윤의 발표를 녹음했다.","saw":"서도윤","witness":"다른 참석자가 녹음기 사용을 봤다.","say":"public","tip":"녹음 파일이 증거다."},{"t":"20:00","room":"dining","place":"식당","action":"자정 공개 선언과 강태준의 반박을 녹음했다.","saw":"강태준(01)","witness":"녹음 파일","say":"public","tip":"녹음 파일을 들려줄 수 있다고 하라."},{"t":"20:26","room":"lounge","place":"라운지","action":"홍예진에게 브리핑 원본을 요청했지만 거절당했다.","saw":"홍예진(15)","witness":"홍예진이 대화했다.","say":"public","tip":"그대로 말하라."},{"t":"20:50","room":"lobby","place":"로비","action":"차시온과 오늘 찍은 영상 목록을 맞춰 봤다.","saw":"차시온(16)","witness":"차시온(16)","say":"public","tip":"그대로 말하라."},{"t":"21:00","room":"lobby","place":"로비","action":"차시온이 2층 계단홀에 고정 카메라를 달고 내려오기를 기다렸다.","saw":"","witness":"","say":"public","tip":"그대로 말하라."},{"t":"21:05","room":"lobby","place":"로비","action":"녹음기 배터리를 새로 끼우고 2층으로 올라갈 준비를 했다.","saw":"차시온(16)","witness":"차시온(16)","say":"public","tip":"그대로 말하라."},{"t":"21:08","room":"stair2","place":"2층 계단홀","action":"계단을 올라갔다. 계단홀 난간에 작은 고정 카메라가 붙어 있었다.","saw":"","witness":"","say":"public","tip":"카메라 위치를 기억해 두면 좋다."},{"t":"21:10","room":"hall2","place":"2층 복도","action":"강태준과 서도윤의 다툼을 녹음했다. 대기 공간 입구 옆 벽에 붙어 서 있었다.","saw":"강태준(01), 서도윤, 최민서(06)","witness":"강태준은 당신을 못 보았을 수 있다.","say":"public","tip":"녹음 파일이 증거다. '너도 끝이야'라는 서도윤의 말이 담겨 있다."},{"t":"21:13","room":"hall2","place":"2층 복도","action":"서도윤이 '오늘 밤 자료가 공개되면 너도 끝이야'라고 말하고 서재 문을 닫는 소리까지 녹음했다."," 도로 간 사람이 당신인가? 그때 계단을 올라간 다른 사람을 봤나?","백하린(10)에게: 21시 45분 손전등을 들고 계단을 올라갈 때 계단 아래 비상등 옆에 서 있던 나를 봤나?","최민서(06)에게: 21시 58분 비서실 PC 앞에서 무엇을 하고 있었나? 그때 얼굴이 굳어 있었는데."]},{"id":6,"name":"최민서","summary":"서도윤의 비서로 1층 비서실과 2층 서재 앞을 오가며 면담 일정을 관리했다. 정전 때는 비서실에 있었다고 말하지만, 실제로는 21시 44분부터 21시 49분까지 2층에 다녀왔다.","timeline":[{"t":"08:10","room":"secr","place":"비서실","action":"피해자 자정 발표 예정 시간표를 확인했다.","saw":"","witness":"일정 서버 편집 로그가 남는다.","say":"public","tip":"그대로 말하라."},{"t":"17:25","room":"lobby","place":"산장 안내데스크","action":"백하린에게 객실 배정 명단을 전달했다. 백하린이 보조 통로 사용 주의사항을 알려 주었다.","saw":"백하린(10)","witness":"백하린이 명단을 받았다.","say":"public","tip":"보조 통로 이야기는 먼저 꺼내지 마라."},{"t":"18:30","room":"secr","place":"비서실","action":"비서실 PC로 면담 순서표 초안을 뽑았다. 21시대 칸이 비어 있었다.","saw":"","witness":"PC 출력 기록","say":"public","tip":"그대로 말하라."},{"t":"19:02","room":"lobby","place":"로비","action":"강태준에게 서도윤의 지시 봉투를 전달했다.","saw":"강태준(01)","witness":"강태준이 기억한다.","say":"public","tip":"봉투 내용은 모른다고 해도 된다."},{"t":"19:24","room":"lobby","place":"로비","action":"백하린의 객실 배정표를 확인해 주었다.","saw":"백하린(10)","witness":"백하린(10)","say":"public","tip":"그대로 말하라."},{"t":"19:48","room":"dining","place":"식당","action":"서도윤에게 발표 자료의 마지막 페이지를 전달했다.","saw":"서도윤, 홍예진(15)","witness":"홍예진이 곁에 있었다.","say":"public","tip":"그대로 말하라."},{"t":"20:00","room":"dining","place":"식당","action":"서도윤의 선언을 식당 뒤편에서 지켜봤다.","saw":"서도윤","witness":"대부분의 참석자","say":"public","tip":"그대로 말하라."},{"t":"20:20","room":"secr","place":"비서실","action":"비서실로 돌아와 서도윤의 비공개 면담 요청 메일을 정리했다.","saw":"","witness":"메일 기록","say":"public","tip":"그대로 말하라."},{"t":"20:40","room":"secr","place":"비서실","action":"모든 비공개 면담을 개인 일정표에 추가했다.","saw":"","witness":"PC 원본 수정 시간이 남는다.","say":"public","tip":"'면담 일정 정리'라고만 하라."},{"t":"21:00","room":"secr","place":"비서실","action":"면담 순서표를 출력해 들고 2층으로 올라갈 준비를 했다.","saw":"","witness":"PC 출력 기록","say":"public","tip":"그대로 말하라."},{"t":"21:05","room":"waiting","place":"서재 앞 대기 공간","action":"대기 공간 협탁에서 순서표를 정리했다. 강태준이 소파에 앉아 있었다.","saw":"강태준(01)","witness":"강태준(01)","say":"public","tip":"그대로 말하라."},{"t":"21:10","room":"waiting","place":"서재 앞 대기 공간","action":"강태준과 서도윤의 언쟁을 바로 옆에서 들었다.","saw":"강태준(01), 서도윤","witness":"정유리(04)도 복도에서 들었다.","say":"public","tip":"언쟁 내용은 말해도 된다."},{"t":"21:13","room":"waiting","place":"서재 앞 대기 공간","action":"서도윤이 '너도 끝이야'라고 말하고 문을 닫았다. 문을 두드리는 강태준에게 '그만하시라'고 말렸다.","saw":"강태준(01)","witness":"강태준(01)","say":"public","tip":"그대로 말하라. 서도윤의 협박이었다는 점을 증언할 수 있다."},{"t":"21:14","room":"stair2","place":"2층 계단홀","action":"순서표를 다시 출력하러 1층으로 내려갔다. 계단홀 벤치에 강태준이 앉는 것을 봤다.","saw":"강태준(01)","witness":"","say":"public","tip":"그대로 말하라."},{"t":"21:16","room":"secr","place":"비서실","action":"순서표를 수정해 출력했다. '21:25 임수빈 비공개 면담' 줄이 들어 있었다.","saw":"","witness":"PC 출력 기록","say":"secret","tip":"순서표 내용은 '면담 순서'라고만 하라. 이름은 말하지 마라."},{"t":"21:20","room":"secr","place":"비서실","action":"출력물을 클립으로 묶고 2층으로 향했다.","saw":"","witness":"","say":"public","tip":"그대로 말하라."},{"t":"21:22","room":"stair2","place":"2층 계단","action":"계단에서 이재혁과 서지안이 서류 이야기를 하는 옆을 지나 대기 공간으로 갔다.","saw":"이재혁(05), 서지안(11)","witness":"이재혁(05)","say":"public","tip":"그대로 말하라."},{"t":"21:23","room":"waiting","place":"서재 앞 대기 공간","action":"강태준이 다시 서재 문을 두드려 '다음 면담이 잡혀 있다'고 막았다. 강태준이 나갔다.","saw":"강태준(01)","witness":"강태준(01)","say":"public","tip":"다음 면담자가 누구였는지는 말하지 마라."},{"t":"21:25","room":"waiting","place":"서재 앞","action":"임수빈이 서재 안으로 들어가는 것을 확인했다. 임수빈의 손에 파란 손수건이 쥐여 있었다.","saw":"임수빈(13), 서도윤","witness":"임수빈도 면담 사실을 안다.","say":"secret","tip":"'21:25에는 대기 공간에서 일정 정리만 했다'고 하라. 면담자를 물으면 '서도윤 대표가 직접 잡은 일정이라 모른다'고 하라."},{"t":"21:27","room":"waiting","place":"서재 앞 대기 공간","action":"조은호가 올라와 면담을 요청했다. '지금은 면담 중이니 기다리시라'고 하고 1층으로 내려갔다.","saw":"조은호(14)","witness":"조은호(14)","say":"careful","tip":"'면담 중'이라고 말한 사실은 조은호가 기억한다. 누구와의 면담이었는지는 모른다고 하라."},{"t":"21:29","room":"secr","place":"비서실","action":"서도윤에게 마지막 일정 확인 전화를 걸었다. '끝나면 내가 부를게'라는 짧은 답을 들었다.","saw":"서도윤","witness":"전화기 통화 기록이 남는다.","say":"public","tip":"통화 기록이 있다. 서도윤의 대답까지 말해도 된다."},{"t":"21:33","room":"secr","place":"비서실","action": )","witness":"다른 사람은 얼굴을 보지 못했다.","say":"secret","tip":"절대 먼저 말하지 마라. 서비스 통로 쪽 소리를 들은 사람이 있다(백하린, 정유리). '나는 그때 1층에 있었다'고 버텨라."},{"t":"21:48","room":"stair2","place":"2층 계단홀","action":"서쪽 끝에서 손전등 불빛이 다가와 서둘러 계단을 내려갔다.","saw":"백하린(10)의 손전등 (상대는 모름)","witness":"","say":"secret","tip":"이 시각은 말하지 마라."},{"t":"21:49","room":"lobby","place":"로비 계단 아래","action":"계단 중간에서 카메라를 든 누군가가 올라오며 어깨가 스쳤다. 계단 아래 비상등 옆에 오세린이 서 있어 고개를 숙이고 지나쳤다.","saw":"차시온(16), 오세린(08)","witness":"오세린(08)이 '서지안'을 봤다고 말할 수 있다.","say":"secret","tip":"오세린이 본 사람이 서지안이라고 믿게 두어라. 당신은 밝은 회색 카디건을 입고 있었다."},{"t":"21:50","room":"hall1","place":"1층 복도","action":"1층 복도를 빠르게 걸어 비서실로 향했다. 반대편에서 누군가 가방을 안고 뛰어왔다.","saw":"배수아(18) (얼굴 모름)","witness":"","say":"secret","tip":"말하지 마라."},{"t":"21:51","room":"secr","place":"비서실","action":"비서실 의자에 주저앉았다. 손이 떨려 휴대폰을 두 번 떨어뜨렸다.","saw":"","witness":"","say":"secret","tip":"'21:42부터 계속 비서실에 있었다'고 하라."},{"t":"21:52","room":"secr","place":"비서실","action":"전기가 들어왔다. PC가 재부팅되기 시작했다.","saw":"","witness":"PC 부팅 기록","say":"public","tip":"PC 부팅 기록은 당신이 비서실에 있었다는 증거다."},{"t":"21:55","room":"secr","place":"비서실","action":"PC가 켜졌다. 일정표 원본 파일을 열었다.","saw":"","witness":"PC 기록","say":"careful","tip":"'정전 후 일정 점검'이라고 하라."},{"t":"21:58","room":"secr","place":"비서실","action":"임수빈과 관련된 면담 항목을 원본 일정표에서 지웠다.","saw":"","witness":"E06 복원본이 이를 드러낸다.","say":"secret","tip":"끝까지 부인하거나, 복원본이 나오면 '대표님이 비공개를 원했던 면담이라 지웠다'고 하라."},{"t":"22:01","room":"lobby","place":"로비","action":"안내 방송을 듣고 로비로 나갔다. 백하린이 자정 발표 준비 때문에 서도윤을 같이 부르러 가자고 했다.","saw":"백하린(10)","witness":"백하린(10)","say":"public","tip":"그대로 말하라."},{"t":"22:02","room":"stair2","place":"2층 계단홀","action":"백하린과 함께 2층으로 올라갔다.","saw":"백하린(10)","witness":"백하린(10)","say":"public","tip":"그대로 말하라."},{"t":"22:04","room":"waiting","place":"서재 앞 대기 공간","action":"서재 문을 두드렸지만 대답이 없었다. 문은 안에서 잠겨 있었다. 백하린이 마스터키를 꺼냈다.","saw":"백하린(10)","witness":"백하린(10)","say":"public","tip":"문이 잠겨 있었다는 사실을 강조하라."},{"t":"22:05","room":"waiting","place":"서재 앞","action":"백하린과 함께 문을 열고 사망 사실을 알 w":"오세린(08)","witness":"오세린(08)","say":"public","tip":"그대로 말하라."},{"t":"21:27","room":"lounge","place":"라운지 벽난로 앞","action":"벽난로 앞에서 수첩에 오세린의 진술을 옮겨 적었다. 소파 위에 의료 가방만 놓여 있고 주인은 보이지 않았다. 배수아가 봉투를 다루고 있었다.","saw":"배수아(18)","witness":"배수아(18)","say":"public","tip":"주인 없는 의료 가방을 본 시각(21:27)을 기억하라."},{"t":"21:31","room":"lounge","place":"라운지","action":"조은호와 홍예진이 들어와 발표 이후 회사 반응을 이야기했다.","saw":"조은호(14), 홍예진(15)","witness":"조은호(14)","say":"public","tip":"그대로 말하라."},{"t":"21:33","room":"hall1","place":"정원 출입문","action":"복도에서 바람이 들어와 문을 닫았다. 관리실로 가던 백하린과 복도에서 마주쳤다.","saw":"백하린(10)","witness":"백하린이 복도에서 지나쳤다.","say":"public","tip":"그대로 말하라."},{"t":"21:35","room":"lobby","place":"로비","action":"로비로 갔다. 서지안과 신우진이 앞뒤로 계단을 올라갔다.","saw":"서지안(11), 신우진(12)","witness":"","say":"public","tip":"그대로 말하라."},{"t":"21:37","room":"lobby","place":"로비 안내 게시판 앞","action":"게시판의 비상등 위치도를 확인했다. 강태준이 게시판 옆에 서서 시계를 보고 있었다.","saw":"강태준(01)","witness":"강태준(01)","say":"public","tip":"강태준이 시계를 자꾸 봤다는 점을 기억하라."},{"t":"21:39","room":"lobby","place":"로비","action":"강태준이 1층 복도 쪽으로 걸어 나갔다. 홍예진이 라운지에서 나와 계단을 올라갔다.","saw":"강태준(01), 홍예진(15)","witness":"","say":"public","tip":"그대로 말하라."},{"t":"21:40","room":"lobby","place":"로비","action":"정전 직후 비상등 아래 인원을 확인했다. 로비에는 차시온과 나뿐이었고, 곧 지하 계단에서 문하준이 휴대전화 불빛을 들고 올라왔다.","saw":"차시온(16), 문하준(19)","witness":"차시온의 카메라가 일부 남아 있다.","say":"public","tip":"정전 직후 로비 인원 확인은 강력한 증언이다."},{"t":"21:42","room":"lobby","place":"로비","action":"이재혁이 1층 복도에서 나와 계단 아래 비상등 옆에 섰다.","saw":"이재혁(05)","witness":"","say":"public","tip":"그대로 말하라."},{"t":"21:44","room":"lobby","place":"로비","action":"계단에서 두 사람이 엇갈렸다. 하나는 뛰어 내려와 1층 복도로, 하나는 구두 소리를 내며 올라갔다. 얼굴은 보지 못했다.","saw":"실루엣 두 개(얼굴 모름), 이재혁(05)","witness":"차시온(16)","say":"public","tip":"'내려간 사람, 올라간 사람'을 구분해 말하라. 이 둘이 누구인지 찾는 것이 수사의 핵심이 될 수 있다."},{"t":"21:45","room":"lobby","place":"로비","action":"차시온과 카메라에 찍힌 복도 방향을 확인했다. 관리실 쪽에서 손전등을 든 백하린이 와서 계단을 올라갔다.","saw":"차시온(16), 백하린(10)","witness":"차시온이 기억한다.","say":"public","tip":"백하린이 올라간 시각(21:45)을 기억하라."},{"t":"21:47","room":"lobby","place":"로비","action":"문하준이 휴대전화로 네트워크 상태를 확인하다 신호가 없다고 투덜댔다.","saw":"문하준(19), 차시온(16)","witness":"문하준(19)","say":"public","tip":"그대로 말하라."},{"t":"21:49","room":"lobby","place":"로비","action":"계단에서 누군가 내려와 고개를 숙이고 1층 복도 쪽으로 빠르게 사라졌다. 같은 때 라운지에서 오세린이 계단 아래로 왔다.","saw":"실루엣(얼굴 모름), 오세린(08)","witness":"오세린(08)","say":"public","tip":"내려온 사람이 1층 복도 쪽으로 갔다는 사실이 중요하다. 객실로 간 게 아니다."},{"t":"21:50","room":"lobby","place":"1층 계단","action":"배수아가 문서가방을 안고 지나가는 것을 봤다. 계단을 두리번거리다 관리실 쪽 복도로 갔다.","saw":"배수아(18), 오세린(08)","witness":"배수아도 계단을 지난 사실은 안다.","say":"public","tip":"그대로 말하라."},{"t":"21:51","room":"lobby","place":"로비","action":"박현우가 계단을 내려왔고, 차시온이 계단 아래쪽에서 배터리를 갈고 있었다.","saw":"박현우(03), 차시온(16)","witness":"","say":"public","tip":"그대로 말하라."},{"t":"21:52","room":"lobby","place":"로비","action":"전기가 들어왔다. 시계를 21시 52분으로 확인했다.","saw":"오세린(08), 박현우(03)","witness":"","say":"public","tip":"복구 시각을 확실히 말하라."},{"t":"21:54","room":"lobby","place":"로비","action":"윤서아가 문하준에게 서버 기록을 묻는 것을 들었다. 박현우가 게시판 앞에서 봉투를 정리했다.","saw":"윤서아(02), 문하준(19), 박현우(03)","witness":"","say":"public","tip":"그대로 말하라."},{"t":"21:57","room":"lobby","place":"로비","action":"홍예진이 임시 공지를 들고 와 백하린에게 건넸다.","saw":"홍예진(15), 백하린(10)","witness":"","say":"public","tip":"그대로 말하라."},{"t":"22:00","room":"lobby","place":"로비","action":"백하린의 안내로 사람들이 로비에 모였다. 머릿수를 셌다.","saw":"백하린(10)","witness":"여러 사람","say":"public","tip":"22:00 로비 인원 확인 결과를 말해도 된다."},{"t":"22:05","room":"lobby","place":"로비","action":"발견 소식을 듣고 위층으로 향했다. 오세린이 이름을 불렀다.","saw":"오세린(08), 문하준(19)","witness":"윤서아가 당신을 봤다.","say":"public","tip":"그대로 말하라."},{"t":"22:08","room":"waiting","place":"서재 문앞","action":"현장 통제를 요청하고 첫 메모를 작성했다. 서재 문은 마스터키로 열려 있었고, 보조문은 안쪽에서 걸쇠가 걸려 있었다.","saw":"백하린(10), 최민서(06)","witness":"백하린이 옆에 있었다.","say":"public","tip":"현장 상태(보조문 걸쇠)는 당신의 핵심 정보다."},{"t":"22:09","room":"waiting","place":"서재 문앞","action":"임수빈이 '간호사였다'며 맥을 짚겠다고 했지만 현장 보존을 위해 막았다.","saw":"임수빈(13)","witness":"임수빈(13), 백하린(10)","say":"public","tip":"임수빈이 현장에 들어가려 했다는 사실을 기억하라."},{"t":"22:12","room":"waiting","place":"서재 문앞","action":"현장 메모를 이어 썼다. 복도 서쪽 끝에 최민서와 임수빈이 붙어 서 있었다.","saw":"최민서(06), 임수빈(13)","witness":"백하린(10)","say":"public","tip":"두 사람이 무슨 이야기를 했는지 물어볼 수 있다."},{"t":"22:15","room":"waiting","place":"서재 문앞","action":"1층으로 사람들을 내려보내고 문앞을 지켰다. 배수아가 계단을 올라와 복도 서쪽으로 갔다.","saw":"배수아(18), 백하린(10)","witness":"백하린(10)","say":"public","tip":"배수아가 왜 2층에 올라왔는지 물어보라."},{"t":"22:20","room":"waiting","place":"서재 문앞","action":"백하린과 함께 문앞을 지켰다.","saw":"백하린(10)","witness":"백하린(10)","say":"public","tip":"그대로 말하라."}],"questions":["배수아(18)에게: 21시 50분 문서가방을 들고 계단 쪽으로 왔다가 관리실로 간 이유는 무엇인가? 가방 안에 무엇이 있었나?","오세린(08)에게: 21시 49분 계단에서 내려온 사람이 서지안이었다면 그 사람은 어디로 갔나? 로비에 있던 나는 1층 복도 쪽으로 사라지는 뒷모습만 봤다.","이재혁(05)에게: 21시 44분 계단 아래에서 두 사람이 엇갈리는 것을 봤나? 올라간 쪽은 어떤 신발 소리를 냈나?"]},{"id":8,"name":"오세린","summary":"저녁 대부분을 정원에서 한지훈과 과거 사고 이야기를 하며 보냈다. 정전 직전 라운지로 들어왔고, 21시 49분 1층 계단 아래에서 위층에서 내려오는 사람을 봤으며, 21시 56분 라운지에서 임수빈이 의료 가방을 닫는 모습을 봤다.","timeline":[{"t":"09:20","room":"offsite","place":"자택","action":"가족이 보관하던 사고 기사와 사진을 봉투에 담았다.","saw":"","witness":"가족만 아는 준비 과정이다.","say":"public","tip":"그대로 말하라."},{"t":"16:40","room":"parking","place":"산장 입구","action":"임수빈의 의료 가방이 눈에 띄었다.","saw":"임수빈(13)","witness":"임수빈도 가방을 지니고 있었다.","say":"public","tip":"그대로 말하라."},{"t":"18:40","room":"garden","place":"정원","action":"정원 벤치에서 사고 기사 스크랩을 다시 읽었다. 한지훈이 정원 한쪽에 서 있었다.","saw":"한지훈(07)","witness":"한지훈(07)","say":"public","tip":"그대로 말하라."},{"t":"19:12","room":"lobby","place":"로비","action":"박현우에게 오래된 사고 현장 사진을 보여주었다. 남가온도 옆에서 사진을 보여줬다.","saw":"박현우(03), 남가온(17)","witness":"박현우가 같은 사진을 보았다고 진술할 수 있다.","say":"public","tip":"그대로 말하라."},{"t":"19:18","room":"lobby","place":"로비","action":"한지훈에게 과거 사고 기사들을 전달했다.","saw":"한지훈(07)","witness":"한지훈이 기억한다.","say":"public","tip":"그대로 말하라."},{"t":"19:46","room":"dining","place":"식당","action":"피해자 가족 모임에서 받은 연락을 휴대전화로 확인했다. 남가온과 유가족 모임 이야기를 했다.","saw":"남가온(17)","witness":"휴대전화 기록으로 메시지 시각을 확인할 수 있다.","say":"public","tip":"그대로 말하라."},{"t":"20:00","room":"dining","place":"식당","action":"서도윤의 자정 공개 선언을 들었다. 숟가락을 쥔 손이 떨렸다.","saw":"서도윤","witness":"대부분의 참석자","say":"public","tip":"그대로 말하라."},{"t":"20:32","room":"lounge","place":"라운지","action":"임수빈에게 임상시험 기록 보관 방법을 질문했다.","saw":"임수빈(13)","witness":"임수빈이 대답했다.","say":"public","tip":"그대로 말하라."},{"t":"20:46","room":"garden","place":"정원","action":"한지훈에게 오래전 경찰 설명의 모순을 물었다.","saw":"한지훈(07)","witness":"한지훈이 있었다.","say":"public","tip":"그대로 말하라."},{"t":"21:00","room":"garden","place":"정원","action":"정원 벤치에 앉아 찬 바람을 맞았다.","saw":"","witness":"","say":"public","tip":"그대로 말하라."},{"t":"21:05","room":"garden","place":"정원 벤치","action":"혼자 벤치에 앉아 어머니가 남긴 메모를 손으로 쓸어 보았다.","saw":"","witness":"","say":"public","tip":"그대로 말하라."},{"t":"21:10","room":"garden","place":"정원 벤치","action":"산장 2층 창에서 큰 목소리가 새어 나왔다.","saw":"","witness":"","say":"public","tip":"그대로 말하라."},{"t":"21:15","room":"garden","place":"정원","action":"한지훈이 다시 정원으로 나왔다.","saw":"한지훈(07)","witness":"한지훈(07)","say":"public","tip":"그대로 말하라."},{"t":"21:18","room":"garden","place":"정원","action":"한지훈과 임혜정 사고를 다시 이야기했다.","saw":"한지훈(07)","witness":"한지훈이 기억한다.","say":"public","tip":"그대로 말하라."},{"t":"21:22","room":"garden","place":"정원","action":"한지훈과 사진을 덮고 말없이 앉아 있었다.","saw":"한지훈(07)","witness":"한지훈(07)","say":"public","tip":"그대로 말하라."},{"t":"21:25","room":"garden","place":"정원 벤치","action":"한지훈이 라운지로 들어갔다. 혼자 남았다.","saw":"한지훈(07)","witness":"한지훈(07)","say":"public","tip":"그대로 말하라."},{"t":"21:30","room":"garden","place":"정원","action":"혼자 사고 당시 메모를 읽었다.","saw":"","witness":"독립 목격은 없다.","say":"public","tip":"혼자였다는 것은 약점이지만 사실이다."},{"t":"21:33","room":"garden","place":"정원 벤치","action":"산장 쪽 정원 출입문이 쾅 하고 닫히는 소리가 났다.","saw":"","witness":"한지훈(07)이 문을 닫았다.","say":"public","tip":"문이 닫힌 시각(21:33)은 한지훈의 진술과 맞는다."},{"t":"21:36","room":"garden","place":"정원","action":"추워져서 라운지 쪽 유리문으로 걸어갔다.","saw":"","witness":"","say":"public","tip":"그대로 말하라."},{"t":"21:39","room":"lounge","place":"라운지","action":"라운지로 들어왔다. 홍예진이 나가며 계단 쪽으로 갔고, 조은호가 창가에 앉아 있었 "오세린이 당신의 의료 가방을 잠깐 쳐다보았다.","saw":"오세린(08)","witness":"오세린이 그 장면을 기억한다.","say":"public","tip":"그대로 말하라."},{"t":"18:40","room":"lounge","place":"라운지","action":"라운지 소파 끝자리에 의료 가방을 내려놓았다. 이 자리가 서비스 계단실 문과 가깝다는 것을 봤다.","saw":"","witness":"","say":"public","tip":"자리 이야기만 하라."},{"t":"19:14","room":"lobby","place":"로비","action":"업무 자료를 넣은 의료 가방을 백하린에게 맡기지 않고 직접 들고 들어왔다.","saw":"백하린(10)","witness":"백하린이 가방을 보았다.","say":"public","tip":"'업무용 의료 키트라 직접 들고 다닌다'고 하라."},{"t":"19:45","room":"dining","place":"식당","action":"서도윤이 어머니의 이름을 언급하지 않는지 유심히 들었다.","saw":"서도윤, 오세린(08)","witness":"오세린이 근처에 있었다.","say":"public","tip":"'발표가 흥미로웠다'고만 하라."},{"t":"20:00","room":"dining","place":"식당","action":"서도윤의 자정 공개 선언을 들었다. '청명'이라는 단어에 포크를 쥔 손에 힘이 들어갔다.","saw":"서도윤","witness":"대부분의 참석자","say":"public","tip":"그대로 말하라."},{"t":"20:32","room":"lounge","place":"라운지","action":"오세린에게 의료기록 보관 절차를 설명했다.","saw":"오세린(08)","witness":"오세린이 기억한다.","say":"public","tip":"그대로 말하라."},{"t":"20:35","room":"archive","place":"자료실","action":"의료진에게 책임을 전가한 수정 보고서를 발견했다.","saw":"","witness":"자료실 시스템에 조회 흔적이 남는다.","say":"secret","tip":"'2층 구경을 했다'고 하라. 조회 기록이 나오면 '간호사로서 관심이 있었다'고 하라."},{"t":"20:50","room":"lounge","place":"라운지","action":"라운지로 돌아와 의료 가방을 무릎에 올려 두고 숨을 골랐다.","saw":"","witness":"","say":"public","tip":"그대로 말하라."},{"t":"21:00","room":"lounge","place":"라운지","action":"소파에 앉아 있었다. 서지안이 맞은편에, 신우진이 창가에 있었다.","saw":"서지안(11), 신우진(12)","witness":"서지안(11)","say":"public","tip":"그대로 말하라."},{"t":"21:05","room":"lounge","place":"라운지","action":"한지훈이 벽난로 옆에서 수첩을 정리했다.","saw":"한지훈(07)","witness":"한지훈(07)","say":"public","tip":"그대로 말하라."},{"t":"21:10","room":"lounge","place":"라운지","action":"2층에서 큰 목소리가 들렸다. 손수건을 손가락에 감았다 풀었다.","saw":"한지훈(07)","witness":"한지훈(07)","say":"public","tip":"그대로 말하라."},{"t":"21:15","room":"lounge","place":"라운지","action":"배수아가 들어와 테이블에 봉투를 펼쳤다.","saw":"배수아(18)","witness":"배수아(18)","say":"public","tip":"그대로 말하라."},{"t":"21:20","room":"lounge","place":"라운지","action":"의료 가방을 소파에 두고 파란 손수건만 쥔 채 일어섰다." \n| **22:05** | 로비 | 로비 | 로비 | 로비 | 로비 | 서재 앞 대기 | 로비 | 로비 | 로비 | 서재 앞 대기 | 로비 | 로비* | 로비 | 로비 | 로비 | 로비 | 로비 | 로비 | 로비 |\n| **22:10** | 2F 복도 | 로비 | 로비* | 로비 | 로비 | 2F 복도 | 서재 앞 대기 | 로비 | B1 복도 | 서재 앞 대기 | 로비 | 로비 | 2F 복도* | 로비 | 2F 복도 | 로비 | 로비 | 로비 | B1 복도 |\n| **22:15** | 로비 | 로비 | 로비 | 로비 | 로비 | 2F 복도* | 서재 앞 대기 | 로비 | B1 보안실* | 서재 앞 대기 | 로비 | 로비 | 로비 | 로비 | 2F 복도 | 로비 | 로비 | 2F 복도* | B1 보안실* |\n\n## 핵심 사실 (정답)\n\n- 21:20 임수빈이 라운지 소파에 의료 가방을 두고 파란 손수건만 쥔 채 이탈(배수아 목격) → 21:23 2층 복도(강태준·이재혁·서지안 목격) → 21:25 서재 입장(최민서 확인, 남가온은 손수건만 봄) → 21:37 언쟁 → 21:38 서도윤이 문을 열어 최민서를 내려보냄.\n- 21:40 김도현이 지하 설비실에서 수동 차단(의뢰인 강태준, 20:42 메시지) → 21:52 복구(문하준이 21:51 설비실 불빛, 21:52 레버 소리 확인).\n- 21:41~21:45 서재 몸싸움·치명상(21:44 둔탁한 소리: 정유리·서지안·홍예진·김도현·신우진) → 21:46 보조문(자동 걸쇠 \"철컥\", 신우진이 들음)→2층 서비스 통로 → 21:47 서비스 계단 문 쾅(백하린·정유리·서지안·홍예진·신우진) → 21:48~21:55 1층 서비스 계단실 은신(21:48 오세린, 21:53 이재혁이 문 너머 소리를 들음) → 21:55 라운지 → 21:56 오세린 앞에서 가방 닫음(젖은 머리, 파란 천).\n- 최민서: 21:43 비서실 이탈 → 21:44 로비 계단 상행(이재혁·한지훈·차시온은 실루엣, 남가온과 엇갈림) → 21:46 2층 복도 동쪽(홍예진 옆) → 21:47 서비스 통로 입구에서 임수빈 목격 → 21:48 계단 하행(홍예진이 회색 옷자락을 봄) → 21:49 계단에서 차시온과 어깨가 스치고 오세린이 \"서지안\"으로 오인 → 21:51 비서실 → 21:58 일정 삭제(이재혁이 21:57 문 유리 너머로 목격).\n- 서지안 21:49 = 2층 복도(홍예진·백하린·차시온·정유리가 확인). 오세린이 21:49에 본 \"서지안\"은 밝은 회색 카디건을 입은 최민서다.\n- 신우진 21:44~21:48 서재 대기 공간(협탁 서랍 수색, 홍예진이 불빛을 봄). 무고하지만 가장 수상한 레드 헤링이고 핵심 청각 증인이다.\n- 강태준 21:39~21:51 회계실(정전 순간 윤서아와 함께 있었고, 계약서 원본을 절취). 정전 의뢰인이지만 살인과는 무관하다.\n- 22:09 임수빈이 \"간호사\"라며 현장 진입 시도(한지훈 저지) / 22:12 최민서·임수빈 2층 복도 서쪽 201호 앞 대화(강태준·한지훈·백하린이 멀리서 봄) / 22:12 김도현·문하준 보안실 영상 / 22:13 최민서가 배수아에게 전화 → 22:15 2층 복도에서 허위 증언 제안.\n\n## 정합성 메모\n\n- 정유리: 원안의 21:18 \"로비, 차시온과 영상 확인\"을 21:19로 1분 옮겼다(21:18 2층 복도 끝 엿듣기와 동시에 있을 수 없음). 차시온의 같은 장면도 21:19로 옮기고, 21:18에는 로비에서 기다리는 상태로 두었다.\n- 강태준 비밀에 나오는 \"21:33 서도윤의 말\"은 21:13 서재 앞에서 들은 것으로 정리했다(21:33에는 서도윤이 임수빈과 면담 중이었다). 21:33 항목(회계실 복도 문서함)은 그대로 유지했다.\n- 배수아 21:43 식당 목격자: 원안의 \"홍예진이 멀리서 봤을 수 있다\"는 홍예진이 그때 2층에 있으므로 쓰지 않고, 윤서아·조은호를 증인으로 두었다(타임라인 원문 문구는 유지).\n- 아침(08:10~17:25) 원안 항목은 삭제하지 않고 타임라인 앞부분에 보존했다.\n","css":"\n/* 레이아웃: 화면 전체를 채우는 타일맵 캔버스 위에 쯔꾸르식 대사창·패드·수첩 시트를 겹친다. 밤의 산장: 남색 어둠, 놋쇠 램프빛, 눈. */\n:host{\n  color-scheme:dark;\n  --night:#0b1220;      /* 바탕 */\n  --ink:#101a2c;        /* 패널 */\n  --ink2:#18253b;       /* 패널 강조 */\n  --line:#3a4d6b;       /* 테두리 */\n  --snow:#eef2f7;       /* 본문 */\n  --fog:#9fb0c8;        /* 보조 글자 */\n  --brass:#e2b867;      /* 램프빛 강조 */\n  --ember:#d9744a;      /* 경고 · 비밀 */\n  --moss:#7fb59a;       /* 공개 */\n  --f-display:'Gowun Batang','Nanum Myeongjo',serif;\n  --f-body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;\n  --f-log:'Nanum Gothic Coding','D2Coding',ui-monospace,monospace;\n}\n\n#tgwrap{position:fixed;inset:0;background:var(--night);color:var(--snow);font-family:var(--f-body);overflow:hidden;font-size:14px;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}\nbutton{font:inherit;color:inherit;cursor:pointer}\nbutton:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--brass);outline-offset:2px}\n#tgapp{position:absolute;inset:0;display:flex;flex-direction:column}\n#stage{position:relative;flex:1;min-height:0}\ncanvas#view{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block}\n\n/* 상단 HUD */\n#hud{position:absolute;top:0;left:0;right:0;display:flex;gap:8px;align-items:center;justify-content:space-between;\n  padding:calc(8px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));\n  background:linear-gradient(#0b1220ee,#0b122000);pointer-events:none;z-index:5}\n#hud > *{pointer-events:auto}\n.place{min-width:0}\n.place b{display:block;font-family:var(--f-display);font-size:17px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.place small{color:var(--fog);font-size:11px;letter-spacing:.08em}\n.hud-r{display:flex;gap:6px;align-items:center;flex-shrink:0}\n.chip{border:1px solid var(--line);background:#101a2ccc;border-radius:6px;padding:4px 8px;font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}\n.chip.p2{border-color:var(--ember);color:#ffd2bd}\n.iconbtn{border:1px solid var(--line);background:#101a2ccc;border-radius:6px;min-width:38px;height:34px;padding:0 9px;font-size:13px}\n\n/* 조사 안내 말풍선 */\n#prompt{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;z-index:4;background:#0b1220e6;border:1px solid var(--brass);\n  color:var(--brass);padding:6px 12px;border-radius:999px;font-size:13px;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}\n\n/* 쯔꾸르식 대사창 */\n#dlg{position:absolute;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));bottom:10px;z-index:8;\n  background:linear-gradient(#18253bf2,#0e1726f2);border:2px solid #c9d4e4;box-shadow:0 0 0 2px #0b1220,0 0 0 4px #5d7090,0 10px 30px #000a;\n  border-radius:6px;padding:16px 16px 14px;min-height:112px;max-width:760px;margin:0 auto}\n#dlg .who{position:absolute;top:-15px;left:14px;background:var(--ink);border:2px solid #c9d4e4;border-radius:4px;padding:1px 10px;\n  font-family:var(--f-display);font-weight:700;font-size:14px;color:var(--brass)}\n#dlg .txt{font-size:15.5px;line-height:1.75;white-space:pre-wrap;word-break:keep-all;min-height:54px}\n#dlg .more{position:absolute;right:14px;bottom:8px;color:var(--brass);font-size:12px;animation:bob 1s infinite}\n@keyframes bob{50%{transform:translateY(3px)}}\n#dlg .choices{display:flex;flex-direction:column;gap:6px;margin-top:10px}\n#dlg .choices button{text-align:left;background:#0b1220;border:1px solid var(--line);border-radius:4px;padding:9px 12px;font-size:14.5px}\n#dlg .choices button.sel,#dlg .choices button:hover{border-color:var(--brass);color:var(--brass)}\n#dlg .choices button.sel::before{content:'▶ ';font-size:11px}\n\n/* 패드 */\n#pad{position:relative;flex:none;display:flex;justify-content:space-between;align-items:center;\n  padding:10px max(18px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));\n  background:linear-gradient(#0b1220,#070c16);border-top:1px solid #1d2a40}\n.dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,48px);gap:3px}\n.dpad button{background:#18253b;border:1px solid #33465f;border-radius:8px;font-size:18px;color:#c8d3e3;touch-action:none}\n.dpad button:active,.dpad button.on{background:#2b3f5e;color:var(--brass)}\n.dpad .c{background:transparent;border:none}\n.ab{display:flex;gap:12px;align-items:center}\n.ab button{width:66px;height:66px;border-radius:50%;border:2px solid #4b6283;background:#1a2940;font-family:var(--f-display);font-weight:700;font-size:15px;line-height:1.1;touch-action:none}\n.ab .a{border-color:var(--brass);color:var(--brass);width:76px;height:76px}\n.ab button:active{transform:scale(.95)}\n.ab small{display:block;font-family:var(--f-body);font-weight:400;font-size:10px;color:var(--fog)}\n.keys-hint{display:none;color:var(--fog);font-size:12px}\n@media (hover:hover) and (pointer:fine){\n  #pad{padding-block:8px}\n  .dpad{grid-template-columns:repeat(3,36px);grid-template-rows:repeat(3,32px)}\n  .ab button{width:52px;height:52px;font-size:13px}.ab .a{width:58px;height:58px}\n  .keys-hint{display:block}\n}\n\n/* 전체 화면 시트 */\n.sheet{position:fixed;inset:0;z-index:50;background:var(--night);display:flex;flex-direction:column;\n  padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}\n.sheet-in{width:100%;max-width:760px;margin:0 auto;display:flex;flex-direction:column;min-height:0;flex:1}\n.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:8px;border-bottom:1px solid var(--line)}\n.sheet-h h2{margin:0;font-family:var(--f-display);font-size:20px;color:var(--brass)}\n.tabs{display:flex;gap:4px;overflow-x:auto;padding:10px 0;flex:none;scrollbar-width:none}\n.tabs button{flex:none;background:transparent;border:1px solid var(--line);border-radius:4px;padding:7px 12px;font-size:13.5px;color:var(--fog)}\n.tabs button.on{background:var(--ink2);color:var(--snow);border-color:var(--brass)}\n.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:20px;-webkit-user-select:text;user-select:text}\n.muted{color:var(--fog)}\n.empty{color:var(--fog);text-align:center;padding:40px 10px;line-height:1.8}\n\n/* 증거 카드 */\n.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}\n.card{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;text-align:left;background:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px 12px;align-items:start}\n.card .id{font-family:var(--f-log);font-size:12px;color:var(--brass);border:1px solid #6b5a33;border-radius:3px;padding:1px 5px;grid-row:span 2;align-self:start}\n.card b{font-size:14.5px;font-weight:500;line-height:1.4}\n.card small{color:var(--fog);font-size:11.5px;grid-column:2}\n.card.p2 .id{color:#ffc7ad;border-color:#7b4a36}\n.doc{background:#f1ead9;color:#2b2418;border-radius:4px;padding:18px 18px 20px;margin-top:10px;box-shadow:0 8px 30px #0008;position:relative}\n.doc h3{margin:0 0 4px;font-family:var(--f-display);font-size:19px}\n.doc .meta{font-size:12px;color:#6b5d45;margin-bottom:12px;letter-spacing:.02em}\n.doc p{margin:0 0 12px;line-height:1.8;word-break:keep-all}\n.doc pre{margin:0;white-space:pre-wrap;word-break:break-word;font-family:var(--f-log);font-size:13px;line-height:1.75;background:#e6dcc4;border:1px dashed #a8946b;padding:12px;border-radius:3px}\n.doc .stamp{position:absolute;top:14px;right:14px;font-family:var(--f-log);font-size:12px;border:2px solid #9b3b2a;color:#9b3b2a;padding:2px 6px;transform:rotate(4deg)}\n.big .doc{font-size:18px}.big .doc pre{font-size:16px}.big .doc h3{font-size:24px}\n\n/* 알리바이 */\n.filt <script>

(function(){
'use strict';
const TG = window.TG_DATA;
const MAPS = TG.maps, SPAWNS = TG.spawns, CLUES = TG.clues, FLAVOR = TG.flavor, ALIBIS = TG.alibis;
const TS = 16; const ART_SCALE=2; const LODGE_LIGHTS={};
const LIMIT_KEY = 'lastcheckin_tg_limits';

// ── 앱 연결 ──
function appLimits(){ try{ const v=JSON.parse(localStorage.getItem(LIMIT_KEY)||'null'); if(v&&typeof v==='object') return {1:+v[1]||0,2:+v[2]||0}; }catch(e){} return {1:TG.defaultLimits[1],2:TG.defaultLimits[2]}; }
window.TG_setLimits = function(l1,l2){ try{ localStorage.setItem(LIMIT_KEY, JSON.stringify({1:Math.max(0,l1|0),2:Math.max(0,l2|0)})); }catch(e){} };
window.TG_getLimits = appLimits;
function tgState(){ state.tg = state.tg || {}; const t=state.tg; t.got=t.got||{}; t.seen=t.seen||{}; t.visited=t.visited||{}; t.used=t.used||{1:0,2:0}; if(t.glint===undefined) t.glint=true; return t; }
// 실명 치환: 앱에 등록된 참가자 이름으로 바꿔 보여 준다.
function LT(s){ s=String(s==null?'':s); try{ const rep=DATA.people.map((p,i)=>[p.name,liveName(i)]).filter(([a,b])=>a!==b).sort((a,b)=>b[0].length-a[0].length); for(const [a,b] of rep) s=s.split(a).join(b); }catch(e){} return s; }
let ROLE = {}; const ALI = Object.fromEntries(ALIBIS.map(a=>[a.id,a]));
function buildRoles(){ ROLE = {}; DATA.people.forEach((p,i)=>{ ROLE[i+1] = {id:i+1, name:liveName(i), job:p.job}; }); }

// S: 엔진이 쓰는 작업 상태 (앱 state.tg 에 저장)

  m.H = m.rows.length; m.W = m.rows[0].length;
  m.rows.forEach((row,y)=>[...row].forEach((c,x)=>{
    const sp = m.spots[c]; if(!sp) return;
    const room = roomAt(fid,x,y);
    SPOT[sp.id] = {f:fid,x,y,name:sp.name,base:sp.base,room}; SPOT_AT[fid+':'+x+':'+y] = sp.id;
  }));
}
const CLUES_AT = {}; CLUES.forEach((c,i)=>{ c.order=i; if(!CLUES_AT[c.spot]) CLUES_AT[c.spot]=[]; CLUES_AT[c.spot].push(c); });

function roomAt(f,x,y){ const m=MAPS[f]; return m.rooms.find(r=>x>=r.x&&x<r.x+r.w&&y>=r.y&&y<r.y+r.h)||null; }
function tile(f,x,y){ const m=MAPS[f]; if(y<0||y>=m.H||x<0||x>=m.W) return ' '; return m.rows[y][x]; }
const OUTDOOR = new Set('grh:=fa'.split(''));
const WALKABLE = new Set('.,_g:=DUVY'.split(''));
function linkAt(f,x,y){ return MAPS[f].links.find(l=>l.x===x&&l.y===y); }
function walkable(f,x,y){
  const c = tile(f,x,y);
  if (c==='L') return S.phase>=2;
  if (MAPS[f].spots[c]) return false;
  return WALKABLE.has(c);
}

  else { const t = player.moving ? player.t : 1; const ix = player.moving ? player.fx+(S.x-player.fx)*t : S.x; const iy = player.moving ? player.fy+(S.y-player.fy)*t : S.y;
    wx = (ix+.5)*T; wy = (iy+.5)*T; player.ix=ix; player.iy=iy; }
  let ox = Math.round(view.width/2 - wx), oy = Math.round(view.height/2 - wy);
  const mw=m.W*T, mh=m.H*T;
  if (mw>view.width) ox = Math.min(0, Math.max(view.width-mw, ox)); else ox = Math.round((view.width-mw)/2);
  if (mh>view.height) oy = Math.min(0, Math.max(view.height-mh, oy)); else oy = Math.round((view.height-mh)/2);

  const dark = f==='B1' ? .62 : .42;

    glow.addColorStop(.42,lamp.warm?'rgba(163,111,57,.055)':'rgba(68,114,152,.045)');glow.addColorStop(1,'rgba(0,0,0,0)');

  }
}
