ck;font-size:19px}.item{display:block;border:1px solid var(--line);border-radius:10px;padding:11px;margin:8px 0;background:#1d2b3d}.item:disabled{opacity:.5}.item.selected{border-color:var(--gold);background:#3b342c}.entry{padding:9px 0;border-bottom:1px solid #2c3c4d}.entry:last-child{border:0}.field{width:100%;background:#0e1928;color:white;border:1px solid #465971;border-radius:10px;padding:11px}.area{min-height:115px;resize:vertical}.tabs{display:flex;gap:7px;overflow:auto;margin:10px 0}.tabs button{white-space:nowrap}.roomgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;padding:8px;background:#07101a;border:3px solid #495b70;border-radius:12px}.tile{aspect-ratio:1/1;display:flex;flex-direction:column;justify-content:center;align-items:center;border:2px solid #3e4e61;background:repeating-linear-gradient(45deg,#2a3646 0 7px,#293443 7px 14px);color:#ddd;border-radius:4px;font-size:11px;padding:4px;position:relative}.tile.active{border-color:var(--gold);background:#5e4d3d}.tile .avatar{font-size:28px;line-height:1}.controls{display:grid;grid-template-columns:repeat(3,53px);justify-content:center;gap:5px;margin:12px}.controls button{width:53px;height:46px;background:#263b51;color:white;border:1px solid #68809c;border-radius:9px;font-size:20px}.log{background:#0c1826;border:1px solid var(--line);border-radius:9px;padding:10px;max-height:160px;overflow:auto;white-space:pre-wrap}.book{background:#f0e2c6;color:#2e2a24;padding:23px 19px;border-radius:9px;font-family:Georgia,'Nanum Myeongjo',serif;line-height:1.9}.book h3{color:#554331}.footer-note{font-size:11px;color:var(--mute)}.votegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.votegrid button{min-height:42px}.sticky-status{background:#102236;border:1px solid #4a607a;padding:9px 13px;border-radius:10px;margin-bottom:12px}.badge{background:#6b4d30;padding:3px 8px;border-radius:20px;font-size:11px}@media(min-width:650px){.roomgrid{max-width:560px;margin:auto}.tile{font-size:13px}}

</style></head><body><header><h1>◈ 마지막 체크인</h1><div><small id="phaseTop">LOCAL DEMO</small> <button class="btn outline" onclick="openAdmin()" style="padding:5px 8px;min-height:29px;font-size:11px">관리자</button> </div></header><main class="shell" id="app"></main><nav class="nav" id="nav"></nav><script>const DATA={"people":[{"name":"강태준","job":"부대표","team":"정보 비공개","motive":"당신은 서도윤과 십오 년 동안 회사를 키웠다. 그러나 성과를 독점하고 위기가 오면 부하에게 책임을 떠넘기는 서도윤의 방식에 이미 오래전부터 균열이 생겼다. 10년 전 청명 프로젝트 사고 이후, 당신은 자금을 빼돌린 회계 처리와 은폐 계약 일부에 서명했다. 이번 폭로가 실제로 이루어진다면 서도윤뿐 아니라 당신도 몰락한다. 당신은 진실을 막기 위해 이곳에 왔지만, 누군가를 죽일 계획까지 세운 것은 아니다.","secret":"21시 33분, 서도윤은 당신에게 “오늘 밤 자료가 공개되면 너도 끝이야”라고 말했다. 당신은 서재에서 나와 회계실로 향했고, 21시 40분에는 서재가 아닌 1층에 있었다. 하지만 투자 계약서 원본을 훔치려 했던 사실을 감추고 싶다.","items":"접힌 사업계약서 / 만년필 / 서재 보조문 도면 사본","alibi":"19:02 로비 체크인하면서 최민서가 전달한 봉투를 받았다. / 19:35 식당 서도윤 맞은편 자리에서 식사했다. / 20:00 식당 서도윤의 폭로 선언에 처음으로 반박했다. / 20:44 회계실 윤서아와 프로젝트 정산 자료를 두고 실랑이했다. / 21:10 2층 서재 앞 서도윤에게 지분 계약을 돌려달라고 언쟁했다. / 21:24 2층 계단 서재를 떠나 1층으로 내려왔다. / 21:33 회계실 복도 투자 계약서가 든 문서함을 확인했다. / 21:40 1층 회계실 정전 때 휴대전화 불빛으로 책상 아래 서류를 확인했다. / 21:49 식당 방향 복도 조은호와 마주쳐 자금 문제를 더 이야기하지 않겠다고 말했다. / 22:05 로비 서재에서 누군가 죽었다는 말을 듣고 2층으로 올라갔다.","evidence":"E15 투자 지분 계약서, E17 보조문 수리 기록","mission":"E09 이중장부와 E15 지분계약을 대조하여 자기 서명이 무엇을 보증했는지 확인한다. / 윤서아가 가진 정산 내역을 확보하거나 증언을 받아 불리한 오해를 풀어낸다. / 자신의 자료 은닉 시도를 공개할지 끝까지 비밀로 할지 선택한다.","links":"서도윤과 당신은 자주 충돌했으며, 이번에는 청명 프로젝트의 원본 장부와 지분 계약을 회수하려 했다. 21시 10분 서재 앞에서 목소리를 높인 이유도 그것이다. 당신의 공격적인 말투는 많은 사람의 기억에 남았다. 불리한 자료를 숨기려는 행동과 살인에 가담한 행동은 구별되어야 한다.","revelation":"21시 10분의 공개적인 언쟁 때문에 가장 먼저 의심받을 수 있다. 당신이 서재 도면 사본을 소지한 것은 과거 리모델링 투자 검토 때문이지만 남들이 믿을지는 알 수 없다.","id":1,"declaration":"당신은 오랫동안 회사의 비밀을 지켜온 부대표입니다.","prologue":"당신은 서도윤과 십오 년 동안 회사를 키웠다. 그러나 성과를 독점하고 위기가 오면 부하에게 책임을 떠넘기는 서도윤의 방식에 이미 오래전부터 균열이 생겼다. 10년 전 청명 프로젝트 사고 이후, 당신은 자금을 빼돌린 회계 처리와 은폐 계약 일부에 서명했다. 이번 폭로가 실제로 이루어진다면 서도윤뿐 아니라 당신도 몰락한다. 당신은 진실을 막기 위해 이곳에 왔지만, 누군가를 죽일 계획까지 세운 것은 아니다.","background":"서도윤과 당신은 자주 충돌했으며, 이번에는 청명 프로젝트의 원본 장부와 지분 계약을 회수하려 대장에는 “원본 노트가 있다”라는 한 줄이 적혀 있었다.","secret":"21시 27분 자료실에서 신우진과 마주쳤다. 두 사람은 공개적으로 언쟁하지 않았지만 “잃어버린 페이지”를 두고 대립했다. 정전 중 자료실 인근에서 남가온과 손전등 불빛을 교차했다.","items":"찢긴 실험 수첩 / 연구실 사진 / 자물쇠 열쇠","alibi":"19:12 로비 남가온이 오래된 연구실 사진을 꺼내는 것을 봤다. / 19:38 식당 서도윤의 왼쪽 뒤편에서 식사했다. / 20:16 라운지 한지훈에게 과거 수사 누락 페이지를 설명했다. / 20:52 자료실 연구노트가 잠겨 있는 캐비닛을 찾았다. / 21:27 자료실 신우진과 누락된 실험 페이지를 놓고 이야기했다. / 21:39 자료실 손전등을 켜며 문 쪽으로 이동했다. / 21:43 자료실 문앞 남가온과 마주쳤다. / 21:51 1층 계단 차시온이 카메라 배터리를 교체하는 것을 봤다. / 21:58 라운지 신우진이 왜 2층에 갔는지 물었다. / 22:05 로비 백하린의 비상 연락을 들었다.","evidence":"E02 원본 연구노트, E03 사고 보고서","mission":"E02 연구노트와 E03 수정 사고 보고서를 비교해 삭제된 페이지의 내용을 찾는다. / 신우진에게 연구 중지 권고가 전달된 시각을 확인한다. / 임혜정의 기록을 원본 그대로 제출할지 고민한다.","links":"원본 실험노트와 수정된 사고 보고서 사이에는 삭제된 두 페이지가 있다. 그 페이지에는 임혜정이라는 참가자의 이상 반응과 연구 중단 요청이 기록되어 있다. 임수빈이 그 가족이라는 사실은 아직 모른다. 신우진이 사고를 완전히 막지 못했던 이유도 확인하고 싶다.","revelation":"당신은 사고 당일 위험한 데이터의 복사본을 허락 없이 가져왔다. 이것이 드러나면 연구자료 유출자로 의심받을 수 있다.","id":3,"declaration":"당신은 10년 전의 실험 기록을 되찾으려는 연구원입니다.","prologue":"당신은 사고 당시 청명 프로젝트의 실험 데이터를 수집하는 연구원이었다. 안전 이상 신호가 나타난 날, 당신은 실험 중단을 권고했지만 공식 보고서에는 당신이 실험을 강행한 책임자로 남았다. 그 이후 학계에서 자리를 잃었다. 산장 초대장에는 “원본 노트가 있다”라는 한 줄이 적혀 있었다.","background":"원본 실험노트와 수정된 사고 보고서 사이에는 삭제된 두 페이지가 있다. 그 페이지에는 임혜정이라는 참가자의 이상 반응과 연구 중단 요청이 기록되어 있다. 임수빈이 그 가족이라는 사실은 아직 모른다. 신우진이 사고를 완전히 막지 못했던 이유도 확인하고 싶다.","privateKnowledge":"21시 27분 자료실에서 신우진과 마주쳤다. 두 사람은 공개적으로 언쟁하지 않았지만 “잃어버린 페이지”를 두고 대립했다. 정전 중 자료실 인근에서 남가온과 손전등 불빛을 교차했다.","weakPoint":"당신은 사고 당일 위험한 데이터의 복사본을 허락 없이 가져왔다. 이것이 드러나면 연구자료 유출자로 의심받을 수 있다.","daySchedule":[{"time":"09:40","place":"자택 서재","detail":"원본 연구노트와 수정 보고서의 장 번호를 비교했다.","corroboration":"책상에 표시해 둔 인덱스가 있다.","visibility":"알려져도 됨"},{"time":"16:50","place":"산장 입구","detail":"연구실 사진이 담긴 서류 봉투를 챙겼다.","corroboration":"남가온이 봉투를 보았다.","visibility":"알려져도 됨"},{"time":"19:12","place":"로비","detail":"남가온이 오래된 연구실 사진을 꺼내는 것을 봤다.","corroboration":"남가온이 같은 장면을 기억한다.","visibility":"알려져도 됨"},{"time":"19:38","place":"식당","detail":"서도윤의 왼쪽 뒤편에서 식사했다.","corroboration":"신우진이 몇 자리를 건너 앉아 있었다 음 버튼을 눌렀다.","evidence":"E04 녹음 2·3번, E16 홍보 대응 지침","mission":"E04의 세 조각과 E20 복구된 음성을 서로 대조한다. / 서재 밖의 발소리와 실제 이동 기록을 연결한다. / 제보자 보호와 원본 공개 중 우선순위를 결정한다.","links":"서도윤의 말투와 강태준의 반박, 기자를 막으려는 홍예진의 태도까지 모두 녹음해 두었다. 그러나 녹음은 길지 않고, 잡음이 심하다. 다른 녹음과 CCTV 영상을 대조해야 누가 어디서 말했는지 분별할 수 있다.","revelation":"당신의 제보자는 산장 참가자 중 한 명이다. 이름을 밝히면 특종을 증명하기는 쉬워져도 약속을 어기게 된다.","id":4,"declaration":"당신은 발표될 진실이 편집되지 않도록 감시하는 기자입니다.","prologue":"당신은 서도윤의 화려한 이미지 뒤에 숨은 의료 연구 사고를 수년간 취재했다. 익명 제보자에게서 “사고 당시 원본 녹음은 하나가 아니라 세 개”라는 이야기를 들었고, 백야산장에는 두 번째 조각을 찾으러 왔다. 당신이 원하는 것은 폭로의 속보가 아니라 조작할 수 없는 원본이다.","background":"서도윤의 말투와 강태준의 반박, 기자를 막으려는 홍예진의 태도까지 모두 녹음해 두었다. 그러나 녹음은 길지 않고, 잡음이 심하다. 다른 녹음과 CCTV 영상을 대조해야 누가 어디서 말했는지 분별할 수 있다. 21시 18분에는 서재 쪽에서 홍예진과 서도윤의 높은 목소리도 들었다. 그러나 이것이 사적인 다툼이라는 사실은 당시에는 알지 못했다.","privateKnowledge":"21시 10분 2층에서 서도윤과 강태준의 언쟁을 들었다. 21시 47분 정전 중 복도에 누군가 지나가는 소리가 났지만 상대의 얼굴은 보지 못했다. 21시 49분 신우진이 자료실 앞에 서 있던 것은 직접 보았다.","weakPoint":"당신의 제보자는 산장 참가자 중 한 명이다. 이름을 밝히면 특종을 증명하기는 쉬워져도 약속을 어기게 된다.","daySchedule":[{"time":"08:55","place":"취재 사무실","detail":"익명 제보자가 전송한 짧은 음성 파일을 받았다.","corroboration":"파일 생성 시간이 남는다.","visibility":"알려져도 됨"},{"time":"15:15","place":"산장 도착 전 휴게소","detail":"차시온과 연락해 촬영 장비를 확인했다.","corroboration":"차시온과 통화 기록이 있다.","visibility":"알려져도 됨"},{"time":"19:16","place":"로비","detail":"차시온의 카메라 앞에서 취재 목적을 설명했다.","corroboration":"차시온이 촬영했다.","visibility":"알려져도 됨"},{"time":"19:30","place":"식당","detail":"서도윤의 발표를 녹음했다.","corroboration":"다른 참석자가 녹음기 사용을 봤다.","visibility":"알려져도 됨"},{"time":"20:26","place":"라운지","detail":"홍예진에게 브리핑 원본을 요청했지만 거절당했다.","corroboration":"홍예진이 대화했다.","visibility":"알려져도 됨"},{"time":"21:10","place":"2층 복도","detail":"강태준과 서도윤의 다툼을 녹음했다.","corroboration":"강태준은 당신을 못 보았을 수 있다.","visibility":"알려져도 됨"},{"time":"21:18","place":"로비","detail":"차시온과 영상 속 얼굴을 확인했다.","corroboration":"차시온이 기억한다.","visibility":"알려져도 됨"},{"time":"21:39","place":"자료실","detail":"녹음 복원용 노트북을 연결했다.","corroboration":"노트북 접속 기록이 있다.","visibility":"알려져도 됨"},{"time":"21:18","place":"2층 인의 이익을 구별해야 한다.","id":5,"declaration":"당신은 사건에 얽힌 계약의 효력을 알고 있는 변호사입니다.","prologue":"서도윤은 유언장 공개와 별도로 비밀유지 합의의 유효성을 확인해 달라며 당신을 불렀다. 평소에는 법률문서를 해석하는 일만 했지만, 이번 계약에는 사고 책임을 누가 짊어질지 정하는 의도가 너무 뚜렷했다. 당신은 계약을 공개하면 고객 비밀을 침해할 수 있다는 두려움과 범죄를 감추어서는 안 된다는 생각 사이에 있다.","background":"배수아는 10년 전 합의서의 초안을 작성했던 외부 자문가다. 서지안이 상속 문제로 상담을 요청했지만 비밀 내용을 모두 알려줄 수는 없었다. 2층에서 강태준이 황급히 내려오는 모습은 보았으나 어느 방에서 나왔는지 확신하지 못한다. 홍예진이 혼인 신고를 하지 않은 관계에 관한 법적 자문을 요청한 적이 있으나 그 사실을 다른 사람에게 말하지 않았다.","privateKnowledge":"21시 36분 법률문서실에서 배수아를 만나 구형 합의서의 빠진 첨부자료를 확인했다. 21시 44분에는 계단에 있었고, 서재에서는 멀리 떨어져 있었다. 그러나 당신의 봉투에는 폭로를 제한하는 문안이 있다.","weakPoint":"서도윤에게 불리할 수 있는 문안을 작성한 사실은 수사팀에도 의심을 살 수 있다. 법적 의무와 개인의 이익을 구별해야 한다.","daySchedule":[{"time":"10:25","place":"법률사무소","detail":"유언장 및 비밀유지 합의 관련 봉투를 봉인했다.","corroboration":"접수 서명이 남는다.","visibility":"알려져도 됨"},{"time":"16:15","place":"산장 근처","detail":"배수아에게 최종 서류 제출 여부를 물었다.","corroboration":"배수아의 통화 기록이 있다.","visibility":"알려져도 됨"},{"time":"19:11","place":"로비","detail":"배수아에게 합의서 원본이 있는지 물었다.","corroboration":"배수아가 기억한다.","visibility":"알려져도 됨"},{"time":"19:47","place":"식당","detail":"서지안과 상속 문제가 아닌 일상 대화를 나눴다.","corroboration":"서지안이 동석했다.","visibility":"알려져도 됨"},{"time":"20:31","place":"라운지","detail":"서도윤의 발표문에 법적 문제가 있음을 경고했다.","corroboration":"홍예진이 근처에 있었다.","visibility":"알려져도 됨"},{"time":"21:22","place":"2층 계단","detail":"서지안과 만나 유언장 공증 날짜를 확인했다.","corroboration":"서지안이 같은 기록을 갖고 있다.","visibility":"알려져도 됨"},{"time":"21:24","place":"2층 계단","detail":"강태준이 서재 쪽에서 내려오는 것을 봤다.","corroboration":"강태준도 계단을 내려왔다고 한다.","visibility":"알려져도 됨"},{"time":"21:36","place":"법률문서실","detail":"배수아와 구형 합의서를 비교했다.","corroboration":"배수아가 동석했다.","visibility":"알려져도 됨"},{"time":"21:44","place":"계단","detail":"정전 중 비상등이 보이는 계단에서 머물렀다.","corroboration":"독립 목격은 불명확하다.","visibility":"알려져도 됨"},{"time":"21:52","place":"라운지","detail":"전력 복구 후 서지안에게 메시지를 보냈다.","corroboration":"메시지 기록이 남는다.","visibility":"알려져도 됨"},{"time":"21:59","place":"법률문서실","detail":"합의서 봉인을 다시 확인했다.","corroboration":"종이 봉투의 봉인 49 자료실 앞 정유리와 마주쳐 무슨 자료를 찾는지 질문받았다. / 21:58 라운지 박현우가 행적을 물었으나 대답하지 않았다. / 22:05 로비 사망 소식에 당황했다.","evidence":"E14 연구 설계도, E02 원본 연구노트","mission":"E14 설계도 원본과 E02 연구노트를 비교한다. / 10년 전 안전성 경고 문서가 실제로 전달되었는지 증명한다. / 회수 자료를 공개해 책임을 인정하거나 숨겨 연구 성과를 지킬지 결정한다.","links":"과거에 서도윤에게 감정적인 협박성 편지를 보낸 적이 있다. 그 편지 때문에 살인 용의자로 보일 수 있다. 그러나 진짜 목적은 연구 설계도의 원본과 중단 권고서를 확보하는 것이었다.","revelation":"옛 연구 참여자 중 임혜정의 이름을 기억하지만 임수빈의 가족이라는 사실은 모른다.","id":12,"declaration":"당신은 자신의 연구 성과를 되찾고 싶은 기술 책임자입니다.","prologue":"당신은 청명 프로젝트의 핵심 기술 개발을 맡았지만 개발 성과는 서도윤 명의로 특허가 이전되었다. 10년 전 위험성을 일부 알고 있었고, 경고 보고서에 서명도 했다. 이번 발표가 이루어지면 자신이 모든 문제를 만든 사람처럼 보일 수 있다. 당신은 마지막으로 기록을 확보할 기회가 있다고 믿는다.","background":"과거에 서도윤에게 감정적인 협박성 편지를 보낸 적이 있다. 그 편지 때문에 살인 용의자로 보일 수 있다. 그러나 진짜 목적은 연구 설계도의 원본과 중단 권고서를 확보하는 것이었다.","privateKnowledge":"21시 27분 자료실에서 박현우와 이야기했고, 21시 49분에는 정유리와 마주쳤다. 정전 직후의 행적을 일부 숨기고 있지만 서재 안에 있었던 적은 없다. 숨긴 것은 자료를 몰래 회수하려던 행동이다.","weakPoint":"옛 연구 참여자 중 임혜정의 이름을 기억하지만 임수빈의 가족이라는 사실은 모른다.","daySchedule":[{"time":"09:45","place":"연구소 사무실","detail":"실험 설계도와 중단 권고서의 서명 부분을 살폈다.","corroboration":"스캔 파일 열람 로그가 있다.","visibility":"알려져도 됨"},{"time":"16:30","place":"산장 입구","detail":"윤서아와 잠깐 인사했다.","corroboration":"윤서아도 마주쳤다.","visibility":"알려져도 됨"},{"time":"19:07","place":"로비","detail":"윤서아에게 회계실 증거 목록을 물었다.","corroboration":"윤서아와 대화했다.","visibility":"알려져도 됨"},{"time":"19:38","place":"식당","detail":"박현우가 앉아 있는 테이블을 피했다.","corroboration":"박현우가 알아챘다.","visibility":"알려져도 됨"},{"time":"20:24","place":"자료실","detail":"본인 명의의 연구노트를 찾았다.","corroboration":"자료실 출입 로그가 남는다.","visibility":"알려져도 됨"},{"time":"21:27","place":"자료실","detail":"박현우와 누락 페이지를 논의했다.","corroboration":"박현우가 기억한다.","visibility":"알려져도 됨"},{"time":"21:35","place":"2층 계단","detail":"원본 설계도를 찾기 위해 위층으로 올라갔다.","corroboration":"독립 목격 없음.","visibility":"비공개"},{"time":"21:40","place":"2층 자료보관 구역","detail":"정전 시 연구 도면이 든 서류함을 찾고 있었다.","corroboration":"카드 태그가 일부 남았다.","visibility":"알려져도 됨"},{"time":"21:43","place":"자료실 인근","detail":"휴대폰 불빛으로 빠져나왔다.","corroboration": "E09 차명 계좌, E15 지분 계약서","mission":"E09의 실제 수취인과 E15의 계약자를 연결한다. / 윤서아가 가진 회계 원본을 확인해 반환 가능한 자금 규모를 추산한다. / 부정 자금을 고발할지 조용히 회수할지 선택한다.","links":"강태준이 투자 지분 계약을 회수하려 한다는 사실을 알고 있다. 윤서아는 당신의 은닉 자금을 밝히려 할 것이며 두 사람을 동시에 속이기는 어렵다. 21시 41분 라운지와 21시 42분 식당에서 목격되었으므로 살인 현장과는 거리가 있다.","revelation":"비자금 일부의 실제 소유자다. 이중장부가 공개되면 손실뿐 아니라 책임도 따를 수 있다.","id":14,"declaration":"당신은 투자금이 어디로 사라졌는지 추적하는 투자자입니다.","prologue":"당신은 청명 프로젝트에 거액을 투자했고 사고 이후 단 한 번도 원래 수익 구조를 설명받지 못했다. 서도윤이 진실을 폭로하면 돈을 돌려받을 수도 있지만, 차명 계좌와 자금 회수 경로가 드러나면 본인의 책임도 생길 수 있다. 당신은 계약의 숫자를 믿지만 지금 이곳의 사람들은 숫자보다 비밀을 많이 갖고 있다.","background":"강태준이 투자 지분 계약을 회수하려 한다는 사실을 알고 있다. 윤서아는 당신의 은닉 자금을 밝히려 할 것이며 두 사람을 동시에 속이기는 어렵다. 21시 41분 라운지와 21시 42분 식당에서 목격되었으므로 살인 현장과는 거리가 있다.","privateKnowledge":"21시 49분 강태준과 식당 복도에서 마주쳤다. 그는 숨을 헐떡이지 않았고 계약 얘기를 피했다. 이를 말하면 자신이 차명계좌를 운영했다는 사실을 추궁받을 가능성이 있다.","weakPoint":"비자금 일부의 실제 소유자다. 이중장부가 공개되면 손실뿐 아니라 책임도 따를 수 있다.","daySchedule":[{"time":"09:50","place":"사무실","detail":"투자 손실 자료를 수집해 방문 명단과 대조했다.","corroboration":"전자문서 수정 이력이 있다.","visibility":"알려져도 됨"},{"time":"15:20","place":"차량","detail":"강태준에게 원본 투자계약 준비를 확인했다.","corroboration":"강태준과 통화 기록이 있다.","visibility":"알려져도 됨"},{"time":"19:35","place":"식당","detail":"강태준·윤서아와 같은 테이블에 앉았다.","corroboration":"두 사람이 기억한다.","visibility":"알려져도 됨"},{"time":"20:23","place":"라운지","detail":"서도윤에게 투자보증금 반환을 요구했다.","corroboration":"홍예진이 들었다.","visibility":"알려져도 됨"},{"time":"20:51","place":"회계실 앞","detail":"윤서아에게 거래 명세를 제시했다.","corroboration":"윤서아가 확인했다.","visibility":"알려져도 됨"},{"time":"21:28","place":"서재 앞 대기 공간","detail":"서도윤의 면담 순서를 기다렸지만 만나지 못했다.","corroboration":"최민서 일정표에 대기 기록이 있다.","visibility":"알려져도 됨"},{"time":"21:31","place":"라운지","detail":"홍예진과 발표 이후 회사 반응을 이야기했다.","corroboration":"홍예진이 기억한다.","visibility":"알려져도 됨"},{"time":"21:41","place":"라운지","detail":"정전 직후 오세린이 자리 쪽으로 오는 것을 봤다.","corroboration":"오세린은 얼굴을 못 봤을 수 있다.","visibility":"알려져도 됨"},{"time":"21:42","place":"식당","detail":"윤서아와 비상등 아래에서 만났다.","corroboration":"윤서아도 기억한다.","visibility":"알려져도 됨"},{"time":"21:49","place":"식당 방향 복도","detail":"강태준에게 지분 반환을 다시 요구했다.","corroboration":"강태준이 기억한다.","visibility":"알려져도 됨"},{"time":"21:50","place":"식당","detail":"혼자 식탁에 앉았다.","corroboration":"독립 목격 없음.","visibility":"알려져도 됨"},{"time":"22:05","place":"로비","detail":"사망 소식 이후 윤서아가 수첩을 꺼내는 걸 봤다.","corroboration":"윤서아가 근처에 있었다.","visibility":"알려져도 됨"}],"goals":["E09의 실제 수취인과 E15의 계약자를 연결한다.","윤서아가 가진 회계 원본을 확인해 반환 가능한 자금 규모를 추산한다.","부정 자금을 고발할지 조용히 회수할지 선택한다."],"personalItems":[["은행 거래 명세","일부 차명 계좌와 송금 시각이 적혀 있다."],["계약 키 카드","금고 보관 계약서 수령용 코드."],["차용증","강태준 측과 주고받은 투자 보증 문서."]],"roleMark":"ordinary"},{"name":"홍예진","job":"홍보 책임자","team":"정보 비공개","motive":"당신은 서도윤의 대외 이미지와 긴급 발표문을 담당한다. 10년 전 사고 당시 실제 원인이 밝혀지기도 전에 “기저질환”이라고 발표한 문안을 만들었다. 위에서 내려온 내용을 썼지만 그 후로도 사건을 지켜보지 않은 책임이 있다. 산장에서는 이번 폭로가 거짓 없이 이루어질지 검토하려 왔다.","secret":"21시 49분 서지안과 2층 객실 복도에서 마주쳤다. 정전 중 무엇을 했는지 묻자 서지안은 휴대폰 사진을 확인 중이었다고 답했다. 21시 46분 김도현에게 전화를 걸었지만 연결되지 않았다.","items":"언론 대응 문건 / 기자 연락처 / 보도 초안","alibi":"19:55 식당 김도현에게 시설 경보 문제를 항의했다. / 20:13 라운지 윤서아가 서도윤에게 문서를 건네는 걸 봤다. / 20:21 라운지 서지안과 서도윤의 말다툼 끝부분을 들었다. / 20:26 라운지 정유리의 브리핑 원본 요청을 거절했다. / 20:31 라운지 조은호가 발표 영향에 대해 물었다. / 21:34 라운지 미리 작성한 언론 대응 문구를 확인했다. / 21:41 2층 객실 복도 비상등을 확인하며 객실 구역에 있었다. / 21:46 복도 김도현에게 정전 원인을 문의했지만 연결되지 않았다. / 21:49 2층 객실 복도 서지안과 마주쳤다. / 21:51 식당 고객에게 설명할 임시 공지를 작성했다. / 22:05 로비 백하린의 연락을 받고 상황을 전파했다.","evidence":"E24 공동거주 기록, E25 연인의 편지, E01 유언장, E16 보도자료 원본 / 복도 센서와 메시지 시간","mission":"E16 대응 초안과 실제 배포본의 수정 시점을 비교한다. / 정유리·차시온에게 확인된 사실만 전달할지 결정한다. / 10년 전 허위 발표에 대한 책임을 인정하거나 자료를 은폐하는 선택을 내린다.","links":"정유리는 끈질기게 원본을 요구하고, 차시온은 인터뷰 전체 장면을 달라고 한다. 서도윤은 홍보팀을 통해 발표 순서를 통제하려 한다. 당신은 말을 바꾸지 않는 사람이 더 수상하다고 생각한다.","revelation":"사실과 다른 첫 보도자료를 쓴 책임 때문에 과거 기록 공개를 망설인다.","id":15,"declaration":"당신은 피해자 서도윤과 사실혼 관계를 유지해온 연인이자 회사 홍보 책임자입니다.","prologue":"당신과 서도윤은 혼인 신고를 하지 않았지만 여섯 해 동안 함께 살아왔다. 서로의 집 열쇠를 가지고 생활비와 일상을 나누었으며, 가까운 지인들은 두 사람이 가족처럼 지낸다는 사실을 알고 있다. 그러나 회사 안에서는 두 사람의 관계가 드러나지 않았다. 당신은 대표의 사적인 관계가 투자 계약이나 인사 문제에 영향을 준다는 소문을 피하고 싶었기 때문이다. 서도윤의 대외 이미지를 맡는 홍보 책임자로서 당신은 공식 일정과 보도자료를 관리해 왔다.\n\n10년 전 청명 프로젝트 사고가 났을 때 당신은 경영진의 설명을 믿고 “기저질환에 의한 사망”이라는 보도 초안을 작성했다. 이후 의혹이 커질수록 진실을 묻지 않았다는 죄책감도 커졌다. 산장으로 떠나기 전 두 사람은 청명 프로젝트 공개 범위를 놓고 크게 다퉜다. 서도윤은 자정 발표 뒤 함께 새로운 삶을 시작할 수 있다고 말했지만, 당신은 그 말이 또 다른 은폐의 시작일 수 있다고 의심했다.\n\n당신이 산장에 온 이유는 홍보 일정 때문만이 아니다. 서도윤이 왜 최근 공동거주 계약과 재산 관련 문서를 몰래 수정했는지, 당신에게 무엇을 숨겼는지를 직접 확인하기 위해서다. [[PARTNER_RELATION_LINE]]","background":"당신은 서도윤에게 가장 가까운 사람이지만 그의 모든 비밀을 알고 있는 사람은 아니다. 비서 최민서는 서도윤의 업무상 일정 대부분을 알고 있어 당신과 자주 부딪혔다. 서지안은 유언장이 바뀐 뒤 당신에게 상속 의혹을 제기했다. 정유리는 발표문 원본을 요구했고 차시온은 당신과 서도윤의 사적 관계를 인터뷰에서 언급하지 말아 달라는 요청을 받았다.\n\n21시 05분, 당신은 서도윤의 휴대전화로 “오늘 일 끝나면 우리 이야기부터 하자”라는 메시지를 남겼다. 21시 18분 서재에 찾아가자 문 앞에서 짧은 언쟁이 있었다. 두 사람은 관계를 공개할지 말지를 두고 다퉜다. 이 장면을 본 인물은 당신이 살인을 저지를 충분한 동기가 있다고 의심할 수 있다. 하지만 21시 41분에는 2층 객실 복도에 있었고, 해당 동선의 일부는 카메라·복도 센서로 확인된다.","privateKnowledge":"당신은 서도윤의 사적인 금고 비밀번호 일부를 알고 있으며, 서도윤이 사고 관련 봉투를 홍보 자료보다 더 중요하게 취급했다는 사실을 알고 있다. 21시 18분 언쟁 당시 서도윤은 “만약 내가 사라지면 그 봉투를 열어 봐”라고 말했다. 당신은 이 말을 협박이나 이별 선언으로 받아들였지만 지금은 예고였을 가능성도 있다고 생각한다.\n\n당신의 지갑 속에는 두 사람의 공동거주 계약서와 서도윤이 직접 남긴 짧은 편지가 있다. 제삼자가 이 자료를 보면 둘의 관계, 서도윤이 당신에게 맡기려 했던 자료, 상속과 관련된 이해관계를 확인할 수 있다. 하지만 사실혼 관계만으로 자동으로 상속권이 발생하는 것은 아니며, 당신은 누군가 유언장을 조작했다는 소문을 경계한다.","weakPoint":"회사와의 이해관계 때문에 사실혼 관계를 숨긴 일은 당신을 수상하게 만든다. 당신은 서도윤을 사랑했고 동시에 거짓 발표문을 작성한 책임이 있다. 서도윤 사망으로 당신에게 어떤 재산이 돌아오는지조차 아직 명확하지 않다. 과거에 왜곡된 발표문을 공개할 경우 비판도 받아야 한다. 서지안에게 연인 관계를 알리면 증거를 찾는 데 도움은 될 수 있지만 가족 사이의 갈등은 커질 수 있다.","daySchedule":[{"time":"08:30","place":"서울 공동 거주지","detail":"서도윤과 아침을 먹으며 자정 발표 이후의 거취를 이야기했다. 서도윤이 “서류를 산장에서 확인하자”고 말했다.","corroboration":"동거 관계는 당신에게만 확실하며 그날 아침 대화의 독립 목격자는 없다.","visibility":"비공개"},{"time":"11:20","place":"회사 홍보실","detail":"편집된 발표문과 원본 보도 초안을 대조했다. 일부 책임 문구가 삭제된 것을 확인했다.","corroboration":"문서 수정 기록과 보도 초안 생성 시간이 남아 있다.","visibility":"알려져도 됨"},{"time":"16:45","place":"백야산장 주차장","detail":"서도윤보다 먼저 도착해 보도 장비를 반입했다. 차시온과 잠시 마주쳤다.","corroboration":"차시온이 카메라를 들고 들어오는 모습을 봤다.","visibility":"알려져도 됨"},{"time":"19:55","place":"식당","de function mapPage(){if(!role())return '<p>역할을 먼저 배정하세요.</p>';if(!isExploring())return `<h2>탐색 종료</h2>${panel('지도는 1·2차 증거 수집 시간에만 열립니다.')}${ui('','쪽지함으로',"setview('chat')",'primary')}`;let here=DATA.rooms[state.room];return `<h2>산장 탐색</h2><p class="muted">픽셀 타일형 공간 시연 · 방을 터치하거나 방향키로 이동</p><div class="roomgrid">${DATA.rooms.map((r,i)=>`<button class="tile ${state.room===i?'active':''}" onclick="moveto(${i})"><span class="avatar">${state.room===i?'🧍':({'서재':'📚','보안실':'📹','설비실':'⚡','창고':'📦','식당':'🍽️','지하 연구실':'🧪'}[r.name]||'🚪')}</span><span>${r.name}</span></button>`).join('')}</div><div class="controls"><span></span><button onclick="move(0,-1)">▲</button><span></span><button onclick="move(-1,0)">◀</button><button onclick="claim(DATA.rooms[state.room].items[0])">◎</button><button onclick="move(1,0)">▶</button><span></span><button onclick="move(0,1)">▼</button><span></span></div>${panel(`<h3>${here.name} · 조사 포인트</h3><div class="log">${safe(lastLog)}</div>${here.items.map(id=>{let e=DATA.evidence.find(x=>x.id===id);return `<button class="item" style="width:100%;text-align:left" onclick="claim('${id}')" ${['E20','E21','E22','E23'].includes(id)&&state.stage!=='explore2'?'disabled':''}>${state.inventory.includes(id)?'✔':'🔎'} <b>${id} ${e.title}</b><br><small>${e.unlock}</small></button>`}).join('')}<p class="footer-note">시연에서는 모든 증거를 버튼으로 획득할 수 있습니다. 정식 버전에서는 열쇠·비밀번호·증거 조합·단계별 개방 조건을 적용합니다.</p>`)}`}
function bagPage(){if(!role())return panel('배정 후 사용할 수 있습니다.');const p=role();return `<h2>증거·소지품 수첩</h2>${panel(`<h3>내 소지품</h3>${p.personalItems.map(it=>`<div class="entry"><b>${safe(it[0])}</b><p>${safe(it[1])}</p></div>`).join('')}`)}${panel(`<h3>획득 증거 (${state.inventory.length}/${DATA.evidence.length})</h3>${state.inventory.length?state.inventory.map(id=>{let e=DATA.evidence.find(x=>x.id===id);return `<div class="entry"><span class="tag">${id}</span> <b>${safe(e?.title||id)}</b><p>${safe(e?.unlock||'')}</p><small class="muted">연관 인물: ${safe(e?.related||'')}</small></div>`}).join(''):'아직 수집한 증거가 없습니다.'}`)}${peerInventoryPage()}${panel(`<h3>연계 추리 예시</h3><p>E06 수정된 일정표 + E23 수정 전 면담 일정 → 정전 전 서재에 들어간 인물의 신원을 좁힐 수 있습니다.</p><p>E17 보조문 기록 + E22 섬유 흔적 + E08 영상 복원 → 밀실에서 빠져나온 인물의 동선 확인에 도움이 됩니다.</p><p>한 가지 증거만으로 결론을 내리기보다 서로 다른 관찰자와 시각을 교차 확인하세요.</p>`)}`;

 if(p.roleMark==='killer')return {title:'진실을 고백할 것인가?',desc:'당신은 서도윤을 죽였다. 어머니의 사망 기록을 밝히는 것과 자신의 범행을 인정하는 것은 다른 문제다.',options:[['reveal','자신의 범행과 어머니의 기록을 모두 고백한다'],['conceal','살인 사실은 숨기고 어머니의 기록만 추적한다'],['deal','최민서와 침묵을 유지하기로 약속한다']]};
 if(p.roleMark==='fixed_accomplice')return {title:'당신은 공범입니다. 마지막 증언을 선택하세요.',desc:'당신은 진범을 알면서 일정표를 삭제했다. 이제 그 선택을 되돌릴 기회가 있다.',options:[['reveal','진범과 일정 조작 사실을 고백한다'],['conceal','일정표 조작을 끝까지 은폐한다'],['deal','진범과 서로의 비밀을 지키기로 거래한다']]};
 if(p.id===9)return {title:'복구 영상의 운명',desc:'당신은 정전을 일으켰지만 살인을 사전에 알지 못했다. 복원된 영상이 임수빈의 이동을 가리킨다는 것을 알게 되었다. 고의적인 영상 은폐에 가담하면 살인 은폐 조력자가 될 수 있다.',options:[['reveal','영상을 그대로 제출하고 정전 사실을 인정한다'],['conceal','범행을 알면서도 영상의 원본을 삭제한다 (조건부 공범)'],['deal','진범을 보호하는 대가로 거래한다 (조건부 공범)']]};
 if(p.id===18)return {title:'허위 증언을 할 것인가?',desc:'최민서에게서 임수빈 관련 면담 정보를 들었다. 단순히 자신의 옛 합의서를 숨기는 것과 살인범을 보호할 허위 증언을 하는 것은 다르다.',options:[['reveal','일정 수정 제안을 폭로하고 사실 그대로 증언한다'],['conceal','과거 합의서만 감추되 살인사건에 관한 거짓 진술은 하지 않는다'],['deal','임수빈에게 유리한 허위 진술을 제공한다 (조건부 공범)']]};
 return {title:'당신이 확보한 기록을 어떻게 할 것인가?',desc:'범행과 별개로 당신에게도 숨기고 싶은 과거가 있다. 무엇을 공개할지 선택하세요.',options:[['reveal','수집한 사실과 본인 관련 기록을 공개한다'],['conceal','자신의 비밀 자료를 공개하지 않는다'],['deal','공개 범위를 놓고 다른 인물과 협상한다']]};
}
function isNetworkMember(){return [13,6].includes(role()?.id)||Boolean([9,18].includes(role()?.id)&&state.branchRegistry?.[String(role().id)]===true)}
function chooseDecision(key){if(!['reveal','conceal','deal'].includes(key))return;state.decision=key;state.branchRegistry=state.branchRegistry||{};if(role()?.id===9)state.branchRegistry['9']=['conceal','deal'].includes(key);if(role()?.id===18)state.branchRegistry['18']=key==='deal';rerender()}
function decisionPageV7(){const cfg=decisionHelp();return panel(`<h2>최후의 선택 <span class="badge">${timer()}</span></h2><p>최종 투표 이전, 4분 동안 자신의 마지막 행동을 선택합니다. 정해진 시간이 지나면 선택 결과가 확정됩니다.</p><h3>${safe(cfg.title)}</h3><p>${safe(cfg.desc)}</p>${cfg.options.map(([key,txt])=>`<button class="item ${state.decision===key?'selected':''}" style="width:100%;text-align:left" onclick="chooseDecision('${key}')">${state.decision===key?'◉':'○'} ${safe(txt)}</button>`).join('')}<p class="footer-note">선택하지 않으면 침묵으로 처리됩니다. 이 데모의 4분은 해당 기기에서만 계산됩니다.</p>${ui('','시연용 선택 저장 후 투표로',"state.stage='vote';rerender()",'primary')}`);
}
function startDecision(){if(!adminAuthenticated){alert('관리자 인증이 필요합니다.');return;}state.stage='decision';state.timerEnd=Date.now()+4*60*1000;state.decision='';selectedPerson=-1;setview('home')}function timer(){if(state.stage!=='decision')return '';let rem=Math.max(0,Math.ceil((state.timerEnd-Date.now())/1000));return `${String(Math.floor(rem/60)).padStart(2,'0')}:${String(rem%60).padStart(2,'0')}`}
function decisionPage(){return decisionPageV7();}

function votePage(){if(!role())return panel('역할을 배정받으세요.');if(state.stage==='decision')return `<h2>마지막 선택</h2>${decisionPageV7()}`;
 if(state.stage!=='vote')return panel('<h3>투표 대기 중</h3><p>최종 범인 투표 시간이 열리기 전에는 지목할 수 없습니다.</p>');
 return `<h2>최종 범인 투표</h2>${panel(mainVotePanel())}${panel(`<h3>인물 선택</h3><p>각 카드를 누르면 해당 인물의 대면 진술 메모와 범인 지목 버튼을 확인할 수 있습니다.</p><div class="cast-list">${DATA.people.map((p,i)=>personSummary(i)).join('')}</div>`)}${ui('','메인으로','openPerson(-1)','outline')}`;

function toggleVote(i){if(state.stage!=='vote')return alert('투표 시간이 아닙니다.');let a=state.votes;if(a.includes(i))state.votes=a.filter(x=>x!==i);else if(a.length<state.count)state.votes=[...a,i];rerender()}
function actualGuilty(){const guilty=[12,5],reg=state.branchRegistry||{};if(reg['9'])guilty.push(8);if(reg['18'])guilty.push(17);return guilty}
function result(){
 const guilty=actualGuilty(),caught=state.votes.includes(12),accompliceVotes=state.votes.filter(i=>i!==12&&guilty.includes(i)),innocentVotes=state.votes.filter(i=>!guilty.includes(i));
 let title,story;
 if(caught&&accompliceVotes.length===guilty.length-1) {title='완전한 검거';story='임수빈이 서도윤을 죽였다는 사실이 밝혀졌다. 최민서의 일정 조작과 최종적으로 살인 은폐를 선택한 조력자의 책임까지 확인되었다.'}
 else if(caught){title=accompliceVotes.length?'불완전한 검거':'진범 검거 · 남겨진 그림자';story='임수빈의 범행은 드러났지만 살인사건을 의도적으로 은폐한 조력자 중 일부는 밝혀지지 않았다. 어머니 임혜정의 의료 사고 기록은 별도의 검증을 기다린다.'}
 else if(accompliceVotes.length){title='조력자만 지목 · 그림자만 붙잡다';story='일부 참가자는 일정표 삭제와 증거 은폐에 가담한 사람을 정확히 찾아냈다. 그러나 서도윤을 실제로 죽인 임수빈은 최종 지목에서 빠졌다. 산장 밖에서 진범을 추적할 새로운 수사가 시작된다.'}
 else{title=state.votes.length?'잘못된 지목':'미해결 사건';story='투표가 살인범과 그 은폐 조력자를 특정하지 못했다. 서로의 진술은 남았지만 그날 정전 중 서재에서 무슨 일이 있었는지는 공개되지 않았다.'}
 if(innocentVotes.length)title+=' · 무고한 인물 오지목';
 return {name:title,story,main:caught,guilty,accompliceVotes,innocentVotes};
}

function finalize(){if(!adminAuthenticated){alert('관리자 인증이 필요합니다.');return;}state.stage='finished';selectedPerson=-1;setview('book')}
function bookPage(){

 const choiceName={reveal:'폭로·자백',conceal:'은폐·침묵',deal:'거래'}[state.decision]||'선택 없음';
 const personalEnd=(()=>{if(!p)return '당신은 사건의 전말을 읽는다.';if(p.id===13)return r.main?'당신은 어머니의 죽음에 대한 진실을 찾았지만, 그 과정에서 스스로 저지른 살인도 인정하거나 추궁받아야 했다.':'당신은 당장의 지목은 피했지만 최민서와 남겨진 기록은 언제든 당신의 이름을 세상에 드러낼 수 있다.';if(p.id===6)return state.decision==='reveal'?'당신은 자신이 삭제한 일정표의 원본을 제출했다. 진실을 향한 증언이 늦어졌다는 사실 또한 기록으로 남았다.':'당신은 진범을 알고도 침묵했다. 숨긴 일정표가 언젠가 복원된다면 스스로 지켜 온 모든 것이 무너질 수 있다.';if([9,18].includes(p.id))return actualGuilty().includes(p.id)?'당신은 자신의 비밀을 지키려고 살인사건과 관련한 사실까지 의도적으로 숨겼다. 이제 사건의 은폐 조력자로서 후속 수사의 대상이 된다.':'당신은 불리한 상황에서도 살인범을 위한 적극적인 거짓 진술을 선택하지 않았다. 다만 원래 감추고 있던 문제에 대한 책임은 별개로 남는다.';return state.decision==='reveal'?'당신은 결국 자신이 가진 자료를 공개하기로 했다. 당신이 선택한 문장 하나가 다른 사람의 알리바이를 다시 쓰게 만들었다.':state.decision==='conceal'?'당신은 자신이 가진 불리한 자료를 남겨 두었다. 침묵이 살인에 가담했다는 뜻은 아니지만, 아직 공개되지 않은 의문은 남았다.':'당신의 선택은 사건을 완전히 끝내지 못했다. 그러나 당신이 모은 기록들은 누군가의 증언을 확인할 기준이 되었다.'})();
 return `<h2>사건의 최종 기록</h2>${panel(`<span class="tag">이번 시연의 결과</span><h2 class="gold">${safe(r.name)}</h2><p>${safe(r.story)}</p><p><b>최종 지목:</b> ${state.votes.length?state.votes.map(i=>safe(liveName(i))).join(', '):'없음'}</p><p><b>나의 마지막 선택:</b> ${safe(choiceName)}</p><p><b>판정 기준:</b> 임수빈(주범) · 최민서(확정 은폐 조력자)${r.guilty.includes(8)?' · 김도현(선택에 따라 가담)':''}${r.guilty.includes(17)?' · 배수아(선택에 따라 가담)':''}</p>`)}<article class="book"><h3>프롤로그 · 임혜정의 수첩</h3><p>10년 전 청명 프로젝트의 임상시험에 참여한 임혜정은 심각한 이상 반응을 호소했다. 그러나 경고는 조직의 기록에서 지워졌고, 사망 원인은 다른 이유로 정리되었다. 임혜정의 자녀 임수빈은 그날부터 진실을 찾기 시작했다.</p><h3>제1장 · 산장에 모인 사람들</h3><p>서도윤은 ${victimGender()==='미지정'?'연인 배역에 배정된 참가자의 성별이 확정되기 전까지 성별이 정해지지 않은 인물':victimGender()+'인 인물'}이었다. 홍예진 배역의 참가자는 서도윤과 여섯 해 동안 사실혼 관계였다. 회사 홍보 책임자이기도 했던 연인은 재산 문서와 왜곡된 발표문을 모두 의심하고 있었고, 21시 18분에는 서재 앞에서 격한 언쟁을 벌였다. 하지만 이 다툼 자체가 살인을 입증하는 증거는 아니었다. ${victimGender()==='여성'?'그녀에게 남은 마지막 밤이었지만, 연인은 그것을 알지 못했다.':victimGender()==='남성'?'그에게 남은 마지막 밤이었지만, 연인은 그것을 알지 못했다.':'이것은 서도윤에게 남은 마지막 밤이었지만, 연인은 그것을 알지 못했다.'}</p><p>19명의 초대객은 서로 다른 것을 얻기 위해 산장에 왔다. 누군가는 지분 계약을, 누군가는 잃어버린 연구노트를, 누군가는 자신이 만든 허위 문서를 되찾으려 했다. 그날 저녁 서도윤이 예고한 폭로는 모두의 이해관계를 흔들었다.</p><h3>제2장 · 21시 40분</h3><p>임수빈은 21시 25분 서재로 들어가 서도윤에게 어머니의 의료기록 원본을 요구했다. 서도윤은 수정된 폭로 자료를 고수했다. 21시 40분, 김도현이 다른 목적의 의뢰로 전원을 차단했고 서재에서 몸싸움이 벌어졌다. 임수빈은 21시 41~45분 사이 서도윤에게 치명적인 부상을 입혔다. 21시 46분 비상 서비스문으로 빠져나왔고, 문은 자동으로 닫혔다.</p><h3>제3장 · 침묵하는 사람들</h3><p>최민서는 임수빈의 비공개 면담과 서비스 통로 이용 정황을 알고도 일정표를 수정했다. 김도현은 정전의 이유를 은폐했고, 배수아는 오래전 합의서의 책임을 두려워했다. 하지만 김도현·배수아의 현재 살인 은폐 가담 여부는 각자의 마지막 행동에 따라 달라진다. 범행을 알지 못했던 과거의 행동만으로 살인 공범이라 단정할 수 없다.</p><h3>제4장 · 우리의 결말</h3><p>${safe(r.story)}</p><h3>제5장 · ${safe(liveName(state.role))}의 이후</h3><p>${safe(personalEnd)}</p><h3>부록 · 다른 가능성</h3><p>임수빈을 지목했다면 범행은 드러난다. 임수빈을 놓치고 최민서만 지목했다면 '조력자만 지목' 엔딩이 된다. 모두를 정확히 지목해도 임혜정 의료사고의 원본 기록이 자동 공개되는 것은 아니다. 10년 전 진실을 공개하는 선택은 각 인물이 수집한 문서와 폭로 여부에 달려 있다.</p><h3>등장인물 비밀 해금</h3>${DATA.people.map(x=>`<p><b>${safe(x.name)} · ${safe(x.job)}</b> — ${safe(x.weakPoint)}</p>`).join('')}</article><p class="footer-note">이 데모의 결과는 현재 기기의 투표·선택에 따른 미리보기입니다. Supabase 연결 후 모든 참가자의 최종 선택과 합산 투표를 기준으로 확정됩니다.</p>`;
}
