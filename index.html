const KEYMAP = { ArrowUp:'up', KeyW:'up', ArrowDown:'down', KeyS:'down', ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right' };
window.addEventListener('keydown', e=>{
  if (!running) return;
  const d = KEYMAP[e.code];
  e.stopImmediatePropagation();
  if (mode==='dialog'){ if(d==='up'){moveSel(-1);e.preventDefault();} else if(d==='down'){moveSel(1);e.preventDefault();} else if(['Space','Enter','KeyZ'].includes(e.code)){ dlgTap(); e.preventDefault(); } return; }
  if (mode==='sheet'){ if(e.code==='Escape'||e.code==='KeyX'){ for(const s of ['cardView','note']) if(!$(s).hidden){ closeSheet(s); break; } } return; }
  if (mode!=='play') return;
  if (d){ if(!heldKeys.includes(d)) heldKeys.push(d); e.preventDefault(); if(!player.moving && !e.repeat) tryMove(d); }
  else if (['Space','Enter','KeyZ'].includes(e.code)){ e.preventDefault(); interact(); }
  else if (['KeyN','KeyX'].includes(e.code)) openNote();
  else if (e.code==='Escape') close();
}, true);

    if(mode==='dialog'){ if(d==='up') moveSel(-1); else if(d==='down') moveSel(1); return; } held=d; if(mode==='play' && !player.moving) tryMove(d); });
  const up=()=>{ b.classList.remove('on'); if(held===d) held=null; };

});

    else { if(inT){ out+='</table>'; inT=false; } if(l.startsWith('#')) out+=`<h4>${esc(l.replace(/^#+\s*/,''))}</h4>`; else if(l.trim()) out+=`<p style="font-size:13px">${esc(l.replace(/\*\*/g,''))}</p>`; }
  }
  return out+(inT?'</table>':'');
}
const _adminPage = adminPage;
adminPage = function(){
  const h = _adminPage(); if (!adminAuthenticated) return h;
  const lim = TG_getLimits(), show = window.tgGmShow||'';
  let out = '';
  if (show==='clues') out = `<div class="tg-x"><table class="tg-grid"><tr><th>ID</th><th>단계</th><th>장소</th><th>제목</th><th>주인</th><th>해설</th></tr>${TG.clues.map(c=>`<tr><td>${c.id}</td><td>${c.phase}</td><td>${esc(SPOTNAME[c.spot])}</td><td>${esc(c.title)}</td><td>${esc(DATA.people[c.owner-1]?.name||'—')}</td><td style="white-space:normal;min-width:220px">${esc(c.gm)}</td></tr>`).join('')}</table></div>`;
  else if (show==='grid') out = `<div class="tg-x">${mdTable(TG.masterMd)}</div>`;
  else if (show.startsWith('ali')) { const id=+show.slice(3)||1; out = `<select class="field" onchange="tgGmView('ali'+this.value)">${DATA.people.map((p,i)=>`<option value="${i+1}" ${i+1===id?'selected':''}>${String(i+1).padStart(2,'0')} ${esc(p.name)}</option>`).join('')}</select><div style="margin-top:10px">${alibiPanel(id,'all')}</div>`; }
  return h + panel(`<h3>증거 수집 게임 설정</h3>
   <p class="muted">조사권은 「자세히 살펴보기」 1회에 1장씩 씁니다. 0이면 무제한입니다. 객실 가방 열람은 조사권을 쓰지 않습니다. 설정은 기기마다 따로 저장됩니다.</p>
   <div class="row"><label>1차 <input class="field" id="tgL1" type="number" min="0" value="${lim[1]}" style="width:76px;display:inline-block"></label><label>2차 <input class="field" id="tgL2" type="number" min="0" value="${lim[2]}" style="width:76px;display:inline-block"></label>${ui('','저장','tgSaveLimits()','primary')}</div>
   <h4>참가자용 진행 코드</h4><p class="muted">각 단계를 시작할 때 코드를 불러 주면 참가자가 홈 화면에서 입력해 같은 단계로 맞춥니다.</p>
   ${Object.entries(TG.stageCodes).map(([k,c])=>`<div class="entry"><b>${(window.STAGE_NAMES||{})[k]||STAGE_LABEL[k]||k}</b> · <span class="gold" style="font-size:17px;letter-spacing:.1em">${c}</span></div>`).join('')}
   <h4>GM 자료</h4><div class="row">${ui('','전체 증거 배치표',"tgGmView('clues')",show==='clues'?'primary':'outline')}${ui('','21:00–22:15 위치표',"tgGmView('grid')",show==='grid'?'primary':'outline')}${ui('','인물별 알리바이',"tgGmView('ali1')",show.startsWith('ali')?'primary':'outline')}${show?ui('','접기',"tgGmView('')",'outline'):''}</div>
   <div style="margin-top:12px">${out}</div>
   <p style="margin-top:14px">${ui('','이 기기 탐색 기록 초기화','tgResetTile()','outline')}</p>`);
};

// 스타일 (앱 쪽)
const st = document.createElement('style');
st.textContent = `.tg-say{font-size:10.5px;border-radius:4px;padding:0 6px;border:1px solid;vertical-align:1px}.tg-say-pub{color:#7fb59a;border-color:#3f6b57}.tg-say-care{color:var(--gold);border-color:#6b5a33}.tg-say-sec{color:#ffb79a;border-color:#7b4a36;background:#2a140c}
.tg-row{cursor:pointer}.tg-dark{background:linear-gradient(90deg,#05080f,transparent)}.tg-tip{margin-top:7px;font-size:13px;color:#ffe2a8;background:#2a2210;border-left:2px solid var(--gold);padding:7px 9px;line-height:1.65}
.tg-x{overflow-x:auto;max-width:100%}.tg-grid{border-collapse:collapse;font-size:11.5px;white-space:nowrap}.tg-grid th,.tg-grid td{border:1px solid #2c3d52;padding:4px 6px;text-align:left}.tg-grid th{background:#1a2a3d}.tg-sec{color:#ffb79a}`;

<script>
// ═══ 실시간 동기화 (Firebase Realtime Database) ═══
// FIREBASE_CONFIG 가 비어 있으면 아무것도 하지 않고 기존 오프라인 방식(진행 코드)으로 동작한다.
(function(){
const CFG = window.FIREBASE_CONFIG || {};
const ROOM = String(window.GAME_ROOM || 'main').replace(/[.#$\[\]\/]/g,'_');
const DEVICE_KEY = 'lastcheckin_device_id', RESET_KEY = 'lastcheckin_reset_seen', STAGE_REV_KEY = 'lastcheckin_stage_rev';
const GENDER_DB = 'lastcheckin_v17_17p_genders';
let device = ''; try{ device = localStorage.getItem(DEVICE_KEY) || ''; if(!device){ device = 'd'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); localStorage.setItem(DEVICE_KEY, device); } }catch(e){ device='d'+Math.random().toString(36).slice(2); }

const SYNC = window.SYNC = { on:false, connected:false, room:ROOM, data:{}, device, skew:0 };
SYNC.now = ()=>Date.now()+(SYNC.skew||0);
let db = null;   // 어댑터: watch(path,cb) set(path,v) update(path,v) remove(path) txn(path,fn) presence(path,v)

// ── 어댑터: Firebase ──
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
async function firebaseAdapter(){
  const V='10.12.2';
  await loadScript(`https://www.gstatic.com/firebasejs/${V}/firebase-app-compat.js`);
  await loadScript(`https://www.gstatic.com/firebasejs/${V}/firebase-database-compat.js`);
  const app = firebase.initializeApp(CFG); const d = firebase.database(app);
  return {
    watch:(p,cb)=>d.ref(p).on('value',s=>cb(s.val())),
    set:(p,v)=>d.ref(p).set(v), update:(p,v)=>d.ref(p).update(v), remove:p=>d.ref(p).remove(),
    txn:(p,fn)=>d.ref(p).transaction(fn).then(r=>({committed:r.committed, value:r.snapshot.val()})),
    connected:cb=>d.ref('.info/connected').on('value',s=>cb(!!s.val())),
    offset:cb=>d.ref('.info/serverTimeOffset').on('value',s=>cb(+s.val()||0)),
    presence:(p,v)=>{ const r=d.ref(p); r.onDisconnect().remove(); return r.set(v); },
    now:()=>firebase.database.ServerValue.TIMESTAMP
  };
}

// ── 경로 ──
const R = p=>`rooms/${ROOM}${p?'/'+p:''}`;
const safeKey = k=>String(k).replace(/[.#$\[\]\/]/g,'_');

// ── 원격 → 이 기기 ──
let pendingRender=false, lastSig='';
function typing(){ const a=document.activeElement; return a && ['INPUT','TEXTAREA','SELECT'].includes(a.tagName) && el('app') && el('app').contains(a); }
function softRender(){ if(window.TG_isOpen&&TG_isOpen()){ pendingRender=true; return; } if(typing()){ pendingRender=true; return; } pendingRender=false; try{ render(); }catch(e){} }
document.addEventListener('focusout', ()=>setTimeout(()=>{ if(pendingRender&&!typing()) softRender(); }, 50));
setInterval(()=>{ if(pendingRender && !typing() && !(window.TG_isOpen&&TG_isOpen())) softRender(); }, 1500);

function lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function apply(room){
  room = room || {}; SYNC.data = room;
  // 새 게임(전체 초기화) 감지
  // 이 기기가 처음 연결될 때 기준값을 남겨 두고(없으면 0), 그 뒤에 더 새로운 초기화가 오면 지운다.
  const resetAt = room.resetAt||0; let seenRaw = null; try{ seenRaw = localStorage.getItem(RESET_KEY); }catch(e){}
  if (seenRaw===null){ try{ localStorage.setItem(RESET_KEY, String(resetAt)); }catch(e){} }
  else if (resetAt && resetAt > +seenRaw){ wipeLocal(resetAt); return; }
  if (window.SYNC_beforeCast) try{ window.SYNC_beforeCast(room); }catch(e){ console.warn(e); }

  // 배역·이름·성별
  const cast = room.cast || {};
  const names = {}, genders = {};
  Object.entries(cast).forEach(([i,c])=>{ if(c&&c.name&&c.device){ names[i]=c.name; if(c.gender) genders[i]=c.gender; } });
  if (state.role>=0){
    const mine = cast[String(state.role)];
    if (mine && mine.device && mine.device !== device){ lostRole(mine.name); return; }
    if ((!mine || !mine.device) && state.name){ claimRole(state.role, state.name, state.gender); names[String(state.role)]=state.name; if(state.gender) genders[String(state.role)]=state.gender; }
    else if (mine && state.gender && mine.gender!==state.gender){ db.update(R('cast/'+state.role), {gender:state.gender}).catch(()=>{}); genders[String(state.role)]=state.gender; }
  }
  lsSet(NAME_DB, names); lsSet(GENDER_DB, genders);

  // 선착순 획득 기록
  const claims = room.claims || {};
  const world = {}; Object.entries(claims).forEach(([k,v])=>{ world[v&&v.key||k]=v; });
  lsSet(WORLD_KEY_V11, world);
  // 내가 가졌다고 생각했지만 다른 사람이 먼저 가진 증거 정리
  if (state.role>=0 && Array.isArray(state.inventory)){
    const lost = state.inventory.filter(id=>{ const w=world['E:'+id]; return w && w.owner!==state.role; });
    if (lost.length) dropEvidence(lost, world['E:'+lost[0]].name);
  }

  // 쪽지
  const letters = Object.values(room.letters||{}).filter(Boolean).sort((a,b)=>a.at-b.at);
  lsSet(MSG_DB, letters);

  // 조건부 조력자 판정 (김도현 = 9번, 배수아 = 18번)
  const dec = room.decisions || {};
  state.branchRegistry = state.branchRegistry || {};
  if (dec['8']) state.branchRegistry['9'] = ['conceal','deal'].includes(dec['8'].key);
  if (dec['17']) state.branchRegistry['18'] = dec['17'].key==='deal';

  // 진행 단계
  const st = room.stage;
  let rev = ''; try{ rev = localStorage.getItem(STAGE_REV_KEY)||''; }catch(e){}
  if (st && st.stage && String(st.rev)!==rev){
    try{ localStorage.setItem(STAGE_REV_KEY, String(st.rev)); }catch(e){}
    const was = state.stage;
    state.stage = st.stage; state.timerEnd = st.timerEnd || 0;
    if (st.stage==='decision' && was!=='decision') state.decision='';
    selectedPerson = -1;
    if (was!==st.stage && window.TG_isOpen && TG_isOpen()) TG_close();
    if (st.stage==='finished') view='book';
    else if (view==='map' && !isExploring()) view='home';
    if (was!==st.stage){ flash(`진행 단계가 「${phaseName()}」(으)로 바뀌었습니다`); if(window.SYNC_onStage) try{ SYNC_onStage(st, was); }catch(e){} }
    else flash(`남은 시간이 조정되었습니다`);
  }
  SYNC.final = room.final || null;

  if (window.SYNC_afterApply) try{ window.SYNC_afterApply(room); }catch(e){ console.warn(e); }
  const sig = JSON.stringify([names,genders,world,letters.length,dec,st,room.final,room.presence&&Object.keys(room.presence).length, room.ballots, room.regs]);
  try{ persist(); }catch(e){}
  if (sig!==lastSig){ lastSig=sig; softRender(); }
}
function wipeLocal(resetAt){
  try{ for(let i=localStorage.length-1;i>=0;i--){ const k=localStorage.key(i); if(k&&k.startsWith('lastcheckin_')&&k!==DEVICE_KEY&&k!==RESET_KEY) localStorage.removeItem(k); } localStorage.setItem(RESET_KEY,String(resetAt)); }catch(e){}
  location.reload();
}
function lostRole(name){
  const old = state.role;
  state = Object.assign({}, defaultState); try{ persist(); }catch(e){}
  view='home'; selectedPerson=-1; softRender();
  alert(`방금 다른 참가자(${name})가 같은 역할을 먼저 받았습니다. 다시 「역할 배정」을 눌러 주세요.`);
}
function dropEvidence(ids, by){
  state.inventory = state.inventory.filter(x=>!ids.includes(x));
  if (state.tg && state.tg.got){ ids.forEach(id=>{ const g=state.tg.got[id]; if(g){ const k=g.pk||g.phase; if(state.tg.used&&state.tg.used[k]>0) state.tg.used[k]--; delete state.tg.got[id]; } }); }
  try{ persist(); }catch(e){}
  flash(`한발 늦었습니다. ${by||'다른 참가자'} 님이 먼저 가져갔어요 (조사권은 돌려받았어요)`);
}
function flash(t){
  let n=document.getElementById('syncToast'); if(!n){ n=document.createElement('div'); n.id='syncToast'; n.style.cssText='position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:10000;background:#e6c48b;color:#1a1408;font-weight:700;padding:9px 14px;border-radius:8px;box-shadow:0 6px 20px #0009;max-width:calc(100% - 32px);text-align:center;font-size:13.5px'; document.body.appendChild(n); }
  n.textContent=t; n.hidden=false; clearTimeout(n._t); n._t=setTimeout(()=>n.hidden=true, 3200);
}

// ── 이 기기 → 원격 ──
function claimRole(i, name, gender){
  return db.txn(R('cast/'+i), cur=>{ if(cur && cur.device && cur.device!==device) return; return Object.assign({gender:gender||''}, cur||{}, {name, device, at:Date.now()}); })
    .then(r=>{ if(!r.committed && r.value && r.value.device!==device && state.role===i) lostRole(r.value.name); }).catch(()=>{});
}
const _registerCastName = registerCastName;
registerCastName = function(i,n){ const ok=_registerCastName(i,n); if(ok && SYNC.on){ const g=(i===state.role&&state.gender)||''; claimRole(i, String(n).trim().replace(/\s+/g,' ').slice(0,24), g); } return ok; };
const _registerGender = registerGender;
registerGender = function(i,g){ _registerGender(i,g); if(SYNC.on) db.update(R('cast/'+i), {gender:g}).catch(()=>{}); };

const _doClaim = doWorldClaimV11;
doWorldClaimV11 = function(key){
  const ok = _doClaim(key);
  if (ok && SYNC.on){
    const me = {owner:state.role, name:liveName(state.role), at:Date.now(), key};
    db.txn(R('claims/'+safeKey(key)), cur=>{ if(cur && cur.owner!==state.role) return; return me; })
      .then(r=>{ if(!r.committed && r.value && r.value.owner!==state.role){
        if (key.startsWith('E:')) dropEvidence([key.slice(2)], r.value.name);
        else { try{ const w=worldClaimsV11(); w[key]=r.value; localStorage.setItem(WORLD_KEY_V11, JSON.stringify(w)); }catch(e){} flash(`한발 늦었습니다. ${r.value.name} 님이 먼저 가져갔어요`); softRender(); }
      } }).catch(()=>{});
  }
  return ok;
};
const _resetWorld = resetWorldV11;
resetWorldV11 = function(){ _resetWorld(); if(SYNC.on && adminAuthenticated) db.remove(R('claims')).catch(()=>{}); };

const _putLetters = putLetters;
putLetters = function(all){ _putLetters(all); if(!SYNC.on) return; const remote=(SYNC.data&&SYNC.data.letters)||{}; (all||[]).forEach(m=>{ if(m&&m.id&&!remote[safeKey(m.id)]) db.set(R('letters/'+safeKey(m.id)), m).catch(()=>{}); }); };

const _chooseDecision = chooseDecision;
chooseDecision = function(key){ _chooseDecision(key); if(SYNC.on && state.role>=0) db.set(R('decisions/'+state.role), {key, at:Date.now()}).catch(()=>{}); };
window.SYNC_pushBallot = ()=>pushBallot();
function pushBallot(){ if(SYNC.on && state.role>=0) db.set(R('ballots/'+state.role), {count:state.count, votes:state.votes||[], at:Date.now()}).catch(()=>{}); }
const _toggleVote = toggleVote; toggleVote = function(i){ _toggleVote(i); pushBallot(); };
const _chooseCount = chooseCount; chooseCount = function(n){ _chooseCount(n); pushBallot(); };

// 진행자: 단계 전환을 모든 기기에 보낸다
window.SYNC_pushStage = (st,ex)=>pushStage(st,ex);
function pushStage(stage, extra){ if(!SYNC.on) return; const rev = Date.now()+'-'+device; try{ localStorage.setItem(STAGE_REV_KEY, rev); }catch(e){} db.set(R('stage'), Object.assign({stage, rev, at:Date.now(), timerEnd:0}, extra||{})).catch(e=>alert('단계 전송에 실패했습니다: '+e.message)); }
const _startPhase = startPhase; startPhase = function(next){ _startPhase(next); if(adminAuthenticated){ if(next==='explore1'||next==='lobby') db&&SYNC.on&&db.remove(R('final')).catch(()=>{}); pushStage(next); } };
const _startDecision = startDecision; startDecision = function(){ _startDecision(); if(adminAuthenticated) pushStage('decision', {timerEnd:state.timerEnd}); };
const _finalize = finalize;
finalize = function(){
  if (!adminAuthenticated) return _finalize();
  if (SYNC.on){ const fin = groupResult(); db.set(R('final'), fin).catch(()=>{}); SYNC.final = fin; }
  _finalize(); pushStage('finished');
};
// 최후 선택 타이머가 끝나면 진행자 기기가 투표 단계로 넘긴다
setInterval(()=>{ const st=SYNC.data&&SYNC.data.stage; if(SYNC.on && adminAuthenticated && st && st.stage==='decision' && st.timerEnd && SYNC.now()>st.timerEnd+1500) pushStage('count', {timerEnd: SYNC.now()+5*60000}); }, 3000);

// ── 집계: 범인 수는 최다 득표 인원, 지목은 득표순 ──
function groupResult(){
  const ballots = Object.entries((SYNC.data&&SYNC.data.ballots)||{}).filter(([i])=>roleActive(+i)).map(([i,b])=>({i:+i, count:b.count||0, votes:(b.votes||[]).filter(roleActive)}));
  const cc={}; ballots.forEach(b=>{ if(b.count) cc[b.count]=(cc[b.count]||0)+1; });
  const count = +(Object.entries(cc).sort((a,b)=>b[1]-a[1]||a[0]-b[0])[0]||[state.count||1])[0];
  const tally={}; ballots.forEach(b=>b.votes.forEach(v=>{ tally[v]=(tally[v]||0)+1; }));
  const ranked = Object.entries(tally).sort((a,b)=>b[1]-a[1]||a[0]-b[0]).map(([k,n])=>({i:+k,n}));
  return { count, votes: ranked.slice(0,count).map(r=>r.i), tally, voters: ballots.length, at: Date.now() };
}
const _result = result;
result = function(){ const f=SYNC.final; if(!f||!Array.isArray(f.votes)) return _result(); const mine=state.votes; state.votes=f.votes; try{ return _result(); } finally { state.votes=mine; } };
const _bookPage = bookPage;
bookPage = function(){
  let h = _bookPage(); const f=SYNC.final; if(!f||state.stage!=='finished') return h;
  const rows = Object.entries(f.tally||{}).sort((a,b)=>b[1]-a[1]).map(([i,n])=>`<div class="entry"><b>${safe(liveName(+i))}</b> · ${n}표${f.votes.includes(+i)?' <span class="tag">최종 지목</span>':''}</div>`).join('');
  return h + panel(`<h3>전체 투표 집계</h3><p class="muted">${f.voters}명 투표 · 다수가 고른 범인 수 ${f.count}명 · 득표순 상위 ${f.count}명을 최종 지목으로 처리했습니다.</p>${rows||'<p class="muted">투표 없음</p>'}`);
};

// ── 화면: 홈 상태 · 진행자 콘솔 ──
const _home = home;
home = function(){
  let h = _home(); if(!SYNC.on || !role() || selectedPerson!==-1) return h;
  // 동기화 중에는 진행 코드 입력칸을 연결 상태 표시로 바꾼다
  const i = h.indexOf('<section class="card">'), j = h.indexOf('</section>', i);
  const badge = panel(`<div class="home-timer"><small>${phaseName()}</small><b id="homeTimer">${(window.V22&&V22.remaining()!=null)?V22.mmss(V22.remaining()):'--:--'}</b></div><div class="row between"><div><b>${SYNC.connected?'● 감독과 연결됨':'○ 연결 중…'}</b><br><small class="muted">진행 단계는 진행자가 바꾸면 자동으로 맞춰집니다. 지금: <b>${phaseName()}</b></small></div></div>${isExploring()?`<button class="btn primary" style="width:100%;margin-top:10px;min-height:48px" onclick="setview('map')">산장 탐색하러 가기</button>`:''}`);
  return (i===0 && j>0) ? badge + h.slice(j+'</section>'.length) : badge + h;
};
window.syncResetGame = function(){
  if(!adminAuthenticated||!SYNC.on) return;
  if(!confirm('모든 참가자의 배정·증거·쪽지·투표를 지우고 새 게임을 시작할까요? 참가자 화면도 처음으로 돌아갑니다.')) return;
  const at=Date.now(); db.set(R(''), {resetAt:at}).then(()=>wipeLocal(at)).catch(e=>alert('초기화 실패: '+e.message));
};
const _adminPage = adminPage;
adminPage = function(){
  const h = _adminPage(); if(!adminAuthenticated) return h;
  if(!SYNC.on) return h + panel(`<h3>실시간 동기화 꺼짐</h3><p class="muted">index.html 맨 위의 FIREBASE_CONFIG 에 설정값을 넣으면 이 콘솔의 단계 전환이 모든 참가자 휴대폰에 바로 반영됩니다. 지금은 참가자가 진행 코드를 직접 입력하는 방식입니다.</p>`);
  const d=SYNC.data||{}, pres=Object.values(d.presence||{}), cast=d.cast||{}, ballots=d.ballots||{}, dec=d.decisions||{};
  const rows = activePeopleMap((p,i)=>{ const c=cast[String(i)], on=pres.some(x=>x.role===i);
    return `<tr><td>${String(dispNo(i)).padStart(2,'0')}</td><td>${safe(p.name)}</td><td>${c?safe(c.name):'<span class="muted">미배정</span>'}</td><td>${c?(on?'<span style="color:#7fb59a">접속</span>':'<span class="muted">오프라인</span>'):''}</td><td>${dec[String(i)]?'✔':''}</td><td>${ballots[String(i)]?((ballots[String(i)].votes||[]).length+'명'):''}</td></tr>`; }).join('');
  return h + panel(`<h3>실시간 동기화 · ${SYNC.connected?'<span style="color:#7fb59a">연결됨</span>':'<span class="warning">연결 끊김</span>'}</h3>
   <p class="muted">방 이름 <b>${safe(ROOM)}</b> · 위의 단계 버튼을 누르면 모든 참가자 화면이 함께 바뀝니다. 최후 선택 4분이 끝나면 자동으로 범인 투표로 넘어가고, 「엔딩 공개」는 전체 투표를 집계해 모두에게 같은 결과를 보여 줍니다.</p>
   <div class="tg-x"><table class="tg-grid"><tr><th>#</th><th>배역</th><th>참가자</th><th>상태</th><th>최후 선택</th><th>투표</th></tr>${rows}</table></div>
   <p style="margin-top:12px">${ui('','새 게임 시작 (전체 초기화)','syncResetGame()','outline')}</p>`);
};

// ── 시작 ──
async function start(){
  if (!CFG || !CFG.databaseURL) return;   // 설정 전: 오프라인 모드
  try{ db = await firebaseAdapter(); }
  catch(e){ console.warn('Firebase 연결 실패, 오프라인 모드로 동작', e); return; }
  SYNC.on = true; SYNC.db = db; SYNC.R = R;
  db.connected(c=>{ SYNC.connected=c; if(c) updatePresence(true); softRender(); });
  if (db.offset) db.offset(v=>{ SYNC.skew=v; });
  watchRoom();
  setInterval(()=>updatePresence(false), 4000);
}
let lastPres='';
function updatePresence(force){
  if(!SYNC.on || !SYNC.connected) return;
  const v = {role: state.role, name: state.name||'', admin: !!adminAuthenticated};
  const sig = JSON.stringify(v); if(!force && sig===lastPres) return; lastPres=sig;
  db.presence(R('presence/'+device), Object.assign({at:Date.now()}, v)).catch(()=>{});
}
window.SYNC_useAdapter = function(a){ db=a; SYNC.on=true; SYNC.connected=true; SYNC.db=db; SYNC.R=R; watchRoom(); updatePresence(true); };  // 테스트용
// 방 전체가 아니라 하위 항목별로 구독한다: 위치(pos) 갱신이 화면 전체를 다시 그리지 않도록.
function watchRoom(){
  const KEYS=['cast','claims','letters','decisions','ballots','stage','final','resetAt','presence','regs'];
  const cache={}, loaded=new Set(); let queued=false;
  KEYS.forEach(k=>db.watch(R(k), v=>{ if(v==null) delete cache[k]; else cache[k]=v; loaded.add(k);
    if(loaded.size<KEYS.length || queued) return; queued=true;
    setTimeout(()=>{ queued=false; apply(Object.assign({},cache)); },0); }));
}
start();
})();

</script>
<script>
// ═══ v22 · 1차 피드백 반영 (시간표·타이머 / 점수 / 등록 후 일괄 배정 / 같은 방 위치 / 관리자 시찰 / 채팅 / 전 기기 초기화) ═══
(function(){
'use strict';
// ───────── 1. 단계와 시간표 ─────────
const STAGES = [
  ['lobby','대기',0],
  ['opening','설정집 숙지',15],
  ['intro','오프닝',4],
  ['explore1','1차 증거 수집',20],
  ['discuss1','1차 대면 토론',20],
  ['explore2','2차 증거 수집 · 밀담',30],
  ['discuss2','2차 대면 토론',40],
  ['explore3','마지막 증거 수집',10],
  ['discuss3','최종 대면 토론',10],
  ['decision','개인 최후 선택',4],
  ['count','범인 수 예측',5],
  ['vote','최종 범인 투표',5],
  ['finished','사건 종료',0]
];
const NAME = Object.fromEntries(STAGES.map(s=>[s[0],s[1]]));
const DUR = Object.fromEntries(STAGES.map(s=>[s[0],s[2]]));
const ORDER = STAGES.map(s=>s[0]).filter(k=>k!=='decision');   // 최후 선택은 관리자가 원할 때만 끼워 넣는다
window.STAGE_NAMES = NAME;
const EXPLORE = ['explore1','explore2','explore3'];
const AFTER2 = ['explore2','discuss2','explore3','discuss3','decision','count','vote','finished'];
Object.assign(window.TG_DATA.stageCodes, {opening:'1500', explore3:'2230', discuss3:'2340', count:'0005'});

const now = ()=> (window.SYNC && SYNC.now) ? SYNC.now() : Date.now();
function remaining(){ return state.timerEnd>0 ? Math.max(0, state.timerEnd-now()) : null; }
function timeUp(){ return state.timerEnd>0 && now()>=state.timerEnd; }
function mmss(ms){ const t=Math.ceil(ms/1000); return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0'); }

phaseName = function(){ return NAME[state.stage] || '대기'; };
isExploring = function(){ return adminMapMode || (EXPLORE.includes(state.stage) && !timeUp()); };

// 알림음 · 진동 (첫 터치에서 오디오 잠금 해제)
let AC=null;
document.addEventListener('pointerdown', ()=>{ try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); }catch(e){} }, {passive:true});
function tone(freqs, len=0.16){ try{ if(!AC) return; let t=AC.currentTime; for(const f of freqs){ const o=AC.createOscillator(), g=AC.createGain(); o.type='sine'; o.frequency.value=f; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.25,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+len); o.connect(g).connect(AC.destination); o.start(t); o.stop(t+len+0.02); t+=len*0.9; } }catch(e){} }
function buzz(p){ try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} }
function toastTop(t){ let n=document.getElementById('syncToast'); if(!n){ n=document.createElement('div'); n.id='syncToast'; n.style.cssText='position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:10000;background:#e6c48b;color:#1a1408;font-weight:700;padding:9px 14px;border-radius:8px;box-shadow:0 6px 20px #0009;max-width:calc(100% - 32px);text-align:center;font-size:13.5px'; document.body.appendChild(n); } n.textContent=t; n.hidden=false; clearTimeout(n._t); n._t=setTimeout(()=>n.hidden=true,3600); }
window.SYNC_onStage = function(st){ tone([660,880]); buzz([120,60,120]); };

// 진행자: 단계 시작 · 시간 조정
startPhase = function(next){
  if(!adminAuthenticated){ alert('관리자 인증이 필요합니다.'); return; }
  const dur = DUR[next]||0, timerEnd = dur ? now()+dur*60000 : 0;
  const was = state.stage;
  state.stage = next; state.timerEnd = timerEnd; selectedPerson = -1;
  if(next==='decision') state.decision='';
  if(window.TG_isOpen && TG_isOpen() && !window.TG_ADMIN) TG_close();
  if(SYNC.on){ if(next==='lobby'||next==='opening'||next==='explore1') SYNC.db.remove(SYNC.R('final')).catch(()=>{}); SYNC_pushStage(next,{timerEnd}); }
  if(was!==next) tone([660,880]);
  rerender();
};
startDecision = function(){ startPhase('decision'); };
window.nextStage = function(){ const i=ORDER.indexOf(state.stage); const n=ORDER[Math.min(ORDER.length-1, i<0?1:i+1)]; if(n==='finished') return finalize(); startPhase(n); };
window.adjustTimer = function(min){
  if(!adminAuthenticated) return;
  let end = min===0 ? now() : Math.max(now(), state.timerEnd||now()) + min*60000;
  if(min<0) end = Math.max(now(), (state.timerEnd||now()) + min*60000);
  state.timerEnd = end; if(SYNC.on) SYNC_pushStage(state.stage,{timerEnd:end}); rerender();
};

// 매초: 남은 시간 표시, 1분 전 · 종료 알림, 수집 시간 종료 시 즉시 잠금
let lastRem=null;
setInterval(()=>{
  const rem = remaining(), top = el('phaseTop');
  if(top) { top.textContent = phaseName() + (rem!=null ? ' · '+mmss(rem) : ''); top.style.color = rem!=null && rem<60000 ? '#ffb79a' : ''; }
  const adm = document.getElementById('admTimer'); if(adm) adm.textContent = rem!=null ? mmss(rem) : '시간 제한 없음';
  const host = document.getElementById('tgHost'); const hud = host && host.shadowRoot && host.shadowRoot.getElementById('hudPhase');
  if(hud && window.TG_isOpen && TG_isOpen()) hud.textContent = (window.TG_ADMIN?'시찰 ':'') + ({explore1:'1차',explore2:'2차',explore3:'마지막'}[state.stage]||'') + (rem!=null?' '+mmss(rem):'');
  const db = document.getElementById('decTimer'); if(db) db.textContent = rem!=null ? mmss(rem) : '';
  if(rem!=null && lastRem!=null){
    if(lastRem>60000 && rem<=60000 && rem>0){ tone([880]); buzz(80); toastTop(`「${phaseName()}」 1분 남았습니다`); }
    if(lastRem>0 && rem===0){
      tone([880,660,440],0.22); buzz([200,80,200]);
      if(EXPLORE.includes(state.stage)){
        toastTop('증거 수집 시간이 끝났습니다. 조사가 잠깁니다.');
        if(window.TG_isOpen && TG_isOpen() && !window.TG_ADMIN) TG_close();
        if(view==='map') { view='home'; render(); }
      } else toastTop(`「${phaseName()}」 시간이 끝났습니다`);
    }
  }
  lastRem = rem;
  posTick();
}, 1000);

// ───────── 2. 내비게이션 · 화면 가드 (범인 수 예측 단계 추가) ─────────
const VOTE_STAGES = ['decision','count','vote'];
nav = function(){
  const n=el('nav'); if(adminMapMode){ n.innerHTML=''; n.style.display='none'; return; } n.style.display='';
  if(!role()){ n.innerHTML=''; return; }
  const special = state.stage==='finished' ? ['book','▤','스토리'] : VOTE_STAGES.includes(state.stage) ? ['vote','✓','투표'] : ['map','▦','지도'];
  const tabs=[['home','⌂','메인'],['role','♙','설정집'],['chat','▤','채팅'],special,['bag','▣','증거목록']];
  n.innerHTML = tabs.map(([v,ic,label])=>{ const disabled=v==='map'&&!isExploring(), mail=v==='chat'&&personalMail().some(x=>x.to===state.role&&!state.seenMailIds?.includes(x.id));
    return `<button ${disabled?'disabled':''} class="${v===view?'active':''}" onclick="setview('${v}')"><b>${ic}${mail?' <span style="color:#e8b777;font-size:10px">●</span>':''}</b>${label}</button>`; }).join('');
};
const _setview = setview;
setview = function(v){
  if(v==='vote' && VOTE_STAGES.includes(state.stage)){ view='vote'; render(); return; }
  if(v==='map' && EXPLORE.includes(state.stage) && timeUp()){ alert('이번 증거 수집 시간이 끝났습니다.'); return; }
  _setview(v);
};
render = function(){
  if(view==='map'&&!isExploring()) view='home';
  if(view==='vote'&&!VOTE_STAGES.includes(state.stage)) view='home';
  if(view==='book'&&state.stage!=='finished') view='home';
  const onboard=!role()&&view!=='admin'&&!adminMapMode;
  document.body.classList.toggle('onboarding',onboard);
  document.body.classList.toggle('admin-mode',view==='admin');
  document.body.classList.toggle('chat-open', !onboard && view==='chat' && activeConversation!==-1);
  nav();
  const rem=remaining(); el('phaseTop').textContent=phaseName()+(rem!=null?' · '+mmss(rem):'');
  el('app').innerHTML = onboard ? startPage() : ({home,role:rolePage,map:mapPage,bag:bagPage,chat:chatPage,vote:votePage,book:bookPage,admin:adminPage})[view]();
  nameEverywhere(el('app'));
  if(view==='chat' && activeConversation!==-1){ const st=el('chatStream'); if(st) st.scrollTop=st.scrollHeight; }
  persist();
};

// ───────── 3. 범인 수 예측 → 최종 투표 ─────────
function groupCount(){
  const b = (SYNC.on && SYNC.data && SYNC.data.ballots) || {};
  const cc={}; Object.entries(b).forEach(([i,v])=>{ if(roleActive(+i) && v && v.count) cc[v.count]=(cc[v.count]||0)+1; });
  const top = Object.entries(cc).sort((a,b)=>b[1]-a[1]||a[0]-b[0])[0];
  return top ? +top[0] : (state.count||1);
}
chooseCount = function(n){
  const ok = state.stage==='count' || (!SYNC.on && state.stage==='vote');
  if(!ok) return alert(state.stage==='vote' ? '지목 인원은 범인 수 예측 단계에서 이미 확정되었습니다.' : '범인 수 예측 시간이 아닙니다.');
  state.count=n; state.votes=(state.votes||[]).slice(0,n); state.ballotSubmitted=false; rerender(); if(window.SYNC_pushBallot) SYNC_pushBallot();
};
mainVotePanel = function(){
  if(state.stage==='count'){
    const b=(SYNC.data&&SYNC.data.ballots)||{}; const done=Object.keys(b).filter(i=>roleActive(+i)&&b[i]&&b[i].count).length;
    return `<h3>범인 수 예측 <span class="badge2 gold" id="decTimer"></span></h3><p>이번 사건에 가담한 사람은 모두 몇 명일까요? 주범과 공범을 합친 수를 고르세요.</p>
    <div class="row votecount">${[1,2,3,4].map(n=>ui('',n+'명',`chooseCount(${n})`,state.count===n?'primary':'outline')).join('')}</div>
    <p class="muted" style="margin-top:9px">참가자들이 가장 많이 고른 수가 <b>최종 지목 가능 인원</b>이 됩니다. ${SYNC.on?`(${done}/${PLAYER_COUNT}명 선택 완료)`:''}</p>`;
  }
  const fixed = SYNC.on ? groupCount() : state.count;
  return `<h3>최종 범인 투표 <span class="badge2 gold" id="decTimer"></span></h3><p>확정된 지목 인원은 <b>${fixed}명</b>입니다. 인물 카드를 눌러 지목하세요. 주범·공범을 구분하지 않습니다.</p>
  <p>지목권 <b>${state.votes.length} / ${fixed}</b>명 · 모두 쓰지 않아도 됩니다.</p>
  <p>${state.votes.length?state.votes.map(i=>safe(liveName(i))).join(' · '):'현재 지목한 인물 없음'}</p>
  <p class="footer-note">범인이 아닌 사람을 지목하면 1명당 1점이 깎입니다(범인 측은 감점 없음).</p>`;
};
votePage = function(){
  if(!role()) return panel('역할을 배정받으세요.');
  if(state.stage==='decision') return `<h2>마지막 선택</h2>${decisionPageV7()}`;
  if(!['count','vote'].includes(state.stage)) return panel('<h3>투표 대기 중</h3><p>범인 수 예측 단계가 열리면 이곳에서 투표합니다.</p>');
  return `<h2>${state.stage==='count'?'범인 수 예측':'최종 범인 투표'}</h2>${panel(mainVotePanel())}${state.stage==='vote'?panel(`<h3>인물 선택</h3><div class="cast-list">${activePeopleMap((p,i)=>personSummary(i)).join('')}</div>`):''}`;
};
const _home = home;
home = function(){ const h=_home(); if(role() && selectedPerson===-1 && state.stage==='count') return panel(mainVotePanel()) + h; return h; };
decisionPageV7 = function(){
  const cfg=decisionHelp(); const rem=remaining();
  return panel(`<h2>최후의 선택 <span class="badge2 gold" id="decTimer">${rem!=null?mmss(rem):''}</span></h2><p>범인 수 예측 전에 자신의 마지막 행동을 고릅니다. 시간이 끝나면 고른 내용이 그대로 확정됩니다.</p><h3>${safe(cfg.title)}</h3><p>${safe(cfg.desc)}</p>${cfg.options.map(([key,txt])=>`<button class="item ${state.decision===key?'selected':''}" style="width:100%;text-align:left" onclick="chooseDecision('${key}')">${state.decision===key?'◉':'○'} ${safe(txt)}</button>`).join('')}<p class="footer-note">고르지 않으면 침묵으로 처리됩니다.</p>`);
};

// ───────── 4. 점수 (0점 시작 · 음수 허용 · 핵심 5 + 추가 5 · 오지목 -1) ─────────
const KILLER=12, ACCOMPLICE=5;
const DEC_TXT={reveal:'폭로·자백',conceal:'은폐·침묵',deal:'거래'};
function wantDecision(i){ if(i===KILLER) return ['conceal']; if(i===ACCOMPLICE) return ['conceal','deal']; return ['reveal']; }
function wantLabel(i){ if(i===KILLER) return '최후 선택: 살인은 숨기고 어머니의 기록을 지킨다'; if(i===ACCOMPLICE) return '최후 선택: 끝까지 임수빈을 지킨다(은폐·거래)'; if(i===8||i===17) return '최후 선택: 살인 은폐에 가담하지 않고 사실대로 밝힌다'; return '최후 선택: 내가 가진 진실을 공개한다'; }
function scoreCtx(){
  const d = (SYNC.on && SYNC.data) || {};
  const ballots = Object.assign({}, d.ballots||{}); if(state.role>=0) ballots[state.role] = {count:state.count, votes:state.votes||[]};
  const decisions = Object.assign({}, d.decisions||{}); if(state.role>=0 && state.decision) decisions[state.role] = {key:state.decision};
  const finalVotes = (SYNC.final && Array.isArray(SYNC.final.votes)) ? SYNC.final.votes : (state.votes||[]);
  const world = worldClaimsV11();
  return {ballots, decisions, finalVotes, world, guilty: actualGuilty()};
}
window.scoreFor = function(i, c){
  c = c || scoreCtx();
  const p = DATA.people[i], my = ((c.ballots[i]||{}).votes||[]).filter(roleActive), dec = (c.decisions[i]||{}).key || '';
  const items=[];
  let coreLabel, coreOk;
  const decided = !!(SYNC.final && Array.isArray(SYNC.final.votes)) || state.stage==='finished';
  if(c.guilty.includes(i)){ coreLabel=(i===KILLER||i===ACCOMPLICE?'':'(은폐를 선택해 범인 측이 됨) ')+'최종 투표에서 본인이 검거(지목)되지 않기'; coreOk=decided && !c.finalVotes.includes(i); }
  else { coreLabel='최종 지목 명단에 진범(임수빈)이 포함되기'; coreOk=decided && c.finalVotes.includes(KILLER); }
  items.push({label:'핵심 · '+coreLabel, pts:5, ok:coreOk, note:decided?'':'최종 투표 결과가 나오면 판정됩니다'});
  const codes = (String(p.evidence).match(/E\d\d/g)||[]);
  const gotEv = codes.filter(code=>{ const w=c.world['E:'+code]; return w && w.owner===i; });
  items.push({label:`추가 · 나와 얽힌 핵심 증거 확보 (${codes.join('·')})`, pts:3, ok:gotEv.length>0, note:gotEv.length?gotEv.join('·')+' 보유':''});
  items.push({label:'추가 · '+wantLabel(i), pts:2, ok:wantDecision(i).includes(dec), note:dec?('선택: '+DEC_TXT[dec]):'선택 안 함'});
  const wrong = c.guilty.includes(i) ? [] : my.filter(v=>!c.guilty.includes(v));
  const plus = items.reduce((a,x)=>a+(x.ok?x.pts:0),0);
  return {items, wrong, total: plus - wrong.length};
};
function scorePanel(i){

window.TG_drawOthers = function(ctx,f,ox,oy,T,SC,t,sprite,roomAt,S){
  const me=myPosKey(), myRoom=roomAt(f,S.x,S.y);

    if(now()-(p.at||0) > 45*60000) continue;

      const r=roomAt(f,p.x,p.y);

    }

    const dx=p.x-d.x, dy=p.y-d.y, dist=Math.hypot(dx,dy);

  }

<script>// ═══ v23 · 2차 수정 (스토리북 v4 반영 · 감독 김세진 · 오프닝 연출/효과음/BGM · 자동 엔딩 · 진술 규칙 · 감독 참여 도구) ═══
(function(){
'use strict';
const V=window.V22, TG=window.TG_DATA, EN=TG.endings;
const DIRECTOR=15, KILLER=12, ACCOMPLICE=5;
const now=()=>SYNC.now?SYNC.now():Date.now();
const esc=s=>safe(String(s==null?'':s));
const paras=t=>String(t||'').split(/\n\s*\n/).map(b=>{const l=b.split('\n');return l.length>1&&l[0].length<40?`<h4 class="v23-era">${esc(l[0])}</h4><p class="storyp">${esc(l.slice(1).join(' '))}</p>`:`<p class="storyp">${esc(b)}</p>`;}).join('');

// ───────── 1. 사운드: 효과음 · 배경음 (외부 파일 없이 합성) ─────────
const SND_KEY='lastcheckin_sound';
let AC=null, MASTER=null, sfxBus=null, bgmBus=null;
function soundOn(){ try{ return localStorage.getItem(SND_KEY)!=='off'; }catch(e){ return true; } }
function ac(){
  if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); MASTER=AC.createGain(); MASTER.gain.value=soundOn()?1:0; MASTER.connect(AC.destination);
    sfxBus=AC.createGain(); sfxBus.gain.value=0.55; sfxBus.connect(MASTER); bgmBus=AC.createGain(); bgmBus.gain.value=0.22; bgmBus.connect(MASTER);}catch(e){ return null; } }
  if(AC.state==='suspended') AC.resume().catch(()=>{});
  return AC;
}
document.addEventListener('pointerdown',()=>{ ac(); },{passive:true});
window.toggleSound=function(){ const on=!soundOn(); try{ localStorage.setItem(SND_KEY,on?'on':'off'); }catch(e){} if(ac()) MASTER.gain.setTargetAtTime(on?1:0,AC.currentTime,0.05); const b=document.getElementById('sndBtn'); if(b) b.textContent=on?'♪':'♪̸'; if(on) syncMusic(true); };
function noiseBuf(sec){ const c=ac(); const b=c.createBuffer(1,c.sampleRate*sec,c.sampleRate); const d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; return b; }
function env(g,t,a,peak,dec){ g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(peak,t+a); g.gain.exponentialRampToValueAtTime(0.0001,t+a+dec); }
const SFX={
  thunder(){ const c=ac(); if(!c) return; const t=c.currentTime, s=c.createBufferSource(); s.buffer=noiseBuf(3); const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.setValueAtTime(900,t); f.frequency.exponentialRampToValueAtTime(80,t+2.5); const g=c.createGain(); env(g,t,0.05,0.9,2.6); s.connect(f).connect(g).connect(sfxBus); s.start(t); },
  powerDown(){ const c=ac(); if(!c) return; const t=c.currentTime, o=c.createOscillator(), g=c.createGain(); o.type='sawtooth'; o.frequency.setValueAtTime(180,t); o.frequency.exponentialRampToValueAtTime(28,t+1.6); env(g,t,0.02,0.35,1.7); const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=600; o.connect(f).connect(g).connect(sfxBus); o.start(t); o.stop(t+1.9); },
  powerUp(){ const c=ac(); if(!c) return; const t=c.currentTime, o=c.createOscillator(), g=c.createGain(); o.type='triangle'; o.frequency.setValueAtTime(40,t); o.frequency.exponentialRampToValueAtTime(120,t+0.9); env(g,t,0.3,0.2,1.2); o.connect(g).connect(sfxBus); o.start(t); o.stop(t+1.6); },
  tick(n=8){ const c=ac(); if(!c) return; for(let k=0;k<n;k++){ const t=c.currentTime+k*0.5, o=c.createOscillator(), g=c.createGain(); o.type='square'; o.frequency.value=k%2?1800:1500; env(g,t,0.002,0.12,0.04); o.connect(g).connect(sfxBus); o.start(t); o.stop(t+0.08); } },
  clink(){ const c=ac(); if(!c) return; [2093,2637,3136].forEach((f,k)=>{ const t=c.currentTime+k*0.01, o=c.createOscillator(), g=c.createGain(); o.type='sine'; o.frequency.value=f; env(g,t,0.003,0.18,1.1); o.connect(g).connect(sfxBus); o.start(t); o.stop(t+1.2); }); },
  door(){ const c=ac(); if(!c) return; const t=c.currentTime, o=c.createOscillator(), g=c.createGain(), f=c.createBiquadFilter(); o.type='sawtooth'; o.frequency.setValueAtTime(90,t); o.frequency.linearRampToValueAtTime(140,t+0.6); o.frequency.linearRampToValueAtTime(70,t+1.3); f.type='bandpass'; f.frequency.value=700; f.Q.value=6; env(g,t,0.15,0.3,1.2); o.connect(f).connect(g).connect(sfxBus); o.start(t); o.stop(t+1.5); },
  latch(){ const c=ac(); if(!c) return; const t=c.currentTime, s=c.createBufferSource(); s.buffer=noiseBuf(0.2); const f=c.createBiquadFilter(); f.type='highpass'; f.frequency.value=2500; const g=c.createGain(); env(g,t,0.002,0.7,0.12); s.connect(f).connect(g).connect(sfxBus); s.start(t); },
  scream(){ const c=ac(); if(!c) return; const t=c.currentTime; [311,330,466,494].forEach(fq=>{ const o=c.createOscillator(), g=c.createGain(); o.type='sawtooth'; o.frequency.setValueAtTime(fq,t); o.frequency.linearRampToValueAtTime(fq*1.06,t+1.2); env(g,t,0.02,0.16,1.8); const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=2400; o.connect(f).connect(g).connect(sfxBus); o.start(t); o.stop(t+2.1); }); SFX.thunder(); },
  steps(n=10){ const c=ac(); if(!c) return; for(let k=0;k<n;k++){ const t=c.currentTime+k*0.28+Math.random()*0.05, s=c.createBufferSource(); s.buffer=noiseBuf(0.15); const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=320; const g=c.createGain(); env(g,t,0.004,0.6,0.11); s.connect(f).connect(g).connect(sfxBus); s.start(t); } },
  heart(n=6){ const c=ac(); if(!c) return; for(let k=0;k<n;k++){ [0,0.22].forEach(d=>{ const t=c.currentTime+k*0.9+d, o=c.createOscillator(), g=c.createGain(); o.type='sine'; o.frequency.setValueAtTime(70,t); o.frequency.exponentialRampToValueAtTime(40,t+0.15); env(g,t,0.01,d?0.35:0.55,0.18); o.connect(g).connect(sfxBus); o.start(t); o.stop(t+0.3); }); } },
  radio(){ const c=ac(); if(!c) return; const t=c.currentTime, s=c.createBufferSource(); s.buffer=noiseBuf(0.7); const f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1800; f.Q.value=1.5; const g=c.createGain(); env(g,t,0.01,0.25,0.6); s.connect(f).connect(g).connect(sfxBus); s.start(t); setTimeout(()=>V.tone([784,1046],0.14),650); }
};
window.SFX=SFX;
// 배경음: 토론 = 잔잔한 패드 + 드문 종소리 / 오프닝 = 낮은 드론 + 바람 / 수집 = 아주 옅은 바람
let musicMode='', musicNodes=[], musicTimer=null;
function stopMusic(){ clearInterval(musicTimer); musicTimer=null; const c=AC; musicNodes.forEach(n=>{ try{ if(n.gain) n.gain.setTargetAtTime(0.0001,c.currentTime,0.6); setTimeout(()=>{ try{ n.src&&n.src.stop(); n.osc&&n.osc.forEach(o=>o.stop()); }catch(e){} },2500); }catch(e){} }); musicNodes=[]; musicMode=''; }
function wind(level){ const c=ac(); const s=c.createBufferSource(); s.buffer=noiseBuf(4); s.loop=true; const f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=500; f.Q.value=0.7; const lfo=c.createOscillator(), lg=c.createGain(); lfo.frequency.value=0.13; lg.gain.value=260; lfo.connect(lg).connect(f.frequency); const g=c.createGain(); g.gain.setValueAtTime(0.0001,c.currentTime); g.gain.exponentialRampToValueAtTime(level,c.currentTime+3); s.connect(f).connect(g).connect(bgmBus); s.start(); lfo.start(); musicNodes.push({src:s,gain:g,osc:[lfo]}); }
function drone(){ const c=ac(); const g=c.createGain(); g.gain.setValueAtTime(0.0001,c.currentTime); g.gain.exponentialRampToValueAtTime(0.35,c.currentTime+4); const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=380; const os=[55,82.4,110.5].map(fr=>{ const o=c.createOscillator(); o.type='sawtooth'; o.frequency.value=fr; o.connect(f); o.start(); return o; }); f.connect(g).connect(bgmBus); musicNodes.push({gain:g,osc:os}); }
const CHORDS=[[220,261.6,329.6],[174.6,220,261.6],[196,246.9,293.7],[164.8,207.7,246.9]];
const BELL=[440,523.3,587.3,659.3,784,880];
function pad(){ const c=ac(); let k=0;
  const play=()=>{ if(!AC) return; const t=c.currentTime, ch=CHORDS[k++%CHORDS.length], g=c.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.2,t+2.5); g.gain.exponentialRampToValueAtTime(0.0001,t+9.5); const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=900; f.connect(g).connect(bgmBus);
    ch.forEach(fr=>{ const o=c.createOscillator(); o.type='triangle'; o.frequency.value=fr/2; o.detune.value=(Math.random()-0.5)*8; o.connect(f); o.start(t); o.stop(t+10); });
    if(Math.random()<0.8){ const bt=t+2+Math.random()*4, o=c.createOscillator(), bg=c.createGain(); o.type='sine'; o.frequency.value=BELL[Math.floor(Math.random()*BELL.length)]; env(bg,bt,0.01,0.12,3.5); o.connect(bg).connect(bgmBus); o.start(bt); o.stop(bt+4); } };
  play(); musicTimer=setInterval(play,8000); }
function syncMusic(force){
  const st=state.stage, want = (st==='intro')?'intro' : ['discuss1','discuss2','discuss3','count','vote','decision'].includes(st)?'talk' : ['explore1','explore2','explore3'].includes(st)?'wind' : '';
  if(!force && want===musicMode) return;
  if(!AC){ if(want) ac(); if(!AC) return; }
  stopMusic(); musicMode=want; if(!soundOn()) return;
  if(want==='intro'){ drone(); wind(0.5); } else if(want==='talk'){ pad(); } else if(want==='wind'){ wind(0.18); }
}
setInterval(()=>syncMusic(false),1500);

// ───────── 2. 시작 위치: 모두 서재 앞(대기 공간·2층 복도)에서 ─────────
(function(){
  // v26: 좌표를 하드코딩하지 않고 방(waiting · hall2)과 서재 문(study 경계의 'D')에서 계산한다.
  const m=TG.maps.F2, U=window.MAP_UTIL || (()=>{ // 자체 계산 (MAP_UTIL 없이도 동작)
    const t=(x,y)=>(m.rows[y]||'')[x]||' ', room=(f,id)=>m.rooms.find(r=>r.id===id)||null, inRoom=(r,x,y)=>!!r&&x>=r.x&&x<r.x+r.w&&y>=r.y&&y<r.y+r.h;
    const stairApproach=(f,x,y)=>m.links.some(l=>{ if(l.x!==x) return false; let n=1; while(n<3&&['.',',','_'].includes(t(l.x,l.y+n))&&!m.links.some(o=>o.x===l.x&&o.y===l.y+n)) n++; return y>l.y&&y<l.y+n; });
    const doorOf=(f,id)=>{ const r=room(f,id); if(!r) return null; const W=room(f,'waiting'); let best=null;
      for(let y=r.y-1;y<=r.y+r.h;y++) for(let x=r.x-1;x<=r.x+r.w;x++){ if(t(x,y)!=='D') continue; const nb=[[1,0],[-1,0],[0,1],[0,-1]];
        if(!nb.some(([a,b])=>inRoom(r,x+a,y+b))) continue; const toW=nb.some(([a,b])=>inRoom(W,x+a,y+b)); if(!best||(toW&&!best.toW)) best={x,y,toW}; }
      return best; };
    return {room,inRoom,stairApproach,doorOf}; })();
  const ok=(x,y)=>{ const c=m.rows[y]&&m.rows[y][x]; return c && '.,_'.includes(c) && !m.spots[c] && !m.links.some(l=>l.x===x&&l.y===y) && !U.stairApproach('F2',x,y); };
  const W=U.room('F2','waiting'), H=U.room('F2','hall2');
  const door=U.doorOf('F2','study',['waiting','hall2']) || (W?{x:W.x+W.w,y:W.y+(W.h>>1)}:{x:0,y:0});
  const tiles=[]; for(let y=0;y<m.rows.length;y++) for(let x=0;x<m.rows[y].length;x++){ if((U.inRoom(W,x,y)||U.inRoom(H,x,y))&&ok(x,y)) tiles.push([x,y]); }
  tiles.sort((a,b)=>(Math.abs(a[0]-door.x)+Math.abs(a[1]-door.y)*1.2)-(Math.abs(b[0]-door.x)+Math.abs(b[1]-door.y)*1.2));
  const order=[10,6,7,1,15,13,2,3,4,5,8,9,11,12,18,19,16,14,17]; // 발견자·현장 통제자가 문 가까이
  if(tiles.length) order.forEach((id,k)=>{ const [x,y]=tiles[k*2%tiles.length]||tiles[k%tiles.length]; window.SPAWNS[id]={f:'F2',x,y,room:(U.inRoom(W,x,y)?W.name:(H?H.name:'2층 객실 복도'))}; });
})();

// ───────── 3. 진술 규칙 (거짓말은 범인 측만) ─────────
function lieRule(i){
  const g=DATA.people[i]&&DATA.people[i].guide;
  if(g&&g.rule) return g.rule;
  return [KILLER,ACCOMPLICE].includes(i)?'당신은 범인 측이라 거짓말을 할 수 있습니다.':'당신은 거짓말을 할 수 없습니다. 먼저 말하지 않아도 되지만, 질문받으면 사실대로 답해야 합니다.';
}
const RULES_HTML=`<ul class="v23-rules"><li><b>거짓말은 범인 측만</b> 할 수 있습니다. 범인 측이 아닌 사람은 사실만 말합니다.</li><li>불리한 사실은 <b>먼저 꺼내지 않아도</b> 됩니다.</li><li>하지만 누군가 <b>직접 물으면 반드시 사실대로 답해야</b> 합니다. 이때 맥락과 이유를 덧붙여 자신을 변호할 수 있습니다.</li><li>"모른다"는 정말 모를 때만 쓸 수 있습니다.</li></ul>`;
function guideHtml(i){
  const g=DATA.people[i].guide||{};
  return `<div class="notice" style="margin-bottom:12px"><b>${esc(lieRule(i))}</b></div>${RULES_HTML}
   <h4>답할 때 쓰는 말</h4><div class="v23-kw">${(g.keywords||[]).map(k=>`<span class="tag">${esc(k)}</span>`).join('')}</div>
   <h4>이렇게 물으면, 이렇게</h4>${(g.examples||[]).map(e=>`<div class="v23-qa"><div class="q">Q. ${esc(e.q)}</div><div class="a">A. ${esc(e.a)}</div></div>`).join('')}
   <p class="footer-note">답변 요령: 인정 → 시간·장소·함께 있던 사람 → "그건 살인과 별개"처럼 선 긋기.</p>`;
}

// ───────── 4. 엔딩 판정 A~F ─────────
window.v23EndingHtml=function(f){ return endingHtml(f); };
window.endingKey=function(votes){
  votes=(votes||[]).filter(roleActive);
  if(!votes.length) return 'F';
  const g=actualGuilty(), accs=g.filter(i=>i!==KILLER), named=accs.filter(i=>votes.includes(i)), innocent=votes.filter(i=>!g.includes(i));
  if(!votes.includes(KILLER)) return named.length?'D':'E';
  if(named.length===accs.length && !innocent.length) return 'A';
  if(!named.length && !innocent.length) return 'B';
  return 'C';
};
function finalVotes(){ return (SYNC.final&&Array.isArray(SYNC.final.votes))?SYNC.final.votes:(state.votes||[]); }
function interviews(){ return Object.keys(DIR.interviews||{}).length; }
function epilogueFor(i){ const n=DATA.people[i].name; return (EN.epilogues||{})[n]||''; }

    h+=`<h3>16명의 그날 이후</h3>${activePeopleMap((p,i)=>`<details class="v23-ep"><summary>${esc(liveName(i))} · ${esc(p.job)}</summary><p class="storyp">${esc(epilogueFor(i))}</p></details>`).join('')}`;

    h+=`<h3>다른 결말</h3>${Object.entries(EN.endings).filter(([k])=>k!==key).map(([k,e])=>`<details class="v23-ep"><summary>ENDING ${k} · ${esc(e.title)}</summary><p class="muted" style="font-size:12px">${esc(e.condition)}</p>${e.body.map(b=>`<p class="storyp">${esc(b)}</p>`).join('')}</details>`).join('')}`;
  }

bookPage=function(){

// ───────── 5. 설정집 (스토리북 v4) ─────────
let aliF='core';
window.v23AliF=function(k){ aliF=k; render(); };
window.v23Tip=function(i){ const n=document.getElementById('v23tip'+i); if(n) n.hidden=!n.hidden; };
function alibiTab(id){
  const a=TG.alibis.find(x=>x.id===id); if(!a) return '<p class="muted">알리바이 정보가 없습니다.</p>';
  const SAY={public:['공개','tg-say-pub'],careful:['조심','tg-say-care'],secret:['비밀','tg-say-sec']};

};

// ───────── 투표·예측·최후 선택에서는 제외 ─────────
const DIR_NOTE=()=>panel(`<h3>🎬 감독은 투표에 참여하지 않습니다</h3><p class="muted">참가자들의 진행 상황은 「관리자」 탭에서 확인하고, 시간이 끝나면 다음 단계로 넘기세요.</p>${ui('','관리자 패널 열기',"setview('admin')",'primary')}`);
const _mvp=mainVotePanel; mainVotePanel=function(){ return isDir()?'':_mvp.apply(this,arguments); };
const _dec=decisionPageV7; decisionPageV7=function(){ return isDir()?DIR_NOTE():_dec.apply(this,arguments); };
['chooseCount','toggleVote','chooseDecision','submitBallot'].forEach(k=>{ const f=window[k]; if(typeof f==='function') window[k]=function(){ if(isDir()) return V.toastTop('감독은 투표에 참여하지 않습니다.'); return f.apply(this,arguments); }; });

// ───────── 큰 타이머 (모든 홈 화면) ─────────
setInterval(()=>{ const t=document.getElementById('homeTimer'); if(!t) return; const r=V.remaining(); t.textContent=r!=null?V.mmss(r):'--:--'; t.classList.toggle('low', r!=null&&r<=60000); },500);

// ───────── 감독 메인 ─────────
function pendingHints(){ const all=letters(); const done=new Set(all.filter(m=>m.hintFor).map(m=>m.hintFor)); return all.filter(m=>m.hintReq&&m.to===DIR&&!done.has(m.id)).length; }
const _home=home;
home=function(){
  if(!isDir()) return _home();
  const r=V.remaining(), pend=pendingHints();
  const d=(SYNC.data)||{}, cast=d.cast||{}, pres=Object.values(d.presence||{});
  const assigned=ACTIVE_ROLE_INDICES.filter(i=>cast[String(i)]).length;
  const unread=personalMail().filter(x=>x.to===DIR&&!state.seenMailIds?.includes(x.id)).length;
  const next=(V.STAGES.map(s=>s[0]).filter(k=>k!=='decision'))[V.STAGES.map(s=>s[0]).filter(k=>k!=='decision').indexOf(state.stage)+1];
  return `<div class="sticky-status" style="background:#2a2216;border-color:#8d7650">🎬 <b>감독 김세진</b> · 17번 · 관리자<br><small>${SYNC.connected?'● 서버 연결됨':'○ 연결 중…'} · 배정 ${assigned}/16명</small></div>
  ${panel(`<div class="home-timer"><small>${esc(phaseName())}</small><b id="homeTimer">${r!=null?V.mmss(r):'--:--'}</b></div>
   ${adminAuthenticated?`<div class="row" style="gap:6px;justify-content:center">${ui('','−1분','adjustTimer(-1)','outline')}${ui('','+1분','adjustTimer(1)','outline')}${ui('','+5분','adjustTimer(5)','outline')}${next?ui('',`다음: ${esc(V.NAME[next]||next)} ▶`,'nextStage()','primary'):''}</div>`:`<p class="muted" style="text-align:center">진행 조작은 「관리자」 탭에서 비밀번호 확인 후 할 수 있습니다.</p>`}`)}
  ${pend?panel(`<h3>🎬 힌트 요청 ${pend}건</h3><p>참가자가 촬영 자료를 제시했습니다. 대본을 읽어 주고 「전달」을 누르세요.</p>${ui('','요청 보러 가기',"setview('admin')",'primary')}`):''}
  ${unread?panel(`<h3>💬 새 메시지 ${unread}건</h3>${ui('','채팅 열기',"setview('chat')",'primary')}`):''}
  ${panel(`<h3>오늘 감독이 할 일</h3><ul class="v23-rules">
   <li><b>설정집 숙지·오프닝</b>: 오프닝 끝의 낭독 카드를 직접 읽어 주세요.</li>
   <li><b>1차 토론부터</b>: D-01을 가져온 사람에게 힌트 A, <b>2차 수집부터</b> D-02에 힌트 B.</li>
   <li><b>밀담 시간</b>: 참가자를 인터뷰하고 「관리자 › 인터뷰 기록」에 체크(8명↑ 특별 후일담).</li>
   <li><b>토론이 늘어질 때</b>: 「관리자 › 돌발 공지」로 무전·속보를 보내세요.</li>
   <li>범인은 말하지 않습니다. 증거 없이 물으면 “원본을 확인 중입니다.”</li></ul>`)}
  ${castOverview()}`;
};
function castOverview(){
  const d=(SYNC.data)||{}, cast=d.cast||{}, pres=Object.values(d.presence||{});
  return panel(`<h3>참가자 (${ACTIVE_ROLE_INDICES.filter(i=>cast[String(i)]).length}/16)</h3><div class="v24-cast">${[...ORDER,DIR].map(i=>{ const c=cast[String(i)], on=pres.some(x=>x&&x.role===i);
    return `<button class="v24-chip ${on?'on':''}" onclick="${i===DIR?'':`setview('chat');openConversation(${i})`}"><span>${String(dispNo(i)).padStart(2,'0')}</span><b>${esc(DATA.people[i].name)}</b><small>${c?esc(c.name):'미배정'}</small></button>`; }).join('')}</div>`);
}

// ───────── 감독 설정집 ─────────
const _role=rolePage;
let dirTab='story';
window.v24DirTab=function(k){ dirTab=k; render(); };
rolePage=function(){
  if(!isDir()) return _role();
  const p=DATA.people[DIR], h=p.hints||{};
  const tabs=[['story','인물 이야기'],['script','감독 대본'],['schedule','시간별 행적'],['ending','📖 엔딩북'],['memo','메모']];
  const paras=t=>String(t||'').split(/\n\s*\n/).map(b=>{const l=b.split('\n');return l.length>1&&l[0].length<40?`<h4 class="v23-era">${esc(l[0])}</h4><p class="storyp">${esc(l.slice(1).join(' '))}</p>`:`<p class="storyp">${esc(b)}</p>`;}).join('');
  const C={
    story:`<h3>당신은 어떤 사람인가</h3>${p.oneLine?`<p class="storyp"><b>${esc(p.oneLine)}</b></p>`:''}${paras(p.prologue)}${p.purpose?`<h4>청명산장에 온 목적</h4><p class="storyp">${esc(p.purpose)}</p>`:''}${p.background?`<h4>이곳에서 마주할 사람들</h4>${paras(p.background)}`:''}${p.actingTip?`<h4>연기할 때</h4><p class="storyp">${esc(p.actingTip)}</p>`:''}${(p.quotes||[]).map(q=>`<blockquote class="v23-quote">${esc(q)}</blockquote>`).join('')}`,
    script:`<h3>힌트 대본</h3>${['A','B'].map(k=>h[k]?`<div class="entry"><span class="tag">힌트 ${k}</span> <small class="muted">${esc(h[k].condition||'')}</small><div class="v23-script">“${esc(h[k].script||'')}”</div></div>`:'').join('')}
      <h4>증거 없이 물으면</h4><div class="v23-script">“${esc(h.noEvidence||'원본을 확인 중입니다.')}”</div>
      <h4>하면 안 되는 말</h4><ul>${(h.forbidden||[]).map(f=>`<li>${esc(f)}</li>`).join('')}</ul>
      <h4>전용 소품</h4><ul>${(p.props||[]).map(f=>`<li>${esc(Array.isArray(f)?f.join(' · '):f)}</li>`).join('')}</ul>
      <h4>진행 대사</h4><div class="v23-script">“오늘 이곳에 오신 분들은 한 가지 일에 연결되어 있습니다. 오래전에 끝났다고 믿었던 청명 프로젝트입니다. 청명그룹 서도윤 대표는 자정에 그 진실을 공개하겠다고 했습니다. 그러나 그는 지금 서재에서 숨진 채 발견되었습니다. 범인을 결정하기 전에, 각자가 무엇을 보았고 무엇을 숨기고 있는지부터 확인하십시오.”</div>`,
    schedule:`<h3>11월 7일 · 시간별 행적</h3><div class="timeline">${(p.daySchedule||[]).map(r=>`<div class="timeline-row"><div class="clock">${esc(r.time)}</div><div class="time-detail"><b>${esc(r.place)}</b><p>${esc(r.detail)}</p>${r.corroboration?`<div class="witness">교차 확인: ${esc(r.corroboration)}</div>`:''}</div></div>`).join('')}</div>`,
    memo:`<h3>감독 메모</h3><textarea class="field area" id="note" style="min-height:260px" placeholder="인터뷰 내용, 눈여겨볼 참가자 등을 기록하세요.">${esc(state.notes)}</textarea><br><br>${ui('','메모 저장',"state.notes=el('note').value;rerender()",'primary')}`
  };
  const body = dirTab==='ending' ? `<div class="notice">진행자 전용: 결말과 진범이 모두 나옵니다. 참가자에게 화면이 보이지 않게 하세요.</div>`+(state.stage==='finished'&&window.v23EndingHtml ? panel(v23EndingHtml(true)) : allEndings()) : panel(C[dirTab]||C.story);
  return `<h2>감독 설정집</h2><div class="card profile-cover"><small class="muted">DIRECTOR BOOK · ROLE 17</small><h2>${esc(p.declaration)}</h2><p class="muted">관리자 · 투표 제외 · 채팅·지도·공지 참여</p></div><div class="tabs">${tabs.map(([k,l])=>ui('',l,`v24DirTab('${k}')`,dirTab===k?'primary':'outline')).join('')}</div>${body}`;
};

function allEndings(){
  const EN=TG_DATA.endings||{}; const P=t=>`<p class="storyp">${esc(t)}</p>`;
  return panel(`<h3>엔딩 판정 (최종 투표로 자동 결정)</h3>${Object.entries(EN.endings||{}).map(([k,e])=>`<details class="v23-ep"><summary>ENDING ${k} · ${esc(e.title)}</summary><p class="muted" style="font-size:12px">${esc(e.condition)}</p>${(e.body||[]).map(P).join('')}</details>`).join('')}`)
   + panel(`<h3>사건의 해설</h3>${(EN.explain||[]).map(P).join('')}<div class="v23-box">${Object.entries(EN.box||{}).map(([k,v])=>`<div><b>${esc(k)}</b> ${esc(v)}</div>`).join('')}</div>`)
   + panel(`<h3>그날 이후</h3>${Object.entries(EN.epilogues||{}).map(([n,t])=>`<details class="v23-ep"><summary>${esc(n)}</summary>${P(t)}</details>`).join('')}`);
}

// ───────── 스타일 ─────────
const css=document.createElement('style');
css.textContent=`
.home-timer{text-align:center;padding:4px 0 10px}.home-timer small{display:block;color:var(--gold);letter-spacing:.08em;font-size:12.5px}
.home-timer b{display:block;font-family:Georgia,'Nanum Myeongjo',serif;font-size:clamp(52px,17vw,76px);line-height:1.05;color:#f5deb1;font-variant-numeric:tabular-nums;letter-spacing:.04em;text-shadow:0 0 22px #c8a76844}
.home-timer b.low{color:#ff9f86;animation:v24pulse 1s infinite}@keyframes v24pulse{50%{opacity:.55}}
body.admin-mode.dir-nav>nav.nav,body.admin-mode.dir-nav>nav{display:grid!important}
body.admin-mode.dir-nav:has(.admin-map-back)>nav.nav{display:none!important}
.v24-cast{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.v24-chip{display:grid;grid-template-columns:28px 1fr;align-items:center;text-align:left;background:#132235;border:1px solid var(--line);border-radius:10px;padding:7px 9px;color:inherit}
.v24-chip span{grid-row:span 2;color:var(--gold);font-weight:700}.v24-chip b{font-size:13px}.v24-chip small{color:var(--mute);font-size:11px}
.v24-chip.on{border-color:#7fb59a}
`;
document.head.appendChild(css);
render();
})();
</script>
</body></html>
