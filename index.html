/* v12 | thumb-operated analog joystick, fixed in the map screen only */
.v12-joy-row{display:flex;align-items:center;justify-content:center;gap:20px;margin:14px auto 11px;max-width:410px;padding:4px 6px 8px}
.v12-pad{width:132px;height:132px;flex:0 0 132px;position:relative;display:grid;place-items:center;border-radius:50%;border:2px solid #738ba4;background:radial-gradient(circle at 50% 44%,#28415a,#111f32 72%);box-shadow:inset 0 2px 18px #020813,0 5px 15px #0007;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;cursor:grab}
.v12-pad:active{cursor:grabbing;border-color:#d3b47b}
.v12-pad-guide{position:absolute;inset:16px;border:1px dashed #546b83;border-radius:50%;pointer-events:none}
.v12-pad-guide:after{content:'✦';color:#5c7490;display:grid;place-items:center;height:100%;font-size:18px}
.v12-knob{position:absolute;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;color:#d9e6f5;font-size:15px;line-height:1;border:2px solid #a9bfda;background:linear-gradient(135deg,#647e9c,#304862);box-shadow:0 4px 13px #0009;pointer-events:none;will-change:transform;transition:none}
.v12-joy-help{display:flex;flex-direction:column;gap:7px;min-width:0;max-width:210px}.v12-joy-help b{font-size:15px;color:#ecd2a6}.v12-joy-help span{font-size:12px;line-height:1.65;color:#d5dfeb}.v12-joy-help small{font-size:11px;line-height:1.5;color:#97aec3}
@media(max-width:360px){.v12-joy-row{gap:14px}.v12-pad{width:112px;height:112px;flex-basis:112px}.v12-knob{width:52px;height:52px}.v12-joy-help span{font-size:11px}}

/* V13 — furnished investigation rooms and translucent touch controls */
.v13-map-shell{position:relative;border-radius:17px;overflow:hidden;border:2px solid #9f875e;box-shadow:0 15px 35px #0009,0 0 0 4px #1d2529;background:#0a151c}
.v13-map-stage{position:relative;width:100%;aspect-ratio:11 / 9;overflow:hidden;isolation:isolate}
.v13-underlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;display:block}
.v13-map-stage .v11-map{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:11/9;background:transparent;border:0;gap:0;z-index:2;overflow:hidden}
.v13-map-stage .v11-cell{background:transparent!important;border:0!important;filter:none!important;box-shadow:none!important;color:transparent;opacity:1;outline-offset:-2px;cursor:default}
.v13-map-stage .v11-cell.floor{cursor:pointer}
.v13-map-stage .v11-cell.wall,.v13-map-stage .v11-cell.furn{pointer-events:none}
.v13-map-stage .v11-cell.door{color:#dbd1ae;pointer-events:none}
.v13-map-stage .v11-cell.has-object{cursor:pointer;color:inherit;overflow:visible;z-index:3}
.v13-map-stage .v11-cell.has-object:before{content:'';position:absolute;inset:9%;border:1px solid rgba(219,178,95,.33);border-radius:6px;box-shadow:0 0 8px rgba(225,180,103,.13);pointer-events:none}
.v13-map-stage .v11-cell.has-object.nearby:before{border-color:#f6d58b;box-shadow:0 0 0 2px #d9a85d33,0 0 17px #f9d8879c;animation:v13glow 1.65s ease-in-out infinite alternate}
.v13-map-stage .v11-cell.has-object.targeted:before{border:2px solid #fff1b1;box-shadow:0 0 0 3px #b48b4788,0 0 20px #fff2b5}
@keyframes v13glow{to{box-shadow:0 0 0 3px #f0c97b45,0 0 19px #f9d887c9}}
.v13-map-stage .v11-cell.has-object:active{transform:none}
.v13-map-stage .v11-cell.avatar-player{z-index:6;filter:drop-shadow(0 1px 2px #0007)!important;color:initial}
.v13-object-svg,.v13-avatar-svg{height:100%;width:100%;display:block;overflow:visible;pointer-events:none}
.v13-avatar-svg{filter:drop-shadow(0 2px 2px rgba(0,0,0,.6))}
.v13-map-chip{position:absolute;left:8px;top:7px;background:#091820b9;border:1px solid #f0d4a16b;backdrop-filter:blur(5px);border-radius:7px;color:#f7e5c4;font-weight:800;font-size:10px;z-index:7;padding:5px 8px;pointer-events:none}
.v13-map-floor{position:absolute;right:7px;top:7px;background:#111d259c;border:1px solid #a5b1b54f;backdrop-filter:blur(3px);border-radius:6px;color:#e6e7dd;font-size:9px;padding:5px 7px;z-index:7;pointer-events:none}
.v13-controls{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 14px 10px;background:linear-gradient(150deg,#172838e0,#101b2aef);border-top:1px solid #8f7e6355}
.v13-controls .v12-pad{width:112px;height:112px;flex:0 0 112px;opacity:.72;background:radial-gradient(circle at 45% 40%,#8295a348,#263c4d84 57%,#1023329a 100%);border:2px solid #d5dfe4a2;box-shadow:inset 0 0 19px #050b0d75,0 2px 14px #0a111564;backdrop-filter:blur(7px);transition:opacity .14s}
.v13-controls .v12-pad:active{opacity:.95;border-color:#e6d3ab}
.v13-controls .v12-pad-guide{inset:12px;border-color:#c3c9c976}
.v13-controls .v12-pad-guide:after{content:'+';color:#bdcbd785;font-size:27px;font-weight:300}
.v13-controls .v12-knob{width:53px;height:53px;color:#f5e9d0;opacity:.91;background:linear-gradient(155deg,#8496a2a8,#365066ae);border:1.5px solid #e2e8e5aa;box-shadow:0 4px 11px #0006;backdrop-filter:blur(5px)}
.v13-action-group{display:flex;align-items:center;flex-direction:column;justify-content:center;gap:5px;min-width:110px}
.v13-action{display:flex;align-items:center;justify-content:center;flex-direction:column;width:90px;height:90px;border-radius:50%;border:2px solid #d8c69d9c;background:radial-gradient(circle at 34% 25%,#e5d29e48,#6c5a4270 66%,#2e30319c);color:#faf1df;font-weight:900;font-size:25px;line-height:1;box-shadow:inset 0 0 16px #0002,0 4px 16px #0006;backdrop-filter:blur(8px);touch-action:manipulation;user-select:none;-webkit-tap-highlight-color:transparent;opacity:.78;transition:transform .08s,opacity .12s}
.v13-action:active{opacity:1;transform:scale(.94);background:#997746bd}
.v13-action span{display:block;font-size:11px;letter-spacing:1px;margin-top:6px;font-weight:750}
.v13-action-group small{color:#c7d0d3;font-size:10px;text-align:center;white-space:nowrap}
.v13-explore-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0 9px}
.v13-explore-top b{font-family:Georgia,'Noto Serif KR',serif;font-size:19px;letter-spacing:.2px;color:#ecdcb7}
.v13-explore-top span{font-size:10px;color:#a1b5be}
.v13-mini-guide{font-size:11px;line-height:1.6;color:#bbcad3;margin:9px 0 13px}
.v13-selected{color:#dfca9d!important}
@media(max-width:370px){.v13-controls{padding:11px 10px 9px;gap:9px}.v13-controls .v12-pad{width:99px;height:99px;flex-basis:99px}.v13-controls .v12-knob{width:47px;height:47px}.v13-action{width:82px;height:82px}.v13-action-group{min-width:94px}}

</style></head><body><header><div class="btk-brand" aria-label="마지막 초대장, Made by BTK"><span class="btk-brand-title">◈ 마지막 초대장</span><span class="btk-brand-credit">MADE BY <strong>BTK</strong></span></div><div><small id="phaseTop">LOCAL DEMO</small> <button class="btn outline" onclick="openAdmin()" style="padding:5px 8px;min-height:29px;font-size:11px">관리자</button> </div></header><main class="shell" id="app"></main><nav class="nav" id="nav"></nav><script>const DATA={"people":[{"name":"강태준","job":"부대표","team":"정보 비공개","motive":"당신은 서도윤과 십오 년 동안 회사를 키웠다. 그러나 성과를 독점하고 위기가 오면 부하에게 책임을 떠넘기는 서도윤의 방식에 이미 오래전부터 균열이 생겼다. 10년 전 청명 프로젝트 사고 이후, 당신은 자금을 빼돌린 회계 처리와 은폐 계약 일부에 서명했다. 이번 폭로가 실제로 이루어진다면 서도윤뿐 아니라 당신도 몰락한다. 당신은 진실을 막기 위해 이곳에 왔지만, 누군가를 죽일 계획까지 세운 것은 아니다.","secret":"21시 33분, 서도윤은 당신에게 “오늘 밤 자료가 공개되면 너도 끝이야”라고 말했다. 당신은 서재에서 나와 회계실로 향했고, 21시 40분에는 서재가 아닌 1층에 있었다. 하지만 투자 계약서 원본을 훔치려 했던 사실을 감추고 싶다.","items":"접힌 사업계약서 / 만년필 / 서재 보조문 도면 사본","alibi":"19:02 로비 체크인하면서 최민서가 전달한 봉투를 받았다. / 19:35 식당 서도윤 맞은편 자리에서 식사했다. / 20:00 식당 서도윤의 폭로 선언에 처음으로 반박했다. / 20:44 회계실 윤서아와 프로젝트 정산 자료를 두고 실랑이했다. / 21:10 2층 서재 앞 서도윤에게 지분 계약을 돌려달라고 언쟁했다. / 21:24 2층 계단 서재를 떠나 1층으로 내려왔다. / 21:33 회계실 복도 투자 계약서가 든 문서함을 확인했다. / 21:40 1층 회계실 정전 때 휴대전화 불빛으로 책상 아래 서류를 확인했다. / 21:49 식당 방향 복도 조은호와 마주쳐 자금 문제를 더 이야기하지 않겠다고 말했다. / 22:05 로비 서재에서 누군가 죽었다는 말을 듣고 2층으로 올라갔다.","evidence":"E15 투자 지분 계약서, E17 보조문 수리 기록","mission":"E09 이중장부와 E15 지분계약을 대조하여 자기 서명이 무엇을 보증했는지 확인한다. / 윤서아가 가진 정산 내역을 확보하거나 증언을 받아 불리한 오해를 풀어낸다. / 자신의 자료 은닉 시도를 공개할지 끝까지 비밀로 할지 선택한다.","links":"서도윤과 당신은 자주 충돌했으며, 이번에는 청명 프로젝트의 원본 장부와 지분 계약을 회수하려 했다. 21시 10분 서재 앞에서 목소리를 높인 이유도 그것이다. 당신의 공격적인 말투는 많은 사람의 기억에 남았다. 불리한 자료를 숨기려는 행동과 살인에 가담한 행동은 구별되어야 한다.","revelation":"21시 10분의 공개적인 언쟁 때문에 가장 먼저 의심받을 수 있다. 당신이 서재 도면 사본을 소지한 것은 과거 리모델링 투자 검토 때문이지만 남들이 믿을지는 알 수 없다.","id":1,"declaration":"당신은 오랫동안 회사의 비밀을 지켜온 부대표입니다.","prologue":"당신은 서도윤과 십오 년 동안 회사를 키웠다. 그러나 성과를 독점하고 위기가 오면 부하에게 책임을 떠넘기는 서도윤의 방식에 이미 오래전부터 균열이 생겼다. 10년 전 청명 프로젝트 사고 이후, 당신은 자금을 빼돌린 회계 처리와 은폐 계약 일부에 서명했다. 이번 폭로가 실제로 이루어진다면 서도윤뿐 아니라 당신도 몰락한다. 당신은 진실을 막기 위해 이곳에 왔지만, 누군가를 죽일 계획까지 세운 것은 아니다.","background":"서도윤과 당신은 자주 충돌했으며, 이번에는 청명 프로젝트의 원본 장부와 지분 계약을 회수하려 했다. 21시 10분 서재 앞에서 목소리를 높인 이유도 그것이다. 당신의 공격적인 말투는 많은 사람의 기억에 남았다. 불리한 자료를 숨기려는 행동과 살인에 가담한 행동은 구별되어야 한다.","privateKnowledge":"21시 33분, 서도윤은 당신에게 “오늘 밤 자료가 공개되면 너도 끝이야”라고 말했다. 당신은 서재에서 나와 회계실로 향했고, 21시 40분에는 서재가 아닌 1층에 있었다. 하지만 투자 계약서 원본을 훔치려 했던 사실을 감추고 싶다.","weakPoint":"21시 10분의 공개적인 언쟁 때문에 가장 먼저 의심받을 수 있다. 당신이 서재 도면 사본을 소지한 것은 과거 리모델링 투자 검토 때문이지만 남들이 믿을지는 알 수 없다.","daySchedule":[{"time":"09:10","place":"회사 회의실","detail":"서도윤이 보낸 수정 투자계약을 열어보았다.","corroboration":"메일 열람 시간이 남는다.","visibility":"알려져도 됨"},{"time":"15:20","place":"산장으로 가는 차량","detail":"조은호에게 지분 계약의 원본을 가져오라고 연락했다.","corroboration":"조은호가 연락을 받았다.","visibility":"알려져도 됨"},{"time":"19:02","place":"로비","detail":"체크인하면서 최민서가 전달한 봉투를 받았다.","corroboration":"최민서가 봉투 전달을 알고 있다.","visibility":"알려져도 됨"},{"time":"19:35","place":"식당","detail":"서도윤 맞은편 자리에서 식사했다.","corroboration":"윤서아와 조은호가 같은 테이블에 있었다.","visibility":"알려져도 됨"},{"time":"20:00","place":"식당","detail":"서도윤의 폭로 선언에 처음으로 반박했다.","corroboration":"대부분의 참석자가 기억한다.","visibility":"알려져도 됨"},{"time":"20:44","place":"회계실","detail":"윤서아와 프로젝트 정산 자료를 두고 실랑이했다.","corroboration":"윤서아가 당시의 대화를 기억한다.","visibility":"알려져도 됨"},{"time":"21:10","place":"2층 서재 앞","detail":"서도윤에게 지분 계약을 돌려달라고 언쟁했다.","corroboration":"정유리와 최민서가 목소리를 들었다.","visibility":"알려져도 됨"},{"time":"21:24","place":"2층 계단","detail":"서재를 떠나 1층으로 내려왔다.","corroboration":"이재혁이 계단에서 당신을 보았다.","visibility":"알려져도 됨"},{"time":"21:33","place":"회계실 복도","detail":"투자 계약서가 든 문서함을 확인했다.","corroboration":"윤서아가 복도에서 펜 소리를 들었다.","visibility":"알려져도 됨"},{"time":"21:40","place":"1층 회계실","detail":"정전 때 휴대전화 불빛으로 책상 아래 서류를 확인했다.","corroboration":"윤서아의 휴대전화 통화기록이 근처 위치를 뒷받침한다.","visibility":"알려져도 됨"},{"time":"21:49","place":"식당 방향 복도","detail":"조은호와 마주쳐 자금 문제를 더 이야기하지 않겠다고 말했다.","corroboration":"조은호가 목격했다.","visibility":"알려져도 됨"},{"time":"22:05","place":"로비","detail":"서재에서 누군가 죽었다 원","team":"정보 비공개","motive":"당신은 사고 당시 청명 프로젝트의 실험 데이터를 수집하는 연구원이었다. 안전 이상 신호가 나타난 날, 당신은 실험 중단을 권고했지만 공식 보고서에는 당신이 실험을 강행한 책임자로 남았다. 그 이후 학계에서 자리를 잃었다. 산장 초대장에는 “원본 노트가 있다”라는 한 줄이 적혀 있었다.","secret":"21시 27분 자료실에서 신우진과 마주쳤다. 두 사람은 공개적으로 언쟁하지 않았지만 “잃어버린 페이지”를 두고 대립했다. 정전 중 자료실 인근에서 신우진과 손전등 불빛을 교차했다.","items":"찢긴 실험 수첩 / 연구실 사진 / 자물쇠 열쇠","alibi":"19:12 로비 오세린이 오래된 사고 현장 사진을 꺼내는 것을 봤다. / 19:38 식당 서도윤의 왼쪽 뒤편에서 식사했다. / 20:16 라운지 한지훈에게 과거 수사 누락 페이지를 설명했다. / 20:52 자료실 연구노트가 잠겨 있는 캐비닛을 찾았다. / 21:27 자료실 신우진과 누락된 실험 페이지를 놓고 이야기했다. / 21:39 자료실 손전등을 켜며 문 쪽으로 이동했다. / 21:43 자료실 문앞 신우진과 마주쳤다. / 21:51 1층 계단 차시온이 카메라 배터리를 교체하는 것을 봤다. / 21:58 라운지 신우진이 왜 2층에 갔는지 물었다. / 22:05 로비 백하린의 비상 연락을 들었다.","evidence":"E02 원본 연구노트, E03 사고 보고서","mission":"E02 연구노트와 E03 수정 사고 보고서를 비교해 삭제된 페이지의 내용을 찾는다. / 신우진에게 연구 중지 권고가 전달된 시각을 확인한다. / 임혜정의 기록을 원본 그대로 제출할지 고민한다.","links":"원본 실험노트와 수정된 사고 보고서 사이에는 삭제된 두 페이지가 있다. 그 페이지에는 임혜정이라는 참가자의 이상 반응과 연구 중단 요청이 기록되어 있다. 임수빈이 그 가족이라는 사실은 아직 모른다. 신우진이 사고를 완전히 막지 못했던 이유도 확인하고 싶다.","revelation":"당신은 사고 당일 위험한 데이터의 복사본을 허락 없이 가져왔다. 이것이 드러나면 연구자료 유출자로 의심받을 수 있다.","id":3,"declaration":"당신은 10년 전의 실험 기록을 되찾으려는 연구원입니다.","prologue":"당신은 사고 당시 청명 프로젝트의 실험 데이터를 수집하는 연구원이었다. 안전 이상 신호가 나타난 날, 당신은 실험 중단을 권고했지만 공식 보고서에는 당신이 실험을 강행한 책임자로 남았다. 그 이후 학계에서 자리를 잃었다. 산장 초대장에는 “원본 노트가 있다”라는 한 줄이 적혀 있었다.","background":"원본 실험노트와 수정된 사고 보고서 사이에는 삭제된 두 페이지가 있다. 그 페이지에는 임혜정이라는 참가자의 이상 반응과 연구 중단 요청이 기록되어 있다. 임수빈이 그 가족이라는 사실은 아직 모른다. 신우진이 사고를 완전히 막지 못했던 이유도 확인하고 싶다.","privateKnowledge":"21시 27분 자료실에서 신우진과 마주쳤다. 두 사람은 공개적으로 언쟁하지 않았지만 “잃어버린 페이지”를 두고 대립했다. 정전 중 자료실 인근에서 신우진과 손전등 불빛을 교차했다.","weakPoint":"당신은 사고 당일 위험한 데이터의 복사본을 허락 없이 가져왔다. 이것이 드러나면 연구자료 유출자로 의심받을 수 있다.","daySchedule":[{"time":"09:40","place":"자택 서재","detail":"원본 연구노트와 수정 보고서의 장 번호를 비교했다.","corroboration":"책상에 표시해 둔 인덱스가 있다.","visibility":"알려져도 됨"},{"time":"16:50","place":"산장 입구","detail":"연구실 사진이 담긴 서류 봉투를 챙겼다.","corroboration":"산장 입구 CCTV에 봉투를 든 모습이 남아 있다.","visibility":"알려져도 됨"},{"time":"19:12","place":"로비","detail":"오세린이 오래된 사 상 속 얼굴을 확인했다. / 21:39 자료실 녹음 복원용 노트북을 연결했다. / 21:47 2층 복도 자료실 문을 열자 구두 소리와 급한 숨소리가 들렸다. 얼굴은 확인하지 못했다. / 21:49 자료실 앞 신우진과 마주쳐 어디에 있었는지 물었다. / 21:56 라운지 차시온에게 원본 음성 비교를 요청했다. / 22:05 로비 백하린의 외침을 듣고 녹음 버튼을 눌렀다.","evidence":"E04 녹음 2·3번, E16 홍보 대응 지침","mission":"E04의 세 조각과 E20 복구된 음성을 서로 대조한다. / 서재 밖의 발소리와 실제 이동 기록을 연결한다. / 제보자 보호와 원본 공개 중 우선순위를 결정한다.","links":"서도윤의 말투와 강태준의 반박, 기자를 막으려는 홍예진의 태도까지 모두 녹음해 두었다. 그러나 녹음은 길지 않고, 잡음이 심하다. 다른 녹음과 CCTV 영상을 대조해야 누가 어디서 말했는지 분별할 수 있다.","revelation":"당신의 제보자는 산장 참가자 중 한 명이다. 이름을 밝히면 특종을 증명하기는 쉬워져도 약속을 어기게 된다.","id":4,"declaration":"당신은 발표될 진실이 편집되지 않도록 감시하는 기자입니다.","prologue":"당신은 서도윤의 화려한 이미지 뒤에 숨은 의료 연구 사고를 수년간 취재했다. 익명 제보자에게서 “사고 당시 원본 녹음은 하나가 아니라 세 개”라는 이야기를 들었고, 백야산장에는 두 번째 조각을 찾으러 왔다. 당신이 원하는 것은 폭로의 속보가 아니라 조작할 수 없는 원본이다.","background":"서도윤의 말투와 강태준의 반박, 기자를 막으려는 홍예진의 태도까지 모두 녹음해 두었다. 그러나 녹음은 길지 않고, 잡음이 심하다. 다른 녹음과 CCTV 영상을 대조해야 누가 어디서 말했는지 분별할 수 있다. 21시 18분에는 서재 쪽에서 홍예진과 서도윤의 높은 목소리도 들었다. 그러나 이것이 사적인 다툼이라는 사실은 당시에는 알지 못했다.","privateKnowledge":"21시 10분 2층에서 서도윤과 강태준의 언쟁을 들었다. 21시 47분 정전 중 복도에 누군가 지나가는 소리가 났지만 상대의 얼굴은 보지 못했다. 21시 49분 신우진이 자료실 앞에 서 있던 것은 직접 보았다.","weakPoint":"당신의 제보자는 산장 참가자 중 한 명이다. 이름을 밝히면 특종을 증명하기는 쉬워져도 약속을 어기게 된다.","daySchedule":[{"time":"08:55","place":"취재 사무실","detail":"익명 제보자가 전송한 짧은 음성 파일을 받았다.","corroboration":"파일 생성 시간이 남는다.","visibility":"알려져도 됨"},{"time":"15:15","place":"산장 도착 전 휴게소","detail":"차시온과 연락해 촬영 장비를 확인했다.","corroboration":"차시온과 통화 기록이 있다.","visibility":"알려져도 됨"},{"time":"19:16","place":"로비","detail":"차시온의 카메라 앞에서 취재 목적을 설명했다.","corroboration":"차시온이 촬영했다.","visibility":"알려져도 됨"},{"time":"19:30","place":"식당","detail":"서도윤의 발표를 녹음했다.","corroboration":"다른 참석자가 녹음기 사용을 봤다.","visibility":"알려져도 됨"},{"time":"20:26","place":"라운지","detail":"홍예진에게 브리핑 원본을 요청했지만 거절당했다.","corroboration":"홍예진이 대화했다.","visibility":"알려져도 됨"},{"time":"21:10","place":"2층 복도","detail":"강태준과 서도윤의 다툼을 녹음했다.","corroboration":"강태준은 당신을 못 보았을 수 있다.","visibility":"알려져도 됨"},{"time":"21:18","place":"로비","detail":"차시온과 영상 속 얼굴을 확인했다.","corroboration":"차시온이 기억한다.","visibility":"알려져도 됨"},{"time":"21:39","place":"자료실","detail":"녹음 복원용 노트북을 연결했다.","corroboration":"노트북 접속 기록이 있다.","visibility":"알려져도 됨"},{"time":"21:18","place":"2층 복도 끝","detail":"서재 방향에서 홍예진과 서도윤으로 들리는 언쟁을 엿들었다. 정확한 대화 내용은 구별하지 못했다.","corroboration":"홍예진이 같은 시각 서재 앞에 있었다고 말할 수 있다.","visibility":"알려져도 됨"},{"time":"21:47","place":"2층 복도","detail":"자료실 문을 열자 구두 소리와 급한 숨소리가 들렸다. 얼굴은 확인하지 못했다.","corroboration":"특정 인물 단정 불가.","visibility":"알려져도 됨"},{"time":"21:49","place":"자료실 앞","detail":"신우진과 마주쳐 어디에 있었는지 물었다.","corroboration":"신우진도 만남을 기억한다.","visibility":"알려져도 됨"},{"time":"21:56","place":"라운지","detail":"차시온에게 원본 음성 비교를 요청했다.","corroboration":"차시온이 대화했다.","visibility":"알려져도 됨"},{"time":"22:05","place":"로비","detail":"백하린의 외침을 듣고 녹음 버튼을 눌렀다.","corroboration":"한지훈이 가까이 있었다.","visibility":"알려져도 됨"}],"goals":["E04의 세 조각과 E20 복구된 음성을 서로 대조한다.","서재 밖의 발소리와 실제 이동 기록을 연결한다.","제보자 보호와 원본 공개 중 우선순위를 결정한다."],"personalItems":[["휴대 녹음기","정전 이전 언쟁과 일부 복도 소리가 들어 있다."],["취재 수첩","익명 제보자 약속과 출입 시간 메모."],["마이크 메모리 카드","녹음 1번 파일의 별도 백업."]],"roleMark":"ordinary"},{"name":"이재혁","job":"개인 변호사","team":"정보 비공개","motive":"서도윤은 유언장 공개와 별도로 비밀유지 합의의 유효성을 확인해 달라며 당신을 불렀다. 평소에는 법률문서를 해석하는 일만 했지만, 이번 계약에는 사고 책임을 누가 짊어질지 정하는 의도가 너무 뚜렷했다. 당신은 계약을 공개하면 고객 비밀을 침해할 수 있다는 두려움과 범죄를 감추어서는 안 된다는 생각 사이에 있다.","secret":"21시 36분 법률문서실에서 배수아를 만나 구형 합의서의 빠진 첨부자료를 확인했다. 21시 44분에는 계단에 있었고, 서재에서는 멀리 떨어져 있었다. 그러나 당신의 봉투에는 폭로를 제한하는 문안이 있다.","items":"공증 사본 / 법률 상담 카드 / 봉인 봉투","alibi":"19:11 로비 배수아에게 합의서 원본이 있는지 물었다. / 19:47 식당 서지안과 상속 문제가 아닌 일상 대화를 나눴다. / 20:31 라운지 서도윤의 발표문에 법적 문제가 있음을 경고했다. / 21:22 2층 계단 서지안과 만나 유언장 공증 날짜를 확인했다. / 21:24 2층 계단 강태준이 서재 쪽에서 내려오는 것을 봤다. / 21:36 법률문서실 배수아와 구형 합의서를 비교했다. / 21:44 계단 정전 중 비상등이 보이는 계단에서 머물렀다. / 21:52 라운지 전력 복구 후 서지안에게 메시지를 보냈다. / 21:59 법률문서실 합의서 봉인을 다시 확인했다. / 22:05 로비 서재에서 사고가 났다는 소식을 들었다.","evidence":"E01 유언장, E10 비밀 합의서","mission":"E01과 E10의 작성 시각 및 진술을 비교한다. / 배수아가 보유한 초안의 누락 부분을 확인한다. / 폭로해야 할 공적 사실과 보호할 법률상 비밀을 구분하여 마지막 선택을 내린다.","links":"배수아는 10년 전 합의서의 초안을 작성했던 외부 자문가다. 서지안이 상속 문제로 상담을 요청했지만 비밀 내용을 모두 알려줄 수는 없었다. 2층에서 강태준이 황급히 내려오는 모습은 보았으나 어느 방에서 나왔는지 확신하지 못한다.","revelation":"서도윤에게 불리할 수 있는 문안을 작성한 사실은 수사팀에도 의심을 살 수 있다. 법적 의무와 개인의 이익을 구별해야 한다.","id":5,"declaration":"당신은 사건에 얽힌 계약의 효력을 알고 있는 변호사입니다.","prologue":"서도윤은 유언장 공개와 별도로 비밀유지 합의의 유효성을 확인해 달라며 당신을 불렀다. 평소에는 법률문서를 해석하는 일만 했지만, 이번 계약에는 사고 책임을 누가 짊어질지 정하는 의도가 너무 뚜렷했다. 당신은 계약을 공개하면 고객 비밀을 침해할 수 있다는 두려움과 범죄를 감추어서는 안 된다는 생각 사이에 있다.","background":"배수아는 10년 전 합의서의 초안을 작성했던 외부 자문가다. 서지안이 상속 문제로 상담을 요청했지만 비밀 내용을 모두 알려줄 수는 없었다. 2층에서 강태준이 황급히 내려오는 모습은 보았으나 어느 방에서 나왔는지 확신하지 못한다. 홍예진이 혼인 신고를 하지 않은 관계에 관한 법적 자문을 요청한 적이 있으나 그 사실을 다른 사람에게 말하지 않았다.","privateKnowledge":"21시 36분 법률문서실에서 배수아를 만나 구형 합의서의 빠진 첨부자료를 확인했다. 21시 44분에는 계단에 있었고, 서재에서는 멀리 떨어져 있었다. 그러나 당신의 봉투에는 폭로를 제한하는 문안이 있다.","weakPoint":"서도윤에게 불리할 수 있는 문안을 작성한 사실은 수사팀에도 의심을 살 수 있다. 법적 의무와 개인의 이익을 구별해야 한다.","daySchedule":[{"time":"10:25","place":"법률사무소","detail":"유언장 및 비밀유지 합의 관련 봉투를 봉인했다.","corroboration":"접수 서명이 남는다.","visibility":"알려져도 됨"},{"time":"16:15","place":"산장 근처","detail":"배수아에게 최종 서류 제출 여부를 물었다.","corroboration":"배수아의 통화 기록이 있다.","visibility":"알려져도 됨"},{"time":"19:11","place":"로비","detail":"배수아에게 합의서 원본이 있는지 물었다.","corroboration":"배수아가 기억한다.","visibility":"알려져도 됨"},{"time":"19:47","place":"식당","detail":"서지안과 상속 문제가 아닌 일상 대화를 나눴다.","corroboration":"서지안이 동석했다.","visibility":"알려져도 됨"},{"time":"20:31","place":"라운지","detail":"서도윤의 발표문에 법적 문제가 있음을 경고했다.","corroboration":"홍예진이 근처에 있었다.","visibility":"알려져도 됨"},{"time":"21:22","place":"2층 계단","detail":"서지안과 만나 유언장 공증 날짜를 확인했다.","corroboration":"서지안이 같은 기록을 갖고 있다.","visibility":"알려져도 됨"},{"time":"21:24","place":"2층 계단","detail":"강태준이 서재 쪽에서 내려오는 것을 봤다.","corroboration":"강태준도 계단을 내려왔다고 한다.","visibility":"알려져도 됨"},{"time":"21:36","place":"법률문서실","detail":"배수아와 구형 합의서를 비교했다.","corroboration":"배수아가 동석했다.","visibility":"알려져도 됨"},{"time":"21:44","place":"계단","detail":"정전 중 비상등이 보이는 계단에서 머물렀다.","corroboration":"독립 목격은 불명확하다.","visibility":"알려져도 됨"},{"time":"21:52","place":"라운지","detail":"전력 복구 후 서지안에게 메시지를 보냈다.","corroboration":"메시지 기록이 남는다.","visibility":"알려져도 됨"},{"time":"21:59","place":"법률문서실","detail":"합의서 봉인을 다시 확인했다.","corroboration":"종이 봉투의 봉인 흔적이 있다.","visibility":"알려져도 됨"},{"time":"22:05","place":"로비","detail":"서재에서 사고가 났다는 소식을 들었다.","corroboration":"정유리의 녹음 시작 시각과 유사하다.","visibility":"알려져도 됨"}],"goals":["E01과 E10의 작성 시각 및 진술을 비교한다.","배수아가 보유한 초안의 누락 부분을 확인한다.","폭로해야 할 공적 사실과 보호할 법률상 비밀을 구분하여 마지막 선택을 내린다."],"personalItems":[["공증 사본","원본과 다른 일련번호가 찍혀 있다."],["법률 상담 카드","서도윤의 사전 상담 일정이 적혀 있다."],["봉인 봉투","구형 비밀유지 합의서의 일부 첨부자료."]],"roleMark":"ordinary"},{"name":"최민서","job":"비서","team":"범인","motive":"당신은 서도윤의 개인 비서로서 그의 일정을 가장 정확히 아는 사람이다. 10년 전 청명 프로젝트 자료의 이관 과정에서 서류 분류와 발표 자료 정리를 지시받았고, 조작 사실을 일부 알고 있었다. 당신은 이번 공개가 자신에게도 불리할 수 있어 중요한 문서를 회수하려 했다. 하지만 당신의 가장 큰 죄는 정전 전의 업무가 아니라 정전 이후에 벌어졌다.","secret":"당신이 가진 수정 전 일정표에는 “21:25 임수빈 비공개 면담”이라고 적혀 있다. 피해자가 숨지기 직전 서재에 누가 있었는지 증명할 수 있다. 원본을 제출하면 임수빈이 의심받고, 공개한 당신 역시 기록 조작 사실을 인정해야 한다.","items":"수정 일정표 / 서재 출입 카드 / 암호 메모","alibi":"19:02 로비 강태준에게 서도윤의 지시 봉투를 전달했다. / 19:48 식당 서도윤에게 발표 자료의 마지막 페이지를 전달했다. / 20:40 비서실 모든 비공개 면담을 개인 일정표에 추가했다. / 21:25 서재 앞 임수빈이 서재 안으로 들어가는 것을 확인했다. / 21:29 비서실 서도윤에게 마지막 일정 확인 전화를 걸었다. / 21:37 서재 앞 문이 닫혀 있고 언성이 높아지는 것을 들었다. / 21:42 비서실 정전 중 책상 옆에서 휴대폰을 찾았다. / 21:47 2층 서비스 통로 입구 임수빈이 손수건을 움켜쥐고 이동하는 것을 보았다. / 21:58 비서실 임수빈과 관련된 면담 항목을 원본 일정표에서 지웠다. / 22:05 서재 앞 백하린과 함께 문을 열고 사망 사실을 알게 되었다. / 22:12 복도 임수빈과 짧게 대화하여 범행 사실을 확신했다.","evidence":"E06 원본 일정표, E12 열쇠 대장","mission":"E06 일정표 원본이 복원되기 전에 자신의 기록 조작을 인정할지 결정한다. / 서재 출입·서비스 통로에 대한 다른 목격자 진술을 파악한다. / 마지막 4분 동안 임수빈을 고발하거나 끝까지 보호하는 선택을 내린다.","links":"당신은 21시 25분 임수빈이 서재 안으로 들어가는 모습을 확인했다. 21시 47분 임수빈이 보조 통로 근처에서 급하게 이동하는 장면도 목격했다. 22시 05분 시신 발견 이후, 임수빈에게 직접 확인하고 그날 밤의 진짜 범행을 인지했다. 그럼에도 당신은 의도적으로 면담 일정의 원본을 감추고 경찰에 전달할 진술에서 그 이름을 빼기로 했다. 당신은 실제 살인 행위를 사전에 지시하지 않았지만, 살인을 알면서 은폐한 확정 조력자다.","revelation":"당신은 범행 현장에 있었던 것처럼 오해받을 수 있다. 21시 37분에는 서재 앞이었지만 사망 추정 시각인 21시 41~45분에는 비서실에 있었다. 알리바이는 한지훈·홍예진·비서실 22:05 로비 서도윤 사망 발견 소식을 다른 참가자들과 함께 들었다. / 22:12 2층 복도 최민서가 당신의 범행을 안다는 사실을 확인했다.","evidence":"E05 사망진단서, E19 현장 감식 기록","mission":"어머니 임혜정의 원본 의료일지(E05/E21)와 수정 사고 보고서(E03)를 비교하여 10년 전 사건의 진실을 확인한다. / 자신의 서재 출입과 서비스 통로 흔적(E06/E08/E20)을 누가 확보했는지 파악한다. / 마지막 선택에서 진실을 고백할지, 침묵할지 결정한다.","links":"산장에서 서도윤은 자정에 공개할 보고서가 사실을 모두 포함한다고 주장했지만 당신은 경영진의 승인 부분만 삭제된 편집본을 보았다. 21시 25분 비공개 면담에서 그에게 원본 제출을 요구했지만 서도윤은 당신의 정체까지 이미 안다며 증거를 넘기지 않았다. 정전 속 다툼은 급격히 격해졌고, 21시 41~45분 사이 몸싸움 중 서도윤은 치명상을 입었다. 당신은 바로 신고하지 못한 채 보조 서비스문을 통해 빠져나왔다.","revelation":"당신은 어머니의 죽음에 대한 자료를 수집했지만 그 과정에서 기관 규정을 위반해 복사한 문서가 있다. 복수의 이유가 있다고 해서 범행을 정당화할 수는 없다. 상대를 몰아붙이기 전에 누가 실제 현장에 있었는지 증거를 살펴야 한다.","id":13,"declaration":"당신은 범인입니다.","prologue":"당신은 10년 전 청명 프로젝트의 임상시험에 참여했다가 세상을 떠난 임혜정의 자녀다. 당시 간호학을 공부하던 당신은 어머니의 죽음이 “기저질환에 의한 급성 악화”라는 기록으로 정리되는 것을 이해할 수 없었다. 그 후 간호사로 일하며 프로젝트와 연계된 의료기관에 취업했고, 의료기록의 수정 이력과 이상 반응 보고서를 조금씩 모았다. 의료진으로 잠입한 이유는 진실을 공개할 증거를 찾기 위해서였지, 처음부터 누군가를 죽이려는 계획 때문은 아니었다.","background":"산장에서 서도윤은 자정에 공개할 보고서가 사실을 모두 포함한다고 주장했지만 당신은 경영진의 승인 부분만 삭제된 편집본을 보았다. 21시 25분 비공개 면담에서 그에게 원본 제출을 요구했지만 서도윤은 당신의 정체까지 이미 안다며 증거를 넘기지 않았다. 정전 속 다툼은 급격히 격해졌고, 21시 41~45분 사이 몸싸움 중 서도윤은 치명상을 입었다. 당신은 바로 신고하지 못한 채 보조 서비스문을 통해 빠져나왔다.","privateKnowledge":"당신은 21시 46분 서비스 통로를 통해 도망쳤다. 보조문의 자동 걸쇠 때문에 서재가 안에서 잠긴 것처럼 보인다는 사실을 나중에 알았다. 당신의 손수건에서 파란 섬유 일부가 걸렸을 가능성이 있다. 21시 47분 최민서가 당신을 본 것을 알고 있고, 22시 12분 직접 대화한 후 최민서가 진실을 알고도 당신을 보호하기로 했다는 것을 안다.","weakPoint":"당신은 어머니의 죽음에 대한 자료를 수집했지만 그 과정에서 기관 규정을 위반해 복사한 문서가 있다. 복수의 이유가 있다고 해서 범행을 정당화할 수는 없다. 상대를 몰아붙이기 전에 누가 실제 현장에 있었는지 증거를 살펴야 한다.","daySchedule":[{"time":"09:00","place":"거주지","detail":"어머니의 수첩과 가족사진을 의료 가방 깊숙이 넣었다.","corroboration":"독립 목격자는 없다.","visibility":"알려져도 됨"},{"time":"16:40","place":"산장 입구","detail":"오세린이 당신의 의료 가방을 잠깐 쳐다보았다.","corroboration":"오세린이 그 장면을 기억한다.","visibility":"알려져도 됨"},{"time":"19:14","place":"로비","detail":"업무 자료를 넣은 의료 가방을 백하린에게 맡기지 않고 직접 들고 들어왔다.","corroboration":"백하린이 가방을 보았다.","visibility":"알려져도 됨"},{"time":"19:45","place":"식당","detail": 세 / 계약 키 카드 / 차용증","alibi":"19:35 식당 강태준·윤서아와 같은 테이블에 앉았다. / 20:23 라운지 서도윤에게 투자보증금 반환을 요구했다. / 20:51 회계실 앞 윤서아에게 거래 명세를 제시했다. / 21:28 서재 앞 대기 공간 서도윤의 면담 순서를 기다렸지만 만나지 못했다. / 21:31 라운지 홍예진과 발표 이후 회사 반응을 이야기했다. / 21:41 라운지 정전 직후 오세린이 자리 쪽으로 오는 것을 봤다. / 21:42 식당 윤서아와 비상등 아래에서 만났다. / 21:49 식당 방향 복도 강태준에게 지분 반환을 다시 요구했다. / 21:50 식당 혼자 식탁에 앉았다. / 22:05 로비 사망 소식 이후 윤서아가 수첩을 꺼내는 걸 봤다.","evidence":"E09 차명 계좌, E15 지분 계약서","mission":"E09의 실제 수취인과 E15의 계약자를 연결한다. / 윤서아가 가진 회계 원본을 확인해 반환 가능한 자금 규모를 추산한다. / 부정 자금을 고발할지 조용히 회수할지 선택한다.","links":"강태준이 투자 지분 계약을 회수하려 한다는 사실을 알고 있다. 윤서아는 당신의 은닉 자금을 밝히려 할 것이며 두 사람을 동시에 속이기는 어렵다. 21시 41분 라운지와 21시 42분 식당에서 목격되었으므로 살인 현장과는 거리가 있다.","revelation":"비자금 일부의 실제 소유자다. 이중장부가 공개되면 손실뿐 아니라 책임도 따를 수 있다.","id":14,"declaration":"당신은 투자금이 어디로 사라졌는지 추적하는 투자자입니다.","prologue":"당신은 청명 프로젝트에 거액을 투자했고 사고 이후 단 한 번도 원래 수익 구조를 설명받지 못했다. 서도윤이 진실을 폭로하면 돈을 돌려받을 수도 있지만, 차명 계좌와 자금 회수 경로가 드러나면 본인의 책임도 생길 수 있다. 당신은 계약의 숫자를 믿지만 지금 이곳의 사람들은 숫자보다 비밀을 많이 갖고 있다.","background":"강태준이 투자 지분 계약을 회수하려 한다는 사실을 알고 있다. 윤서아는 당신의 은닉 자금을 밝히려 할 것이며 두 사람을 동시에 속이기는 어렵다. 21시 41분 라운지와 21시 42분 식당에서 목격되었으므로 살인 현장과는 거리가 있다.","privateKnowledge":"21시 49분 강태준과 식당 복도에서 마주쳤다. 그는 숨을 헐떡이지 않았고 계약 얘기를 피했다. 이를 말하면 자신이 차명계좌를 운영했다는 사실을 추궁받을 가능성이 있다.","weakPoint":"비자금 일부의 실제 소유자다. 이중장부가 공개되면 손실뿐 아니라 책임도 따를 수 있다.","daySchedule":[{"time":"09:50","place":"사무실","detail":"투자 손실 자료를 수집해 방문 명단과 대조했다.","corroboration":"전자문서 수정 이력이 있다.","visibility":"알려져도 됨"},{"time":"15:20","place":"차량","detail":"강태준에게 원본 투자계약 준비를 확인했다.","corroboration":"강태준과 통화 기록이 있다.","visibility":"알려져도 됨"},{"time":"19:35","place":"식당","detail":"강태준·윤서아와 같은 테이블에 앉았다.","corroboration":"두 사람이 기억한다.","visibility":"알려져도 됨"},{"time":"20:23","place":"라운지","detail":"서도윤에게 투자보증금 반환을 요구했다.","corroboration":"홍예진이 들었다.","visibility":"알려져도 됨"},{"time":"20:51","place":"회계실 앞","detail":"윤서아에게 거래 명세를 제시했다.","corroboration":"윤서아가 확인했다.","visibility":"알려져도 됨"},{"time":"21:28","place":"서재 앞 대기 공간","detail":"서도윤의 면담 순서를 기다렸지만 만나지 못했다.","corroboration":"최민서 일정표에 대기 기록이 있다.","visibility":"알려져도 됨"},{"time":"21:31","place":"라운지","detail":"홍예진과 발표 이후 회사 반응을 이야기했다.","corroboration":"홍예진이 기억한다.","visibility":"알려져도 됨"},{"time":"21:41","place":"라운지","detail":"정전 직후 오세린이 자리 쪽으로 오는 것을 봤다.","corroboration":"오세린은 얼굴을 못 봤을 수 있다.","visibility":"알려져도 됨"},{"time":"21:42","place":"식당","detail":"윤서아와 비상등 아래에서 만났다.","corroboration":"윤서아도 기억한다.","visibility":"알려져도 됨"},{"time":"21:49","place":"식당 방향 복도","detail":"강태준에게 지분 반환을 다시 요구했다.","corroboration":"강태준이 기억한다.","visibility":"알려져도 됨"},{"time":"21:50","place":"식당","detail":"혼자 식탁에 앉았다.","corroboration":"독립 목격 없음.","visibility":"알려져도 됨"},{"time":"22:05","place":"로비","detail":"사망 소식 이후 윤서아가 수첩을 꺼내는 걸 봤다.","corroboration":"윤서아가 근처에 있었다.","visibility":"알려져도 됨"}],"goals":["E09의 실제 수취인과 E15의 계약자를 연결한다.","윤서아가 가진 회계 원본을 확인해 반환 가능한 자금 규모를 추산한다.","부정 자금을 고발할지 조용히 회수할지 선택한다."],"personalItems":[["은행 거래 명세","일부 차명 계좌와 송금 시각이 적혀 있다."],["계약 키 카드","금고 보관 계약서 수령용 코드."],["차용증","강태준 측과 주고받은 투자 보증 문서."]],"roleMark":"ordinary"},{"name":"홍예진","job":"홍보 책임자","team":"정보 비공개","motive":"당신은 서도윤의 대외 이미지와 긴급 발표문을 담당한다. 10년 전 사고 당시 실제 원인이 밝혀지기도 전에 “기저질환”이라고 발표한 문안을 만들었다. 위에서 내려온 내용을 썼지만 그 후로도 사건을 지켜보지 않은 책임이 있다. 산장에서는 이번 폭로가 거짓 없이 이루어질지 검토하려 왔다.","secret":"21시 49분 서지안과 2층 객실 복도에서 마주쳤다. 정전 중 무엇을 했는지 묻자 서지안은 휴대폰 사진을 확인 중이었다고 답했다. 21시 46분 김도현에게 전화를 걸었지만 연결되지 않았다.","items":"언론 대응 문건 / 기자 연락처 / 보도 초안","alibi":"19:55 식당 김도현에게 시설 경보 문제를 항의했다. / 20:13 라운지 윤서아가 서도윤에게 문서를 건네는 걸 봤다. / 20:21 라운지 서지안과 서도윤의 말다툼 끝부분을 들었다. / 20:26 라운지 정유리의 브리핑 원본 요청을 거절했다. / 20:31 라운지 조은호가 발표 영향에 대해 물었다. / 21:34 라운지 미리 작성한 언론 대응 문구를 확인했다. / 21:41 2층 객실 복도 비상등을 확인하며 객실 구역에 있었다. / 21:46 복도 김도현에게 정전 원인을 문의했지만 연결되지 않았다. / 21:49 2층 객실 복도 서지안과 마주쳤다. / 21:51 식당 고객에게 설명할 임시 공지를 작성했다. / 22:05 로비 백하린의 연락을 받고 상황을 전파했다.","evidence":"E24 공동거주 기록, E25 연인의 편지, E01 유언장, E16 보도자료 원본 / 복도 센서와 메시지 시간","mission":"E16 대응 초안과 실제 배포본의 수정 시점을 비교한다. / 정유리·차시온에게 확인된 사실만 전달할지 결정한다. / 10년 전 허위 발표에 대한 책임을 인정하거나 자료를 은폐하는 선택을 내린다.","links":"정유리는 끈질기게 원본을 요구하고, 차시온은 인터뷰 전체 장면을 달라고 한다. 서도윤은 홍보팀을 통해 발표 순서를 통제하려 한다. 당신은 말을 바꾸지 않는 사람이 더 수상하다고 생각한다.","revelation":"사실과 다른 첫 보도자료를 쓴 책임 때문에 과거 기록 공개를 망설인다.","id":15,"declaration":"당신은 피해자 서도윤과 사실혼 관계를 유지해온 여자친구이자 회사 홍보 책임자입니다.","prologue":"당신과 서도윤은 혼인 신고를 하지 않았지만 여섯 해 동안 함께 살아왔다. 서로의 집 열쇠를 가지고 생활비와 일상을 나누었으며, 가까운 지인들은 두 사람이 가족처럼 지낸다는 사실을 알고 있다. 그러나 회사 안에서는 두 사람의 관계가 드러나지 않았다. 당신은 대표의 사적인 관계가 투자 계약이나 인사 문제에 영향을 준다는 소문을 피하고 싶었기 때문이다. 서도윤의 대외 이미지를 맡는 홍보 책임자로서 당신은 공식 일정과 보도자료를 관리해 왔다.\n\n10년 전 청명 프로젝트 사고가 났을 때 당신은 경영진의 설명을 믿고 “기저질환에 의한 사망”이라는 보도 초안을 작성했다. 이후 의혹이 커질수록 진실을 묻지 않았다는 죄책감도 커졌다. 산장으로 떠나기 전 두 사람은 청명 프로젝트 공개 범위를 놓고 크게 다퉜다. 서도윤은 자정 발표 뒤 함께 새로운 삶을 시작할 수 있다고 말했지만, 당신은 그 말이 또 다른 은폐의 시작일 수 있다고 의심했다.\n\n당신이 산장에 온 이유는 홍보 일정 때문만이 아니다. 서도윤이 왜 최근 공동거주 계약과 재산 관련 문서를 몰래 수정했는지, 당신에게 무엇을 숨겼는지를 직접 확인하기 위해서다. [[PARTNER_RELATION_LINE]]","background":"당신은 서도윤에게 가장 가까운 사람이지만 그의 모든 비밀을 알고 있는 사람은 아니다. 비서 최민서는 서도윤의 업무상 일정 대부분을 알고 있어 당신과 자주 부딪혔다. 서지안은 유언장이 바뀐 뒤 당신에게 상속 의혹을 제기했다. 정유리는 발표문 원본을 요구했고 차시온은 당신과 서도윤의 사적 관계를 인터뷰에서 언급하지 말아 달라는 요청을 받았다.\n\n21시 05분, 당신은 서도윤의 휴대전화로 “오늘 일 끝나면 우리 이야기부터 하자”라는 메시지를 남겼다. 21시 18분 서재에 찾아가자 문 앞에서 짧은 언쟁이 있었다. 두 사람은 관계를 공개할지 말지를 두고 다퉜다. 이 장면을 본 인물은 당신이 살인을 저지를 충분한 동기가 있다고 의심할 수 있다. 하지만 21시 41분에는 2층 객실 복도에 있었고, 해당 동선의 일부는 카메라·복도 센서로 확인된다.","privateKnowledge":"당신은 서도윤의 사적인 금고 비밀번호 일부를 알고 있으며, 서도윤이 사고 관련 봉투를 홍보 자료보다 더 중요하게 취급했다는 사실을 알고 있다. 21시 18분 언쟁 당시 서도윤은 “만약 내가 사라지면 그 봉투를 열어 봐”라고 말했다. 당신은 이 말을 협박이나 이별 선언으로 받아들였지만 지금은 예고였을 가능성도 있다고 생각한다.\n\n당신의 지갑 속에는 두 사람의 공동거주 계약서와 서도윤이 직접 남긴 짧은 편지가 있다. 제삼자가 이 자료를 보면 둘의 관계, 서도윤이 당신에게 맡기려 했던 자료, 상속과 관련된 이해관계를 확인할 수 있다. 하지만 사실혼 관계만으로 자동으로 상속권이 발생하는 것은 아니며, 당신은 누군가 유언장을 조작했다는 소문을 경계한다.","weakPoint":"회사와의 이해관계 때문에 사실혼 관계를 숨긴 일은 당신을 수상하게 만든다. 당신은 서도윤을 사랑했고 동시에 거짓 발표문을 작성한 책임이 있다. 서도윤 사망으로 당신에게 어떤 재산이 돌아오는지조차 아직 명확하지 않다. 과거에 왜곡된 발표문을 공개할 경우 비판도 받아야 한다. 서지안에게 연인 관계를 알리면 증거를 찾는 데 도움은 될 수 있지만 가족 사이의 갈등은 커질 수 있다.","daySchedule":[{"time":"08:30","place":"서울 공동 거주지","detail":"서도윤과 아침을 먹으며 자정 발표 이후의 거취를 이야기했다. 서도윤이 “서류를 산장에서 확인하자”고 말했다.","corroboration":"동거 관계는 당신에게만 확실하며 그날 아침 대화의 독립 목격자는 없다.","visibility":"비공개"},{"time":"11:20","place":"회사 홍보실","detail":"편집된 발표문과 원본 보도 초안을 대조했다. 일부 책임 문구가 삭제된 것을 확인했다.","corroboration":"문서 수정 기록과 보도 초안 생성 시간이 남아 있다.","visibility":"알려져도 됨"},{"time":"16:45","place":"백야산장 주차장","detail":"서도윤보다 먼저 도착해 보도 장비를 반입했다. 차시온과 잠시 마주쳤다.","corroboration":"차시온이 카메라를 들고 들어오는 모습을 봤다.","visibility":"알려져도 됨"},{"time":"19:55","place":"식당","detail":"김도현에게 시설 경보 문제를 항의했다.","corroboration":"김도현이 들었다.","visibility":"알려져도 됨"},{"time":"20:13","place":"라운지","detail":"윤서아가 서도윤에게 문서를 건네는 걸 봤다.","corroboration":"윤서아가 전달했다.","visibility":"알려져도 됨"},{"time":"20:21","place":"라운지","detail":"서지안과 서도윤의 말다툼 끝부분을 들었다.","corroboration":"서지안이 불편한 대화가 있었다고 인정한다.","visibility":"알려져도 됨"},{"time":"20:26","place":"라운지","detail":"정유리의 브리핑 원본 요청을 거절했다.","corroboration":"정유리가 기억한다.","visibility":"알려져도 됨"},{"time":"21:05","place":"1층 홍보 준비실","detail":"서도윤에게 사적인 메시지를 보냈다. 업무 메시지는 아니었다.","corroboration":"휴대전화의 발신 시각이 남아 있다.","visibility":"비공개"},{"time":"21:18","place":"2층 서재 앞","detail":"서도윤에게 두 사람의 관계를 계속 숨길 것인지 따져 물었다. 큰소리를 냈다.","corroboration":"정유리가 먼 복도에서 두 사람의 목소리를 들었다고 주장할 수 있다.","visibility":"비공개"},{"time":"21:34","place":"라운지","detail":"미리 작성한 언론 대응 문구를 확인했다.","corroboration":"노트북 수정 시각이 남는다.","visibility":"알려져도 됨"},{"time":"21:41","place":"2층 객실 복도","detail":"정전 중 비상등을 확인하며 객실 구역에 있었다.","corroboration":"복도 센서가 일부 작동했으며 서재 내부에 있었다는 증거는 없다.","visibility":"알려져도 됨"},{"time":"21:46","place":"2층 객실 복도","detail":"김도현에게 정전 원인을 문의했지만 연결되지 않았다.","corroboration":"발신 기록이 있다.","visibility":"알려져도 됨"},{"time":"21:49","place":"2층 객실 복도","detail":"서지안과 마주쳤다.","corroboration":"서지안도 기억한다.","visibility":"알려져도 됨"},{"time":"21:51","place":"식당","detail":"고객에게 설명할 임시 공지를 작성했다.","corroboration":"서버 자동저장 시간이 남는다.","visibility":"알려져도 됨"},{"time":"22:05","place":"로비","detail":"백하린의 연락을 받고 상황을 전파했다.","corroboration":"차시온이 통화 사실을 들었다.","visibility":"알려져도 됨"}],"goals":["E24 공동거주 기록과 E25 서도윤의 개인 편지를 확보해 사실혼 관계와 서류 수정 이유를 확인한다.","서지안·이재혁에게 유언장(E01)의 변경 시점을 확인하고, 연인 관계가 상속 동기와 어떻게 연결되는지 검증한다.","정유리·차시온에게 허위 보도 초안(E16)을 제출할지, 사적인 관계가 알려질까 두려워 은폐할지 결정한다.","21:18 서재 앞 언쟁을 목격했다는 진술과 21:41 객실 복도 센서 기록을 대조하여 억울한 의심을 해소한다."],"personalItems":[["공동거주 계약 사본","서도윤과 홍예진이 함께 거주해 온 주소 및 기간이 적힌 문서. 서명이 있다."],["낡은 커플 사진","서도윤과 함께 찍은 일상 사진. 관계를 대외적으로 공개하지 않았다는 사실과 대조된다."],["비공개 편지","서도윤이 “마지막 발표 뒤 네게 꼭 해야 할 말이 있다”고 남긴 편지."],["언론 대응 문건","사고 발표문과 자정 발표문 여러 버전이 있으며 삭제된 문단이 표시되어 있다."],["휴대전화","21:05 개인 메시지와 21:46 김도현 통화 실패 기록을 확인할 수 있다."]],"roleMark":"ordinary"},{"name":"차시온","job":"다큐 감독","team":"정보 비공개","motive":"당신은 청명 프로젝트 사고의 피해자와 연구진을 인터뷰하며 장편 다큐를 제작 중이었다. 과거 인터뷰 중 서도윤에게 불리한 장면을 잘라낸 것이 마음에 남았다. 이번 산장 모임은 사건을 직접 기록할 기회지만, 촬영된 장면이 반드시 진실 전부를 의미하지는 않는다.","secret":"21시 18분 정유리와 로비에서 녹음 장비를 확인했다. 21시 45분 한지훈과 같은 장소에 있었고 21시 51분 계단에서 배터리를 바꿨다. 당신은 21시 46분 서비스 통로 장면을 직접 촬영한 것이 아니라 반사면의 일부만 갖고 있다.","items":"촬영 카메라 / 교체 배터리 / 인터뷰 동의서","alibi":"19:16 로비 정유리의 인터뷰 도입을 촬영했다. / 19:58 식당 서도윤의 발표를 광각으로 촬영했다. / 20:45 로비 인터뷰 장비와 배터리를 점검했다. / 21:18 로비 정유리와 영상 속 얼굴을 다시 확인했다. / 21:40 로비 정전 직후 카메라 비상 조명으로 일부를 비췄다. / 21:45 로비 한지훈과 복도 방향 화면을 확인했다. / 21:49 복도 반사면에 수상한 그림자가 보이는지 확인했다. / 21:51 1층 계단 촬영 장비 배터리를 교체했다. / 21:56 라운지 정유리에게 영상 원본을 보여주기로 했다. / 22:05 로비 사망 소식을 듣고 카메라 전원을 껐다.","evidence":"E04 녹음, E08 CCTV 백업","mission":"E04 녹음, E08 CCTV, E20 복원 음성의 타임코드를 맞춘다. / 확실하지 않은 그림자를 실명으로 단정하지 않도록 교차 확인한다. / 숨겼던 인터뷰 원본을 공개할지 선택한다.","links":"영상에 나타나는 21시 45분 로비의 한지훈은 확실한 목격 증거가 된다. 하지만 복도 반사면에서 보인 형체가 누구인지 혼자 확신할 수 없다. 정유리의 녹음과 문하준의 영상 시각 동기화가 필요하다.","revelation":"영상 한 장면을 의도적으로 편집한 사실을 드러내면 자신의 작품 신뢰가 떨어진다.","id":16,"declaration":"당신은 사람들의 증언을 영상에 남기려는 다큐멘터리 감독입니다.","prologue":"당신은 청명 프로젝트 사고의 피해자와 연구진을 인터뷰하며 장편 다큐를 제작 중이었다. 과거 인터뷰 중 서도윤에게 불리한 장면을 잘라낸 것이 마음에 남았다. 이번 산장 모임은 사건을 직접 기록할 기회지만, 촬영된 장면이 반드시 진실 전부를 의미하지는 않는다.","background":"영상에 나타나는 21시 45분 로비의 한지훈은 확실한 목격 증거가 된다. 하지만 복도 반사면에서 보인 형체가 누구인지 혼자 확신할 수 없다. 정유리의 녹음과 문하준의 영상 시각 동기화가 필요하다. 산장으로 오는 오후에는 홍예진이 서도윤보다 먼저 보도 장비를 들고 도착하는 모습을 봤다.","privateKnowledge":"21시 18분 정유리와 로비에서 녹음 장비를 확인했다. 21시 45분 한지훈과 같은 장소에 있었고 21시 51분 계단에서 return `<h2>진행자 콘솔</h2><div class="sticky-status">관리자 인증됨 · 현재 단계: <b>${phaseName()}</b></div>${panel(`<h3>전체 진행 단계</h3><p>증거 수집 단계에서만 지도 탐색이 열립니다. 2차 증거 수집부터는 타인 초기 소지품 열람이 허용됩니다.</p><div class="admin-controls">${[['explore1','1차 증거 수집'],['discuss1','1차 대면 토론'],['explore2','2차 증거 수집'],['discuss2','최종 대면 토론'],['vote','범인 투표']].map(([k,v])=>ui('',v,`startPhase('${k}')`,state.stage===k?'primary':'outline')).join('')}</div><br>${ui('','최후 선택 4분 시작','startDecision()','primary')} ${ui('','엔딩 공개','finalize()','outline')}`)}${castRoster()}${panel(`<h3>조건부 조력자 판정 · 시연용</h3><p>실제 게임에서는 각 인물의 최후 선택을 서버가 확정합니다. 여기서는 결말 미리보기를 위해 조절할 수 있습니다.</p>${[9,18].map(id=>`<p>${DATA.people[id-1].name}: ${state.branchRegistry?.[String(id)]?'살인 은폐 가담':'미가담'} ${ui('',state.branchRegistry?.[String(id)]?'가담 해제':'가담 설정',`togglePreviewBranch(${id})`,'outline')}</p>`).join('')}`)}${panel(`<h3>진행 안내</h3><p>현재 역할: ${role()?role().name:'미배정'} / 수집 증거는 증거목록에서 확인</p><p>이 시연판에서는 관리자 단계 변경이 현재 기기에만 적용됩니다. 17명 동시 진행에는 서버의 공용 단계 상태가 필요합니다.</p><p class="footer-note">개인 쪽지는 운영자 콘솔에서 일괄 열람하지 않습니다.</p>${ui('','데모 초기화','resetDemo()','outline')} ${ui('','관리자 로그아웃','adminLogout()','outline')}`)}`}
function togglePreviewBranch(id){if(!adminAuthenticated||![9,18].includes(id))return;state.branchRegistry=state.branchRegistry||{};state.branchRegistry[String(id)]=!state.branchRegistry[String(id)];rerender()}
function assign(){let n=el('realName')?.value.trim().replace(/\s+/g,' ');if(!n){alert('실제 참가자 이름을 먼저 입력하세요.');return}const gender=el('realGender')?.value;if(!gender){alert('성별을 선택하세요.');return}const used=castNames();const free=activePeopleMap((p,i)=>i).filter(i=>!used[String(i)]);if(!free.length){alert('배정 가능한 역할이 없습니다. 관리자에게 문의하세요.');return}const id=free[Math.floor(Math.random()*free.length)];if(!registerCastName(id,n))return;state.name=n;state.gender=gender;registerGender(id,gender);state.role=id;state.stage='lobby';selectedPerson=-1;rerender()}
function assignSpecific(id){if(!roleActive(id)){alert('현재 17인 구성에서 선택할 수 없는 역할입니다.');return;}let n=el('realName')?.value.trim().replace(/\s+/g,' ')||state.name;if(!n){alert('역할 시연에도 먼저 실제 이름을 입력하세요.');return}if(!registerCastName(id,n))return;state.name=n;state.gender=el('realGender')?.value||'미지정';registerGender(id,state.gender);state.role=id;state.stage='lobby';selectedPerson=-1;rerender()}
function editCastName(){if(!role())return;let n=prompt('표시할 참가자 이름을 입력하세요.',state.name||liveName(state.role));if(n===null)return;n=n.trim().replace(/\s+/g,' ');if(!n){alert('이름을 입력하세요.');return}if(!registerCastName(state.role,n))return;state.name=n;rerender()}
function castRoster(){return panel(`<h3>실제 참가자 이름 / 캐릭터 매칭</h3><p class="muted">등록된 인물은 실명으로 표시됩니다. 미등록 역할은 원래 가명을 임시 표시합니다. 모든 역할은 성별이 정해져 있지 않습니다. 배정된 참가자가 입력한 성별을 사용합니다. 이 화면의 매칭 정보는 시연용이며 실제 운영에서는 서버에서 관리해야 합니다.</p>${activePeopleMap((p,i)=>`<div class="entry"><small class="muted">역할 ID ${String(i+1).padStart(2,'0')} · ${safe(p.job)} · ${safe(castGender(i))}</small><br><b>${safe(liveName(i))}</b> ${liveName(i)!==p.name?'<span class="tag">등록됨</span>':'<span class="tag">미등록</span>'}</div>`).join('')}`)}
let selectedPerson=-1;
function personNote(i){return String((state.alibiNotes||{})[String(i)]||'')}
function openPerson(i){if(i>=0&&!roleActive(i))return;selectedPerson=i;setview('home')}
function savePersonNote(i){if(!role())return;state.alibiNotes=state.alibiNotes||{};state.alibiNotes[String(i)]=el('personNote')?.value||'';rerender()}
function openInbox(){selectedPerson=-2;setview('home')}
function personSummary(i){const p=DATA.people[i],mine=i===state.role;return `<button class="cast-card" onclick="openPerson(${i})"><span class="role-index">${String(i+1).padStart(2,'0')}</span><span class="cast-identity"><b>${safe(liveName(i))}${mine?' <small class="gold">· 나</small>':''}</b><small>${safe(p.job)}</small></span><span class="chevron">›</span></button>`}
function personContact(i){const p=DATA.people[i],mine=i===state.role,mails=personalMail().filter(x=>x.from===i||x.to===i);
 const name=safe(liveName(i));
 return `<h2 class="contact-title">${name}</h2><p class="muted">${safe(p.job)}${mine?' · 내 역할':''}</p>
 ${panel(`<div class="contact-row"><span class="tag">ROLE ${String(i+1).padStart(2,'0')}</span><span class="tag">알리바이 메모</span></div><p class="muted">이 인물에게 들은 진술, 이동 시간, 목격 정보를 기록하세요. 타인의 비밀 설정집이 자동 공개되지는 않습니다.</p><textarea class="field area" id="personNote" rows="7" placeholder="예: 21:49 객실 복도에서 목격, 진술은 확인 필요">${safe(personNote(i))}</textarea><div class="row">${ui('','알리바이 메모 저장',`savePersonNote(${i})`,'primary')}</div>`)}
 ${!mine?panel(`<h3>1:1 비밀 쪽지</h3><p class="muted">상대에게 직접 보낼 수 있는 밀담입니다. 전체 채팅은 제공하지 않습니다.</p><textarea class="field" id="letterBody" maxlength="1000" placeholder="상대에게만 보낼 쪽지를 작성하세요."></textarea>${ui('','쪽지 보내기',`sendNoteTo(${i})`,'primary')}<h4>대화 기록 (${mails.length})</h4>${mails.length?mails.map(m=>`<div class="dm-entry ${m.from===state.role?'me':'them'}"><small>${m.from===state.role?'보냄':'받음'}</small><p>${safe(m.body)}</p></div>`).join(''):'<p class="muted">아직 주고받은 쪽지가 없습니다.</p>'}<small class="footer-note">서버가 연결되기 전에는 같은 브라우저에서만 쪽지를 시연할 수 있습니다.</small>`):''}
 ${state.stage==='vote'&&!mine?panel(`<h3>최종 범인 후보</h3><p>지목권 ${state.votes.length} / ${state.count}명</p>${ui('',state.votes.includes(i)?'범인 지목 취소':'이 인물을 범인으로 지목',`toggleVote(${i})`,state.votes.includes(i)?'outline':'primary')}`):''}
 ${state.stage!=='vote'&&!mine?panel('<p class="footer-note"><b>범인 투표는 아직 닫혀 있습니다.</b> 최종 투표 단계가 열리면 이 인물 카드에서 범인을 지목할 수 있습니다.</p>'):''}
 ${ui('','전체 인물 목록으로','openPerson(-1)','outline')}`;}
function mainVotePanel(){return `<h3>최종 범인 투표</h3><p>전체 토론에서 예상한 범행 가담자 수를 선택하고, 각 인물 카드를 눌러 지목하세요. 주범·공범을 구분하지 않습니다.</p><div class="row votecount">${[1,2,3,4].map(n=>ui('',n+'명',`chooseCount(${n})`,state.count===n?'primary':'outline')).join('')}</div><p>지목권 <b>${state.votes.length} / ${state.count}</b>명 · 모두 사용하지 않아도 됩니다.</p><p>${state.votes.length?state.votes.map(i=>safe(liveName(i))).join(' · '):'현재 지목한 인물 없음'}</p><small class="footer-note">이 정적 데모에서 범인 수는 기기별로 선택합니다. 실제 운영에서는 공동 인원투표를 먼저 집계해 모든 참가자에게 같은 지목권을 배정합니다.</small>`}
function inboxPanel(){const mail=personalMail();const secret=isNetworkMember()?letters().filter(x=>x.kind==='criminal'):[];return `<h2>내 쪽지함</h2>${panel(`<h3>주고받은 개인 연락 (${mail.length})</h3>${mail.length?mail.map(m=>`<div class="dm-entry ${m.from===state.role?'me':'them'}"><small class="muted">${m.from===state.role?'보냄 → '+safe(liveName(m.to)):safe(liveName(m.from))+' → 받음'}</small><div>${safe(m.body)}</div>${ui('','대화 열기',`openPerson(${m.from===state.role?m.to:m.from})`,'outline')}</div>`).join(''):'아직 쪽지가 없습니다. 메인에서 인물을 선택해 쪽지를 보내세요.'}`)}${isNetworkMember()?panel(`<h3>비밀 연락망</h3><p class="muted">확정 조력자와 실제 범인만의 연락망입니다. 조건부 가담자는 최후 선택에 따라 달라집니다.</p><div class="log">${secret.map(m=>safe(liveName(m.from))+': '+safe(m.body)).join('\n')||'아직 기록 없음'}</div><textarea class="field" id="secretBody" placeholder="비밀 연락"></textarea>${ui('','전송','sendSecret()','primary')}`):''}${ui('','인물 목록으로','openPerson(-1)','outline')}`}
function sendNoteTo(i){if(!role()||i===state.role)return;const t=el('letterBody')?.value.trim();if(!t)return alert('쪽지 내용을 입력하세요.');const arr=letters();arr.push({id:Date.now()+'-'+Math.random().toString(36).slice(2),kind:'dm',from:state.role,to:i,body:t.slice(0,1000),at:Date.now()});putLetters(arr);openPerson(i)}
function chooseCount(n){if(state.stage!=='vote')return alert('현재는 투표 시간이 아닙니다.');state.count=n;state.votes=state.votes.slice(0,n);state.ballotSubmitted=false;rerender()}
function home(){
 if(!role())return `<section class="card hero"><span class="tag">17인 · 모바일 PWA 시연</span><h2>마지막 체크인</h2><p>역할의 성별은 고정되어 있지 않습니다. 이름과 성별을 입력하면 남아 있는 17개 역할 가운데 하나가 배정됩니다.</p><label for="realName">실제 참가자 이름</label><input class="field" id="realName" maxlength="24" placeholder="예: 홍길동"><br><br><label for="realGender">나의 성별</label><div class="gender-choices" role="group" aria-label="참가자 성별"><button type="button" class="gender-btn" id="genderMale" onclick="chooseGender('남성')">남성</button><button type="button" class="gender-btn" id="genderFemale" onclick="chooseGender('여성')">여성</button></div><input type="hidden" id="realGender" value=""><br><br>${ui('','랜덤 역할 배정','assign()','primary')}<p class="footer-note">실전의 중복 방지 및 이름 공유는 Supabase 연동이 필요합니다.</p>${adminAuthenticated?`<details><summary>관리자 테스트: 배역 지정 시연</summary><select class="field" id="previewRole">${activePeopleMap((p,i)=>`<option value="${i}">${safe(p.name)} · ${safe(p.job)}</option>`).join('')}</select>${ui('','선택 배역 시작',"assignSpecific(Number(el('previewRole').value))",'outline')}</details>`:''}</section>`;

 const roster=activePeopleMap((p,i)=>personSummary(i)).join('');
 return `<div class="sticky-status"><b>${safe(state.name)}</b> · ${safe(role().job)}<br><small>${phaseName()} · ${victimDisplay()} 사망 사건</small></div>
 ${state.stage==='decision'?decisionPageV7():''}
 ${state.stage==='vote'?panel(mainVotePanel()):''}
 ${panel(`<div class="row between"><div><h2 style="margin:0">산장 초대객</h2><small class="muted">인물을 눌러 비밀 쪽지, 알리바이 메모, 최종 투표</small></div>${ui('','내 쪽지함','openInbox()','outline')}</div><div class="cast-list">${roster}</div>`)}
 ${panel(`<h3>진행 안내</h3><p>대면 토론은 직접 진행합니다. 증거 수집 시간에만 지도 탐색이 열리고, 2차부터 다른 참가자의 초기 소지품을 볼 수 있습니다.</p><p class="footer-note">현재는 단일 기기 시연입니다. 쪽지·공용 타이머·역할 배정은 휴대폰 사이에서 아직 동기화되지 않습니다.</p>`)}`;
}

 const p=role(), firstLine=p.declaration;

 };

 return `<h2>개인 설정집</h2><div class="card profile-cover"><small class="muted">PRIVATE ROLE BOOK · ROLE ${String(p.id).padStart(2,'0')}</small><h2>${safe(firstLine)}</h2><p class="muted">당신의 이름: <b>${safe(liveName(state.role))}</b> · ${safe(state.gender||'미지정')} · ${safe(p.job)}</p><p>원래 배역명: <strong data-keep-original>${safe(p.name)}</strong> ${ui('','표시 이름 수정','editCastName()','outline')}</p></div><div class="tabs">${tabs.map(([k,label])=>ui('',label,`roleTab='${k}';render()`,roleTab===k?'primary':'outline')).join('')}</div>${panel(contents[roleTab]||contents.story)}`;

 else if(caught){title=accompliceVotes.length?'불완전한 검거':'진범 검거 · 남겨진 그림자';story='임수빈의 범행은 드러났지만 살인사건을 의도적으로 은폐한 조력자 중 일부는 밝혀지지 않았다. 어머니 임혜정의 의료 사고 기록은 별도의 검증을 기다린다.'}
 else if(accompliceVotes.length){title='조력자만 지목 · 그림자만 붙잡다';story='일부 참가자는 일정표 삭제와 증거 은폐에 가담한 사람을 정확히 찾아냈다. 그러나 서도윤을 실제로 죽인 임수빈은 최종 지목에서 빠졌다. 산장 밖에서 진범을 추적할 새로운 수사가 시작된다.'}
 else{title=state.votes.length?'잘못된 지목':'미해결 사건';story='투표가 살인범과 그 은폐 조력자를 특정하지 못했다. 서로의 진술은 남았지만 그날 정전 중 서재에서 무슨 일이 있었는지는 공개되지 않았다.'}
 if(innocentVotes.length)title+=' · 무고한 인물 오지목';

 const choiceName={reveal:'폭로·자백',conceal:'은폐·침묵',deal:'거래'}[state.decision]||'선택 없음';
 const personalEnd=(()=>{if(!p)return '당신은 사건의 전말을 읽는다.';if(p.id===13)return r.main?'당신은 어머니의 죽음에 대한 진실을 찾았지만, 그 과정에서 스스로 저지른 살인도 인정하거나 추궁받아야 했다.':'당신은 당장의 지목은 피했지만 최민서와 남겨진 기록은 언제든 당신의 이름을 세상에 드러낼 수 있다.';if(p.id===6)return state.decision==='reveal'?'당신은 자신이 삭제한 일정표의 원본을 제출했다. 진실을 향한 증언이 늦어졌다는 사실 또한 기록으로 남았다.':'당신은 진범을 알고도 침묵했다. 숨긴 일정표가 언젠가 복원된다면 스스로 지켜 온 모든 것이 무너질 수 있다.';if([9,18].includes(p.id))return actualGuilty().includes(p.id)?'당신은 자신의 비밀을 지키려고 살인사건과 관련한 사실까지 의도적으로 숨겼다. 이제 사건의 은폐 조력자로서 후속 수사의 대상이 된다.':'당신은 불리한 상황에서도 살인범을 위한 적극적인 거짓 진술을 선택하지 않았다. 다만 원래 감추고 있던 문제에 대한 책임은 별개로 남는다.';return state.decision==='reveal'?'당신은 결국 자신이 가진 자료를 공개하기로 했다. 당신이 선택한 문장 하나가 다른 사람의 알리바이를 다시 쓰게 만들었다.':state.decision==='conceal'?'당신은 자신이 가진 불리한 자료를 남겨 두었다. 침묵이 살인에 가담했다는 뜻은 아니지만, 아직 공개되지 않은 의문은 남았다.':'당신의 선택은 사건을 완전히 끝내지 못했다. 그러나 당신이 모은 기록들은 누군가의 증언을 확인할 기준이 되었다.'})();
 return `<h2>사건의 최종 기록</h2>${panel(`<span class="tag">이번 시연의 결과</span><h2 class="gold">${safe(r.name)}</h2><p>${safe(r.story)}</p><p><b>최종 지목:</b> ${state.votes.length?state.votes.map(i=>safe(liveName(i))).join(', '):'없음'}</p><p><b>나의 마지막 선택:</b> ${safe(choiceName)}</p><p><b>판정 기준:</b> 임수빈(주범) · 최민서(확정 은폐 조력자)${r.guilty.includes(8)?' · 김도현(선택에 따라 가담)':''}${r.guilty.includes(17)?' · 배수아(선택에 따라 가담)':''}</p>`)}<article class="book"><h3>프롤로그 · 임혜정의 수첩</h3><p>10년 전 청명 프로젝트의 임상시험에 참여한 임혜정은 심각한 이상 반응을 호소했다. 그러나 경고는 조직의 기록에서 지워졌고, 사망 원인은 다른 이유로 정리되었다. 임혜정의 자녀 임수빈은 그날부터 진실을 찾기 시작했다.</p><h3>제1장 · 산장에 모인 사람들</h3><p>서도윤은 ${victimGender()==='미지정'?'연인 배역에 배정된 참가자의 성별이 확정되기 전까지 성별이 정해지지 않은 인물':victimGender()+'인 인물'}이었다. 홍예진 배역의 참가자는 서도윤과 여섯 해 동안 사실혼 관계였다. 회사 홍보 책임자이기도 했던 연인은 재산 문서와 왜곡된 발표문을 모두 의심하고 있었고, 21시 18분에는 서재 앞에서 격한 언쟁을 벌였다. 하지만 이 다툼 자체가 살인을 입증하는 증거는 아니었다. ${victimGender()==='여성'?'그녀에게 남은 마지막 밤이었지만, 연인은 그것을 알지 못했다.':victimGender()==='남성'?'그에게 남은 마지막 밤이었지만, 연인은 그것을 알지 못했다.':'이것은 서도윤에게 남은 마지막 밤이었지만, 연인은 그것을 알지 못했다.'}</p><p>17명의 초대객은 서로 다른 것을 얻기 위해 산장에 왔다. 누군가는 지분 계약을, 누군가는 잃어버린 연구노트를, 누군가는 자신이 만든 허위 문서를 되찾으려 했다. 그날 저녁 서도윤이 예고한 폭로는 모두의 이해관계를 흔들었다.</p><h3>제2장 · 21시 40분</h3><p>임수빈은 21시 25분 서재로 들어가 서도윤에게 어머니의 의료기록 원본을 요구했다. 서도윤은 수정된 폭로 자료를 고수했다. 21시 40분, 김도현이 다른 목적의 의뢰로 전원을 차단했고 서재에서 몸싸움이 벌어졌다. 임수빈은 21시 41~45분 사이 서도윤에게 치명적인 부상을 입혔다. 21시 46분 비상 서비스문으로 빠져나왔고, 문은 자동으로 닫혔다.</p><h3>제3장 · 침묵하는 사람들</h3><p>최민서는 임수빈의 비공개 면담과 서비스 통로 이용 정황을 알고도 일정표를 수정했다. 김도현은 정전의 이유를 은폐했고, 배수아는 오래전 합의서의 책임을 두려워했다. 하지만 김도현·배수아의 현재 살인 은폐 가담 여부는 각자의 마지막 행동에 따라 달라진다. 범행을 알지 못했던 과거의 행동만으로 살인 공범이라 단정할 수 없다.</p><h3>제4장 · 우리의 결말</h3><p>${safe(r.story)}</p><h3>제5장 · ${safe(liveName(state.role))}의 이후</h3><p>${safe(personalEnd)}</p><h3>부록 · 다른 가능성</h3><p>임수빈을 지목했다면 범행은 드러난다. 임수빈을 놓치고 최민서만 지목했다면 '조력자만 지목' 엔딩이 된다. 모두를 정확히 지목해도 임혜정 의료사고의 원본 기록이 자동 공개되는 것은 아니다. 10년 전 진실을 공개하는 선택은 각 인물이 수집한 문서와 폭로 여부에 달려 있다.</p><h3>등장인물 비밀 해금</h3>${activePeopleMap(x=>`<p><b>${safe(x.name)} · ${safe(x.job)}</b> — ${safe(x.weakPoint)}</p>`).join('')}</article><p class="footer-note">이 데모의 결과는 현재 기기의 투표·선택에 따른 미리보기입니다. Supabase 연결 후 모든 참가자의 최종 선택과 합산 투표를 기준으로 확정됩니다.</p>`;
}
